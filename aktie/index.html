<!-- Die gemeinsame Aktienseite (App-Konzept 2, Prototyp #v-aktie): /aktie/#/NVDA.
     Z2 (Redesign 2027) bleibt: /aktie/?t=NVDA&p=zahlen und (über 404.html) /aktie/NVDA?p=zahlen
     führen auf die Perspektive in ihrer Welt. Ohne p entscheidet die Herkunftswelt, sonst der Überblick. -->
<script src="/core/identity.js"></script>

<script src="/core/stock-address.js"></script>
<script>
  (function () {
    var h = document.documentElement;
    if (/^#\/./.test(location.hash)) { h.setAttribute("data-state", "PAGE"); return; }
    var r = VUCore.StockAddress.resolve(location.pathname, location.search, document.referrer);
    if (r.state === "OK") location.replace(r.href);
    else h.setAttribute("data-state", r.state);
  })();
</script>
<link rel="stylesheet" href="/assets/site-navigation.css">
<!-- Farbschema vor dem ersten Bild: dieselbe gemerkte Wahl wie die ganze Plattform; ohne Wahl dunkel (App-Konzept 2). -->
<script>(function(){var w="dark";try{var v=localStorage.getItem("vu-discover-theme-v1");if(v==="light"||v==="dark")w=v;}catch(e){}var h=document.documentElement;h.setAttribute("data-theme",w);h.setAttribute("data-theme-mode",w);var t=document.querySelector('meta[name="theme-color"]');if(t)t.setAttribute("content",w==="dark"?"#000000":"#ffffff");})();</script>
