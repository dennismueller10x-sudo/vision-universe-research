# VORLAGE – fuer das private Backup-Repository (.github/workflows/vu-runner-probe.yml).
# Beantwortet vor der Einrichtung: Reicht ein GitHub-Runner fuer die Sicherung?
#
# Misst: CPU, RAM, freier Plattenplatz vor/nach dem Aufraeumen, Zeit und Groesse eines
# vollstaendigen Mirror-Klons des (oeffentlichen) Produktions-Repos - NUR LESEN, der Klon
# wird danach geloescht und nirgends hochgeladen -, optional Durchsatz zum B2-TEST-Bucket
# mit synthetischen Daten (nur wenn die Test-Secrets gesetzt sind).
# Ergebnis in der Lauf-Zusammenfassung: "ausreichend" / "knapp" / "nicht ausreichend".
name: VU Runner-Probe
on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: 'Zu messendes Repository (https-URL, oeffentlich oder per Lesetoken)'
        required: true
        default: https://github.com/dennismueller10x-sudo/vision-universe-research
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: backup-test
    steps:
      - name: Ausgangslage
        run: |
          set -euo pipefail
          { echo "## Runner-Probe"; echo; echo "| Messung | Wert |"; echo "|---|---|"
            echo "| CPU | $(nproc) |"; echo "| RAM | $(free -g | awk '/Mem/{print $2}') GB |"
            echo "| frei / vorher | $(df -BG --output=avail / | tail -1 | tr -d ' ') |"
            echo "| frei /mnt vorher | $(df -BG --output=avail /mnt 2>/dev/null | tail -1 | tr -d ' ' || echo n/a) |"; } >> "$GITHUB_STEP_SUMMARY"
      - name: Platz schaffen (vorinstallierte Werkzeuge entfernen)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af >/dev/null 2>&1 || true
          echo "| frei / nachher | $(df -BG --output=avail / | tail -1 | tr -d ' ') |" >> "$GITHUB_STEP_SUMMARY"
      - name: Mirror-Klon messen (nur lesen, wird geloescht)
        env:
          REPO_URL: ${{ inputs.repo_url }}
          TOKEN: ${{ secrets.VU_GITHUB_READ_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$REPO_URL" =~ ^https://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+(\.git)?$ ]] || { echo "ungueltige URL"; exit 1; }
          if [ -n "${TOKEN:-}" ]; then
            export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
            export GIT_CONFIG_VALUE_0="Authorization: Basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          fi
          start=$(date +%s)
          git clone --quiet --mirror "$REPO_URL" "$RUNNER_TEMP/probe.git"
          secs=$(( $(date +%s) - start ))
          size=$(du -sBG "$RUNNER_TEMP/probe.git" | cut -f1 | tr -d G)
          free=$(df -BG --output=avail / | tail -1 | tr -d ' G')
          rm -rf "$RUNNER_TEMP/probe.git"
          # Bundle-Modus: Folgelaeufe brauchen Mirror + kleines Bundle; der Erstlauf Mirror + Voll-Bundle (~2 x).
          need=$(( size * 13 / 10 + 10 )); need_first=$(( size * 2 + 10 ))
          avail=$((free + size))
          verdict="ausreichend"; [ "$avail" -lt "$need" ] && verdict="nicht ausreichend"
          [ "$verdict" = ausreichend ] && [ "$avail" -lt $(( need + 15 )) ] && verdict="knapp (Wachstum ~10 GB/Monat)"
          first="ausreichend"; [ "$avail" -lt "$need_first" ] && first="nicht ausreichend (Erstlauf in Cloud Shell/Batch)"
          { echo "| Mirror-Klon | ${size} GB in ${secs} s |"
            echo "| Bedarf Folgelauf (1,3 x Mirror + 10 GB) | ${need} GB |"
            echo "| Bedarf Erstlauf (2 x Mirror + 10 GB) | ${need_first} GB: ${first} |"
            echo "| frei fuer Klon + Bundles | ${avail} GB |"
            echo "| **Urteil** | **$verdict** |"; } >> "$GITHUB_STEP_SUMMARY"
      - name: Durchsatz zum B2-Test-Bucket (synthetisch, optional)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.B2_TEST_WRITER_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_TEST_WRITER_KEY }}
          VU_S3_ENDPOINT: ${{ vars.B2_TEST_ENDPOINT }}
          BUCKET: ${{ vars.B2_TEST_BUCKET }}
        run: |
          set -euo pipefail
          if [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [[ "${BUCKET:-}" != *test* ]]; then echo "| B2-Durchsatz | uebersprungen |" >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          pip install --quiet boto3==1.40.0
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import boto3, os, time
          s3 = boto3.client("s3", endpoint_url=os.environ["VU_S3_ENDPOINT"])
          path = "/tmp/synthetic.bin"; open(path, "wb").write(os.urandom(512 * 1024 * 1024))
          key = f"vu-acceptance/runner-probe-{int(time.time())}.bin"
          t = time.time(); s3.upload_file(path, os.environ["BUCKET"], key); up = time.time() - t
          t = time.time(); s3.download_file(os.environ["BUCKET"], key, path + ".d"); down = time.time() - t
          s3.delete_object(Bucket=os.environ["BUCKET"], Key=key)
          print(f"| B2-Durchsatz 512 MB | hoch {512/up:.0f} MB/s, runter {512/down:.0f} MB/s |")
          PY
