# Vision Universe – taegliche unabhaengige Sicherung (privates Repo vision-universe-backup).
# Ablage: .github/workflows/vu-backup-daily.yml
#
# Zeitplan: taeglich 02:41 UTC, sonntags mit Stufe 2 (grosse, neu erzeugbare Bestaende);
# am 1. jedes Monats 06:17 UTC zusaetzlich vollstaendige Datenpruefung (restic check --read-data).
# Laeuft automatisch erst, wenn die Variable VU_BACKUP_ENABLED = true gesetzt ist (nach der
# Abnahme). Von Hand jederzeit: GitHub-App -> Actions -> "VU Backup taeglich" -> Run workflow.
#
# Sicherheit: Secrets nur im Environment "backup"; contents: read; keine Artefakte; der
# B2-Schreibschluessel wird vor jedem Lauf geprueft (kein Loeschrecht, sonst Abbruch);
# Datenbank nur ueber die Leserolle vu_backup_ro. Meldung: Healthcheck (E-Mail ausserhalb
# von GitHub) - bleibt der Erfolgs-Ping 26 h aus, kommt eine Mail, auch wenn GitHub ausfaellt.
name: VU Backup taeglich
on:
  schedule:
    - cron: '41 2 * * *'     # taeglich: Sicherung (sonntags mit Stufe 2)
    - cron: '17 6 1 * *'     # monatlich: vollstaendige Datenpruefung und Kettenpruefung
  workflow_dispatch:
    inputs:
      action:
        description: 'backup | backup-tier2 | db-only | verify-full | drill | maintain-plan | maintain-apply | init'
        type: choice
        options: [backup, backup-tier2, db-only, verify-full, drill, maintain-plan, maintain-apply, init]
        default: backup
permissions:
  contents: read
concurrency:
  group: vu-backup-${{ github.ref_name }}
  cancel-in-progress: false
env:
  ACTION: ${{ inputs.action || 'scheduled' }}

jobs:
  gate:
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.g.outputs.run }}
      action: ${{ steps.g.outputs.action }}
    steps:
      - id: g
        env:
          ENABLED: ${{ vars.VU_BACKUP_ENABLED }}
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          a="$ACTION"
          if [ "$EVENT" = schedule ]; then
            [ "$ENABLED" = true ] || { echo "run=false" >> "$GITHUB_OUTPUT"; echo "Zeitplan aus (VU_BACKUP_ENABLED != true)"; exit 0; }
            a=backup; [ "$(date -u +%u)" = 7 ] && a=backup-tier2
            [ "$CRON" = '17 6 1 * *' ] && a=verify-full
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"; echo "action=$a" >> "$GITHUB_OUTPUT"

  db:
    needs: gate
    if: needs.gate.outputs.run == 'true' && contains(fromJSON('["backup","backup-tier2","db-only"]'), needs.gate.outputs.action)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: backup
    env:
      VU_S3_ENDPOINT: ${{ vars.B2_ENDPOINT }}
      VU_S3_BUCKET: ${{ vars.B2_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.B2_WRITER_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_WRITER_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: scripts/backup/runner/github-actions/setup-tools.sh pg age py
      - name: Schluessel pruefen
        run: python3 scripts/backup/bin/vu-key-check.py writer
      - name: Konten-Datenbank (Leserolle, age, direkt nach B2)
        env:
          VU_DB_URL: ${{ secrets.VU_DB_BACKUP_RO_URL }}
          VU_DB_PROJECT: ${{ vars.VU_DB_PROJECT }}
          VU_DB_AGE_RECIPIENT: ${{ vars.VU_DB_AGE_RECIPIENT }}
        run: scripts/backup/bin/vu-db-export.sh
      - name: Integritaet der juengsten DB-Sicherung
        run: python3 scripts/backup/lib/s3_put.py check-latest db/accounts/ 26

  files:
    needs: gate
    if: needs.gate.outputs.run == 'true' && needs.gate.outputs.action != 'db-only'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    environment: backup
    env:
      VU_WORK: /mnt/vu-backup-work
      RESTIC_REPOSITORY: ${{ secrets.RESTIC_REPOSITORY }}
      RESTIC_PASSWORD: ${{ secrets.RESTIC_PASSWORD }}
      AWS_ACCESS_KEY_ID: ${{ secrets.B2_WRITER_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_WRITER_KEY }}
      VU_S3_ENDPOINT: ${{ vars.B2_ENDPOINT }}
      VU_S3_BUCKET: ${{ vars.B2_BUCKET }}
      VU_SOURCES: ${{ vars.VU_SOURCES || 'git github-meta gh-artifacts r2 cf-kv cf-config brevo' }}
      VU_GIT_MODE: bundle
      VU_GIT_REPOS: ${{ vars.VU_GIT_REPOS }}
      VU_GITHUB_REPOS: ${{ vars.VU_GITHUB_REPOS }}
      VU_GITHUB_TOKEN: ${{ secrets.VU_GITHUB_READ_TOKEN }}
      VU_ARTIFACT_ALLOWLIST: ${{ vars.VU_ARTIFACT_ALLOWLIST }}
      VU_R2_ENDPOINT: ${{ secrets.VU_R2_ENDPOINT }}
      VU_R2_BUCKET: ${{ secrets.VU_R2_BUCKET }}
      VU_R2_ACCESS_KEY_ID: ${{ secrets.VU_R2_READ_KEY_ID }}
      VU_R2_SECRET_ACCESS_KEY: ${{ secrets.VU_R2_READ_KEY }}
      VU_R2_PREFIXES_TIER1: ${{ vars.VU_R2_PREFIXES_TIER1 }}
      VU_R2_PREFIXES_TIER2: ${{ vars.VU_R2_PREFIXES_TIER2 }}
      VU_CF_API_TOKEN: ${{ secrets.VU_CF_READ_TOKEN }}
      VU_CF_ACCOUNT_ID: ${{ vars.VU_CF_ACCOUNT_ID }}
      VU_CF_KV_NAMESPACES: ${{ vars.VU_CF_KV_NAMESPACES }}
      VU_CF_ZONE_IDS: ${{ vars.VU_CF_ZONE_IDS }}
      VU_BREVO_ENABLED: ${{ vars.VU_BREVO_ENABLED }}
      VU_BREVO_API_KEY: ${{ secrets.VU_BREVO_BACKUP_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Plattenplatz
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo mkdir -p "$VU_WORK" && sudo chown "$USER" "$VU_WORK"
          df -h / /mnt | tee -a "$GITHUB_STEP_SUMMARY"
      - run: scripts/backup/runner/github-actions/setup-tools.sh restic rclone py
      - name: Schluessel pruefen
        run: python3 scripts/backup/bin/vu-key-check.py writer
      - name: Ausfuehren
        env:
          A: ${{ needs.gate.outputs.action }}
        run: |
          set -uo pipefail
          B=scripts/backup/bin
          case "$A" in
            init)           "$B/vu-backup.sh" --init ;;
            backup)         "$B/vu-backup.sh" && "$B/vu-verify.sh" chain ;;
            backup-tier2)   "$B/vu-backup.sh" --tier2 && "$B/vu-verify.sh" chain ;;
            verify-full)    "$B/vu-verify.sh" full && "$B/vu-verify.sh" chain ;;
            drill)          "$B/vu-restore.sh" drill "$VU_WORK/drill" ;;
            maintain-plan)  "$B/vu-maintain.sh" plan ;;
            maintain-apply) "$B/vu-maintain.sh" apply ;;
          esac
      - name: Werkzeuge unabhaengig im Ziel ablegen (ohne Secrets, fuer Wiederherstellung ohne GitHub)
        if: needs.gate.outputs.action == 'backup' || needs.gate.outputs.action == 'backup-tier2'
        run: |
          set -euo pipefail
          tar -czf "$RUNNER_TEMP/vu-backup-tools.tar.gz" scripts/backup .github/workflows
          sha=$(sha256sum "$RUNNER_TEMP/vu-backup-tools.tar.gz" | cut -c1-64)
          python3 scripts/backup/lib/s3_put.py put "$RUNNER_TEMP/vu-backup-tools.tar.gz" "tools/vu-backup-tools-${GITHUB_SHA::12}.tar.gz" "$sha"

  report:
    needs: [gate, db, files]
    if: always() && needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    environment: backup
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: scripts/backup/runner/github-actions/setup-tools.sh py
      - name: Ergebnis, letzter vollstaendiger Stand, Meldung
        env:
          DB: ${{ needs.db.result }}
          FILES: ${{ needs.files.result }}
          A: ${{ needs.gate.outputs.action }}
          HC: ${{ secrets.VU_HEALTHCHECK_URL }}
          VU_S3_ENDPOINT: ${{ vars.B2_ENDPOINT }}
          VU_S3_BUCKET: ${{ vars.B2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.B2_WRITER_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_WRITER_KEY }}
          REPO_SIZE_WARN_GB: ${{ vars.VU_REPO_SIZE_WARN_GB || '40' }}
          SRC_REPO: ${{ vars.VU_GITHUB_REPOS }}
        run: |
          set -uo pipefail
          ok=true
          for r in "$DB" "$FILES"; do case "$r" in success|skipped) ;; *) ok=false ;; esac; done
          size=$(curl -fsS -m 20 "https://api.github.com/repos/${SRC_REPO%% *}" | python3 -c 'import json,sys; print(round(json.load(sys.stdin)["size"]*1024/1e9,1))' 2>/dev/null || echo "?")
          { echo "## Ergebnis: $([ "$ok" = true ] && echo OK || echo FEHLER)"; echo
            echo "| Teil | Ergebnis |"; echo "|---|---|"; echo "| Datenbank | $DB |"; echo "| Git, R2, KV, Konfiguration | $FILES |"
            echo "| Quell-Repository | ${size} GB (Warnschwelle ${REPO_SIZE_WARN_GB} GB) |"; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$ok" = true ] && [ "$A" != maintain-plan ]; then
            stamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            printf '{"lastSuccess":"%s","action":"%s","run":"%s","db":"%s","files":"%s","sourceRepoGB":"%s"}\n' "$stamp" "$A" "$GITHUB_RUN_ID" "$DB" "$FILES" "$size" > "$RUNNER_TEMP/last-success.json"
            python3 scripts/backup/lib/s3_put.py put "$RUNNER_TEMP/last-success.json" "status/last-success-$(date -u +%Y%m%dT%H%M%SZ).json" "$(sha256sum "$RUNNER_TEMP/last-success.json" | cut -c1-64)" || ok=false
          fi
          warn=""
          python3 -c "import sys; sys.exit(0 if '$size'=='?' or float('$size')<float('$REPO_SIZE_WARN_GB') else 1)" || warn=" (Repository groesser als ${REPO_SIZE_WARN_GB} GB: Runner-Platz pruefen)"
          if [ -n "${HC:-}" ]; then
            suffix=""; [ "$ok" = true ] || suffix="/fail"
            printf 'VU Backup %s: DB=%s Dateien=%s%s\n' "$A" "$DB" "$FILES" "$warn" | curl -fsS -m 20 --retry 3 --data-binary @- "${HC}${suffix}" >/dev/null || echo "Healthcheck nicht erreichbar"
          fi
          [ "$ok" = true ]
