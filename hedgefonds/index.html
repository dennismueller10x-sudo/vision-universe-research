     Umrechnung: 13F-Werte sind immer USD, §49). -->
<script src="/quant/engines/fx/currency-registry.js"></script>
<script src="/quant/engines/fx/money-format.js"></script>
<script>window.HF_FORMAT_USD = function (n) {
  var F = window.VUFx && VUFx.Format;
  if (!F || typeof F.formatCompact !== "function") return null;
  var a = Math.abs(n);
  return a >= 1e3 ? F.formatCompact(n, "USD", { numberLocale: "de-DE", decimals: a >= 1e9 ? 1 : 0 })
    : F.formatPrice(n, "USD", { numberLocale: "de-DE", decimals: 0 });
};</script>
