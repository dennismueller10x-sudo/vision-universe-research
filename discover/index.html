<!-- STARTREIHENFOLGE DER STARTSEITE
     Der erste Bildschirm besteht aus Stilen, Kopfbild und dem vorgerenderten Kopf (unten in #v2-shell). Alles andere - die rund
     50 Skripte aus dem Template dx-start (unten) und die Datenabrufe der Startseite - wartet, bis das Kopfbild da ist
     (spaetestens STAGE_MS), damit es sich nicht mit Stilen und Kopfbild um dieselbe Leitung streitet. Nur meta.json und der
     Marktkalender (zusammen 17 KB) laufen sofort mit: aus meta.json ergeben sich Adresse der ersten Auswahl und des
     Intraday-Verzeichnisses. Auf jeder anderen Route (Aktie, Maerkte, ...) gibt es weder Kopfbild noch vorgeladene Daten;
     dort starten die Skripte, sobald das Dokument gelesen ist.
     Die Skripte laufen unveraendert in ihrer Reihenfolge (async=false), nur eben nachgeladen. Jede Antwort der Startseite
     bekommt dieselbe Adresse und denselben Cache-Modus wie der spaetere fetch() der Seite und wird genau diesem
     uebergeben (danach ist der Eintrag weg); schlaegt sie fehl, laeuft dessen eigene Wiederholung normal.
     Ein Tipp auf die Suche vor dem Skriptstart wird gemerkt (__vuSearchTap) und oeffnet sie, sobald home.js laeuft. -->
<script>(function(w,d){var home=!/^(s|settings|suche|aktien|watchlist|welten|strategien|thema|c|einzeln|maerkte|daten)$/.test(location.hash.replace(/^#\/?/,"").split("/")[0]),STAGE_MS=2500,ready=!home,parsed=false,started=false,f=w.fetch,e={},N={cache:"no-cache"},meta;
function go(u,o){var r=e[u]=f.call(w,u,o);r.catch(function(){});return r}
function json(r){return r.clone().json()}
if(home&&f){w.fetch=function(u){var r=typeof u==="string"&&e[u];if(r){delete e[u];return r}return f.apply(this,arguments)};
meta=go("/discover/data/meta.json",N).then(json);meta.catch(function(){});go("/quant/config/market-calendar.json",N)}
function data(){
meta.then(function(m){var h=(m.home||[]).filter(function(x){return x.universeId==="US_REAL"})[0],r=m.realtime;if(h&&h.chunks&&h.chunks[0])go(h.chunks[0],N);if(r&&r.available===true&&r.intraday&&r.intraday.index)go(r.intraday.index)}).catch(function(){});
go("/discover/live/im-blick-US_REAL.json",N);
go("/quant/data/market/multi-asset/snapshot.json",N);
go("/quant/config/multi-asset.json",N);
go("/quant/config/fx-license.json");
go("/quant/data/market/fx/ecb/index.json").then(json).then(function(x){var p=(x.pairs||[]).filter(function(q){return q.base==="EUR"&&q.quote==="USD"})[0];if(p&&p.file)go("/quant/data/market/fx/ecb/"+p.file)}).catch(function(){})}
function start(){if(started||!ready||!parsed)return;started=true;
var t=d.getElementById("dx-start"),s=t.content.querySelectorAll("script[src]"),i,n;
if(meta)data();
for(i=0;i<s.length;i++){n=d.createElement("script");n.src=s[i].getAttribute("src");n.async=false;d.head.appendChild(n)}}
w.__vuParsed=function(){parsed=true;start()};
// Suche vor dem Skriptstart: Tipp auf das Suchfeld oder die Taste "/" werden gemerkt; home.js oeffnet die Suche, sobald sie laeuft.
d.addEventListener("click",function(v){var b=v.target.closest&&v.target.closest("[data-static] .v2-search-prompt");if(b)w.__vuSearchTap=1},true);
d.addEventListener("keydown",function(v){if(v.key==="/"&&!/^(INPUT|TEXTAREA|SELECT)$/.test(v.target&&v.target.tagName||"")&&d.querySelector("[data-static]")){v.preventDefault();w.__vuSearchTap=1}},true);
if(home){var l=d.createElement("link");l.rel="preload";l.as="image";l.href="/assets/hero-visuals/discover.webp";l.setAttribute("fetchpriority","high");
l.onload=l.onerror=function(){ready=true;start()};d.head.appendChild(l);setTimeout(function(){ready=true;start()},STAGE_MS)}
})(window,document);</script>
