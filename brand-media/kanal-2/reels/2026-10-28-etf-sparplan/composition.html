<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<style>
@font-face{font-family:Archivo;src:url(../../fonts/archivo-black.woff2) format("woff2");font-weight:900}
@font-face{font-family:Nunito;src:url(../../fonts/nunito.woff2) format("woff2");font-weight:200 1000}
:root{--bg:#fbf7ef;--ink:#1d2433;--bull:#1f9d55;--bear:#8a5a2b;--red:#d93a3a;--gold:#e8a917;--line:#2b3446}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg);font-family:Nunito,sans-serif;color:var(--ink)}
#stage{position:absolute;inset:0;overflow:hidden}
.paper{position:absolute;inset:0;background:
 radial-gradient(circle at 20% 10%,rgba(232,169,23,.08),transparent 40%),
 radial-gradient(circle at 85% 30%,rgba(31,157,85,.07),transparent 40%),
 repeating-linear-gradient(0deg,rgba(29,36,51,.035) 0 2px,transparent 2px 64px),
 repeating-linear-gradient(90deg,rgba(29,36,51,.035) 0 2px,transparent 2px 64px)}
#title{position:absolute;top:120px;left:0;right:0;text-align:center;font-family:Archivo;font-size:58px;letter-spacing:1px;line-height:1.05;opacity:0}
#title span{background:var(--gold);padding:4px 18px;border-radius:10px;display:inline-block;transform:rotate(-1.5deg)}
#dia{position:absolute;left:0;top:0;width:1080px;height:1160px;transform-origin:540px 650px}
svg#arrows{position:absolute;inset:0;width:1080px;height:1160px;overflow:visible}
.node{position:absolute;width:290px;height:150px;margin:-75px 0 0 -145px;background:#fff;border:6px solid var(--line);border-radius:28px;
 box-shadow:0 10px 0 var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;opacity:0}
.node svg{width:62px;height:62px}
.node b{font-family:Archivo;font-size:28px;white-space:nowrap;letter-spacing:.5px}
.pill{position:absolute;transform:translate(-50%,-50%);background:var(--ink);color:#fff;font-family:Archivo;font-size:30px;padding:8px 20px;border-radius:40px;white-space:nowrap;opacity:0;border:4px solid #fff;box-shadow:0 6px 0 rgba(0,0,0,.18)}
.pill.g{background:var(--bull)}.pill.r{background:var(--red)}.pill.o{background:var(--gold);color:var(--ink)}
.stamp{position:absolute;left:540px;top:600px;transform:translate(-50%,-50%);font-family:Archivo;font-size:150px;color:var(--red);border:14px solid var(--red);border-radius:26px;padding:6px 40px;background:rgba(251,247,239,.92);opacity:0;white-space:nowrap}
.stamp.g{color:var(--bull);border-color:var(--bull)}
#word{position:absolute;left:0;right:0;top:1085px;z-index:6;text-align:center;font-family:Archivo;font-size:118px;line-height:1;text-transform:uppercase;
 -webkit-text-stroke:18px #fbf7ef;paint-order:stroke fill;text-shadow:0 8px 0 rgba(0,0,0,.12)}
#word span{display:inline-block;padding:0 24px}
.char{position:absolute;bottom:-40px;width:560px;height:700px;transform-origin:50% 100%}
.char img,.char svg{width:100%;height:100%;object-fit:contain;object-position:50% 100%}
#bulle{left:-20px}#baer{right:-20px}
.tag{position:absolute;bottom:40px;font-family:Archivo;font-size:30px;color:#fff;padding:6px 18px;border-radius:12px;opacity:.95}
#end{position:absolute;inset:0;z-index:10;background:var(--bg);opacity:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px}
#end .name{font-family:Archivo;font-size:120px;line-height:.95;text-align:center}
#end .name i{font-style:normal;color:var(--bull)}#end .name u{text-decoration:none;color:var(--bear)}
#end .btn{font-family:Archivo;font-size:56px;background:var(--ink);color:#fff;padding:18px 60px;border-radius:24px}
#end .fine{font-size:34px;font-weight:800;opacity:.7}
</style><link rel="stylesheet" href="/assets/site-navigation.css"></head><body><vu-navigation></vu-navigation><script src="/assets/site-navigation.js"></script><div id="stage">
<div class="paper"></div>
<div id="title"><span>WER VERDIENT AN<br>DEINEM SPARPLAN?</span></div>
<div id="dia">
 <svg id="arrows"><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0L10,5L0,10z" fill="#2b3446"/></marker></defs></svg>
</div>
<div class="stamp g" id="s0">0 €</div>
<div class="stamp" id="s7">−4.750 €</div>
<div class="stamp" id="s8">WAS?!</div>
<div class="stamp" id="s13">KEIN GRATIS</div>
<div id="word"></div>
<div class="char" id="bulle"></div>
<div class="char" id="baer"></div>
<div id="end"><div class="name"><i>BULLE</i> &amp;<br><u>BÄR</u></div><div class="btn">FOLGEN</div><div class="fine">Keine Anlageberatung</div></div>
</div>
<script>
const T=window.TIMING, W=T.words, S=T.segments, END=T.duration;
const ICON={
 du:'<svg viewBox="0 0 64 64"><circle cx="32" cy="20" r="12" fill="#1d2433"/><path d="M8 60c2-14 12-22 24-22s22 8 24 22z" fill="#1d2433"/></svg>',
 broker:'<svg viewBox="0 0 64 64"><rect x="16" y="4" width="32" height="56" rx="6" fill="#1d2433"/><rect x="20" y="10" width="24" height="40" fill="#fff"/><path d="M23 42l7-9 5 5 7-12" stroke="#1f9d55" stroke-width="4" fill="none"/></svg>',
 boerse:'<svg viewBox="0 0 64 64"><path d="M6 22L32 6l26 16z" fill="#1d2433"/><rect x="10" y="24" width="6" height="26" fill="#1d2433"/><rect x="22" y="24" width="6" height="26" fill="#1d2433"/><rect x="36" y="24" width="6" height="26" fill="#1d2433"/><rect x="48" y="24" width="6" height="26" fill="#1d2433"/><rect x="6" y="52" width="52" height="8" fill="#1d2433"/></svg>',
 etf:'<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="26" fill="#1d2433"/><path d="M32 32V6a26 26 0 0 1 25 19z" fill="#e8a917"/><path d="M32 32l25-7a26 26 0 0 1-9 27z" fill="#1f9d55"/></svg>',
 staat:'<svg viewBox="0 0 64 64"><rect x="8" y="26" width="48" height="30" fill="#1d2433"/><path d="M4 26L32 8l28 18z" fill="#1d2433"/><text x="32" y="50" font-size="24" text-anchor="middle" fill="#fff" font-family="Archivo">§</text></svg>'};
const NODES={du:[540,360,'DU'],broker:[210,640,'BROKER'],etf:[870,640,'ETF-ANBIETER'],boerse:[210,960,'BÖRSE'],staat:[870,960,'STAAT']};
// line index -> what appears (at line start + delay)
const EV=[
 {line:2,node:'du',d:0},{line:2,node:'broker',d:.5},{line:2,arrow:['du','broker'],label:'100 € / Monat',cls:'',d:1.4},
 {line:3,node:'boerse',d:.3},{line:3,arrow:['broker','boerse'],label:'Spread',cls:'r',d:4.2},
 {line:5,node:'etf',d:.2},{line:5,arrow:['du','etf'],label:'0,2 % / Jahr',cls:'r',d:5.0},
 {line:9,node:'staat',d:1.2},{line:9,arrow:['etf','staat'],label:'26,4 % Steuer',cls:'r',d:5.4},
 {line:11,chip:[540,770],label:'1.000 € im Jahr frei',cls:'g',d:.3},{line:11,chip:[540,860],label:'30 % Teilfreistellung',cls:'g',d:4.4}];
const STAMPS={s0:[0,0.15,3.4],s7:[7,4.6,7.0],s8:[8,0,1.2],s13:[13,1.6,99]};
const lineStart=i=>S[i].s;
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const easeOut=x=>1-Math.pow(1-clamp(x),3);
const back=x=>{x=clamp(x);const c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const dia=document.getElementById('dia'),svg=document.getElementById('arrows');
const nodeEl={};
for(const [k,[x,y,l]] of Object.entries(NODES)){const e=document.createElement('div');e.className='node';e.style.left=x+'px';e.style.top=y+'px';e.innerHTML=ICON[k]+'<b>'+l+'</b>';dia.appendChild(e);nodeEl[k]=e}
const evs=EV.map(ev=>{const t0=lineStart(ev.line)+ev.d;const o={...ev,t0};
 if(ev.arrow){const [a,b]=ev.arrow;const [x1,y1]=NODES[a],[x2,y2]=NODES[b];const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy);
  const sx=x1+dx/L*95,sy=y1+dy/L*95,ex=x2-dx/L*100,ey=y2-dy/L*100;
  const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',`M${sx},${sy}L${ex},${ey}`);
  p.setAttribute('stroke','#2b3446');p.setAttribute('stroke-width','9');p.setAttribute('fill','none');p.setAttribute('stroke-linecap','round');p.setAttribute('marker-end','url(#ah)');
  svg.appendChild(p);o.path=p;o.len=Math.hypot(ex-sx,ey-sy);p.style.strokeDasharray=o.len;
  const pl=document.createElement('div');pl.className='pill '+(ev.cls||'');pl.textContent=ev.label;pl.style.left=(sx+ex)/2+'px';pl.style.top=(sy+ey)/2+'px';dia.appendChild(pl);o.pill=pl}
 if(ev.chip){const pl=document.createElement('div');pl.className='pill '+(ev.cls||'');pl.textContent=ev.label;pl.style.left=ev.chip[0]+'px';pl.style.top=ev.chip[1]+'px';pl.style.fontSize='32px';dia.appendChild(pl);o.pill=pl}
 return o});
// characters: real cut-out images if present, otherwise simple placeholders
function placeholder(color,label){return `<svg viewBox="0 0 560 700"><ellipse cx="280" cy="640" rx="200" ry="40" fill="rgba(0,0,0,.08)"/><rect x="140" y="300" width="280" height="360" rx="120" fill="${color}"/><circle cx="280" cy="230" r="150" fill="${color}"/><circle cx="225" cy="215" r="26" fill="#fff"/><circle cx="335" cy="215" r="26" fill="#fff"/><circle cx="230" cy="220" r="12" fill="#1d2433"/><circle cx="330" cy="220" r="12" fill="#1d2433"/><text x="280" y="520" font-family="Archivo" font-size="56" fill="#fff" text-anchor="middle">${label}</text></svg>`}
const CH={bulle:document.getElementById('bulle'),baer:document.getElementById('baer')};
function setChar(k,color,label){const img=new Image();img.onload=()=>{CH[k].innerHTML='';CH[k].appendChild(img)};img.onerror=()=>{CH[k].innerHTML=placeholder(color,label)};img.src='../../figuren/entwurf-1/'+k+'.png';return new Promise(r=>{img.addEventListener('load',r);img.addEventListener('error',r)})}
const word=document.getElementById('word'),title=document.getElementById('title'),end=document.getElementById('end');
function segAt(t){let s=null;for(const x of S)if(t>=x.s-0.05)s=x;return s}
function render(t){
 const seg=segAt(t)||S[0];
 // word caption: current word holds until the next starts
 let w=null;for(const x of W){if(x.s<=t+0.02)w=x;else break}
 if(w&&t<END){const k=(t-w.s);const sc=0.82+0.18*back(k/0.16);word.innerHTML=`<span style="color:${w.who==='bulle'?'var(--bull)':'var(--bear)'};transform:scale(${sc})">${w.w.replace(/[.,!?]+$/,m=>m.includes('?')||m.includes('!')?m.replace(/[.,]/g,''):'')}</span>`}else word.innerHTML='';
 title.style.opacity=clamp((t-lineStart(1)-0.3)/0.3);
 title.style.transform=`translateY(${(1-easeOut((t-lineStart(1)-0.3)/0.4))*-40}px)`;
 for(const [k,e] of Object.entries(nodeEl)){const ev=evs.find(v=>v.node===k);const x=(t-(ev?ev.t0:1e9))/0.45;e.style.opacity=clamp(x*2);e.style.transform=`scale(${x<0?0.4:back(x)})`}
 for(const ev of evs){if(ev.path){const x=easeOut((t-ev.t0)/0.55);ev.path.style.strokeDashoffset=ev.len*(1-x);ev.path.style.opacity=t>=ev.t0?1:0}
  if(ev.pill){const x=(t-ev.t0-(ev.path?0.4:0))/0.35;ev.pill.style.opacity=clamp(x*2);ev.pill.style.transform=`translate(-50%,-50%) scale(${x<0?0.3:back(x)}) rotate(${ev.cls==='g'?-2:0}deg)`}}
 // diagram camera: slow push-in, small punch on each new event
 let punch=0;for(const ev of evs){const k=t-ev.t0;if(k>=0&&k<0.35)punch=Math.max(punch,Math.sin(k/0.35*Math.PI)*0.025)}
 dia.style.transform=`scale(${1+0.04*clamp(t/END)+punch})`;
 for(const [id,[ln,a,b]] of Object.entries(STAMPS)){const e=document.getElementById(id);const t0=lineStart(ln)+a,t1=lineStart(ln)+b;const x=(t-t0)/0.22;
  const on=t>=t0&&t<t1;e.style.opacity=on?clamp(x*3):0;e.style.transform=`translate(-50%,-50%) rotate(-8deg) scale(${on?1+1.4*(1-back(x)):1})`}
 // characters
 for(const k of ['bulle','baer']){const e=CH[k];const speaking=seg.who===k&&t<=seg.e+0.05;let ty=0,rot=0,sc=1,dx=0;
  const ph=t*(k==='bulle'?2.1:1.6);ty=Math.sin(ph)*5;sc=1+Math.sin(ph*0.5)*0.008;
  if(speaking){const talk=W.some(x=>x.who===k&&t>=x.s&&t<=x.e);if(talk){ty-=Math.abs(Math.sin(t*16))*9;sc+=0.015}
   const k2=t-seg.s;const P=seg.pose;
   if(P==='jubel'){ty-=Math.max(0,Math.sin(k2*7))*36;rot=Math.sin(k2*7)*3}
   if(P==='schock'){dx=Math.sin(k2*60)*10*clamp(1-k2/0.8);sc+=0.06*clamp(1-k2/0.6)}
   if(P==='skeptisch'||P==='rechnet'){rot=k==='baer'?-5*easeOut(k2/0.3):5*easeOut(k2/0.3)}
   if(P==='lacht'){ty-=Math.abs(Math.sin(k2*10))*14}
   if(P==='schulterzucken'){ty-=Math.max(0,Math.sin(k2*5))*20}
   if(P==='zeigt'||P==='erklaert'){rot=(k==='bulle'?3:-3)*easeOut(k2/0.3)}}
  const enter=easeOut(t/0.5);const off=(1-enter)*(k==='bulle'?-500:500);
  e.style.transform=`translateX(${dx+off}px) translateY(${ty}px) rotate(${rot}deg) scale(${sc*(speaking?1.04:0.96)})`;
  e.style.filter=speaking||t<lineStart(1)?'none':'saturate(.75) brightness(.97)';e.style.zIndex=speaking?3:2}
 const ex=(t-END-0.1)/0.3;end.style.opacity=clamp(ex);
}
window.render=render;
Promise.all([setChar('bulle','#1f9d55','BULLE'),setChar('baer','#8a5a2b','BÄR'),document.fonts.ready]).then(()=>{document.fonts.load('900 100px Archivo').then(()=>{render(0);window.__ready=true})});
</script></body></html>
