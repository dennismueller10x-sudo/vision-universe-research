<section class="page dark cover">
  <div class="bleed" id="cover-img" style="background-image:url(img/hf-cover-meteor.jpg);background-position:50% 45%"></div>
  <div class="bleed" style="background:linear-gradient(180deg,rgba(0,0,0,.95) 0%,rgba(0,0,0,.35) 20%,rgba(0,0,0,0) 38%,rgba(0,0,0,.25) 52%,rgba(0,0,0,.88) 70%,#000 86%)"></div>
  <span class="ki" style="top:44mm;right:11mm">KI-Bild</span>
  <div class="pad" style="inset:8mm 11mm 9mm">
    <div style="display:flex;justify-content:space-between;align-items:flex-start">
      <div>
        <img src="../../../docs/design/redesign-2027/img/vu-logo.png" style="height:6.6mm;filter:invert(1)" alt="Vision Universe">
        <div style="font-size:52pt;font-weight:900;letter-spacing:-.06em;line-height:.82;margin-top:2mm">AKTIEN<span style="color:var(--lime)">MAGAZIN</span></div>
      </div>
      <div style="text-align:right">
        <div style="display:inline-block;background:var(--lime);color:#000;font-weight:900;font-size:8pt;letter-spacing:.08em;padding:1.5mm 2.5mm;border-radius:3px">NR. 01 · NEU</div>
        <div style="font-size:7.2pt;font-weight:800;letter-spacing:.1em;text-transform:uppercase;line-height:1.55;margin-top:2mm">KW 46 · 09.11.2026<br><span style="color:#9a9a9a">Daten bis 06.11.</span></div>
      </div>
    </div>
    <!-- Kurs-Blasen -->
    <div style="position:absolute;left:0;top:45mm;display:grid;gap:3mm" data-k="cover-bubbles"></div>
    <!-- Riesenzahl -->
    <div style="position:absolute;right:0;top:50mm;text-align:right;transform:rotate(-4deg)">
      <div style="font-size:50pt;font-weight:900;letter-spacing:-.06em;line-height:.85;color:#fff;text-shadow:0 0 18px rgba(200,245,49,.55)">−3&nbsp;BIO.&nbsp;$</div>
      <div style="display:inline-block;background:var(--lime);color:#000;font-weight:900;font-size:9pt;padding:1.2mm 2.5mm;margin-top:1.5mm;border-radius:2px">AN EINEM TAG</div>
    </div>
    <!-- Titel -->
    <div style="position:absolute;left:0;right:0;top:134mm">
      <div style="display:flex;gap:2mm;align-items:center"><span class="ressort" style="background:#fff;color:#000">Titelthema</span><span class="ressort" style="background:var(--lime);color:#000">9 Seiten</span><span class="ressort" style="background:#fff;color:#000">6 Aktien im Stresstest</span></div>
      <div style="font-size:92pt;font-weight:900;letter-spacing:-.075em;line-height:.78;margin-top:3mm;text-shadow:0 4px 30px rgba(0,0,0,.6)">DIE KI-<br><span style="color:var(--lime)">BREMSE</span></div>
      <div style="margin-top:4mm;max-width:155mm;font-size:13pt;font-weight:700;line-height:1.3;color:#f0f0f0">Washington wählt, die Chips stürzen ab. Was hinter dem schwersten Chip-Tag seit 2020 steckt, und wer jetzt noch steht.</div>
    </div>
    <!-- Anrisse -->
    <div class="grid" style="position:absolute;left:0;right:0;bottom:0;grid-template-columns:1fr 1fr 1fr 1fr;gap:3.5mm" data-k="cover-teaser"></div>
  </div>
</section>
<script>
VUM.k('cover-bubbles',()=>[['NVDA','Nvidia'],['MU','Micron'],['AMD','AMD'],['APP','AppLovin']].map(([t,n])=>{const c=VUM.C(t);return `<div style="display:flex;align-items:center;gap:2.5mm"><div style="width:13mm;height:13mm;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px ${c.week>=0?'#c8f531':'#fff'}">${c.logo?`<img src="${c.logo}" style="max-width:11mm;max-height:8mm;object-fit:contain">`:`<b style="color:#000;font-size:7pt">${t}</b>`}</div><div><div style="font-size:7pt;font-weight:900;letter-spacing:.06em;color:#fff">${n.toUpperCase()}</div><span class="pill ${c.week>=0?'up':'dn'}" style="${c.week>=0?'':'background:#fff;color:#000'};font-size:9.5pt;margin-top:.6mm">${VUM.sg(c.week,1)} %</span></div></div>`}).join(''));
VUM.k('cover-teaser',()=>[['img/hf-schach-trading.jpg','Hedgefonds','Burry wettet gegen Chips, Berkshire kauft sich selbst'],['img/hf-mobile-games-werbung.jpg','Analyse','AppLovin: +71 % in fünf Tagen. Was dahintersteckt'],['img/bv-bildschirme-rot.jpg','Chart der Woche','Nvidia: Doppeltop im Wochenchart bestätigt'],['img/hf-lupe-tabellen.jpg','Screening','19 Aktien, die im Ausverkauf stiegen']].map(r=>`<div><div class="ph" style="height:21mm;border-radius:4px;margin-bottom:2mm;background-image:url(${r[0]})"></div><div style="border-top:2px solid var(--lime);padding-top:2mm"><div style="font-size:6.8pt;font-weight:900;letter-spacing:.12em;color:var(--lime);text-transform:uppercase">${r[1]}</div><div style="font-size:9.8pt;font-weight:800;line-height:1.12;margin-top:.8mm">${r[2]}</div></div></div>`).join(''));
</script>
