 ['ABNB','hf-ferienhaus-nacht.jpg','Airbnb bucht wieder schneller','Übernachtungen +16 %, nach +10 % im Vorquartal. Umsatz 4,87 Mrd. $ (+19 %), Prognose für das Jahr angehoben. Dazu ein neues Rückkaufprogramm über bis zu 12 Mrd. $.','Der KI-Assistent löst schon rund 40 % der Kundenanfragen ohne Mitarbeiter. Die Servicekosten je Buchung sanken um über 17 %.'],
