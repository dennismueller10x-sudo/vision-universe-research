<section class="page dark">

<script>
VUM.k('zahlen',()=>{const D=VUM.D,c=VUM.C;return [
 ['−12,3 %','Halbleiter-Index SOX am Donnerstag: schwächster Tag seit März 2020',0,0],

 [''+VUM.de(c('MU').pe,1),'KGV von Micron. Walmart: '+VUM.de(D.quick.find(q=>q.t==='WMT').pe,0)+', Costco: '+VUM.de(D.quick.find(q=>q.t==='COST').pe,0),1,1],
 ['+'+VUM.de(c('APP').week,0)+' %','AppLovin in fünf Tagen, nach Quartalszahlen',0,1],
 ['165.000','neue Stellen im Oktober, erwartet waren rund 70.000',0,0],
 ['3,7 %','US-Inflation im September. Deshalb denkt die Fed über eine Zinserhöhung im Dezember nach',0,0],
 ['56 %','der Wähler nannten KI und Rechenzentren wichtig für ihre Wahl',0,0],
 ['9,6 Mrd. $','Rückkäufe eigener Aktien bei Berkshire im 3. Quartal',0,0],
 ['115 Mrd. $','Unternehmenswert der Lumentum-Übernahme durch Marvell',0,0],
 ['26,1 %','Anteil von KI-Aktien am Netto-Engagement der Hedgefonds, nach 31,7 % im Juni',0,0],
].map(r=>`<div style="background:${r[2]?'var(--lime)':'#111'};color:${r[2]?'#000':'#fff'};border:1px solid ${r[2]?'var(--lime)':'#262626'};border-radius:8px;padding:4mm;min-height:44mm;display:flex;flex-direction:column;justify-content:space-between"><div style="font-size:${r[0].length>8?'24pt':'30pt'};font-weight:900;letter-spacing:-.05em;line-height:.95">${r[0]}</div><div style="font-size:7.8pt;font-weight:700;line-height:1.35;color:${r[2]?'#000':'#bdbdbd'}">${r[3]?'<span style="color:'+(r[2]?'#000':'var(--lime)')+'">● </span>':''}${r[1]}</div></div>`).join('')});
</script>
