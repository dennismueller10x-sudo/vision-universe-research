<script>
VUM.k('ver',()=>[
 ['AXON','hf-bodycam.jpg','Axon: Drohnen-Abwehr verschoben','Umsatz +28 %, aber unter den Erwartungen. Die Jahresprognose sinkt: Drei große Aufträge des Bundes für Drohnen-Abwehr rutschen aus 2026, rund 130 Mio. $ Umsatz.','Das Abo-Geschäft läuft stark: wiederkehrender Umsatz +40 %, Kunden geben 26 % mehr aus als im Vorjahr. KI-Produkte erreichen über 100 Mio. $ im Jahr.'],

 ['TEAM',null,'Atlassian: Wachstum mit Bremse','Starke Zahlen (Umsatz +24 %), aber das Abo-Wachstum soll bis Jahresende auf rund 18,5 % sinken. −17 % nachbörslich, nach fast einer Verdopplung seit August.','Im Quartal kaufte Atlassian für 581 Mio. $ eigene Aktien, mehr als der freie Cashflow von 463 Mio. $.'],
