# =============================================================================
# VISION UNIVERSE — workers/vu-account/wrangler.toml
#
# Konto- und Abo-API (Cloudflare Workers Free: 100.000 Anfragen/Tag,
# 10 ms CPU je Anfrage; der Worker wartet fast nur auf Supabase/Stripe).
# Kein KV, kein D1, kein Durable Object: Zustand liegt in Supabase.
#
# AUSGEROLLT WIRD NUR VON HAND (Workflow "Konten — vu-account ausrollen",
# workflow_dispatch) in die GitHub-Umgebung "account-dev". Kein Ausrollen bei
# Merge. Produktion braucht die Freigabe aus docs/accounts/LIVE_RELEASE.md.
#
# SECRETS (nie in diese Datei, setzt der Workflow aus GitHub-Secrets):
#   SUPABASE_SECRET_KEY      sb_secret_…  (Supabase -> Settings -> API Keys)
#   STRIPE_SECRET_KEY        sk_test_… bzw. rk_test_… (Restricted Key empfohlen)
#   STRIPE_WEBHOOK_SECRET    whsec_…
#   BREVO_API_KEY            Brevo-API-Schluessel fuer Transaktions-E-Mails (Kuendigungsbestaetigung)
#   STRIPE_PORTAL_CONFIGURATION  bpc_… (kein Geheimnis; setzt "Konten — Entwicklungsumgebung einrichten")
#   STRIPE_WEBHOOK_SECRET wird ebenfalls von diesem Einrichtungs-Workflow gesetzt.
# =============================================================================

name = "vu-account-dev"
main = "src/index.mjs"
compatibility_date = "2026-09-17"
workers_dev = true
# Eigene Subdomain derselben Site, damit die HttpOnly-Cookies First-Party sind
# (Safari/Firefox blockieren Cookies von *.workers.dev im Kontext der Seite).
# Entwicklung: account-dev.visionuniverse.de. Aktivieren, sobald die Zone in
# Cloudflare liegt (docs/accounts/DEV_ENVIRONMENT.md, Schritt C1); Cloudflare legt
# DNS-Eintrag und Zertifikat selbst an:
# routes = [{ pattern = "account-dev.visionuniverse.de", custom_domain = true }]

[observability]
enabled = true

# Alle 10 Minuten: Postausgang wiederholen (Kuendigungsbestaetigungen), Fristen
# ueberwachen, Alarm an VU_OPS_ALERT_EMAIL (Workers Free: Cron-Trigger enthalten).
[triggers]
crons = ["*/10 * * * *"]

# Optionale, isolate-uebergreifende Ratenbegrenzung (docs/accounts/SETUP.md, C3).
# [[ratelimits]]
# name = "VU_ACCOUNT_LIMITER"
# namespace_id = "1101"
# simple = { limit = 20, period = 60 }

[vars]
VU_ENVIRONMENT = "development"
VU_SITE_ORIGIN = "https://research.visionuniverse.de"
# Wird nach dem ersten Ausrollen auf die Worker-Adresse gesetzt (Workflow-Variable
# VU_ACCOUNT_API_ORIGIN hat Vorrang). Muss in Supabase als Redirect-URL eingetragen sein.
VU_ACCOUNT_API_ORIGIN = ""
VU_ALLOWED_ORIGINS = ""
SUPABASE_URL = ""
# Oeffentlich (sb_publishable_…): darf im Klartext stehen, RLS schuetzt die Daten.
SUPABASE_PUBLISHABLE_KEY = ""
SUPABASE_FORWARD_CLIENT_IP = "false"
STRIPE_API_VERSION = "2025-03-31.basil"
STRIPE_CHECKOUT_REQUIRE_TERMS = "false"
# Oeffentliche Registrierung: AUS bis zur ausdruecklichen Freigabe.
VU_REGISTRATION_ENABLED = "false"
VU_REGISTRATION_ALLOWLIST = ""
# Absender der Transaktions-E-Mails (in Brevo verifiziert, Domain authentifiziert).
# Leer = keine E-Mails; Kuendigungen werden dann als "nicht bestaetigt" markiert.
VU_MAIL_SENDER = ""
VU_MAIL_SENDER_NAME = "Vision Universe"
# Kuendigung ohne Anmeldung (§ 312k BGB): Eingang speichern, bestaetigen,
# Zuordnung vorschlagen; ausfuehren nur durch eine berechtigte Person.
# VERPFLICHTEND "false" (Owner-Vorgabe); der Deploy-Workflow setzt den Wert hart.
VU_CANCELLATION_AUTO_PROCESS = "false"
# Empfaenger von Betriebsalarmen (Kuendigung > 24 h offen, Bestaetigung nicht
# zustellbar). Ohne Wert: nur Log und /v1/health "attention".
VU_OPS_ALERT_EMAIL = ""
# Produktionsfreigabe fuer Stripe-Live-Schluessel. Nur per Freigabe-PR auf "true".
STRIPE_LIVE_MODE_APPROVED = "false"
# Steuer im Checkout (docs/accounts/STEUER.md): none | automatic (Stripe Tax) | txr_… (fester Satz).
# Der Preis ist inkl. USt (tax_behavior inclusive); "none" weist keine Steuer gesondert aus.
STRIPE_TAX_MODE = "none"
# Rechtstexte: Fassung, die der Owner freigegeben hat (src/legal/texts.mjs LEGAL_VERSION, Status
# "freigegeben"). Ohne beides bleibt ein Live-Checkout "public" auf Tester beschraenkt.
VU_LEGAL_APPROVED = ""
# Brevo (docs/accounts/BREVO.md): A Kontaktabgleich (Servicekommunikation, keine Werbung),
# B Newsletter mit Double-Opt-in. IDs liefert scripts/account/brevo-setup.mjs.
VU_BREVO_SYNC = "false"
VU_NEWSLETTER = "false"
VU_BREVO_LIST_USERS = ""
VU_BREVO_LIST_FREE = ""
VU_BREVO_LIST_PRO = ""
VU_BREVO_LIST_NEWSLETTER = ""

# =============================================================================
# PRODUKTION (eine einzige Infrastruktur, docs/accounts/PRODUCTION.md)
#
#   npx wrangler deploy --env production   (nur ueber den Workflow
#   "Konten — vu-account ausrollen (Produktion)", mit Freigabe)
#
# Worker "vu-account" unter https://konto.visionuniverse.de (Custom Domain;
# Cloudflare legt DNS-Eintrag und Zertifikat an). NICHT account.visionuniverse.de:
# dieser Name gehoert den Shopify-Kundenkonten des Shops.
# Supabase-Projekt qiytbnpoqvldsatpfkeh (Frankfurt) ist die Produktionsdatenbank.
#
# Schalter, die nur per eigenem, freigegebenem PR umgestellt werden:
#   STRIPE_LIVE_MODE_APPROVED  Live-Abrechnung (zusaetzlich: Live-Preise in plan_prices)
#   VU_CHECKOUT_ACCESS         wer den Checkout starten darf: testers (Rolle billing_tester) | off | public
#   VU_REGISTRATION_ENABLED    oeffentliche Registrierung (zusaetzlich: registration_gate.open)
#   VU_CANCELLATION_AUTO_PROCESS bleibt "false" (Owner-Vorgabe; der Workflow erzwingt es)
# =============================================================================
[env.production]
name = "vu-account"
workers_dev = false
routes = [{ pattern = "konto.visionuniverse.de", custom_domain = true }]

[env.production.observability]
enabled = true

# Oeffentliche Registrierung: Ratenbegrenzung ueber alle Isolates (Cloudflare Rate Limiting Binding,
# docs/accounts/SETUP.md C3). Schluessel je Art und Client-IP (src/limits.mjs); dazu bleibt der Zaehler je
# Isolate (signup 5/h, login 10/5 min, recover 5/h) und die Grenzen von Supabase Auth.
[[env.production.ratelimits]]
name = "VU_ACCOUNT_LIMITER"
namespace_id = "1101"
simple = { limit = 20, period = 60 }

[env.production.triggers]
crons = ["*/10 * * * *"]

[env.production.vars]
VU_ENVIRONMENT = "production"
VU_SITE_ORIGIN = "https://research.visionuniverse.de"
VU_ACCOUNT_API_ORIGIN = "https://konto.visionuniverse.de"
VU_ALLOWED_ORIGINS = ""
SUPABASE_URL = "https://qiytbnpoqvldsatpfkeh.supabase.co"
# Oeffentlich, setzt der Workflow aus dem Secret (Repo-Regel: Schluessel nur ueber secrets).
SUPABASE_PUBLISHABLE_KEY = ""
# Erst "true", wenn in Supabase Auth "Forward client IP" eingeschaltet ist.
SUPABASE_FORWARD_CLIENT_IP = "false"
STRIPE_API_VERSION = "2025-03-31.basil"
STRIPE_CHECKOUT_REQUIRE_TERMS = "false"
# Oeffentliche Registrierung fuer jede gueltige Adresse (Owner-Entscheidung 27.10.2026), keine Positivliste.
# Konto erst nach bestaetigter E-Mail (Supabase Auth, mailer_autoconfirm = false); dazu registration_gate.open.
VU_REGISTRATION_ENABLED = "true"
VU_REGISTRATION_ALLOWLIST = ""
VU_MAIL_SENDER = "konto@visionuniverse.de"
VU_MAIL_SENDER_NAME = "Vision Universe"
VU_CANCELLATION_AUTO_PROCESS = "false"
VU_OPS_ALERT_EMAIL = ""
# Tarife Free und Pro (Owner-Entscheidung 28.10.2026): Stripe Live angebunden, Webhooks werden verarbeitet.
# Den Checkout starten duerfen nur Konten mit Rolle billing_tester (interner Test); der Deploy-Workflow
# lehnt "public" ab. Oeffentlicher Pro-Checkout nur per eigenem Freigabe-PR.
STRIPE_LIVE_MODE_APPROVED = "true"
VU_CHECKOUT_ACCESS = "testers"
# Siehe [vars]. Oeffentlicher Checkout zusaetzlich nur mit freigegebenen Rechtstexten (VU_LEGAL_APPROVED).
STRIPE_TAX_MODE = "none"
VU_LEGAL_APPROVED = ""
# Brevo aus bis zur Abnahme; Liste 4 = bestehende Newsletter-Liste der Landingpage (DOI).
VU_BREVO_SYNC = "false"
VU_NEWSLETTER = "false"
VU_BREVO_LIST_USERS = ""
VU_BREVO_LIST_FREE = ""
VU_BREVO_LIST_PRO = ""
VU_BREVO_LIST_NEWSLETTER = "4"
