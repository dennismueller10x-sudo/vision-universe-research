name = "vu-research-access"
main = "src/index.mjs"
compatibility_date = "2026-10-01"
workers_dev = false
preview_urls = false

# Existing GitHub Pages origin stays in place. This route requires proxied DNS.
[[routes]]
pattern = "research.visionuniverse.de/*"
zone_name = "visionuniverse.de"

# Set RESEARCH_ACCESS_PASSWORD with `wrangler secret put`, never in this file.
