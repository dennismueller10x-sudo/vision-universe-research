name: Intraday-Snapshots (Discover-Umfang waehrend der Sitzung, Universum nach Schluss)

# Eigentuemerentscheidung 2026-09-13 - quant/config/development-preview.json
# (intraday). Holt 5-Minuten-Bars ueber den bestehenden Tiingo-Adapter und
# legt je Titel und Sitzung einen Snapshot ab (quant/data/market/intraday/).
#
#   waehrend der Sitzung  Zeitplan alle 5 Minuten (V4.1 §4): die Titel auf den
#                         Discover-Flaechen (discover/data/live-scope/US_REAL.json).
#                         Ein Lauf braucht rund 6 Minuten (524 Abrufe bei
#                         hoechstens 100 je Minute - Sicherheitsgrenze des
#                         Adapters, kein Anbieterlimit); die Gruppe laesst nur
#                         einen Lauf zugleich zu und haelt einen wartend - so
#                         folgt Lauf auf Lauf, statt dass der 10-Minuten-Takt
#                         plus GitHub-Verzoegerung 16 Minuten wurde. Ein Lauf
#                         kurz vor 09:30 New York wartet auf die Eroeffnung
#                         (ingest-intraday.mjs, openWaitMs).
#   nach Handelsschluss   einmal: das ganze Produktuniversum, damit jede
#                         Aktienseite ein 1T hat
#
# Der Trading Session Resolver (quant/engines/realtime/trading-session.js)
# entscheidet je Lauf, welche Sitzung gilt; ausserhalb der Sitzung und bei
# abgeschlossenen Snapshots wird nichts abgerufen. Cron kennt keine
# Sommerzeit - das Fenster ist deshalb breit (13-21 UTC) und der Resolver
# haelt die Laeufe ausserhalb der Sitzung kurz (kein Abruf, kein Commit).
#
# Grenzen, die dieser Weg hat und die die Seite nennt: Lauf (~6 min) plus
# Pages-Auslieferung (~1-2 min); ein Stand ist deshalb bis zu ~8 Minuten alt.
# Die Statuszeile sagt "Markt geoeffnet · Live" nur im Zustand LIVE des
# Freshness-Vertrags; die Uhrzeit des Stands steht am Chart ("Stand 15:42").
#
# Der Zeitplan laeuft nur auf dem Default-Branch; auf Entwicklungsbranches
# dient ein Push mit der Marke `[intraday-snapshot]` als Ausloeser (ohne
# Pfadfilter: die Marke ist das Tor, nicht die Datei).

on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'discover (Flaechen), universe (alles) oder Tickerliste (AAPL,MSFT)'
        type: string
        default: 'discover'
  schedule:
    - cron: '*/5 13-21 * * 1-5'
    - cron: '35 21 * * 1-5'
  push:
    branches:
      - 'claude/**'

permissions:
  contents: write

concurrency:
  group: intraday-snapshots
  cancel-in-progress: false

jobs:
  snapshots:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      contains(github.event.head_commit.message, '[intraday-snapshot')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ist ein Zugang hinterlegt?
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
        run: |
          if [ -z "$TIINGO_API_KEY" ]; then
            echo "Kein TIINGO_API_KEY hinterlegt. Ohne Zugang wird nichts abgerufen."
            exit 1
          fi

      - name: Umfang bestimmen
        id: scope
        # Die Commit-Nachricht kommt ueber die Umgebung, nicht ueber eine
        # Textersetzung in der Kommandozeile.
        #
        # Vorher stand hier ${{ github.event.head_commit.message }} mitten
        # in einem Shell-Aufruf. Am 17.09.2026 hat das eine Nachricht mit
        # einem Anfuehrungszeichen darin zerlegt - der Schritt brach ab,
        # und der Lauf sah aus wie ein Datenfehler. Eine Commit-Nachricht
        # ist Text von aussen; sie gehoert nie unquotiert in ein Skript.
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_SCOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.scope || '' }}
        run: |
          SCOPE="$DISPATCH_SCOPE"
          # Auf Entwicklungsbranches darf die Marke den Umfang nennen: [intraday-snapshot:universe]
          if [ -z "$SCOPE" ] && [ "$EVENT_NAME" = "push" ]; then
            SCOPE=$(printf '%s' "$COMMIT_MESSAGE" | grep -o '\[intraday-snapshot:[a-zA-Z,]*\]' | head -1 | sed 's/\[intraday-snapshot:\(.*\)\]/\1/')
          fi
          if [ -z "$SCOPE" ]; then
            # Der Lauf um 21:35 UTC ist der Universumslauf nach Schluss. Alle anderen
            # Zeitplan-Laeufe entscheiden selbst (auto): bei offener Boerse die
            # Discover-Flaechen; ausserhalb der Sitzung das Universum, wenn die letzte
            # abgeschlossene Sitzung noch nicht fuer das Universum vorliegt (Nachzug
            # nach einem ausgefallenen oder verpassten Lauf - Vorfall 15.09.2026).
            if [ "${{ github.event.schedule }}" = "35 21 * * 1-5" ]; then SCOPE=universe; else SCOPE=auto; fi
          fi
          echo "scope=$SCOPE" >> "$GITHUB_OUTPUT"
          echo "Umfang: $SCOPE"

      - name: Intraday-Snapshots holen
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
        run: node scripts/market/ingest-intraday.mjs --scope=${{ steps.scope.outputs.scope }}

      - name: Kein Schluessel im Statusbericht
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
        run: node scripts/market/assert-no-secrets.mjs

      - name: Public-Data-Hygiene
        run: node scripts/market/assert-public-data-hygiene.mjs

      - name: Capability Matrix nachziehen (Intraday-Spalten)
        run: node scripts/market/build-capability-matrix.mjs

      - name: Quant-2.0-Product-Capabilities nachziehen
        run: node scripts/vu2/build-product-capabilities.mjs

      - name: Freshness-Check (Health-Bericht, kein Abbruch)
        run: node scripts/market/check-freshness.mjs

      - name: Commit und Push
        run: |
          git config user.name "vision-universe-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A quant/data/market/intraday quant/data/market/capabilities quant/data/market/freshness \
            quant/data/product/capabilities-v1.json quant/data/product/capabilities-summary-v1.json
          if git diff --cached --quiet; then
            echo "Keine neuen Snapshots."
          else
            git commit -m "Intraday-Snapshots: ${{ steps.scope.outputs.scope }} ($(node -e 'const s=require("./quant/data/market/intraday/status.json");console.log(s.session.sessionDate+" "+s.marketStateAtRun+", "+s.summary.written+" geschrieben, "+s.summary.requests+" Anfragen")'))"
            scripts/ci/push-with-retry.sh "${GITHUB_REF_NAME}"
          fi

      - name: Zusammenfassung
        if: always()
        run: |
          {
            echo '### Intraday-Snapshots'
            echo ''
            if [ -f quant/data/market/intraday/status.json ]; then
              node -e '
                const s = require("./quant/data/market/intraday/status.json"); const z = s.summary || {};
                console.log("| Kennzahl | Wert |"); console.log("|---|---|");
                console.log("| Sitzung | " + s.session.sessionDate + " (" + s.session.kind + ", " + (s.session.isComplete ? "abgeschlossen" : s.session.isRunning ? "laeuft" : "offen") + ") |");
                console.log("| Marktlage beim Lauf | " + s.marketStateAtRun + " · " + s.localTimeAtRun + " New York |");
                console.log("| Umfang | " + s.scope + " (" + z.requested + " Titel) |");
                console.log("| abgerufen / geschrieben / gewachsen | " + z.fetched + " / " + z.written + " / " + z.grown + " |");
                console.log("| unveraenderlich uebersprungen | " + z.skippedImmutable + " |");
                console.log("| ohne regulaere Bars / fehlgeschlagen | " + z.notPublishable + " / " + z.failed + " |");
                console.log("| Anfragen | " + z.requests + (z.stopped ? " (Abbruch: " + z.stopped + ")" : "") + " |");
                console.log("| Gruende | " + JSON.stringify(z.reasons) + " |");
              '
            fi
            if [ -f quant/data/market/freshness/health.json ]; then
              node -e '
                const h = require("./quant/data/market/freshness/health.json");
                console.log(""); console.log("### Freshness · " + h.overall);
                console.log("| Bereich | Zustand | Stand | erwartet |"); console.log("|---|---|---|---|");
                if (h.intraday) console.log("| Intraday | " + h.intraday.state + " | " + (h.intraday.dataSession ? h.intraday.dataSession.sessionDate : "-") + " | " + h.market.expectedIntradaySession + " |");
                if (h.daily) console.log("| Tageskurse | " + h.daily.state + " | " + h.daily.universeAsOf + " | " + h.daily.expectedSession + " |");
                (h.findings || []).forEach((f) => console.log("- " + f));
              '
            fi
          } >> "$GITHUB_STEP_SUMMARY"
