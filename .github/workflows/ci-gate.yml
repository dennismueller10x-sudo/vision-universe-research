name: ci-gate

# Sammel-Check "ci-gate" fuer "Merge bei Gruen" (CLAUDE.md, RUNBOOK §14), ereignisgesteuert (Steuerung 22./23.11.2026). Ersetzt den frueheren
# Job, der einen Runner hielt, solange er wartete. Der Check-Name "ci-gate" ist unveraendert (wait-gate.sh, Branch-Schutz).
#
# WARUM: der fruehere Job belegte einen Runner, solange es auf die anderen Pruefungen wartet (bis 85 min je PR-Push; 22.11.2026
# 20:00-22:45 UTC: 296 von 1.250 Runner-Minuten, bei 144 wartenden Jobs). Hier wartet kein Job:
#   pull_request:  kurzer Start-Job (Gnadenfrist 90 s, dann Check anlegen bzw. entscheiden, z. B. reiner Doku-PR)
#   workflow_run:  je Abschluss eines PR-Workflows ein Lauf von wenigen Sekunden, der die Laeufe des Commits liest und den Check setzt
# Fail-closed (scripts/ci/ci-gate-sync.mjs): gruen nur, wenn alle Actions-Laeufe dieses Commits abgeschlossen und nicht rot sind.
# Jeder Workflow mit pull_request MUSS unten stehen (Test CG-14), sonst bliebe der Check offen. workflow_run laeuft immer mit der
# Fassung auf main; Aenderungen an dieser Datei wirken erst nach dem Merge.
run-name: ${{ github.event_name == 'pull_request' && format('ci-gate PR {0}', github.event.pull_request.number) || format('ci-gate nach {0}', github.event.workflow_run.name) }}
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_run:
    workflows:
      - 'App - Android Bauprobe (ungesignt, kein Upload)'
      - 'CI (Pruefungen je Produkt)'
      - 'Company Intelligence (isolated preview)'
      - 'Core - Tests, Datenqualitaet, Systemzustand'
      - 'Currency & FX — Capability- und Datennachweis'
      - 'Multi-Asset Data Core — Faehigkeiten und Daten'
      - 'Quant 2.0 Production Pages'
      - 'Quant CI'
      - 'SEC Fundamentals — Universum'
      - 'Company Master — Universum, Suchindex, CIK'
    types: [completed]

# Pruef-Workflow: contents/actions nur lesend; checks: write nur, um den Check dieses Commits zu setzen (kein Schreibzugriff auf Code).
permissions:
  contents: read
  actions: read
  checks: write

# Je Commit ein laufender und ein wartender Lauf: der wartende liest beim Start den neuesten Stand, ein neuer ersetzt ihn gefahrlos.
concurrency:
  group: ci-gate-${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  sync:
    name: ci-gate-sync
    if: github.event_name == 'pull_request' || github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.ref || github.event.repository.default_branch }}
          sparse-checkout: scripts/ci
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check setzen (kein Warten)
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_SHA: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}
          GATE_MODE: ${{ github.event_name == 'pull_request' && 'start' || 'event' }}
          GATE_NAME: ci-gate
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/ci/ci-gate-sync.mjs
