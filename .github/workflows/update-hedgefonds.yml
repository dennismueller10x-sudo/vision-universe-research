name: Update Hedgefonds 13F data

on:
  workflow_dispatch:
  schedule:
    # Wöchentlich (Montag): erfasst Nachzügler, Korrekturen (13F-HR/A) und
    # neue Ticker-Zuordnungen. Ohne inhaltliche Änderung entsteht kein Commit.
    - cron: "17 6 * * 1"
    # Täglich rund um die vier 13F-Meldefristen (14. Feb, 15. Mai, 14. Aug,
    # 14. Nov), wenn die meisten Fonds melden.
    - cron: "17 7 10-20 2,5,8,11 *"

permissions:
  contents: write

concurrency:
  group: update-hedgefonds
  cancel-in-progress: false

jobs:
  update-hedgefonds-data:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch SEC EDGAR 13F data
        env:
          OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
        run: python scripts/hedgefonds/fetch_edgar_data.py

      - name: Verify generated-file-only scope
        shell: bash
        run: |
          unexpected="$(git status --porcelain -uall | awk '{print $2}' | grep -vE '^hedgefonds/(data|img/managers)/' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected modified files:"
            echo "$unexpected"
            exit 1
          fi

      - name: Validate generated data
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open("hedgefonds/data/hedgefonds.json"))
          inv = [f for f in d["funds"] if f["category"] == "Investoren"]
          assert len(inv) >= 20, f"nur {len(inv)} Investoren"
          for f in inv:
              assert f["totalValueUSD"] > 0 and f["reportDate"], f["slug"]
          print("OK:", len(inv), "Investoren,", d["latestPeriodLabel"], "| Fehler:", len(d["errors"]))
          PY

      - name: Commit generated data
        shell: bash
        run: |
          git add -A hedgefonds/data hedgefonds/img/managers
          if git diff --cached --quiet; then
            echo "Keine Änderungen an den 13F-Daten – nichts zu committen."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Hedgefonds: 13F-Daten aktualisiert ($(python3 -c "import json;print(json.load(open('hedgefonds/data/hedgefonds.json'))['latestPeriodLabel'])"))"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1
