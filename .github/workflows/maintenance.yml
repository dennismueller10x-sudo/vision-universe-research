# Buendel `maintenance` (core/registry/workflow-bundles.json, Plan Neustart §3, A-Doc):
# manuelle Betriebswerkzeuge, Diagnosen, Einmal-Laeufe. Jeder Teil ist ein eigener Job mit
# unveraendertem Inhalt (Schritte bytegleich, gleiche Concurrency-Gruppe wie vorher); gestartet
# wird genau der gewaehlte Teil (`teil`).
#   r2-audit   vormals r2-audit.yml (R2-Audit, nur lesen)
#
# r2-audit (vormals eigene Datei):
# R2-Audit (nur lesen): misst den Speicher der produktiven Ablage und vergleicht ihn mit der eigenen
# Decke (zero-cost-guard.js, 8 GB) und dem kostenlosen Kontingent (10 GB, 1 Mio Class A, 10 Mio Class B).
#
# Aendert nichts: kein PUT/DELETE, kein Bucket, keine Domain, keine Regel. Der S3-Treiber erlaubt nur
# GET/HEAD/LIST, die Cloudflare-API wird nur gelesen. Die Secrets kommen ueber env: und werden nie ausgegeben;
# das Ergebnis steht nur in der Job-Zusammenfassung (kein Commit, kein Artefakt).
name: Wartung (Buendel maintenance)

on:
  workflow_dispatch:
    inputs:
      teil:
        description: 'Welcher Teil'
        type: choice
        required: true
        options:
          - r2-audit

permissions:
  contents: read

jobs:
  r2-audit:
    name: R2 Audit (nur lesen)
    if: inputs.teil == 'r2-audit'
    concurrency:
      group: r2-audit-${{ github.ref_name }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Speicher und Operationen lesen
        env:
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_REGION: ${{ secrets.VU_HISTORY_S3_REGION }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          # Die Konto-ID steckt im Endpunkt und ist selbst kein Secret-Wert: vor jeder Ausgabe maskieren.
          if [[ "${VU_HISTORY_S3_ENDPOINT:-}" =~ ^https://([0-9a-f]{32})\. ]]; then echo "::add-mask::${BASH_REMATCH[1]}"; fi
          node scripts/core/r2-audit.mjs
