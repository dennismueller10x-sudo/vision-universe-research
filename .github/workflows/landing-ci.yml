name: Coming-soon Landingpage prüfen
on:
  pull_request:
    paths:
      - 'landing/**'
      - '.github/workflows/landing-ci.yml'
      - '.github/workflows/landing-pages-publish.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: landing-ci-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: landing
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - run: npm ci --ignore-scripts
      - run: node node_modules/playwright/cli.js install --with-deps chromium
      - run: npm test
      - run: npm run test:browser
      - run: npm run test:design
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: vision-universe-coming-soon-review
          path: |
            landing/dist/
            landing/review/
          retention-days: 14
          include-hidden-files: true
