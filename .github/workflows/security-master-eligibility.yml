name: Produktuniversum (Eignung aus dem Security Master, mit Gate)

# Erzeuger: scripts/market/build-us-eligibility.mjs (bestehend, keine Kursabfrage).
# Gate: scripts/core/eligibility-gate.mjs mit den Grenzen aus core/registry/eligibility-gate.json.
# Ablauf: neuer Stand nach $RUNNER_TEMP, Gate gegen den committeten Stand, Bericht als Artefakt,
# Commit nur mit commit=true UND Gate COMMIT. Ein Nachholen ueber die Grenzen hinaus braucht einen
# eigenen PR mit Vorher/Nachher (CLAUDE.md), nicht diesen Lauf.
# Zeitplan: folgt dem woechentlichen Security-Master-Lauf (workflow_run, nur main). Ein solcher Lauf committet nur bei
# Gate COMMIT unter den normalen Grenzen, ohne Freigabeliste; sonst rot und Alarm. Das Nachholen vom 05.11.2026
# (eligibility-catchup-2026-11, 228 Wechsel) ist uebernommen (Commit c5357718cb).
# Umfangsfolgen: aendert sich das Produktuniversum, entfernen die Erzeuger selbst, was nicht mehr im Umfang
# steht (Discover-Reihen, lange Reihen, Intraday; --prune-only/--index-only), Company Master und Discover werden
# neu gebaut, und die Materialisierung wird
# mit force neu angestossen (Technical-Signale). Sonst scheitern alle Laeufe mit Public-Data-Hygiene, auch
# der naechtliche Marktdatenlauf vor seiner Materialisierung (Befund 05.11.2026: 131 ETFs nach dem Nachholen).
# Zeitplan: core/registry/schedule.json (Wecker, Eintrag security-master-eligibility-schnellweg), RUNBOOK §10.
run-name: ${{ inputs.zeitplan && format('{0} · Takt {1}', github.workflow, inputs.zeitplan) || '' }}
on:
  workflow_run:
    workflows: ['Security Master + Firmennamen (wöchentlich)']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      zeitplan:
        description: 'Vom Cloudflare-Wecker gesetzt (Cron des Termins, core/registry/schedule.json); manuell leer lassen'
        type: string
        default: ''
      schnell_tage:
        description: 'Schnellweg fuer Boersengaenge (nur mit neuzugaenge): nur Titel, deren Anbieter-Beginn hoechstens so viele Tage zurueckliegt (1-30), hoechstens schnellMembersAdded je Lauf'
        type: string
        default: ''
      commit:
        description: 'Ergebnis committen (nur bei Gate COMMIT)'
        type: boolean
        default: false
      approved_catchup:
        description: 'Freigabeliste anwenden (Nachholen/Bereinigung, PR mit Vorher/Nachher)'
        type: boolean
        default: false
      freigabe:
        description: 'Freigabeliste unter docs/data/security-master/ (Dateiname)'
        default: 'eligibility-catchup-2026-11.json'
      umfangsfolgen:
        description: 'Nur die Umfangsfolgen nachziehen (Reihen ausserhalb des Umfangs entfernen, Materialisierung anstossen)'
        type: boolean
        default: false
      erweiterung:
        description: 'Mitgliedschaft erweitern: nur diese Ticker anhaengen (komma-getrennt; neuer Stamm aus der Anbieterliste, Stamm-Gate, Freigabe membersAdded)'
        type: string
        default: ''
      neuzugaenge:
        description: 'Dauerregel von Hand: neue Titel mit SEC-Abgleich anhaengen, hoechstens autoMembersAdded (core/registry/eligibility-gate.json); nach dem Wochenlauf automatisch'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  # dieselbe Gruppe wie Security Master und Marktdaten: kein paralleler Lauf auf denselben Dateien
  group: market-data-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  eligibility:
    # nach dem Security-Master-Lauf nur, wenn dieser gruen war
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Erweiterung der Mitgliedschaft (17.11.2026, Steuerung): neue Titel kommen sonst nie ins Universum (einmalige
      # Erweiterung vom 11.09.). Nur die Positivliste wird angehaengt (expand-us-universe --only), nichts entfernt; der
      # Wertpapierstamm wird mit dem erweiterten Bestand neu gebaut und muss das Stamm-Gate bestehen. Die Eignung unten
      # rechnet dann auf diesem Stand; die Zugaenge brauchen die Freigabe membersAdded in der Freigabeliste.
      #
      # Dauerregel (18.11.2026, Steuerung): nach dem Wochenlauf (workflow_run) oder mit neuzugaenge=true haengt derselbe
      # Schritt neue Titel ohne Positivliste an: expand-us-universe --auto (hoechstens autoMembersAdded aus
      # core/registry/eligibility-gate.json, nur mit SEC-Abgleich an derselben Boersenfamilie, aelteste Notierung zuerst,
      # der Rest wartet auf den naechsten Lauf). Das Gate laesst genau diese Zugaenge ohne Freigabeliste durch
      # (expansion.json auto.added); Abgaenge bleiben 0. Titel ohne genug Historie zeigen "zu kurze Historie".
      # Ohne SEC-Liste (Secret SEC_USER_AGENT fehlt oder Abruf scheitert) haengt der Lauf nichts an und warnt.
      - name: Erweiterung (Positivliste oder Dauerregel)
        if: inputs.erweiterung != '' || inputs.neuzugaenge == true || github.event_name == 'workflow_run'
        env:
          IN_ERWEITERUNG: ${{ inputs.erweiterung }}
          IN_SCHNELL: ${{ inputs.schnell_tage }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          set -euo pipefail
          case "${IN_ERWEITERUNG:-}" in *[!A-Za-z0-9,.\ -]*) echo "::error::erweiterung: nur Ticker, Komma, Leerzeichen"; exit 2;; esac
          case "${IN_SCHNELL:-}" in ''|*[!0-9]*) [ -z "${IN_SCHNELL:-}" ] || { echo "::error::schnell_tage: nur eine Zahl"; exit 2; };; esac
          heute="$(date -u +%F)"; X="$RUNNER_TEMP/erw"; N=quant/data/market/security-master
          mkdir -p "$X/work0" "$X/next0" "$X/scale" "$X/out" "$X/work1" "$X/next1" "$X/prev"
          if [ -z "${IN_ERWEITERUNG:-}" ]; then
            if [ -z "${SEC_USER_AGENT:-}" ] || ! curl -fsS --retry 3 -A "$SEC_USER_AGENT" -o "$X/sec-tickers.json" \
                 https://www.sec.gov/files/company_tickers_exchange.json; then
              echo "::warning::Dauerregel: keine SEC-Tickerliste (Secret SEC_USER_AGENT oder Abruf) - dieser Lauf haengt keine neuen Titel an"
              exit 0
            fi
          fi
          node scripts/market/build-us-security-master.mjs --require-provider --today "$heute" --stamp "${heute}T00:00:00Z" \
            --out "$X/next0" --work-dir "$X/work0"
          cp quant/data/market/scale/universe-FULL_UNIVERSE.json "$X/scale/"
          if [ -n "${IN_ERWEITERUNG:-}" ]; then
            node scripts/market/expand-us-universe.mjs --only "$IN_ERWEITERUNG" --master "$X/work0/us-security-master.json" \
              --scale-dir "$X/scale" --out "$X/out" --today "$heute"
          else
            max="$(node -e 'console.log(require("./core/registry/eligibility-gate.json").limits.autoMembersAdded)')"
            recent=()
            if [ -n "${IN_SCHNELL:-}" ]; then
              # Schnellweg (Boersengaenge): dieselbe Kette und derselbe SEC-Abgleich, nur Titel der letzten Tage, kleine Obergrenze
              max="$(node -e 'console.log(require("./core/registry/eligibility-gate.json").limits.schnellMembersAdded)')"
              recent=(--recent-days "$IN_SCHNELL")
            fi
            node scripts/market/expand-us-universe.mjs --auto "$max" --sec "$X/sec-tickers.json" --sec-submissions "${recent[@]}" \
              --master "$X/work0/us-security-master.json" --scale-dir "$X/scale" --out "$X/out" --today "$heute"
            echo "ELIG_AUTO_ADDED=$X/out/expansion.json" >> "$GITHUB_ENV"
          fi
          # Erst in den Repo-Pfad, dann den Stamm mit dem Standard-Bestand bauen: Stamm (reconciliation.baselineFile) und
          # Eignung speichern den Pfad der Bestandsdatei; ein Runner-Pfad macht SM60/SM62 und verify-company-master rot.
          cp "$X/scale/universe-FULL_UNIVERSE.json" quant/data/market/scale/universe-FULL_UNIVERSE.json
          node scripts/market/build-us-security-master.mjs --require-provider --today "$heute" --stamp "${heute}T00:00:00Z" \
            --out "$X/next1" --work-dir "$X/work1"
          for f in us-security-master.json summary.json reconciliation.json company-names.json; do git show "HEAD:$N/$f" > "$X/prev/$f"; done
          node scripts/market/security-master-refresh-gate.mjs --prev "$X/prev" --next "$X/next1" \
            --prev-names "$X/prev/company-names.json" --next-names "$N/company-names.json" --today "$heute" --out "$X/sm-gate.json"
          echo "ELIG_UNIVERSE=quant/data/market/scale/universe-FULL_UNIVERSE.json" >> "$GITHUB_ENV"
          echo "ELIG_MASTER=$X/next1/us-security-master.json" >> "$GITHUB_ENV"

      - name: Neuer Stand (bestehender Erzeuger, nach RUNNER_TEMP)
        run: |
          set -euo pipefail
          N=quant/data/market/security-master
          mkdir -p "$RUNNER_TEMP/elig/out" "$RUNNER_TEMP/elig/scale"
          node scripts/market/build-us-eligibility.mjs --master "${ELIG_MASTER:-$N/us-security-master.json}" \
            --universe "${ELIG_UNIVERSE:-quant/data/market/scale/universe-FULL_UNIVERSE.json}" \
            --previous "$N/eligibility.json" --names "$N/company-names.json" \
            --out "$RUNNER_TEMP/elig/out" --scale-out "$RUNNER_TEMP/elig/scale"
          # Vollstaendige Erzeugerkette (wie der committete Stand entstanden ist): ohne die beiden Schritte kaemen
          # boersennotierte Anleihen und ETNs als Stammaktie ins Produkt (Probelauf 05.11.2026: 147).
          E="$RUNNER_TEMP/elig"
          node scripts/market/apply-name-layer-class.mjs --classes DEBT --eligibility "$E/out/eligibility.json" \
            --reconciliation "$E/out/eligibility-reconciliation.json" --product-universe "$E/scale/universe-ELIGIBLE_US_EQUITY.json" \
            --names "$N/company-names.json"
          mkdir -p "$E/exchange-directory"
          # ETF seit 05.11.2026 (Bereinigung): belegte ETFs gehoeren nicht ins Aktien-Produktuniversum; SPY & Co. stehen
          # nicht in der Eignung (Multi-Asset-Segment).
          node scripts/market/apply-exchange-directory.mjs --classes DEBT,ETN,PREFERRED,WARRANT,RIGHT,UNIT,ETF \
            --dir "$E/exchange-directory" --eligibility "$E/out/eligibility.json" \
            --reconciliation "$E/out/eligibility-reconciliation.json" --product-universe "$E/scale/universe-ELIGIBLE_US_EQUITY.json"
          # Beendete Notierungen (scripts/market/apply-ended-listings.mjs, #2054) sind ZURUECKGESTELLT (Steuerung 17.11.2026,
          # Entscheidung A): Die Umfangsfolge loeschte lange Reihen, auf die eingefrorene Forschung (V10-Population,
          # Elliott-Registry, Backtest-Tests) verweist. Wieder eingeschaltet erst, wenn die Forschung private Kopien (R2) liest.

      - name: Gate (fail closed)
        id: gate
        env:
          IN_APPROVED: ${{ inputs.approved_catchup }}
          IN_FREIGABE: ${{ inputs.freigabe }}
        run: |
          extra=()
          if [ -n "${ELIG_AUTO_ADDED:-}" ]; then extra+=(--auto-added "$ELIG_AUTO_ADDED"); fi
          if [ "$IN_APPROVED" = "true" ]; then
            case "${IN_FREIGABE:-}" in ''|*/*|*..*) echo "::error::freigabe: nur ein Dateiname"; exit 2;; esac
            extra+=(--approved "docs/data/security-master/$IN_FREIGABE")
          fi
          set +e
          node scripts/core/eligibility-gate.mjs "${extra[@]}" --prev quant/data/market/security-master/eligibility.json \
            --next "$RUNNER_TEMP/elig/out/eligibility.json" \
            --prev-universe quant/data/market/scale/universe-ELIGIBLE_US_EQUITY.json \
            --next-universe "$RUNNER_TEMP/elig/scale/universe-ELIGIBLE_US_EQUITY.json" \
            --out "$RUNNER_TEMP/elig/gate.json"
          rc=$?
          set -e
          if [ "$rc" = 0 ]; then echo "decision=COMMIT" >> "$GITHUB_OUTPUT"; else echo "decision=BLOCKED" >> "$GITHUB_OUTPUT"; fi
          { echo '### Produktuniversum'; echo '```'; cat "$RUNNER_TEMP/elig/gate.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          [ "$rc" = 0 ] || [ "$rc" = 4 ]

      - name: Bericht als CI-Artefakt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eligibility-${{ github.run_id }}
          path: ${{ runner.temp }}/elig
          retention-days: 30

      - name: Commit (nur mit commit=true und Gate COMMIT)
        id: commit
        if: (github.event_name == 'workflow_run' || inputs.commit == true) && steps.gate.outputs.decision == 'COMMIT'
        env:
          PUSH_OWNED_PATHS: quant/data/market/security-master/eligibility.json quant/data/market/security-master/eligibility-reconciliation.json quant/data/market/scale/universe-ELIGIBLE_US_EQUITY.json
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/elig/out/eligibility.json" "$RUNNER_TEMP/elig/out/eligibility-reconciliation.json" quant/data/market/security-master/
          cp "$RUNNER_TEMP/elig/scale/universe-ELIGIBLE_US_EQUITY.json" quant/data/market/scale/
          if [ -n "${ELIG_UNIVERSE:-}" ]; then
            # Erweiterung: Mitgliedschaft und Wertpapierstamm desselben Laufs (Stamm-Gate oben bestanden)
            for f in us-security-master.json summary.json reconciliation.json backfill-estimate.json; do cp "$RUNNER_TEMP/erw/next1/$f" quant/data/market/security-master/; done
            PUSH_OWNED_PATHS="$PUSH_OWNED_PATHS quant/data/market/scale/universe-FULL_UNIVERSE.json quant/data/market/security-master/us-security-master.json quant/data/market/security-master/summary.json quant/data/market/security-master/reconciliation.json quant/data/market/security-master/backfill-estimate.json"
          fi
          git config user.name "vision-universe-bot"
          git config user.email "actions@users.noreply.github.com"
          git add $PUSH_OWNED_PATHS
          if git diff --cached --quiet; then echo "unveraendert"; exit 0; fi
          git commit -q -m "Produktuniversum: Eignung neu aus dem Security Master (Gate COMMIT)"
          scripts/ci/push-with-retry.sh "${GITHUB_REF_NAME}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Umfangsfolgen - Reihen ausserhalb des Umfangs entfernen (Erzeuger, kein Abruf)
        id: folgen
        if: steps.commit.outputs.changed == 'true' || inputs.umfangsfolgen == true
        env:
          PUSH_OWNED_PATHS: quant/data/market/discover-series/ quant/data/market/discover-series-kurz/ quant/data/market/discover-series-long/ quant/data/market/intraday/ quant/data/universe/ quant/data/market/capabilities/ quant/data/product/capabilities-v1.json quant/data/product/capabilities-summary-v1.json quant/data/market/security-master/company-names.json quant/data/market/security-master/company-names-summary.json quant/data/fundamentals/
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || 'VisionUniverseResearch info@visionuniverse.de' }}
        run: |
          set -euo pipefail
          git pull -q --rebase origin "${GITHUB_REF_NAME}" || true
          # Namensschicht gehoert zu genau einem Master-Stand (company-names.json master.sha256, Test CN6): nach jeder neuen
          # Eignung ohne Abruf aus den gespeicherten Kandidaten neu rechnen (derselbe Vorrang, kein Tiingo, kein SEC).
          node scripts/market/build-company-names.mjs
          # Company Master und Universums-Indizes: market-capability.json bestimmt, wofuer die Materialisierung
          # Technical-Signale baut. Derselbe Weg wie sec-fundamentals-daily.yml (dort erst am naechsten Morgen).
          node scripts/universe/build-company-master.mjs
          node scripts/universe/build-universe-indexes.mjs
          node scripts/universe/build-issuer-master.mjs
          node scripts/universe/verify-company-master.mjs
          # SEC-Abdeckung zum neuen Universum (18.11.2026): Aggregate und Abgleich aus den committeten Emittenten-Scherben,
          # ohne Abruf und ohne Faktenspeicher. Sonst sind sie bis zum naechsten SEC-Tageslauf vom alten Universum (test_daily rot).
          python3 scripts/quant/cli.py universe-follow
          # Faehigkeitsmatrix und Produkt-Projektion (Quelle von productUniverse fuer Strategie, Watchlist, Radar):
          # dieselben Schritte wie im Marktdatenlauf, ohne Kursabruf.
          node scripts/market/build-capability-matrix.mjs
          node scripts/vu2/build-product-capabilities.mjs
          # Teil B2a (Steuerung 21.11.2026): jede Reihe, die die Umfangsfolge gleich loescht, vorher privat sichern
          # (R2, Praefix research-series-long/, Lesetest je Datei). Die Loeschschritte loeschen nur, was mit gleichem Hash
          # im Manifest steht; sonst Abbruch vor dem Loeschen. Das Manifest wird als Beleg mitcommittet.
          sicherung="$RUNNER_TEMP/series-backup.json"
          node scripts/market/backup-series.mjs --plan --out "$sicherung"
          export VU_SERIES_BACKUP_MANIFEST="$sicherung"
          node scripts/market/publish-discover-series.mjs --prune-only
          node scripts/market/publish-long-series.mjs --prune-only
          node scripts/market/ingest-intraday.mjs --index-only
          # Discover-Daten (Startseite, Live-Umfang, Aktienseiten, Meta) aus dem neuen Universum: derselbe Erzeuger
          # und dieselbe Nachpruefung wie im Marktdatenlauf und in long-series.yml (Registereintrag discover/data/meta.json).
          node scripts/discover/build-discover-data.mjs
          node scripts/discover/verify-discover-data.mjs
          git config user.name "vision-universe-bot"
          git config user.email "actions@users.noreply.github.com"
          # Nur vorhandene bzw. getrackte Pfade: ein noch leeres Verzeichnis (z. B. discover-series-kurz vor der ersten
          # Kurzreihe) lässt "git add" sonst mit "pathspec did not match" (128) scheitern und der Schritt bricht ab.
          if [ "$(node -e 'console.log(require(process.argv[1]).count)' "$sicherung")" != "0" ]; then
            mkdir -p docs/data/security-master/series-backup
            cp "$sicherung" "docs/data/security-master/series-backup/$(date -u +%F)-${GITHUB_RUN_ID}.json"
            git add docs/data/security-master/series-backup
          fi
          for pfad in $PUSH_OWNED_PATHS discover/data; do
            if [ -e "$pfad" ] || git ls-files --error-unmatch -- "$pfad" >/dev/null 2>&1; then git add -A -- "$pfad"; fi
          done
          if git diff --cached --quiet; then echo "nichts ausserhalb des Umfangs"; else
            git commit -q -m "Umfangsfolgen: Reihen ausserhalb des Produktuniversums entfernt, Discover neu gebaut (Erzeuger)"
            # wie long-series.yml: nach dem Rebase Discover auf dem zusammengefuehrten Stand neu bauen und pruefen
            git pull -q --rebase origin "${GITHUB_REF_NAME}"
            node scripts/discover/build-discover-data.mjs
            node scripts/discover/verify-discover-data.mjs
            git add -A discover/data
            if ! git diff --cached --quiet; then git commit -q --amend --no-edit; fi
            scripts/ci/push-with-retry.sh "${GITHUB_REF_NAME}"
          fi
          # Uebrig bleiben darf hoechstens die Technical-Materialisierung, die der naechste Schritt neu anstoesst.
          set +e
          node scripts/market/assert-public-data-hygiene.mjs > "$RUNNER_TEMP/hygiene.txt" 2>&1
          set -e
          rest="$(grep -E '^ *- ' "$RUNNER_TEMP/hygiene.txt" | grep -v 'technical-signals-v1/' || true)"
          if [ -n "$rest" ]; then echo "$rest" | head -20; echo "::error::Hygiene-Befunde ausserhalb der Materialisierung"; exit 1; fi

      - name: Umfangsfolgen - Materialisierung neu anstossen (Technical-Signale)
        if: steps.folgen.outcome == 'success' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # ein wartender oder laufender Lauf baut ohnehin auf dem neuen Stand - kein zweiter
          offen="$(gh run list --workflow product-intelligence-materialization.yml --branch main --limit 10 --json status \
            --jq '[.[] | select(.status=="queued" or .status=="in_progress" or .status=="waiting" or .status=="pending")] | length')"
          if [ "$offen" != "0" ]; then echo "Materialisierung laeuft schon ($offen) - kein zweiter Anstoss"; exit 0; fi
          gh workflow run product-intelligence-materialization.yml --ref main -f force=true

      - name: Umfangsfolgen - Deckung und Fundamentalschicht-Abgleich neu messen (pipeline-weekly, Teil deckung)
        # Steuerung 19.11.2026: Der abgenommene Marktdatenstand (coverage-metrics.json, reconciliation.json) zieht bei jeder
        # Eignungsaenderung im selben Zug nach. Sonst ist der Abgleich der Fundamentalschicht bis zur naechsten Messung rot und
        # blockiert jeden PR auf Fundamental-Pfaden (19.11.: 6309 abgenommen, 6340 im Produkt). Der Teil erklaert jede
        # Abweichung je Titel (coverage-delta.mjs) und bricht bei Unerklaertem vor dem Commit ab.
        if: steps.folgen.outcome == 'success' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        # Ein zweiter Anstoss waehrend einer laufenden Messung wartet in der Gruppe market-data-main und misst danach erneut.
        run: gh workflow run pipeline-weekly.yml --ref main -f teil=deckung

      - name: Umfangsfolgen - Vorsorge-Ingest anstossen (ausgeschiedene ETFs)
        # Vorsorge las Reihen ausgeschiedener ETFs aus den Discover-Reihen (05.11.2026, 121 ETFs). Der Ingest holt
        # alles, was noch nicht im Vorsorge-Universum steht (Zusatz-ETFs aus dem Company Master), und baut neu.
        if: steps.folgen.outcome == 'success' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run research.yml --ref main -f teil=etf-universum -f nur_zusatz=true

      - name: Ergebnis
        if: steps.gate.outputs.decision != 'COMMIT'
        run: |
          echo "::error::Gate BLOCKED: Produktuniversum nicht uebernommen (Bericht im Artefakt und in der Zusammenfassung)."
          exit 1
