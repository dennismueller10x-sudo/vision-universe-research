# =========================================================================
# EXTERNAL SOCIAL INTELLIGENCE — DIE GANZE KETTE, TAEGLICH, OHNE OWNER
#
#   SCHEDULER
#     -> QUERY PORTFOLIO        wer bekommt heute einen der 100 Aufrufe
#     -> YOUTUBE SEARCH         finden, was wir noch nicht kennen
#     -> CREATOR DISCOVERY      neue Version des Watch Universe
#     -> PUBLIC METRIC ENRICHMENT  Zahlen zu den bekannten Kanaelen
#     -> EXTERNAL PATTERN INTELLIGENCE  Muster statt Texte
#     -> OPPORTUNITY ENGINE     externes Interesse als EIGENE Dimension
#
# Der Owner richtet Google Cloud und den Schluessel EINMAL ein. Danach
# laeuft das hier taeglich von selbst. Kein manueller Start, keine
# manuelle Suche, keine handgepflegte Creator-Liste.
#
# -------------------------------------------------------------------------
# WARUM DER LAUF OHNE SCHLUESSEL TROTZDEM SINNVOLL IST
# -------------------------------------------------------------------------
#
# Ohne YOUTUBE_API_KEY plant er und sucht nicht - und endet gruen. So
# ist taeglich sichtbar, WAS gesucht wuerde und was es kostete, lange
# bevor der erste Aufruf laeuft. Ein "kein Schluessel" darf nicht
# aussehen wie ein Defekt, sonst sucht jemand den Fehler statt den
# Schluessel.
#
# -------------------------------------------------------------------------
# DAS KONTINGENT, STAND 2026-06-01
# -------------------------------------------------------------------------
#
#   SUCHE       100 Aufrufe je Tag, eigener Topf, je 1
#   ALLGEMEIN   10.000 Einheiten je Tag, alles andere, je 1
#
# Die beiden sind unabhaengig. Deshalb laeuft die Anreicherung auch
# dann noch, wenn die Suchen des Tages aufgebraucht sind - sie
# verbraucht keinen einzigen davon.
#
# -------------------------------------------------------------------------
# EINE GRENZE, DIE HIER EHRLICH DASTEHEN MUSS
# -------------------------------------------------------------------------
#
# GitHub fuehrt `schedule` NUR im Standardzweig aus - genauso wie
# `workflow_dispatch` nur dort registriert wird. Solange diese Datei
# allein auf dem Feature-Zweig liegt, feuert der Zeitplan NICHT.
#
# Die Autonomie ist also gebaut und geprueft, aber sie wird erst
# wirksam, wenn der Zweig im Standardzweig landet. Das ist eine
# Owner-Entscheidung und keine, die von hier aus getroffen wird.
#
# Bis dahin gibt es den Datei-Ausloeser unten: wer
# `social/data/intelligence-request.json` aendert, startet einen Lauf.
# Das ist ein Nachweisweg, keine Zielarchitektur.
#
# Nichts hiervon veroeffentlicht. Keine kostenpflichtige Quelle.
# =========================================================================
name: Social External Intelligence

# -------------------------------------------------------------------------
# STILLGELEGT — OWNER-ENTSCHEIDUNG VOM 2026-09-20
# -------------------------------------------------------------------------
#
# Der Zeitplan ist ENTFERNT, nicht auskommentiert und nicht auf eine
# unmoegliche Uhrzeit gesetzt. Ein Zeitplan, der laeuft und jedes Mal
# nichts tut, verbraucht Laufzeit und erzeugt Protokolle, die jemand
# liest und deutet.
#
# Der Workflow selbst bleibt vollstaendig erhalten: er ist der fertige
# Pfad fuer den Tag, an dem die Quelle wieder eingeschaltet wird. Dann
# kommen drei Zeilen Zeitplan zurueck - kein Architekturumbau.
#
# Ein Lauf von Hand (workflow_dispatch) bleibt moeglich und bricht
# sauber ab, solange die Quelle auf NOT_ACTIVATED_BY_OWNER steht.
on:
  workflow_dispatch:
    inputs:
      searches:
        description: 'Wie viele Suchaufrufe (leer = Tagesplan entscheidet)'
        type: string
        default: ''


concurrency:
  group: social-external-intelligence
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  intelligence:
    runs-on: ubuntu-latest
    steps:
      # Beim push- und schedule-Ausloeser checkt die Aktion sonst den
      # Commit aus, nicht den Zweig - ein `git push` aus losgeloestem
      # HEAD scheitert, nachdem die Arbeit schon getan ist.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ist die Quelle ueberhaupt eingeschaltet?
        id: quelle
        run: |
          set -euo pipefail
          # Erst fragen, dann anfragen. Eine Anfrage gegen eine bewusst
          # abgeschaltete Quelle ist nicht nur nutzlos - sie erzeugt
          # Fehler, die danach jemand deutet.
          node -e '
            const R = require("./social/engines/source-registry.js");
            const fs = require("fs");
            const b = fs.existsSync("social/data/external-sources.json")
              ? JSON.parse(fs.readFileSync("social/data/external-sources.json", "utf8"))
              : null;
            const d = R.darfAnfragen(b, "YOUTUBE_EXTERNAL_INTELLIGENCE");
            console.log(d.explanation);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "aktiv=" + (d.allowed ? "ja" : "nein") + "\n");
          '

      - name: Stillgelegt — und das ist kein Fehler
        if: steps.quelle.outputs.aktiv != 'ja'
        run: |
          # KEIN ::warning:: und kein exit 1. Eine Owner-Entscheidung
          # ist kein Vorfall. Wer sie als Warnung meldet, erzieht zum
          # Wegsehen - und irgendwann uebersieht jemand den echten.
          echo "YOUTUBE_EXTERNAL_INTELLIGENCE steht auf NOT_ACTIVATED_BY_OWNER."
          echo "Es wird nichts abgefragt. Der Lauf endet gruen."
          {
            echo "## Stillgelegt"
            echo ""
            echo "Die Quelle ist per Owner-Entscheidung nicht aktiviert"
            echo "(\`social/data/external-sources.json\`). Der Pfad bleibt"
            echo "vollstaendig erhalten und ist ohne Umbau wieder aktivierbar."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Liegt ein Schluessel vor?
        if: steps.quelle.outputs.aktiv == 'ja'
        id: key
        env:
          KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          set -euo pipefail
          # Nur pruefen, DASS er da ist - nie, WAS er ist.
          if [ -z "${KEY:-}" ]; then
            echo "vorhanden=nein" >> "$GITHUB_OUTPUT"
            echo "::notice::Kein YOUTUBE_API_KEY hinterlegt. Der Lauf plant und sucht nicht. Das ist der offene Owner-Schritt, kein Defekt."
          else
            echo "vorhanden=ja" >> "$GITHUB_OUTPUT"
            echo "Schluessel vorhanden (${#KEY} Zeichen, Wert ungelesen)."
          fi

      - name: Query Portfolio — wer bekommt heute einen Aufruf?
        if: steps.quelle.outputs.aktiv == 'ja'
        run: |
          set -euo pipefail
          ARGS=""
          if [ -n "${{ inputs.searches }}" ]; then
            ARGS="--searches ${{ inputs.searches }}"
          fi
          node scripts/social/discover-creators.mjs $ARGS | tee tmp-plan.txt

      - name: Suchen und Watch Universe fortschreiben
        if: steps.key.outputs.vorhanden == 'ja'
        env:
          # Der Schluessel kommt als Variable herein; das Skript setzt ihn
          # in die Kopfzeile X-goog-api-key und nie in eine Adresse.
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          set -euo pipefail
          ARGS=""
          if [ -n "${{ inputs.searches }}" ]; then
            ARGS="--searches ${{ inputs.searches }}"
          fi
          node scripts/social/discover-creators.mjs $ARGS --discover

      - name: Oeffentliche Zahlen anreichern (kostet keinen Suchaufruf)
        if: steps.key.outputs.vorhanden == 'ja'
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          set -euo pipefail
          node scripts/social/enrich-youtube-metrics.mjs --run

      - name: Opportunity Engine — extern als eigene Dimension
        if: steps.quelle.outputs.aktiv == 'ja'
        run: |
          set -euo pipefail
          # Laeuft IMMER, auch ohne Schluessel: dann steht dort null
          # externe Beobachtungen, und das ist eine ehrliche Zahl.
          node scripts/social/rank-social-opportunities.mjs --top 3 \
            --out social/data | tee tmp-rank.txt

      - name: Zusammenfassen
        if: always()
        run: |
          {
            echo "## External Social Intelligence"
            echo ""
            echo "### Query Portfolio"
            echo '```'
            head -40 tmp-plan.txt 2>/dev/null || echo "kein Plan"
            echo '```'
            echo ""
            echo "### Evidenzklassen"
            echo '```'
            sed -n '/ZWEI EVIDENZKLASSEN/,/^$/p' tmp-rank.txt 2>/dev/null || echo "kein Lauf"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f tmp-plan.txt tmp-rank.txt

      - name: Festschreiben
        if: steps.quelle.outputs.aktiv == 'ja'
        run: |
          set -euo pipefail
          # `git diff` sieht neue Dateien nicht - und beim ersten Lauf
          # sind alle Ergebnisdateien neu. Derselbe Fehler hat im
          # Hashtag-Pfad schon einmal eine Beobachtung verschluckt.
          if [ -z "$(git status --porcelain -- social/data/)" ]; then
            echo "Keine Aenderung."
            exit 0
          fi
          git config user.name "vision-universe-bot"
          git config user.email "bot@visionuniverse.de"
          git add social/data/
          git commit -m "External Social Intelligence: taeglicher Lauf"
          # Der Instagram-Beobachter schreibt in denselben Zweig. Ohne
          # Rebase verliert der langsamere von beiden seinen Push.
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
