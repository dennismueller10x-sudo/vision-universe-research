name: Company Intelligence Reviewed Profiles and Source Onboarding
on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false
      sources:
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      publish:
        description: 'Main-only controlled update through existing full private restore, eligibility and GOOD guards'
        type: boolean
        default: false
      sources:
        description: 'One bounded resumable native source onboarding/HTTPS repair batch; no broad crawl'
        type: boolean
        default: true
permissions:
  contents: read
  actions: write
concurrency:
  group: company-intelligence-continuous-${{ inputs.publish && 'production' || 'profile-source-verification' }}
  cancel-in-progress: false
jobs:
  upgrade:
    if: ${{ !inputs.publish || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: abbea154a90ffece598e494530eea38661a20a95
          path: .accepted-identities
          sparse-checkout: |
            company-master
            company-intelligence
            quant/data/sec
            quant/data/universe
            docs/company-intelligence
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source, copy, privacy and failure-safety regressions
        run: |
          PYTHONPATH=scripts python3 -m unittest discover -s scripts/company_intelligence/tests -p 'test_reviewed_profiles.py'
          PYTHONPATH=scripts python3 -m unittest discover -s scripts/company_intelligence/tests -p 'test_source_onboarding.py'
          node --test scripts/company_intelligence/tests/continuous-refresh.test.mjs scripts/company_intelligence/tests/universe-identity-prune.test.mjs
      - name: Existing browser runtime; never a model dependency
        run: |
          npm install --prefix /tmp/ci-profile-source --no-audit --no-fund playwright@1.55.0
          node scripts/company_intelligence/install-browser-deps.mjs /tmp/ci-profile-source/node_modules/.bin/playwright
      - name: Verify private bucket access remains protected
        env:
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_API: ${{ secrets.CLOUDFLARE_API }}
        run: node scripts/company_intelligence/privacy.mjs
      - name: Full private restore, bounded upgrade, eligibility, fresh R2 restore and consumer readback
        env:
          NODE_PATH: /tmp/ci-profile-source/node_modules
          PUBLISH: ${{ inputs.publish }}
          SOURCES: ${{ inputs.sources }}
          RESEARCH_ACCESS_PASSWORD: ${{ secrets.RESEARCH_ACCESS_PASSWORD }}
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_REGION: ${{ secrets.VU_HISTORY_S3_REGION }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
        run: |
          options=()
          if [ "$PUBLISH" = true ]; then options+=(--publish); fi
          if [ "$SOURCES" = true ]; then options+=(--sources); fi
          node scripts/company_intelligence/profile-source-run.mjs --temporary "$RUNNER_TEMP/ci-profile-source" --identity-root .accepted-identities "${options[@]}"
      - name: Existing Pages deployment and real consumer verification
        id: live
        if: inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_PATH: /tmp/ci-profile-source/node_modules
          RESEARCH_ACCESS_PASSWORD: ${{ secrets.RESEARCH_ACCESS_PASSWORD }}
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_REGION: ${{ secrets.VU_HISTORY_S3_REGION }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
        run: |
          gh workflow run pages-release.yml --ref main
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const expected=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/ci-profile-source/health.json')).consumerGeneration;
          const deadline=Date.now()+30*60000;let served=false;
          while(Date.now()<deadline){
            try{const r=await fetch('https://research.visionuniverse.de/company-intelligence-delivery.json?profile='+Date.now(),{signal:AbortSignal.timeout(15000)});const d=await r.json();if(d.status==='PASS'&&d.generation===expected){served=true;break;}}catch{}
            await new Promise(r=>setTimeout(r,10000));
          }
          if(!served)throw Error('PROFILE_SOURCE_GENERATION_NOT_SERVED');
          NODE
          node scripts/company_intelligence/refresh-qa.mjs --live --delta "$RUNNER_TEMP/ci-profile-source/delta-qa.json" --out "$RUNNER_TEMP/ci-profile-source/live-qa.json"
          node scripts/company_intelligence/universe-browser-qa.mjs --live --consumer "$RUNNER_TEMP/ci-profile-source/consumer" --sample "$RUNNER_TEMP/ci-profile-source/profile-sample.json" --out "$RUNNER_TEMP/ci-profile-source/profile-live-browser-qa.json"
          node scripts/company_intelligence/refresh-run.mjs observe --health "$RUNNER_TEMP/ci-profile-source/health.json"
      - name: Fail closed on a material production regression
        if: failure() && steps.live.outcome == 'failure' && inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
        run: |
          node scripts/company_intelligence/refresh-run.mjs rollback || true
          node scripts/company_intelligence/production-release.mjs disable || true
          gh workflow run pages-release.yml --ref main -f company_intelligence_off=true
      - name: Public-safe aggregate acceptance only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: company-intelligence-profile-source-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ci-profile-source/health.json
            ${{ runner.temp }}/ci-profile-source/source-onboarding.json
            ${{ runner.temp }}/ci-profile-source/candidate-qa.json
            ${{ runner.temp }}/ci-profile-source/live-qa.json
            ${{ runner.temp }}/ci-profile-source/profile-source-funnel.json
            ${{ runner.temp }}/ci-profile-source/profile-before-funnel.json
            ${{ runner.temp }}/ci-profile-source/profile-qa-metadata.json
            ${{ runner.temp }}/ci-profile-source/profile-sample.json
            ${{ runner.temp }}/ci-profile-source/profile-browser-qa.json
            ${{ runner.temp }}/ci-profile-source/profile-live-browser-qa.json
            ${{ runner.temp }}/ci-profile-source/profile-*-browser-qa.json-*.png
          retention-days: 14
