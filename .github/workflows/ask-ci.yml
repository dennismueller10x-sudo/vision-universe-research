name: Frag Vision Universe — Tests
# Worker (Budget, Limits, Lernprotokoll) und Browser-Auswertung der
# Fragefunktion. Keine Anfrage an Anthropic: die API ist in den Tests aus Pappe.
on:
  pull_request:
    paths: ['ask/**', 'workers/vu-ask/**', 'screener/engine/**', 'scripts/screener/sic.mjs', 'scripts/supertrader/build.mjs', 'quant/engines/technical/ti/ai-tools.js', '.github/workflows/ask-ci.yml']
  push:
    branches: [main]
    paths: ['ask/**', 'workers/vu-ask/**', 'screener/engine/**', 'quant/engines/technical/ti/ai-tools.js', '.github/workflows/ask-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Worker und Auswertung
        run: node --test "workers/vu-ask/tests/*.test.mjs" "ask/tests/*.test.mjs"
      - name: Worker laesst sich buendeln (ohne Ausrollen)
        working-directory: workers/vu-ask
        run: npx --yes wrangler@4.147.0 deploy --dry-run --outdir /tmp/vu-ask-bundle
