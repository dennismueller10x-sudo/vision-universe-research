name: Company Intelligence Refresh Health
run-name: ${{ inputs.zeitplan && format('{0} · Takt {1}', github.workflow, inputs.zeitplan) || '' }}
on:
  workflow_dispatch:
    inputs:
      zeitplan:
        description: 'Von Cloudflare-Wecker gesetzt (Cron des Eintrags in core/registry/schedule.json); nicht von Hand'
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: company-intelligence-refresh-health
  cancel-in-progress: false
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    # contents: write nur fuer den Datenzweig data/live (scripts/ci/push-data-branch.sh verweigert main); kein Commit auf main, kein Release-Ausloeser.
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/ci
            core/registry
            company-intelligence/data
            scripts/market/storage
            scripts/company_intelligence
            company-intelligence/config
            company-intelligence/api
            company-intelligence/ui
            docs/company-intelligence
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read-only freshness SLO; no source polling or publication
        env:
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_REGION: ${{ secrets.VU_HISTORY_S3_REGION }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Exit contract: 0 = HEALTHY/WARNING/OFF (deliberately closed gate, fresh data),
          # 1 = SLO CRITICAL (a verdict file with status CRITICAL exists),
          # 2 = the check itself crashed (no verdict). Static import failures such as
          # ENOENT from a sparse checkout exit 1 in Node without a verdict file; they are
          # mapped to 2 here so a crash is never reported as a data outage.
          out="$RUNNER_TEMP/refresh-slo.json"
          rm -f "$out"
          rc=0
          node scripts/company_intelligence/refresh-run.mjs health --out "$out" || rc=$?
          if [ "$rc" -eq 1 ] && ! grep -q '"status": *"CRITICAL"' "$out" 2>/dev/null; then
            echo "::error::health crashed (exit 1 without an SLO verdict file); not an SLO finding"
            rc=2
          fi
          # Vollumfang: Refresh-SLO ueber Rueckstandsquote und Lane-Stempel (backlog-slo.mjs); ein
          # unlesbares Artefakt laesst das strenge Stempel-Urteil stehen. Nur Lesen.
          if [ "$rc" -le 1 ] && [ -s "$out" ]; then
            rc=0
            node scripts/company_intelligence/backlog-slo.mjs --verdict "$out" || rc=$?
          fi
          # Frischealarm Rollback-Freeze (freeze-slo.mjs): WARNING ab 5 Tagen, CRITICAL ab 6 Tagen oder abgelaufen. Hebt nur an.
          if [ "$rc" -le 1 ] && [ -s "$out" ]; then
            rc=0
            node scripts/company_intelligence/freeze-slo.mjs --verdict "$out" || rc=$?
          fi
          case "$rc" in
            0) ;;
            1) echo "::error::Company Intelligence SLO CRITICAL (verdict in artifact company-intelligence-refresh-slo-${GITHUB_RUN_ID})" ;;
            2) echo "::error::health crashed; see job log. No SLO verdict was produced" ;;
            *) echo "::error::health exited with unexpected code $rc"; rc=2 ;;
          esac
          exit "$rc"
      # Veroeffentlichung des Urteils als Aggregat (nur Zahlen) im Datenzweig; /status/ liest es ueber core/registry/domains.json
      # (companyIntelligenceRefresh, core/registry/data-branch.json). Auch bei SLO CRITICAL, solange ein Urteil vorliegt; ein Fehler hier
      # faerbt den Lauf nicht rot (das Urteil selbst steht im Artefakt).
      - name: Aggregat in den Datenzweig schreiben (nicht nach main; nur Laeufe auf main)
        if: always() && github.ref == 'refs/heads/main'
        env:
          RUNNER_TMP: ${{ runner.temp }}
        run: |
          set -uo pipefail
          out="$RUNNER_TMP/refresh-slo.json"
          [ -s "$out" ] || { echo "::notice::kein Urteil, Aggregat nicht geschrieben"; exit 0; }
          # Bisheriger Stand (Verlauf) aus dem Datenzweig in den Arbeitsbaum (DB-15); fehlt er, beginnt der Verlauf neu.
          scripts/ci/seed-data-branch.sh companyIntelligenceRefresh || echo "::warning::Datenzweig nicht eingespielt, Verlauf beginnt neu"
          prev=company-intelligence/data/refresh-slo.json
          [ -s "$prev" ] && cp "$prev" "$RUNNER_TMP/refresh-slo-previous.json" || rm -f "$RUNNER_TMP/refresh-slo-previous.json"
          prev="$RUNNER_TMP/refresh-slo-previous.json"
          args=(--verdict "$out" --out company-intelligence/data/refresh-slo.json)
          [ -s "$prev" ] && args+=(--previous "$prev")
          node scripts/company_intelligence/refresh-slo-aggregate.mjs "${args[@]}" || { echo "::warning::Aggregat nicht gebaut"; exit 0; }
          scripts/ci/push-data-branch.sh data/live company-intelligence/data/refresh-slo.json || echo "::warning::Aggregat nicht in den Datenzweig geschrieben"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: company-intelligence-refresh-slo-${{ github.run_id }}
          path: ${{ runner.temp }}/refresh-slo.json
          if-no-files-found: ignore
          retention-days: 14
