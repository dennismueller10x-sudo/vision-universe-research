name: Konten — Tarife Free/Pro einspielen (Ops, Produktion)
# Owner-Entscheidung 28.10.2026 (PR #1055). Eine Freigabe (Umgebung account-dev), dann:
#   1. Migration 20261028000200_free_pro.sql (Pruefsumme fest) mit der offiziellen CLI (supabase db push), Probelauf zuerst.
#      Kein reset, kein migration repair; Konten und Watchlists bleiben unberuehrt.
#   2. Nachkontrolle: free = pro, gesperrte Funktionen in keinem Tarif, plus verborgen, Rolle billing_tester vorhanden.
#   3. Optional (Datei ops/production/billing-tester.sha256 nicht leer): Rolle billing_tester fuer genau das Konto,
#      dessen kleingeschriebene E-Mail-Adresse diesen SHA-256 hat (Adresse steht nirgends im Repository).
# Ausgabe nur Zaehlungen und Zustaende.
on:
  push:
    branches: [ops/supabase-dev-migrations]
    paths: ['.github/workflows/account-prod-free-pro.yml', 'ops/production/free-pro.trigger', 'ops/production/billing-tester.sha256']
permissions:
  contents: read
  actions: read
concurrency:
  group: account-prod-free-pro-${{ github.ref_name }}
  cancel-in-progress: false
env:
  PROJECT_REF: qiytbnpoqvldsatpfkeh
  SUPABASE_CLI: supabase@2.122.0
  MIGRATION: 20261028000200_free_pro.sql
jobs:
  einspielen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: account-dev
    steps:
      - name: Freigabe des Owners pruefen (fail closed, vor jedem Datenbankzugriff)
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          APPROVER: dennismueller10x-sudo
        run: |
          set -euo pipefail
          json=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/approvals")
          ok=$(jq --arg u "$APPROVER" '[.[] | select(.state == "approved" and .user.login == $u
                 and any(.environments[]; .name == "account-dev"))] | length' <<<"$json")
          [ "$ok" -ge 1 ] || { echo "::error::Keine Freigabe durch $APPROVER fuer account-dev - Abbruch ohne jede Aenderung"; exit 1; }
          echo "Freigabe durch $APPROVER fuer account-dev liegt vor."

      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Quelle pruefen (9 Migrationen, Pruefsumme der neuen)
        run: |
          set -euo pipefail
          test "$(ls supabase/migrations/*.sql | wc -l)" -eq 9
          echo "MIGRATION_MD5  supabase/migrations/$MIGRATION" | sed "s/MIGRATION_MD5/$(cat ops/production/free-pro.md5)/" | md5sum -c --strict

      - name: Ziel pruefen (Projekt, Historie 1-8 vorhanden)
        env:
          DB_URL: ${{ secrets.VU_ACCOUNT_SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          [[ "$DB_URL" == postgresql://* && "$DB_URL" == *"$PROJECT_REF"* ]] \
            || { echo "::error::VU_ACCOUNT_SUPABASE_DB_URL fehlt oder gehoert nicht zu $PROJECT_REF"; exit 1; }
          q() { psql -X -q -t -A -v ON_ERROR_STOP=1 -d "$DB_URL" -c "$1"; }
          n=$(q "select count(*) from supabase_migrations.schema_migrations where version <= '20261028000100'")
          [ "$n" = 8 ] || { echo "::error::Historie 1-8 unvollstaendig ($n)"; exit 1; }
          echo "Historie: $(q 'select count(*) from supabase_migrations.schema_migrations') Eintraege; Konten: $(q 'select count(*) from auth.users'); Watchlist-Titel: $(q 'select count(*) from public.watchlist_items')"

      - name: Arbeitsverzeichnis fuer die CLI
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/sb"; mkdir -p "$work"; cd "$work"
          npx --yes "$SUPABASE_CLI" init --yes > /dev/null
          mkdir -p supabase/migrations
          cp "$GITHUB_WORKSPACE"/supabase/migrations/*.sql supabase/migrations/

      - name: Probelauf und Einspielen (supabase db push)
        env:
          DB_URL: ${{ secrets.VU_ACCOUNT_SUPABASE_DB_URL }}
        working-directory: ${{ runner.temp }}/sb
        run: |
          set -euo pipefail
          npx "$SUPABASE_CLI" db push --dry-run --db-url "$DB_URL" | tee "$RUNNER_TEMP/plan.txt"
          if grep -q 'up to date' "$RUNNER_TEMP/plan.txt"; then echo "Bereits eingespielt."; exit 0; fi
          grep -q "${MIGRATION%.sql}" "$RUNNER_TEMP/plan.txt" || { echo "::error::Unerwarteter Plan"; exit 1; }
          [ "$(grep -cE '^ ?• [0-9]{14}_' "$RUNNER_TEMP/plan.txt" || true)" -le 1 ] || { echo "::error::Mehr als eine offene Migration"; exit 1; }
          npx "$SUPABASE_CLI" db push --yes --db-url "$DB_URL"

      - name: Nachkontrolle
        env:
          DB_URL: ${{ secrets.VU_ACCOUNT_SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          q() { psql -X -q -t -A -v ON_ERROR_STOP=1 -d "$DB_URL" -c "$1"; }
          test "$(q "select count(*) from supabase_migrations.schema_migrations where version = '20261028000200'")" = 1
          test "$(q "select (select jsonb_object_agg(feature_key, limit_value) from public.plan_features where plan_id = 'free') = (select jsonb_object_agg(feature_key, limit_value) from public.plan_features where plan_id = 'pro')")" = t
          test "$(q "select count(*) from public.plan_features where feature_key in ('quant.screener.full','supertrader.signals','alerts.push','export.csv')")" = 0
          test "$(q "select active or is_public from public.plans where id = 'plus'")" = f
          test "$(q "select count(*) from pg_enum e join pg_type t on t.oid = e.enumtypid where t.typname = 'app_role' and e.enumlabel = 'billing_tester'")" = 1
          echo "Tarife: $(q "select string_agg(id || ':' || (active and is_public), ',' order by rank) from public.plans")"
          echo "Free = Pro: $(q "select string_agg(feature_key || '=' || limit_value, ', ' order by feature_key) from public.plan_features where plan_id = 'free'")"
          echo "Live-Preise: $(q 'select count(*) from public.plan_prices where livemode and active')"
          echo "Konten: $(q 'select count(*) from auth.users'); Watchlist-Titel: $(q 'select count(*) from public.watchlist_items') (unveraendert)"

      - name: Rolle billing_tester (nur mit Hash-Datei)
        env:
          DB_URL: ${{ secrets.VU_ACCOUNT_SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          h=$(tr -d ' \n' < ops/production/billing-tester.sha256 2>/dev/null || true)
          [ -n "$h" ] || { echo "Keine Testerrolle angefordert."; exit 0; }
          [[ "$h" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::billing-tester.sha256 ist kein SHA-256"; exit 1; }
          # $h ist geprueft (64 Hex-Zeichen) und darf deshalb direkt im SQL stehen.
          q() { psql -X -q -t -A -v ON_ERROR_STOP=1 -d "$DB_URL" -c "$1"; }
          n=$(q "select count(*) from auth.users where encode(sha256(convert_to(lower(email), 'UTF8')), 'hex') = '$h' and email_confirmed_at is not null")
          [ "$n" = 1 ] || { echo "::error::Kein (oder kein bestaetigtes) Konto zu diesem Hash ($n) - erst registrieren und bestaetigen"; exit 1; }
          q "insert into public.user_roles (user_id, role)
            select id, 'billing_tester' from auth.users where encode(sha256(convert_to(lower(email), 'UTF8')), 'hex') = '$h'
            on conflict do nothing" > /dev/null
          echo "Konten mit Rolle billing_tester: $(q "select count(*) from public.user_roles where role = 'billing_tester'")"
