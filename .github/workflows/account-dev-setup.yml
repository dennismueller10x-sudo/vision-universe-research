name: Konten — Entwicklungsumgebung einrichten
# Richtet die ECHTEN Entwicklungszugaenge ein (Supabase Free, Stripe-Testmodus,
# Brevo). Nur von Hand (workflow_dispatch), Werte aus der GitHub-Umgebung
# "account-dev". Anleitung und Reihenfolge: docs/accounts/DEV_ENVIRONMENT.md.
#
#   supabase  Migrationen einspielen, Positivliste setzen, Auth einstellen
#             (Redirect, Bestaetigung, Hook "Before User Created", SMTP ueber Brevo)
#   stripe    Testkatalog, Kundenportal, Webhook; Preis-IDs nach plan_prices;
#             Webhook-Geheimnis und Portal-ID direkt als Worker-Secret
#   brevo     Schluessel, Absender, Domain pruefen (sendet nichts)
#   pruefen   Ende-zu-Ende-Pruefung (scripts/account/dev-doctor.mjs)
#
# Sperren: Stripe-Live-Schluessel werden abgelehnt; Supabase nur, wenn der
# Projektname dev/test/staging enthaelt; Probelauf ist voreingestellt; kein
# Wert wird ausgegeben (oeffentliches Repository).
on:
  workflow_dispatch:
    inputs:
      step:
        description: 'Schritt'
        type: choice
        options: [pruefen, supabase, stripe, brevo, alle]
        default: pruefen
      dry_run:
        description: 'Probelauf (nichts schreiben)'
        type: boolean
        default: true
permissions:
  contents: read
  actions: read
concurrency:
  group: account-dev-setup-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  # Sensibel: erst nach ausdruecklicher Freigabe des Owners (Umgebung account-production,
  # Required reviewers). account-dev selbst hat keine Required reviewers mehr (docs/accounts/FREIGABEN.md).
  freigabe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: account-production
    steps:
      - name: Owner-Freigabe dieses Laufs pruefen (fail closed)
        env: {GH_TOKEN: '${{ github.token }}', RUN_ID: '${{ github.run_id }}', REPO: '${{ github.repository }}', APPROVER: dennismueller10x-sudo, ENV_NAME: account-production}
        run: |
          set -euo pipefail
          json=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/approvals")
          ok=$(jq --arg u "$APPROVER" --arg e "$ENV_NAME" '[.[] | select(.state=="approved" and .user.login==$u and any(.environments[]; .name==$e))] | length' <<<"$json")
          [ "$ok" -ge 1 ] || { echo "::error::Keine Freigabe durch $APPROVER fuer $ENV_NAME"; exit 1; }

  setup:
    needs: freigabe
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: account-dev
    env:
      STEP: ${{ inputs.step }}
      DRY_RUN: ${{ inputs.dry_run }}
      SUPABASE_URL: ${{ vars.VU_ACCOUNT_SUPABASE_URL }}
      VU_ACCOUNT_API_ORIGIN: ${{ vars.VU_ACCOUNT_API_ORIGIN }}
      VU_MAIL_SENDER: ${{ vars.VU_ACCOUNT_MAIL_SENDER }}
    steps:
      - name: Owner-Freigabe dieses Laufs pruefen (fail closed)
        env: {GH_TOKEN: '${{ github.token }}', RUN_ID: '${{ github.run_id }}', REPO: '${{ github.repository }}', APPROVER: dennismueller10x-sudo, ENV_NAME: account-production}
        run: |
          set -euo pipefail
          json=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/approvals")
          ok=$(jq --arg u "$APPROVER" --arg e "$ENV_NAME" '[.[] | select(.state=="approved" and .user.login==$u and any(.environments[]; .name==$e))] | length' <<<"$json")
          [ "$ok" -ge 1 ] || { echo "::error::Keine Freigabe durch $APPROVER fuer $ENV_NAME"; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Werkzeuge pruefen (ohne Netz)
        run: node --test scripts/account/tests/dev-tools.test.mjs

      - name: Supabase — Migrationen, Positivliste, Auth
        if: inputs.step == 'supabase' || inputs.step == 'alle'
        env:
          SUPABASE_DB_URL: ${{ secrets.VU_ACCOUNT_SUPABASE_DB_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.VU_ACCOUNT_SUPABASE_ACCESS_TOKEN }}
          ALLOWLIST: ${{ vars.VU_ACCOUNT_REGISTRATION_ALLOWLIST }}
          BREVO_SMTP_LOGIN: ${{ secrets.VU_ACCOUNT_BREVO_SMTP_LOGIN }}
          BREVO_SMTP_KEY: ${{ secrets.VU_ACCOUNT_BREVO_SMTP_KEY }}
        run: |
          set -euo pipefail
          [[ "$SUPABASE_URL" =~ ^https://([a-z0-9]{20})\.supabase\.co$ ]] || { echo "::error::VU_ACCOUNT_SUPABASE_URL fehlt (https://<ref>.supabase.co)"; exit 1; }
          export SUPABASE_PROJECT_REF="${BASH_REMATCH[1]}"
          [[ "$SUPABASE_DB_URL" == postgresql://* && "$SUPABASE_DB_URL" == *"$SUPABASE_PROJECT_REF"* ]] \
            || { echo "::error::VU_ACCOUNT_SUPABASE_DB_URL fehlt oder gehoert nicht zu diesem Projekt"; exit 1; }
          psql --version
          if [ "$DRY_RUN" = "true" ]; then
            node scripts/account/apply-migrations.mjs --dry-run
            node scripts/account/supabase-auth-config.mjs --dry-run
            exit 0
          fi
          node scripts/account/apply-migrations.mjs
          [[ -z "$ALLOWLIST" || "$ALLOWLIST" =~ ^[A-Za-z0-9._%+@,-]+$ ]] || { echo "::error::VU_ACCOUNT_REGISTRATION_ALLOWLIST: nur Adressen, kommagetrennt"; exit 1; }
          # Variablen setzt psql nur in Eingaben von stdin ein (nicht bei -c); :'list' wird sicher zitiert.
          count=$(echo "select public.registration_set_allowlist(string_to_array(nullif(:'list', ''), ','));" \
            | psql -X -q -t -A -v ON_ERROR_STOP=1 -v list="$ALLOWLIST" -d "$SUPABASE_DB_URL")
          echo "Positivliste: $count Adresse(n)"
          node scripts/account/supabase-auth-config.mjs

      - name: Stripe — Testkatalog, Portal, Webhook
        if: inputs.step == 'stripe' || inputs.step == 'alle'
        env:
          STRIPE_SETUP_KEY: ${{ secrets.VU_ACCOUNT_STRIPE_SETUP_KEY }}
          SUPABASE_DB_URL: ${{ secrets.VU_ACCOUNT_SUPABASE_DB_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          case "$STRIPE_SETUP_KEY" in
            sk_test_*|rk_test_*) ;;
            sk_live_*|rk_live_*) echo "::error::Stripe-LIVE-Schluessel abgelehnt."; exit 1;;
            *) echo "::error::VU_ACCOUNT_STRIPE_SETUP_KEY fehlt (sk_test_…)"; exit 1;;
          esac
          [[ "$VU_ACCOUNT_API_ORIGIN" =~ ^https://[a-z0-9.-]+$ ]] || { echo "::error::VU_ACCOUNT_API_ORIGIN fehlt - zuerst den Worker ausrollen"; exit 1; }
          if [ "$DRY_RUN" = "true" ]; then node scripts/account/stripe-test-setup.mjs --dry-run; exit 0; fi
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::CLOUDFLARE_API_TOKEN fehlt"; exit 1; }
          umask 077
          out="$RUNNER_TEMP/stripe"; mkdir -p "$out"
          node scripts/account/stripe-test-setup.mjs --secret-out="$out/whsec" --sql-out="$out/prices.sql" | tee "$out/log"
          psql -X -q -v ON_ERROR_STOP=1 -d "$SUPABASE_DB_URL" -f "$out/prices.sql"
          echo "plan_prices aktualisiert."
          cd workers/vu-account
          put() { npx --yes wrangler@4.147.0 secret put "$1" < "$2" > /dev/null 2>&1 && echo "$1 im Worker hinterlegt" || { echo "::error::$1 nicht hinterlegt (Worker schon ausgerollt?)"; exit 1; }; }
          if [ -s "$out/whsec" ]; then put STRIPE_WEBHOOK_SECRET "$out/whsec"; fi
          portal=$(grep -oE 'bpc_[A-Za-z0-9]+' "$out/log" | head -1 || true)
          if [ -n "$portal" ]; then printf '%s' "$portal" > "$out/portal"; put STRIPE_PORTAL_CONFIGURATION "$out/portal"; fi

      - name: Brevo pruefen
        if: inputs.step == 'brevo' || inputs.step == 'alle'
        env:
          BREVO_API_KEY: ${{ secrets.VU_ACCOUNT_BREVO_API_KEY }}
        run: node scripts/account/brevo-check.mjs

      - name: Ende-zu-Ende pruefen
        if: inputs.step == 'pruefen' || (inputs.step == 'alle' && !inputs.dry_run)
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VU_ACCOUNT_SUPABASE_PUBLISHABLE_KEY }}
          STRIPE_SETUP_KEY: ${{ secrets.VU_ACCOUNT_STRIPE_SETUP_KEY }}
          BREVO_API_KEY: ${{ secrets.VU_ACCOUNT_BREVO_API_KEY }}
        run: node scripts/account/dev-doctor.mjs

      - name: Temporaere Dateien entfernen
        if: always()
        run: rm -rf "$RUNNER_TEMP/stripe"
