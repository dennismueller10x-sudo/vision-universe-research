name: Konten — Supabase Auth einstellen (Produktion)
# Stellt Supabase Auth der Produktionsdatenbank (qiytbnpoqvldsatpfkeh) ein:
# Site-URL, Redirect https://konto.visionuniverse.de/v1/auth/callback**,
# E-Mail-Bestaetigung, Passwortregeln, Hook "Before User Created"
# (Registrierungssperre in der Datenbank), deutsche Vorlagen und - wenn die
# Brevo-SMTP-Zugangsdaten hinterlegt sind - SMTP ueber Brevo.
# scripts/account/supabase-auth-config.mjs --production (nur die feste Ref).
# Startet als Probelauf. Oeffnet die Registrierung NICHT (registration_gate).
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Probelauf (nichts aendern)'
        type: boolean
        default: true
permissions:
  contents: read
  actions: read
concurrency:
  group: account-production-auth-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  # Sensibel: erst nach ausdruecklicher Freigabe des Owners (Umgebung account-production,
  # Required reviewers). account-dev selbst hat keine Required reviewers mehr (docs/accounts/FREIGABEN.md).
  freigabe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: account-production
    steps:
      - name: Owner-Freigabe dieses Laufs pruefen (fail closed)
        env: {GH_TOKEN: '${{ github.token }}', RUN_ID: '${{ github.run_id }}', REPO: '${{ github.repository }}', APPROVER: dennismueller10x-sudo, ENV_NAME: account-production}
        run: |
          set -euo pipefail
          json=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/approvals")
          ok=$(jq --arg u "$APPROVER" --arg e "$ENV_NAME" '[.[] | select(.state=="approved" and .user.login==$u and any(.environments[]; .name==$e))] | length' <<<"$json")
          [ "$ok" -ge 1 ] || { echo "::error::Keine Freigabe durch $APPROVER fuer $ENV_NAME"; exit 1; }

  auth:
    needs: freigabe
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: account-dev
    steps:
      - name: Owner-Freigabe dieses Laufs pruefen (fail closed)
        env: {GH_TOKEN: '${{ github.token }}', RUN_ID: '${{ github.run_id }}', REPO: '${{ github.repository }}', APPROVER: dennismueller10x-sudo, ENV_NAME: account-production}
        run: |
          set -euo pipefail
          json=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/approvals")
          ok=$(jq --arg u "$APPROVER" --arg e "$ENV_NAME" '[.[] | select(.state=="approved" and .user.login==$u and any(.environments[]; .name==$e))] | length' <<<"$json")
          [ "$ok" -ge 1 ] || { echo "::error::Keine Freigabe durch $APPROVER fuer $ENV_NAME"; exit 1; }
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Auth einstellen
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.VU_ACCOUNT_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: qiytbnpoqvldsatpfkeh
          VU_ACCOUNT_API_ORIGIN: https://konto.visionuniverse.de
          BREVO_SMTP_LOGIN: ${{ secrets.VU_ACCOUNT_BREVO_SMTP_LOGIN }}
          BREVO_SMTP_KEY: ${{ secrets.VU_ACCOUNT_BREVO_SMTP_KEY }}
          VU_MAIL_SENDER: konto@visionuniverse.de
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then node scripts/account/supabase-auth-config.mjs --production --dry-run
          else node scripts/account/supabase-auth-config.mjs --production; fi
