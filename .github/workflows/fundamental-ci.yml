name: Fundamental CI
# Fundamental 2.0 (fundamental/**, scripts/fundamental/**): Modell- und Datentests. Liest die bestehenden Discover-Aktiendateien
# und SEC-Verbraucherdateien, schreibt nur in ein temporaeres Verzeichnis. Browser-Kontrast und Wege laufen in shell-ci.yml (vu3-regression), sobald die Welt dort gelistet ist.
on:
  push:
    branches: [main]
    paths: ['fundamental/**', 'scripts/fundamental/**', '.github/workflows/fundamental-ci.yml', '.github/workflows/fundamental-sec-freshness.yml']
  pull_request:
    paths: ['fundamental/**', 'scripts/fundamental/**', '.github/workflows/fundamental-ci.yml', '.github/workflows/fundamental-sec-freshness.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fundamental-ci-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check fundamental/engine/model.js
          node --check fundamental/engine/catalog.js
          node --check fundamental/app.js
          node --check scripts/fundamental/build-history.mjs
          node --check scripts/fundamental/sec-freshness.mjs
          node --check scripts/fundamental/verify-publication.mjs
      - name: Model and data tests
        run: node --test "fundamental/tests/*.test.mjs"
