# =========================================================================
# SOCIAL ORCHESTRATOR — DER BETRIEB, DER KEINEN OWNER BRAUCHT
#
#   DISCOVER -> SELECT -> AUDIENCE FRAME -> RESEARCH -> STORY -> HOOK
#   -> VISUAL -> CREATIVE JOB DECISION -> [AUTHORING REQUEST -> CHATGPT
#   WORK -> RESULT INGEST] -> CREATE -> VALIDATE -> CANDIDATE
#   -> [OWNER PUBLISHING GATE]
#   -> MEASURE -> LEARN -> ADAPT
#
# Der Owner waehlt keine Themen aus, startet keine Signalsammlung,
# erzeugt kein Slate, stoesst kein Ranking an, verschiebt keine Bilder,
# ruft keine Insights ab und oeffnet keinen Creative-Request. Er steht
# an genau einer Stelle: am Publishing Gate.
#
# -------------------------------------------------------------------------
# WAS DIESER WORKFLOW NIEMALS TUT
# -------------------------------------------------------------------------
#
# Veroeffentlichen. Freigeben. Ablehnen. Eine externe Quelle
# aktivieren. Autopublish einschalten.
#
# Das sind keine Vorsichtsmassnahmen, sondern die Definition der Grenze:
# alles davor ist Maschine, alles danach ist Entscheidung.
#
# -------------------------------------------------------------------------
# ES BRAUCHT KEINE EXTERNE QUELLE
# -------------------------------------------------------------------------
#
# Beide externen Sensoren stehen auf NOT_ACTIVATED_BY_OWNER. Dieser
# Lauf fragt sie nicht, erwaehnt sie nicht als Mangel und laeuft
# vollstaendig ohne sie. `externalInterest` erscheint als NOT_ACTIVE -
# ohne Gewicht und ohne Abzug.
#
# -------------------------------------------------------------------------
# EINE GRENZE, DIE HIER EHRLICH DASTEHEN MUSS
# -------------------------------------------------------------------------
#
# GitHub fuehrt `schedule` NUR im Standardzweig aus. Solange diese
# Datei allein auf dem Feature-Zweig liegt, feuert der Zeitplan NICHT.
# Der Betrieb ist gebaut und geprueft; wirksam wird er mit dem Merge.
# Das ist eine Owner-Entscheidung, keine technische Huerde.
#
# Bis dahin laesst sich jeder Lauf von Hand ausloesen - derselbe Pfad,
# dieselben Schritte.
# =========================================================================
name: Social Orchestrator

on:
  schedule:
    # Zweimal taeglich. Messen ist billig und lesend; ein Kandidat
    # entsteht trotzdem hoechstens alle 24 h - das entscheidet der
    # Orchestrator, nicht der Zeitplan.
    - cron: '35 6 * * *'
    - cron: '35 16 * * *'
  workflow_dispatch:
    inputs:
      nur_entscheiden:
        description: 'Nur sagen, was dran waere (nichts ausfuehren)'
        type: boolean
        default: false

concurrency:
  group: social-orchestrator
  cancel-in-progress: false

permissions:
  contents: write
  # Der Orchestrator oeffnet den Request-PR selbst. Ohne dieses Recht
  # endet der Dispatch an der letzten Stelle, an der er frueher einen
  # Menschen brauchte.
  pull-requests: write

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # =====================================================================
      # TESTS UND ISOLATION, BEVOR IRGENDETWAS GESCHIEHT
      #
      # Ein Betrieb, der auf rotem Code laeuft, schreibt Fehler in
      # Produktionsdaten. Deshalb zuerst - und mit demselben Messer wie
      # in der CI.
      #
      # Hier standen zwei Schritte, die je einen STRING in $GITHUB_OUTPUT
      # schrieben ("gruen=social/tests (Zeitpunkt)"), den der Reifebericht
      # dann als --suites-green bekam. Das war ehrlicher als in der CI -
      # der Schritt brach oben ab, wenn die Suite rot war - aber es blieb
      # eine Behauptung in Textform: keine Zahl, kein Stand, und 14
      # uebersprungene Tests waeren darin unsichtbar geblieben.
      #
      # verify-suites.mjs laesst beide Suiten und beide Isolationslaeufe
      # laufen und schreibt, was herauskam, samt Commit. Der Bericht liest
      # das und vergleicht den Commit mit HEAD.
      #
      # Der Schritt scheitert bei roter Suite oder veraenderten
      # Produktionsdaten - der Lauf kommt dann gar nicht erst zum
      # Schreiben.
      # =====================================================================
      - name: Tests und Isolation, bevor irgendetwas geschieht
        run: node scripts/social/verify-suites.mjs

      # =====================================================================
      # DEN REGISTERZUSTAND AN DIE EVIDENZ HOLEN — VOR DEM ZAEHLEN
      #
      # Ein Creative Job stand 51 Stunden auf CREATIVE_JOB_IN_FLIGHT und
      # blockierte MAX_OPEN_CREATIVE_JOBS = 1, obwohl sein Ergebnis seit
      # zehn Minuten nach dem Start im Repository lag und das Ledger
      # denselben Schluessel COMPLETED nannte. Der Abschluss wurde an
      # einer Stelle notiert und an einer anderen gezaehlt.
      #
      # ingest-creative.mjs zieht das Register seitdem selbst nach. Das
      # hier ist die ZWEITE Linie: verpasst der Ingest den Rueckweg -
      # weil ein Lauf abbrach, weil jemand ihn uebersprang -, holt ihn
      # der naechste Orchestratorlauf nach, bevor er zaehlt.
      #
      # Er schliesst NIE einen Job wegen seines Alters. Nur harte
      # Evidenz mit identischem processing_key zaehlt; die Liste steht
      # in creative-job.js und weist alles andere benannt zurueck.
      #
      # VOR "Was ist jetzt dran?", weil genau dort die offenen Jobs
      # gezaehlt werden. Danach waere er ein Tor neben dem Weg.
      # =====================================================================
      - name: Creative Jobs gegen die Evidenz abgleichen
        run: node scripts/social/reconcile-creative-jobs.mjs --write

      - name: Was ist jetzt dran?
        id: plan
        run: |
          set -euo pipefail
          node scripts/social/run-orchestrator.mjs --github-output | tee /tmp/plan.txt

      # =====================================================================
      # DIE LEASE — ZWEI AUSLOESER, EIN PRODUKTIVER ZYKLUS (§5)
      #
      # Der Scheduler startet um 06:35, und der Owner tippt um 06:35 auf
      # JETZT PRUEFEN. Die Concurrency-Gruppe oben laesst die beiden nicht
      # gleichzeitig laufen - der zweite wartet. Danach faende er einen
      # Zustand, in dem nichts mehr verboten ist, und fuehre einen
      # zweiten vollen Zyklus: kein Fehler, nur doppelte Arbeit. Wo
      # Work-Aufrufe Geld kosten, ist doppelte Arbeit ein Schaden.
      #
      # Die Lease steht im Datenverzeichnis und wird am Ende
      # mitfestgeschrieben. Sie sperrt NICHTS Lesendes: Messen,
      # Berichten und die Warteschlange laufen weiter. Verwehrt ist nur
      # der produktive Teil.
      # =====================================================================
      - name: Lauf-Lease nehmen
        id: lease
        if: inputs.nur_entscheiden != true
        run: |
          set -euo pipefail
          node scripts/social/run-orchestrator.mjs \
            --lease-claim "${{ github.run_id }}" \
            --von "${{ github.event_name }}"

      # =====================================================================
      # DIE ENTSCHEIDUNGEN DES OWNERS ZURUECK
      #
      # Der Owner entscheidet am Telefon, der Worker haelt fest, dieser
      # Schritt traegt ins Repository - durch decide-candidate.mjs, den
      # bestehenden Weg. Dort haengt alles daran, was an einer
      # Owner-Entscheidung haengt: der Zustandsuebergang durch die
      # kanonische Maschine, der Schutz einer bereits getroffenen
      # Entscheidung, und dass ein Ablehnungsgrund eine Rueckmeldung
      # ueber die AUSWAHL ist und keine ueber die WIRKUNG.
      #
      # VOR dem Messen und vor dem Vorbereiten. Ein Lauf, der zuerst
      # einen neuen Kandidaten baut und danach erfaehrt, dass der alte
      # abgelehnt wurde, hat die Ablehnung nicht gelesen, als sie
      # zaehlte.
      #
      # Exit 4 heisst "kein Schluessel" und ist eine Antwort.
      # =====================================================================
      - name: Die Entscheidungen des Owners abholen
        if: inputs.nur_entscheiden != true
        continue-on-error: true
        env:
          VU_SOCIAL_ADMIN_KEY: ${{ secrets.VU_SOCIAL_ADMIN_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${VU_SOCIAL_ADMIN_KEY:-}" ]; then
            echo "Kein Admin-Schluessel: es wird nichts abgeholt."
            exit 0
          fi
          node scripts/social/ingest-owner-decisions.mjs --data social/data --write \
            | tee /tmp/entscheidungen.txt || [ "$?" = "4" ]

      # =====================================================================
      # DIE PLATTE — DAS BREITE CONTENT UNIVERSE, FRISCH
      #
      # build-opportunity-slate.mjs lief bis hierher in KEINEM Workflow.
      # Die Datei auf der Platte stammte vom Vortag, und der
      # Owner-Bericht zeigte ihre 32 Themen aus fuenf Familien, waehrend
      # der Zyklus aus vier Quant-Signalen drei STOCK_STORY-Pakete
      # baute. Wer den Bericht las, schloss auf eine Breite, die im
      # Lauf keine Rolle spielte.
      #
      # Der Schritt ist lesend und netzfrei: er ruft keine externe
      # Quelle und schon gar keine der beiden vom Owner nicht
      # aktivierten. Er schreibt genau eine Datei.
      #
      # VOR dem Messen, weil die Platte den Datenstand beschreibt, auf
      # dem dieser Lauf entscheidet - nicht den von gestern.
      # =====================================================================
      - name: DIE PLATTE — Content Universe in voller Breite
        if: inputs.nur_entscheiden != true
        run: |
          set -euo pipefail
          node scripts/social/build-opportunity-slate.mjs \
            --data social/data --out social/data | tail -25

      - name: MESSEN — Zahlen holen, lernen, anpassen
        if: steps.plan.outputs.measure == 'ja' && inputs.nur_entscheiden != true
        env:
          VU_SOCIAL_ADMIN_KEY: ${{ secrets.VU_SOCIAL_ADMIN_KEY }}
        run: |
          set -euo pipefail
          # Lesend. Holt die Insights des EIGENEN Kontos - kein fremdes
          # Konto, keine externe Quelle.
          if [ -n "${VU_SOCIAL_ADMIN_KEY:-}" ]; then
            node scripts/social/ingest-performance.mjs --out social/data || \
              echo "::notice::Insights nicht abrufbar - der Lauf geht weiter."
          else
            echo "Kein Admin-Schluessel: es wird nicht abgerufen."
          fi
          # Lernen und Anpassen stecken im Zyklus und brauchen kein Netz.
          node scripts/social/run-social-cycle.mjs \
            --provider mock --data social/data --out social/data | tail -30

      # =====================================================================
      # CREATIVE JOB — DER SCHRITT, DEN BISHER EIN MENSCH GETAN HAT
      #
      # Er laeuft NUR, wenn der Orchestrator ihn beschlossen hat. Ein
      # Scheduler-Lauf erzeugt keinen Creative Job, nur weil er laeuft:
      # `creative` ist ja genau dann, wenn ein Kandidat faellig ist, zum
      # Inhalt kein Ergebnis und kein offener Job vorliegt, die Evidenz
      # eine Geschichte traegt und das Budget den Dispatch zulaesst.
      #
      # Die drei Skripte sind die BESTEHENDEN. Hier wird kein zweiter
      # Ausloesemechanismus gebaut - nur der letzte Schritt getan, den
      # dispatch-creative-job.mjs seit jeher ankuendigt.
      #
      # EIN VERWEIGERTES TOR IST KEIN FEHLER. Jedes der drei Skripte
      # endet bei einer Verweigerung mit 4. Das ist eine Antwort und
      # kein Ausfall - der Lauf geht weiter, und der Grund steht im
      # Protokoll.
      # =====================================================================
      - name: CREATIVE JOB — Brief, Register, Request-PR
        if: >-
          steps.plan.outputs.creative == 'ja' &&
          steps.lease.outputs.produktiv_erlaubt == 'true' &&
          inputs.nur_entscheiden != true
        env:
          GH_TOKEN: ${{ github.token }}
          SYMBOL: ${{ steps.plan.outputs.creative_symbol }}
          CONTENT_ID: ${{ steps.plan.outputs.creative_content_id }}
        run: |
          set -uo pipefail

          tor() {
            # 0 = weiter, 4 = begruendete Verweigerung, alles andere = Fehler
            "$@"
            rc=$?
            if [ "$rc" -eq 4 ]; then
              echo "::notice::Tor verweigert ($*). Das ist eine Antwort, kein Ausfall."
              return 1
            fi
            if [ "$rc" -ne 0 ]; then
              echo "::error::Unerwarteter Abbruch ($rc) in: $*"
              exit "$rc"
            fi
            return 0
          }

          tor node scripts/social/request-creative.mjs \
                --symbol "$SYMBOL" --write || exit 0

          tor node scripts/social/dispatch-creative-job.mjs \
                --content-id "$CONTENT_ID" --write || exit 0

          git config user.name "vision-universe-bot"
          git config user.email "bot@visionuniverse.de"

          tor node scripts/social/open-creative-request.mjs \
                --content-id "$CONTENT_ID" --write \
                --reason "Orchestrator: Kandidat faellig, kein Ergebnis und kein offener Job zu diesem Inhalt." \
            || exit 0

          # -----------------------------------------------------------------
          # DIE WACHE, DIE SONST STUMM BLIEBE
          #
          # creative-job-guard.yml laeuft auf `pull_request`. Ein PR, den
          # GITHUB_TOKEN oeffnet, loest in diesem Repository KEINE
          # Workflows aus - GitHub verhindert so Endlosschleifen.
          #
          # Die Wache wuerde damit ausgerechnet fuer die automatisch
          # erzeugten Requests schweigen, also fuer die, bei denen
          # niemand zusieht. Deshalb laeuft dieselbe Pruefung hier, in
          # einem Lauf, der stattfindet. Dasselbe Skript, dieselbe
          # Frage - nur an einem Ort, an dem sie gestellt wird.
          # -----------------------------------------------------------------
          node scripts/social/verify-creative-dispatch.mjs \
            --branch "authoring/request/$CONTENT_ID"

      - name: VORBEREITEN — bis zum Publishing Gate, nicht darueber hinaus
        if: >-
          steps.plan.outputs.prepare == 'ja' &&
          steps.lease.outputs.produktiv_erlaubt == 'true' &&
          inputs.nur_entscheiden != true
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq chromium-browser || sudo apt-get install -y -qq chromium
          export CHROMIUM_PATH="$(command -v chromium-browser || command -v chromium)"

          node scripts/social/run-social-cycle.mjs \
            --provider mock --data social/data --out social/data --render
          node scripts/social/make-publish-candidate.mjs --data social/data --write \
            | tail -40

      # =====================================================================
      # DIE WARTESCHLANGE ZUM OWNER
      #
      # Der Worker kann das Repository nicht lesen. Also traegt dieser
      # Schritt die Schlange hinueber - berechnet von
      # owner-decision.warteschlange(), geformt von
      # approval-projection.js, dort nur gespeichert und gezeigt.
      #
      # KEINE ZWEITE LOGIK IM WORKER. Er darf nicht wissen, was
      # "wartet" bedeutet: zwei Definitionen desselben Begriffs gehen
      # auseinander, und dieses Projekt hatte den Fall schon (sechs
      # gegen null).
      #
      # `if: always()` und nicht an `prepare` gehaengt: auch ein Lauf,
      # der nichts vorbereitet hat, kann die Schlange veraendert haben -
      # ein Kandidat wurde abgeloest, einer entschieden. Und eine
      # Uebertragung, die ausfaellt, ist kein Grund, den Lauf rot zu
      # machen: der Owner sieht dann einen datierten aelteren Stand,
      # und das steht auf der Seite.
      # =====================================================================
      - name: Die Warteschlange an das Approval Center
        if: always() && inputs.nur_entscheiden != true
        continue-on-error: true
        env:
          VU_SOCIAL_ADMIN_KEY: ${{ secrets.VU_SOCIAL_ADMIN_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${VU_SOCIAL_ADMIN_KEY:-}" ]; then
            echo "Kein Admin-Schluessel: die Schlange bleibt, wo sie ist."
            node scripts/social/publish-approval-queue.mjs --check-assets \
              | tee /tmp/queue.txt
            exit 0
          fi
          # --check-assets: jedes wartende Bild wird HIER abgerufen, aus der
          # Umgebung, die den Assethost erreicht. Der Worker kann das nicht
          # nachholen - er zeigt nur, was ihm gesagt wurde, und sperrt die
          # Freigabe, solange es nicht ERREICHBAR heisst. Ohne diese Fahne
          # bleibt jeder Eintrag UNGEPRUEFT, und UNGEPRUEFT ist gesperrt.
          #
          # Exit 4 heisst "kein Schluessel" und ist eine Antwort, kein Ausfall.
          node scripts/social/publish-approval-queue.mjs --write --check-assets \
            | tee /tmp/queue.txt || [ "$?" = "4" ]

      # Der Reifezustand nach dem Lauf, gegen den dann aktuellen
      # Datenstand. Er schaltet nichts frei - er stellt fest.
      - name: SOCIAL_ORCHESTRATOR_PRODUCTION_READY
        id: reife
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          # Ohne Fahnen: der Suiten- und Isolationszustand kommt aus dem
          # gemessenen Befund des Schritts oben, an diesen Commit
          # gebunden.
          node scripts/social/production-readiness.mjs | tee /tmp/reife.txt

      - name: Der Stand, den der Owner sieht
        if: always()
        run: |
          set -euo pipefail
          node scripts/social/rank-social-opportunities.mjs --top 3 \
            --out social/data > /tmp/rank.txt 2>&1 || true
          {
            echo "## Orchestrator"
            echo ""
            echo '```'
            cat /tmp/plan.txt 2>/dev/null || echo "kein Plan"
            echo '```'
            echo ""
            echo "### Owner-Warteschlange"
            echo '```'
            cat /tmp/queue.txt 2>/dev/null || echo "nicht uebertragen"
            echo '```'
            echo ""
            echo "### Produktionsreife"
            echo '```'
            cat /tmp/reife.txt 2>/dev/null || echo "kein Reifebericht"
            echo '```'
            echo ""
            echo "### Opportunities"
            echo '```'
            sed -n '/ZWEI EVIDENZKLASSEN/,$p' /tmp/rank.txt 2>/dev/null | head -40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Die Rueckgabe steht VOR dem Festschreiben: sonst ginge die
      # beendete Lease nicht mit, und der naechste Lauf saehe einen
      # Lauf, der ewig arbeitet.
      #
      # `--produktiv` nur dann, wenn wirklich etwas entstanden ist.
      # Ein Lauf, der nur gemessen hat, haelt den naechsten nicht auf.
      - name: Lauf-Lease zurueckgeben
        if: always() && inputs.nur_entscheiden != true
        run: |
          set -euo pipefail
          if [ "${{ steps.plan.outputs.creative }}" = "ja" ] || \
             [ "${{ steps.plan.outputs.prepare }}" = "ja" ]; then
            node scripts/social/run-orchestrator.mjs \
              --lease-release "${{ github.run_id }}" --produktiv
          else
            node scripts/social/run-orchestrator.mjs \
              --lease-release "${{ github.run_id }}"
          fi

      - name: Festschreiben
        if: inputs.nur_entscheiden != true
        run: |
          set -euo pipefail
          # `git diff` sieht neue Dateien nicht, und beim ersten Lauf
          # sind Kandidat und Bild neu.
          #
          # ============================================================
          # DAS BILD GEHOERT DAZU
          #
          # Hier stand nur `social/data/`. Das gerenderte Bild schreibt
          # render-asset.mjs aber nach assets/social/ — und das liegt
          # NICHT darunter. Jeder Lauf hat sein Bild also erzeugt, die
          # Adresse in den Kandidaten geschrieben und die Datei mit dem
          # Runner weggeworfen.
          #
          # Im Approval Center stand danach eine kaputte Bildflaeche,
          # und die Adresse zeigte auf eine Datei, die es nie gab.
          # `git log --all -- assets/social/pkg_ca25cb404ae49dc4.jpg`
          # ist leer. Die dreizehn Bilder, die im Repository liegen,
          # stammen alle aus Sitzungs-Commits frueherer Auftraege.
          #
          # Der Kommentar zwei Zeilen hoeher wusste es ("Kandidat und
          # BILD"). Nur die Pfade wussten es nicht.
          # ============================================================
          if [ -z "$(git status --porcelain -- social/data/ assets/social/)" ]; then
            echo "Keine Aenderung."
            exit 0
          fi
          git config user.name "vision-universe-bot"
          git config user.email "bot@visionuniverse.de"
          git add social/data/ assets/social/
          git commit -m "Orchestrator: ${{ steps.plan.outputs.stage }}"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
