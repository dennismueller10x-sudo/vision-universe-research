name: Core - Tests, Datenqualitaet, Systemzustand

# Vision Universe Core (core/, scripts/core/, status/): siehe
# docs/VISION_UNIVERSE_ARCHITECTURE.md.
#
#   pull_request / push   Core-Tests (rot, wenn einer faellt), dazu
#                         Datenqualitaet und Systemzustand des Repository-
#                         Stands als Bericht in der Step Summary.
#   schedule              streng: Datenqualitaet des main-Stands (eine
#                         ERROR-Regel macht rot) und Systemzustand der
#                         AUSGELIEFERTEN Seite (ein kritisches System
#                         STALE/FAILED macht rot). GitHub benachrichtigt den
#                         Eigentuemer.
#
# Kein Anbieterabruf, kein Schluessel, kein Commit.

on:
  pull_request:
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - 'core/**'
      - 'scripts/core/**'
      - 'status/**'
      - '.github/workflows/core-ci.yml'
  schedule:
    # Taeglich nach dem naechtlichen Refresh und der Materialisierung.
    - cron: '47 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Core-Tests
        run: node --test "core/tests/*.test.mjs" quant/tests/push-with-retry.test.mjs quant/tests/intraday-scope.test.mjs quant/tests/published-close-rounding.test.mjs

      - name: Systemzustand des Repository-Stands (Bericht)
        run: node scripts/core/system-health.mjs

      - name: Datenqualitaet des Repository-Stands (Bericht)
        run: node scripts/core/data-quality.mjs

      # Ein Feature-PR, der erzeugte Pipeline-Artefakte mitbringt, laesst den
      # naechsten Datenlauf in einen Konflikt laufen (Lauf 37083168221:
      # 5.237 Intraday-Tagesverlaeufe verworfen wegen PR #366). Kein Verbot -
      # manche PRs bauen Daten bewusst neu -, aber eine sichtbare Warnung.
      - name: Erzeugte Artefakte im PR (Warnung)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/changed.txt"
          node -e '
            const fs = require("fs");
            const changed = fs.readFileSync(process.env.RUNNER_TEMP + "/changed.txt", "utf8").split("\n").filter(Boolean);
            const owned = [/^quant\/data\/market\/intraday\//, /^quant\/data\/market\/capabilities\//, /^quant\/data\/market\/freshness\//,
              /^quant\/data\/product\/capabilities(-summary)?-v1\.json$/, /^quant\/data\/market\/discover-series(-long)?\//,
              /^quant\/data\/market\/factors\//, /^quant\/data\/market\/golden-preview\//, /^discover\/data\//];
            const hits = changed.filter((f) => owned.some((r) => r.test(f)));
            if (hits.length) {
              console.log("::warning::Dieser PR aendert " + hits.length + " pipeline-eigene Artefakte (z. B. " + hits.slice(0, 5).join(", ") + "). Der naechste Datenlauf kann daran in einen Rebase-Konflikt laufen. Wenn nicht beabsichtigt: diese Dateien auf den Stand von main zuruecksetzen.");
            } else console.log("Keine pipeline-eigenen Artefakte geaendert.");
          '

  live:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Datenqualitaet des main-Stands (streng)
        id: dq
        continue-on-error: true
        run: node scripts/core/data-quality.mjs --strict
      - name: Systemzustand der ausgelieferten Seite (streng)
        id: health
        continue-on-error: true
        run: node scripts/core/system-health.mjs --site=https://research.visionuniverse.de --strict
      - name: Ergebnis
        if: steps.dq.outcome == 'failure' || steps.health.outcome == 'failure'
        run: |
          echo "::error::Datenqualitaet: ${{ steps.dq.outcome }} · Systemzustand: ${{ steps.health.outcome }} - Details in der Zusammenfassung."
          exit 1
