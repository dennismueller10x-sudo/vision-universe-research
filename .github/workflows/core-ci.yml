name: Core - Tests, Datenqualitaet, Systemzustand

# Vision Universe Core (core/, scripts/core/, status/): siehe
# docs/VISION_UNIVERSE_ARCHITECTURE.md.
#
#   pull_request / push   Core-Tests (rot, wenn einer faellt), dazu
#                         Datenqualitaet und Systemzustand des Repository-
#                         Stands als Bericht in der Step Summary.
#   schedule              streng: Datenqualitaet des main-Stands (eine
#                         ERROR-Regel macht rot) und Systemzustand der
#                         AUSGELIEFERTEN Seite (ein kritisches System
#                         STALE/FAILED macht rot). GitHub benachrichtigt den
#                         Eigentuemer.
#
#                         Zustandstests (core/tests/state/): Querverträge über
#                         erzeugte Daten zweier Produkte - im PR nur blockierend,
#                         wenn der PR einen Eingang berührt; sonst Hinweis.
#
# Kein Anbieterabruf, kein Schluessel, kein Commit.

on:
  pull_request:
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - 'core/**'
      - 'scripts/core/**'
      - 'status/**'
      - 'scripts/ci/state-gate.mjs'
      - '.github/workflows/core-ci.yml'
  schedule:
    # Taeglich nach dem naechtlichen Refresh und der Materialisierung.
    - cron: '47 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Keine volle Historie: fetch-depth 0 holte alle Branches und Tags
      # (.git rund 18 GB) und lief regelmaessig ins 15-Minuten-Limit, bevor ein
      # Test begann. Kein Test braucht Historie (git ls-files, eigene
      # Fixture-Repos). Nur die PR-Diffs brauchen eine erreichbare Basis: im PR
      # ist der Checkout der Merge-Commit, Tiefe 2 bringt seine Eltern (Basis
      # und PR-Kopf) mit. Sonst genuegt der Stand selbst.
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Geaenderte Dateien des PR = Merge-Commit gegen seine Basis (erster
      # Elternteil). Ein Git-Fehler macht den Schritt rot, nie still "0 Dateien".
      - name: Geaenderte Dateien des PR
        if: github.event_name == 'pull_request'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD^2)" != "$HEAD_SHA" ]; then
            echo "::error::Checkout ist nicht der Merge-Commit des PR-Kopfs $HEAD_SHA"
            exit 1
          fi
          git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed.txt"
          echo "$(wc -l < "$RUNNER_TEMP/changed.txt") geaenderte Dateien gegen die Basis $(git rev-parse --short HEAD^1)"

      - name: Core-Tests
        run: node --test "core/tests/*.test.mjs" quant/tests/push-with-retry.test.mjs quant/tests/intraday-scope.test.mjs quant/tests/published-close-rounding.test.mjs

      # Die Registry darf den Supertrader-8-Produktpfad nur im einen, festgeschriebenen
      # Eintrag nennen. Diese Schutztests liegen in der Supertrader-Welt (Gate A) und
      # laufen dort nur bei Supertrader-Pfaden - hier laufen sie bei jeder Core-Aenderung
      # mit. Ein Registry-Eintrag vor der Oeffnung der Schutztests (#1025) wird so im
      # Core-PR rot, nicht erst auf main.
      - name: Supertrader-Schutztests der Registry
        run: node --test --test-name-pattern="SF-PRODUCT-NO-RUN-INTEGRATION|SF2-LEGACY-ISOLATION|SF8-REGISTRY-GUARD" scripts/supertrader/tests/sf-product-contract.test.mjs scripts/supertrader/tests/sf-completion.test.mjs

      # Zustandstests: Querverträge über ERZEUGTE Daten zweier Produkte
      # (core/tests/state/, z. B. jedes Supertrader-Signal hat eine Discover-
      # Seite). Dieselben Tests, nichts gelockert - aber ein roter Datenbefund
      # blockiert einen PR nur, wenn der PR einen Eingang des Tests berührt
      # (core/tests/state/manifest.json). Auf main, im Zeitplan und per
      # Dispatch sind sie immer streng (Job `live`). Gleicher Job wie die
      # Code-Tests: ein Pflicht-Check `core`.
      - name: Zustandstests (Querverträge über erzeugte Daten)
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            node scripts/ci/state-gate.mjs --event="$EVENT" --changed="$RUNNER_TEMP/changed.txt"
          else
            node scripts/ci/state-gate.mjs --event="$EVENT"
          fi

      - name: Systemzustand des Repository-Stands (Bericht)
        run: node scripts/core/system-health.mjs

      - name: Datenqualitaet des Repository-Stands (Bericht)
        run: node scripts/core/data-quality.mjs

      # Ein Feature-PR, der erzeugte Pipeline-Artefakte mitbringt, laesst den
      # naechsten Datenlauf in einen Konflikt laufen (Lauf 37083168221:
      # 5.237 Intraday-Tagesverlaeufe verworfen wegen PR #366). Kein Verbot -
      # manche PRs bauen Daten bewusst neu -, aber eine sichtbare Warnung.
      - name: Erzeugte Artefakte im PR (Warnung)
        if: github.event_name == 'pull_request'
        run: |
          node -e '
            const fs = require("fs");
            const changed = fs.readFileSync(process.env.RUNNER_TEMP + "/changed.txt", "utf8").split("\n").filter(Boolean);
            const owned = [/^quant\/data\/market\/intraday\//, /^quant\/data\/market\/capabilities\//, /^quant\/data\/market\/freshness\//,
              /^quant\/data\/product\/capabilities(-summary)?-v1\.json$/, /^quant\/data\/market\/discover-series(-long)?\//,
              /^quant\/data\/market\/factors\//, /^quant\/data\/market\/golden-preview\//, /^discover\/data\//,
              /^supertrader\/data\/sf-candidates\//];
            const hits = changed.filter((f) => owned.some((r) => r.test(f)));
            if (hits.length) {
              console.log("::warning::Dieser PR aendert " + hits.length + " pipeline-eigene Artefakte (z. B. " + hits.slice(0, 5).join(", ") + "). Der naechste Datenlauf kann daran in einen Rebase-Konflikt laufen. Wenn nicht beabsichtigt: diese Dateien auf den Stand von main zuruecksetzen.");
            } else console.log("Keine pipeline-eigenen Artefakte geaendert.");
          '

  live:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Datenqualitaet des main-Stands (streng)
        id: dq
        continue-on-error: true
        run: node scripts/core/data-quality.mjs --strict
      - name: Zustandstests der Querverträge (streng)
        id: state
        continue-on-error: true
        run: node scripts/ci/state-gate.mjs --strict
      - name: Systemzustand der ausgelieferten Seite (streng)
        id: health
        continue-on-error: true
        run: node scripts/core/system-health.mjs --site=https://research.visionuniverse.de --strict
      # Chart-Paritaet (scripts/quality/chart-parity.mjs): zeigt dieselbe Aktie in
      # Discover, Quant, Supertrader und Elliott denselben Kurs? Nur Bericht - eine
      # Abweichung geht ueber DQ-PX-4 und den Reparaturlauf (long-series.yml) bzw.
      # an den Erzeuger, nicht ueber diesen Schritt.
      - name: Chart-Paritaet (Bericht)
        continue-on-error: true
        run: |
          node --max-old-space-size=4096 scripts/quality/chart-parity.mjs > "$RUNNER_TEMP/parity.txt"
          { echo '### Chart-Paritaet'; echo '```'; cat "$RUNNER_TEMP/parity.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Ergebnis
        if: steps.dq.outcome == 'failure' || steps.state.outcome == 'failure' || steps.health.outcome == 'failure'
        run: |
          echo "::error::Datenqualitaet: ${{ steps.dq.outcome }} · Querverträge: ${{ steps.state.outcome }} · Systemzustand: ${{ steps.health.outcome }} - Details in der Zusammenfassung."
          exit 1
