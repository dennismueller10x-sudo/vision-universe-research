name: Update VISION UNIVERSE dashboard data

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-dashboard-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch market data into private runner cache
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python scripts/dashboard/fetch_market_data.py --output .market-cache/dashboard/market_data.json

      - name: Verify public paths stay untouched
        shell: bash
        run: |
          git diff --exit-code -- dashboard/data quant/data/market quant/data/technical
          node scripts/market/assert-public-data-hygiene.mjs
