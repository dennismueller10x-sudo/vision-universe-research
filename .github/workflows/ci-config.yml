name: CI Config

# Prueft die Workflows selbst (scripts/ci/tests): z. B. dass kein PR-Lauf
# eine feste Concurrency-Gruppe mit Produktions- oder Zustandslaeufen teilt.
# Ohne diesen Workflow liefen diese Tests nirgends. Dazu der npx/npm-Waechter
# (quant/tests/workflow-npx-pinned.test.mjs): er lief bisher nur in Quant CI,
# das bei reinen Workflow-Aenderungen nicht startet.

on:
  push:
    branches: [main]
    paths: ['.github/workflows/**', 'scripts/ci/**', 'quant/tests/workflow-npx-pinned.test.mjs']
  pull_request:
    paths: ['.github/workflows/**', 'scripts/ci/**', 'quant/tests/workflow-npx-pinned.test.mjs']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Workflow-Regeln
        run: node --test "scripts/ci/tests/*.test.mjs" quant/tests/workflow-npx-pinned.test.mjs
