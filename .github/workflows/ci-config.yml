name: CI Config

# Prueft die Workflows selbst (scripts/ci/tests): z. B. dass kein PR-Lauf
# eine feste Concurrency-Gruppe mit Produktions- oder Zustandslaeufen teilt.
# Ohne diesen Workflow liefen diese Tests nirgends.

on:
  push:
    branches: [main]
    paths: ['.github/workflows/**', 'scripts/ci/**']
  pull_request:
    paths: ['.github/workflows/**', 'scripts/ci/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Workflow-Regeln
        run: node --test "scripts/ci/tests/*.test.mjs"
