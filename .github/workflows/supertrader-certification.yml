name: Supertrader data and execution certification (private)
on:
  push:
    branches: ['research/supertrader-data-execution-certification-*']
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [probe, canonical, repack, current]
        default: probe
      source_run:
        type: string
        default: '38211486301'
permissions:
  contents: read
  actions: read
concurrency:
  group: supertrader-certification-${{ github.ref_name }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  data-probe:
    if: contains(github.event.head_commit.message, '[supertrader-certification:probe]') || contains(github.event.head_commit.message, '[supertrader-certification:canonical]') || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'probe' || inputs.mode == 'canonical'))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/supertrader/
            !/scripts/supertrader/research/tournament/sealed/
            /scripts/market/storage/
            /quant/engines/
            /quant/config/
            /quant/data/market/scale/universe-FULL_UNIVERSE.json
            /quant/data/market/security-master/eligibility.json
            /quant/data/market/security-master/company-names.json
            /quant/data/sec/consumer/
            /core/identity.js
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read-only data inventory; no strategy performance
        env:
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_REGION: ${{ secrets.VU_HISTORY_S3_REGION }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
          NODE_OPTIONS: --max-old-space-size=12000
          CERTIFICATION_CANONICAL: ${{ contains(github.event.head_commit.message, '[supertrader-certification:canonical]') || inputs.mode == 'canonical' }}
        run: |
          set -euo pipefail
          if [ "$CERTIFICATION_CANONICAL" = "true" ]; then
            node scripts/supertrader/research/certification/data-inventory.mjs --out "$RUNNER_TEMP/datacert" --fact-doc-limit 4 --canonical
          else
            node scripts/supertrader/research/certification/data-inventory.mjs --out "$RUNNER_TEMP/datacert" --fact-doc-limit 0
          fi
      - name: Preserve encrypted inventory and public statuses only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supertrader-certification-probe-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/datacert/*status.json
            ${{ runner.temp }}/datacert/*.sealed.json
          if-no-files-found: error
          retention-days: 30
  repack-existing-encrypted-inputs:
    if: contains(github.event.head_commit.message, '[supertrader-certification:repack]') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'repack')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout: scripts/supertrader/research/certification
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.source_run || '38211486301' }}
          name: supertrader-certification-probe-${{ inputs.source_run || '38211486301' }}
          path: ${{ runner.temp }}/encrypted-inputs
      - name: Lossless bounded packages; no decrypt, provider reads or performance
        run: python3 scripts/supertrader/research/certification/repack-artifact.py --input "$RUNNER_TEMP/encrypted-inputs" --out "$RUNNER_TEMP/repacked"
      - uses: actions/upload-artifact@v4
        with:
          name: supertrader-certification-repack-manifest-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/repacked/repack-status.json
            ${{ runner.temp }}/repacked/repack-manifest.json
          retention-days: 30
          if-no-files-found: error
      - name: Upload each bounded encrypted package with the official artifact client
        uses: actions/github-script@v7
        env:
          REPACK_DIRECTORY: ${{ runner.temp }}/repacked
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const {spawnSync} = require('child_process');
            const dir = process.env.REPACK_DIRECTORY;
            const manifest = JSON.parse(fs.readFileSync(path.join(dir, 'repack-manifest.json'), 'utf8'));
            const actionRoot = path.resolve(process.env.GITHUB_WORKSPACE, '../../_actions/actions/upload-artifact/v4');
            const client = ['dist/upload/index.js', 'dist/index.js'].map(f => path.join(actionRoot, f)).find(f => fs.existsSync(f));
            if (!client) throw new Error('OFFICIAL_ARTIFACT_CLIENT_UNAVAILABLE');
            for (const item of manifest.bundles) {
              if (!/^canonical-bundle-\d{4}\.zip$/.test(item.file)) throw new Error('INVALID_BUNDLE_NAME');
              const uploaded = spawnSync(process.execPath, [client], {
                env: {...process.env, INPUT_NAME: `supertrader-certification-bounded-${context.runId}-${item.file.replace('.zip', '')}`,
                  INPUT_PATH: path.join(dir, item.file), 'INPUT_RETENTION-DAYS': '30',
                  'INPUT_IF-NO-FILES-FOUND': 'error', 'INPUT_COMPRESSION-LEVEL': '0', INPUT_OVERWRITE: 'false', 'INPUT_INCLUDE-HIDDEN-FILES': 'false'},
                stdio: 'inherit'
              });
              if (uploaded.status !== 0) throw new Error('BOUNDED_ARTIFACT_UPLOAD_FAILED');
            }
            core.info(JSON.stringify({status: 'ENCRYPTED_BUNDLES_PRESERVED', bundles: manifest.bundles.length, providerReads: 0, performanceCalculated: false}));

  current-rerun:
    if: contains(github.event.head_commit.message, '[supertrader-certification:current]') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'current')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/supertrader/
            !/scripts/supertrader/research/tournament/sealed/
            /scripts/market/storage/
            /quant/engines/
            /quant/config/
            /quant/data/market/scale/universe-FULL_UNIVERSE.json
            /quant/data/market/security-master/eligibility.json
            /quant/data/market/security-master/company-names.json
            /quant/data/sec/consumer/
            /core/identity.js
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frozen current research scan; encrypted results only
        env:
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_REGION: ${{ secrets.VU_HISTORY_S3_REGION }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
          NODE_OPTIONS: --max-old-space-size=12000
        run: >-
          node scripts/supertrader/research/certification/current-rerun.mjs
          --out "$RUNNER_TEMP/current-v2"
          --freeze scripts/supertrader/research/certification/SUPERTRADER-METHOD-FREEZES-V2.json
          --eligibility scripts/supertrader/research/certification/SUPERTRADER-METHOD-ELIGIBILITY.json
          --as-of 2026-10-09
      - name: Preserve encrypted current results and safe counts only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supertrader-certification-current-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/current-v2/safe-status.json
            ${{ runner.temp }}/current-v2/*.sealed.json
          retention-days: 30
          if-no-files-found: error

      - name: Bound encrypted current source inputs without provider rereads
        run: python3 scripts/supertrader/research/certification/repack-current-artifact.py --input "$RUNNER_TEMP/current-v2/inputs" --out "$RUNNER_TEMP/current-input-bundles"
      - uses: actions/upload-artifact@v4
        with:
          name: supertrader-certification-current-input-manifest-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/current-input-bundles/repack-manifest.json
            ${{ runner.temp }}/current-input-bundles/repack-status.json
          retention-days: 30
          if-no-files-found: error
      - name: Upload each bounded encrypted current input package
        uses: actions/github-script@v7
        env:
          REPACK_DIRECTORY: ${{ runner.temp }}/current-input-bundles
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const {spawnSync} = require('child_process');
            const dir = process.env.REPACK_DIRECTORY;
            const manifest = JSON.parse(fs.readFileSync(path.join(dir, 'repack-manifest.json'), 'utf8'));
            const actionRoot = path.resolve(process.env.GITHUB_WORKSPACE, '../../_actions/actions/upload-artifact/v4');
            const client = ['dist/upload/index.js', 'dist/index.js'].map(f => path.join(actionRoot, f)).find(f => fs.existsSync(f));
            if (!client) throw new Error('OFFICIAL_ARTIFACT_CLIENT_UNAVAILABLE');
            for (const item of manifest.bundles) {
              if (!/^canonical-bundle-\d{4}\.zip$/.test(item.file)) throw new Error('INVALID_BUNDLE_NAME');
              const uploaded = spawnSync(process.execPath, [client], {
                env: {...process.env, INPUT_NAME: `supertrader-certification-current-input-${context.runId}-${item.file.replace('.zip', '')}`,
                  INPUT_PATH: path.join(dir, item.file), 'INPUT_RETENTION-DAYS': '30',
                  'INPUT_IF-NO-FILES-FOUND': 'error', 'INPUT_COMPRESSION-LEVEL': '0', INPUT_OVERWRITE: 'false', 'INPUT_INCLUDE-HIDDEN-FILES': 'false'},
                stdio: 'inherit'
              });
              if (uploaded.status !== 0) throw new Error('BOUNDED_ARTIFACT_UPLOAD_FAILED');
            }
            core.info(JSON.stringify({status: 'ENCRYPTED_BUNDLES_PRESERVED', bundles: manifest.bundles.length, providerReads: 0, performanceCalculated: false}));
