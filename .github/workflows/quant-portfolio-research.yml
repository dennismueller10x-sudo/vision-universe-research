name: Quant - Musterportfolios (VU-Portfolio-Standard, historisch, Forschung)

# Rechnet die Musterportfolios nach dem VU-Portfolio-Standard auf rekonstruierter Point-in-Time-Basis
# (scripts/quant/portfolio/model-portfolios.cjs). Forschung, nicht zertifiziert.
# Eingaben, die nur im Runner existieren und nie committet werden:
#   - kanonische Tagesbalken (Tiingo, R2-Historienablage): Gesamtrendite, Rohschluss, Tagesumsatz
#   - delistete Titel aus dem privaten V13-Archiv (Teile v13-derived und v13-raw, alle Hashes geprueft)
#   - SEC-Fundamentaldaten in der Lesart ORIGINAL (wie erstmals eingereicht) aus companyfacts.zip (oeffentlich)
# Committet wird nur das abgeleitete Ergebnis docs/quant/research/portfolio-v1/ und das Vorschau-Paket
# workers/vu-account/data/model-portfolios-bundle.json (Kennzahlen, Wertentwicklung, Gewichte; keine Kurse).
#
# Ausloeser: manuell oder die Marke [quant-portfolio-research] in der Commit-Nachricht auf claude/**.
# E3-Edge-Studie (docs/research/edge/PROTOKOLL.md): Marke [edge-e3:dev-quant] bzw. [edge-e3:test-quant]; gleiche Eingaben,
# statt der Musterportfolios rechnet scripts/research/edge/run-e3.cjs die Phase und committet docs/research/edge/.
# Holdout 2008-2015 (Strang H, docs/research/holdout/PROTOKOLL-2008-2015.json): nur manuell, Modus holdout-quant mit
# Pruefschluessel; einmalig (Ledger im privaten Eimer), Ergebnis nur versiegelt im Artefakt, kein Commit.
# Edge 2 (docs/research/edge2/PROTOKOLL.json, SHA gepinnt): Marke [edge2:dev]; gleiche Eingaben, scripts/research/edge2/run-edge2.cjs,
# committet nur docs/research/edge2/results/ (oeffentlich ohne Kennzahlen, Kennzahlen versiegelt an Owner und Strang Edge 2).
# Blinder KI-Backtest (docs/research/edge2/ki/BLIND_PROTOKOLL.json): [edge2:blind-build] baut die anonymen Pakete einmalig
# (Schluessel nur im privaten Eimer), [edge2:blind-resolve] loest die committeten Auswahlen auf; committet docs/research/edge2/ki/blind/.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'portfolios (Musterportfolios) oder holdout-quant (Holdout 2008-2015, einmalig, nur versiegelt)'
        required: false
        default: 'portfolios'
        type: choice
        options: [portfolios, holdout-quant]
      reviewer_public_key_b64:
        description: 'Nur holdout-quant: oeffentlicher RSA-Schluessel (PEM, base64 in einer Zeile) der Steuerung'
        required: false
        default: ''
        type: string
  push:
    branches:
      - 'claude/**'

permissions:
  contents: write

concurrency:
  group: quant-portfolio-research-${{ github.ref_name }}-${{ (github.event_name == 'push' && !contains(github.event.head_commit.message, '[quant-portfolio-research]') && !contains(github.event.head_commit.message, '[edge-e3:') && !contains(github.event.head_commit.message, '[edge2:')) && github.run_id || 'run' }}
  cancel-in-progress: false

jobs:
  run:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[quant-portfolio-research]') || contains(github.event.head_commit.message, '[edge-e3:') || contains(github.event.head_commit.message, '[edge2:')
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Modus aus der Commit-Nachricht
        id: m
        env:
          MSG: ${{ github.event.head_commit.message }}
          IN_MODE: ${{ inputs.mode }}
          REVIEWER_B64: ${{ inputs.reviewer_public_key_b64 }}
        run: |
          set -euo pipefail
          m=$(printf '%s' "$MSG" | grep -oE '\[edge-e3:(dev-quant|test-quant)\]' | head -1 | sed -E 's/\[edge-e3:([a-z-]+)\]/\1/' || true)
          if printf '%s' "$MSG" | grep -qF '[edge2:dev]'; then m=edge2; fi
          if printf '%s' "$MSG" | grep -qF '[edge2:blind-build]'; then m=edge2-blind-build; fi
          if printf '%s' "$MSG" | grep -qF '[edge2:blind-resolve]'; then m=edge2-blind-resolve; fi
          if [ "${IN_MODE:-}" = "holdout-quant" ]; then
            m=holdout-quant
            [[ "$REVIEWER_B64" =~ ^[A-Za-z0-9+/=]+$ ]] || { echo "REVIEWER_KEY_REQUIRED"; exit 2; }
            mkdir -p "$RUNNER_TEMP/holdout/upload"
            printf '%s' "$REVIEWER_B64" | base64 -d > "$RUNNER_TEMP/holdout/reviewer.pem"
            openssl pkey -pubin -in "$RUNNER_TEMP/holdout/reviewer.pem" -noout || { echo "REVIEWER_KEY_NOT_A_PUBLIC_KEY"; exit 2; }
          fi
          echo "mode=${m:-portfolios}" >> "$GITHUB_OUTPUT"
          echo "Modus: ${m:-portfolios}"

      - name: R2-Zugang vorhanden
        env:
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
          V13_ARCHIVE_PRIVATE_KEY: ${{ secrets.V13_ARCHIVE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for v in VU_HISTORY_S3_ENDPOINT VU_HISTORY_S3_BUCKET VU_HISTORY_S3_ACCESS_KEY_ID VU_HISTORY_S3_SECRET_ACCESS_KEY V13_ARCHIVE_PRIVATE_KEY; do
            if [ -z "${!v}" ]; then echo "::error::$v fehlt"; exit 1; fi
          done

      - name: Lesender Vorabcheck (Nullkostengrenze)
        env:
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_REGION: ${{ secrets.VU_HISTORY_S3_REGION }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
        run: >-
          node scripts/market/preflight-zero-cost.mjs --operation RECOVERY --gate FULL_UNIVERSE
          --out "$RUNNER_TEMP/portfolio-preflight.json"

      - name: Tagesbalken aus der Historienablage (nur Runner)
        env:
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_REGION: ${{ secrets.VU_HISTORY_S3_REGION }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
        run: >-
          node scripts/market/sync-history-store.mjs --pull --gate FULL_UNIVERSE --concurrency 24
          --preflight "$RUNNER_TEMP/portfolio-preflight.json"
          --work-dir "$RUNNER_TEMP/canonical-history"
          --report "$RUNNER_TEMP/portfolio-sync.json"

      - name: Delistete Titel aus dem V13-Archiv (privater Schluessel nur in diesem Schritt)
        env:
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_REGION: ${{ secrets.VU_HISTORY_S3_REGION }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
          V13_ARCHIVE_PRIVATE_KEY: ${{ secrets.V13_ARCHIVE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          node scripts/quant/v13/archive/r2-restore.mjs --mode extract --parts v13-derived,v13-raw \
            --dest "$RUNNER_TEMP/priv" --manifest docs/quant-recovery/v13/archive/manifest-1.2.0.json --prefix research-snapshots/quant-v13/archive-1.2.0/
          first=$(python3 -I -c 'import json,sys;r=json.load(open(sys.argv[1]));f=r["columns"];rows=r["rows"];i=f.index("chainId");s=f.index("status");print(next(x[i] for x in rows if x[s]=="QUALIFIED"))' docs/quant-recovery/v13/delisted/register-1.0.0.json)
          hit=$(find "$RUNNER_TEMP/priv/v13-derived" -name "$first.json" -print -quit); test -n "$hit"
          echo "DELISTED_DIR=$(dirname "$hit")" >> "$GITHUB_ENV"
          rawf=$(find "$RUNNER_TEMP/priv/v13-raw" -name 'series.jsonl.gz' -print -quit); test -n "$rawf"
          echo "DELISTED_RAW_DIR=$RUNNER_TEMP/priv/v13-raw" >> "$GITHUB_ENV"
          echo "Rohdateien: $(find "$RUNNER_TEMP/priv/v13-raw" -name 'series.jsonl.gz' | wc -l)"
          echo "Reihen: $(find "$(dirname "$hit")" -maxdepth 1 -name '*.json' | wc -l)"

      - name: SEC-Fundamentaldaten wie erstmals eingereicht (oeffentlich, companyfacts.zip)
        run: |
          set -euo pipefail
          python3 scripts/quant/portfolio/build_pit_fundamentals.py --out "$RUNNER_TEMP/pit-fundamentals" --bulk --workers 4

      - name: Musterportfolios rechnen
        if: steps.m.outputs.mode == 'portfolios'
        run: |
          set -euo pipefail
          mkdir -p docs/quant/research/portfolio-v1
          node --max-old-space-size=12288 scripts/quant/portfolio/model-portfolios.cjs \
            --work-dir "$RUNNER_TEMP/canonical-history" --delisted-dir "$DELISTED_DIR" --delisted-raw-dir "$DELISTED_RAW_DIR" \
            --fundamentals "$RUNNER_TEMP/pit-fundamentals" --sensitivity \
            --out docs/quant/research/portfolio-v1/model-portfolios.json
          node scripts/quant/portfolio/render-model-portfolios.cjs --in docs/quant/research/portfolio-v1/model-portfolios.json \
            --out docs/quant/research/portfolio-v1/MODEL_PORTFOLIOS.md
          node scripts/quant/portfolio/export-model-portfolios-bundle.cjs
          rm -rf "$RUNNER_TEMP/priv" "$RUNNER_TEMP/canonical-history"

      - name: Holdout 2008-2015 Quant (einmalig, Protokoll gepinnt, nur versiegelt)
        if: steps.m.outputs.mode == 'holdout-quant'
        env:
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_REGION: ${{ secrets.VU_HISTORY_S3_REGION }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          umask 077
          H="$RUNNER_TEMP/holdout"
          node --test scripts/research/holdout/holdout.test.cjs
          node --max-old-space-size=12288 scripts/research/holdout/quant-holdout.cjs \
            --work-dir "$RUNNER_TEMP/canonical-history" --delisted-dir "$DELISTED_DIR" --delisted-raw-dir "$DELISTED_RAW_DIR" \
            --fundamentals "$RUNNER_TEMP/pit-fundamentals" --out "$H/out" --reviewer-key "$H/reviewer.pem" > "$H/run.log" 2>&1 || { tail -n 20 "$H/run.log" | grep -vE '[0-9]\.[0-9]{3,}' || true; exit 1; }
          cp "$H/out/quant-holdout.public.json" "$H/out"/quant-holdout.sealed.*.json "$H/upload/"
          grep -q '"schema":"supertrader-sealed-1.0.0"' "$H/upload/quant-holdout.sealed.owner.json"
          node -e 'const p=require(process.argv[1]); for (const k of ["totalReturn","cagr","maxDrawdown","sharpe"]) if (JSON.stringify(p).includes("\""+k+"\"")) { console.log("METRIC_IN_PUBLIC_PART"); process.exit(1); }' "$H/upload/quant-holdout.public.json"
          cat "$H/upload/quant-holdout.public.json"
          find "$H/out" -type f -exec shred -u {} +
          rm -rf "$RUNNER_TEMP/priv" "$RUNNER_TEMP/canonical-history"
      - uses: actions/upload-artifact@v4
        if: steps.m.outputs.mode == 'holdout-quant'
        with:
          name: holdout-quant-${{ github.run_id }}
          path: ${{ runner.temp }}/holdout/upload
          retention-days: 7
          if-no-files-found: error

      - name: Edge 2 rechnen (Protokoll gepinnt, Ergebnis versiegelt)
        if: steps.m.outputs.mode == 'edge2'
        run: |
          set -euo pipefail
          umask 077
          X="$RUNNER_TEMP/edge2"
          mkdir -p "$X" docs/research/edge2/results
          node --test scripts/research/edge2/edge2.test.cjs
          node --max-old-space-size=12288 scripts/research/edge2/run-edge2.cjs \
            --work-dir "$RUNNER_TEMP/canonical-history" --delisted-dir "$DELISTED_DIR" --delisted-raw-dir "$DELISTED_RAW_DIR" \
            --fundamentals "$RUNNER_TEMP/pit-fundamentals" --out "$X/out" --reviewer-key docs/research/edge2/reviewer-public.pem > "$X/run.log" 2>&1 || { tail -n 30 "$X/run.log" | grep -vE '[0-9]\.[0-9]{3,}' || true; exit 1; }
          grep -E '^\{"(id|panel)"' "$X/run.log" | grep -vE '[0-9]\.[0-9]{3,}' || true
          grep -q '"schema":"supertrader-sealed-1.0.0"' "$X/out/edge2.sealed.owner.json"
          node -e 'const t=require("fs").readFileSync(process.argv[1],"utf8"); for (const k of ["totalReturn","cagr","maxDrawdown","sharpe","weeklyReturns"]) if (t.includes("\""+k+"\"")) { console.log("METRIC_IN_PUBLIC_PART"); process.exit(1); }' "$X/out/edge2.public.json"
          cp "$X/out/edge2.public.json" "$X/out/edge2.sealed.owner.json" "$X/out/edge2.sealed.reviewer.json" docs/research/edge2/results/
          cat docs/research/edge2/results/edge2.public.json
          find "$X" -type f -exec shred -u {} +
          rm -rf "$RUNNER_TEMP/priv" "$RUNNER_TEMP/canonical-history"

      - name: Edge 2 blinder KI-Backtest (Pakete bauen oder Auswahlen aufloesen)
        if: steps.m.outputs.mode == 'edge2-blind-build' || steps.m.outputs.mode == 'edge2-blind-resolve'
        env:
          MODE: ${{ steps.m.outputs.mode }}
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_REGION: ${{ secrets.VU_HISTORY_S3_REGION }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          umask 077
          X="$RUNNER_TEMP/edge2-blind"
          mkdir -p "$X" docs/research/edge2/ki/blind
          node --test scripts/research/edge2/blind.test.cjs
          phase=build; [ "$MODE" = "edge2-blind-resolve" ] && phase=resolve
          node --max-old-space-size=12288 scripts/research/edge2/run-blind.cjs --phase "$phase" \
            --work-dir "$RUNNER_TEMP/canonical-history" --delisted-dir "$DELISTED_DIR" --delisted-raw-dir "$DELISTED_RAW_DIR" \
            --fundamentals "$RUNNER_TEMP/pit-fundamentals" --out "$X/out" > "$X/run.log" 2>&1 || { tail -n 30 "$X/run.log" | grep -vE '[0-9]\.[0-9]{3,}' || true; exit 1; }
          cat "$X/run.log" | grep -vE '[0-9]\.[0-9]{3,}' | tail -n 5 || true
          test ! -e "$X/out/keys.plain.json"
          for f in "$X/out"/*; do case "$(basename "$f")" in packets.json|*.sealed.owner.json|*.sealed.reviewer.json|blind-result.public.json) cp "$f" docs/research/edge2/ki/blind/ ;; esac; done
          find "$X" -type f -exec shred -u {} +
          rm -rf "$RUNNER_TEMP/priv" "$RUNNER_TEMP/canonical-history"

      - name: E3-Phase rechnen (Protokoll eingefroren, Hash geprueft)
        if: steps.m.outputs.mode != 'portfolios' && steps.m.outputs.mode != 'holdout-quant' && steps.m.outputs.mode != 'edge2' && steps.m.outputs.mode != 'edge2-blind-build' && steps.m.outputs.mode != 'edge2-blind-resolve'
        env:
          PHASE: ${{ steps.m.outputs.mode }}
        run: |
          set -euo pipefail
          node --test scripts/research/edge/study.test.cjs scripts/research/edge/edge-quant.test.cjs
          node --max-old-space-size=12288 scripts/research/edge/run-e3.cjs --phase "$PHASE" \
            --work-dir "$RUNNER_TEMP/canonical-history" --delisted-dir "$DELISTED_DIR" --delisted-raw-dir "$DELISTED_RAW_DIR" \
            --fundamentals "$RUNNER_TEMP/pit-fundamentals"
          node scripts/research/edge/run-e3.cjs --phase report
          rm -rf "$RUNNER_TEMP/priv" "$RUNNER_TEMP/canonical-history"

      - name: Tests und Datenhygiene
        run: |
          node --test quant/tests/portfolio-standard.test.mjs quant/tests/model-portfolios-result.test.mjs workers/vu-account/tests/backtests.test.mjs
          # Der Hygiene-Check scannt das ganze Repository. Fundstellen ausserhalb der eigenen Ausgabepfade bestehen schon auf main
          # und gehoeren anderen Erzeugern; dieser Lauf scheitert nur an Fundstellen in seinen eigenen Pfaden.
          set +e; node scripts/market/assert-public-data-hygiene.mjs > "$RUNNER_TEMP/hygiene.txt" 2>&1; rc=$?; set -e
          if [ "$rc" -ne 0 ]; then
            echo "Hygiene-Fundstellen gesamt: $(grep -c '^  - ' "$RUNNER_TEMP/hygiene.txt" || true)"
            if grep -E '^  - (docs/research/edge|docs/research/edge2|docs/quant/research/portfolio-v1|workers/vu-account/data/model-portfolios-bundle)' "$RUNNER_TEMP/hygiene.txt"; then exit 1; fi
            echo "::warning::Hygiene-Fundstellen nur ausserhalb der Ausgabepfade dieses Laufs (bestehen auf main)."
          fi

      - name: Ergebnis auf den aktuellen Zweig committen
        if: steps.m.outputs.mode != 'holdout-quant'
        env:
          MODE: ${{ steps.m.outputs.mode }}
        run: |
          git config user.name "vision-universe-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/quant/research/portfolio-v1 workers/vu-account/data/model-portfolios-bundle.json docs/research/edge
          if [ -d docs/research/edge2/results ]; then git add docs/research/edge2/results; fi
          if [ -d docs/research/edge2/ki/blind ]; then git add docs/research/edge2/ki/blind; fi
          if git diff --cached --quiet; then echo "Ergebnis unveraendert."; exit 0; fi
          git commit -m "Quant-Forschungslauf ${MODE} (Lauf ${GITHUB_RUN_ID})"
          scripts/ci/push-with-retry.sh "${GITHUB_REF_NAME}"
