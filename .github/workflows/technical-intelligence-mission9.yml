name: Chartbild-Historie (Mission IX, Genauigkeit x Geometrie / asymmetrische Gewinner)

# WOZU: Mission IX nutzt die Mission-VIII-Infrastruktur (scripts/technical/hsab) runner-privat und
# committet NUR aggregierte Kennzahlen (keine Kurse, keine Niveaus, keine Ereignis-Exporte).
#
#   Track A Bestaetigung: Tagesengine auf einer NEUEN, zu Mission VIII titel-disjunkten Stichprobe
#     (Hash-Raenge 1200..2399; Mission VIII oeffnete nur 0..1199, die Disjunktheit prueft replay.mjs
#     gegen den veroeffentlichten Symbol-Hash), Erkennung 2017-01-01 .. 2026-09-30.
#   Track B Survivorship-Erweiterung: delistete Wochenkohorte (in Mission VIII als Holdout VERBRAUCHT;
#     hier nur Erweiterung/Sensitivitaet, ausdruecklich KEINE Bestaetigung).
#
# Ausloeser: Push auf claude/** mit einer Marke im BETREFF der Commit-Nachricht:
#   [hsab9-ci-dev]    Track B delistete Kohorte (verbrauchte Daten, beschreibend) + Track A NUR Stage 1
#                     (Siegel, Zaehler, Disjunktheitspruefung; keine Outcomes)
#   [hsab9-confirm] freeze=<sha>   einmalige Track-A-Bestaetigung (Marke am ANFANG des Betreffs). Verlangt:
#                     - <sha> = Freeze-Commit, Vorfahr von HEAD, dort protocol9.status PREREGISTERED und passender
#                       Praeregistrierungs-Hash; zwischen <sha> und HEAD keine Aenderung an Code, Protokoll, Workflow,
#                       Praeregistrierung oder Entscheidungsdateien (Red Team H2)
#                     - auf KEINEM Branch existiert schon eine Oeffnungsmarke oder ein Ergebnis (Red Team H1);
#                       die Oeffnungsmarke wird VOR Stage 2 committet und gepusht — ein abgebrochener Lauf ist verbraucht
# Ohne Marke laeuft nichts.

on:
  push:
    branches:
      - 'claude/**'

permissions:
  contents: write

# global (nicht je Branch): keine zwei Mission-IX-Laeufe gleichzeitig, auch nicht von verschiedenen Branches (Red Team H1)
concurrency:
  group: technical-intelligence-mission9
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.g.outputs.mode }}
    steps:
      - id: g
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          subject=$(printf '%s\n' "$COMMIT_MESSAGE" | head -n 1)
          case "$subject" in
            "[hsab9-confirm]"*) echo "mode=confirm" >> "$GITHUB_OUTPUT" ;;
            "[hsab9-ci-dev]"*) echo "mode=dev" >> "$GITHUB_OUTPUT" ;;
            *) echo "mode=none" >> "$GITHUB_OUTPUT" ;;
          esac

  track-b-delisted:
    needs: gate
    if: needs.gate.outputs.mode == 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      OUT: quant/data/technical-intelligence/historical-accuracy/mission9/ci
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read-only recovery preflight
        env:
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_REGION: ${{ secrets.VU_HISTORY_S3_REGION }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
        run: node scripts/market/preflight-zero-cost.mjs --operation RECOVERY --gate FULL_UNIVERSE --out "$RUNNER_TEMP/preflight.json"
      - name: Restore canonical history (runner-private, needed for ticker-change de-duplication)
        env:
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_REGION: ${{ secrets.VU_HISTORY_S3_REGION }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
        run: >-
          node scripts/market/sync-history-store.mjs --pull --gate FULL_UNIVERSE --concurrency 24
          --preflight "$RUNNER_TEMP/preflight.json" --work-dir "$RUNNER_TEMP/canonical-history" --report "$RUNNER_TEMP/sync.json"
      - name: Private delisted weekly bundle
        env:
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_REGION: ${{ secrets.VU_HISTORY_S3_REGION }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
          VU_SURVIVORSHIP_OUT: ${{ runner.temp }}/survivorship-control.json
        run: >-
          node --max-old-space-size=6144 scripts/quant/build-survivorship-control.mjs
          --work-dir "$RUNNER_TEMP/canonical-history" --bundle-out "$RUNNER_TEMP/delisted-weekly.json"
      - name: Stage 1 replay (delisted weekly cohort, detection points only)
        run: >-
          node --max-old-space-size=6144 scripts/technical/hsab/replay.mjs --delisted "$RUNNER_TEMP/delisted-weekly.json"
          --workers "$(nproc)" --out "$RUNNER_TEMP/dl-replay"
      - name: Track B on the delisted cohort (aggregates only)
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          node --max-old-space-size=7168 scripts/technical/hsab/track-b.mjs --records "$RUNNER_TEMP/dl-replay" --delisted "$RUNNER_TEMP/delisted-weekly.json" --out "$OUT/tb-delisted.json"
          node --max-old-space-size=7168 scripts/technical/hsab/track-b.mjs --records "$RUNNER_TEMP/dl-replay" --delisted "$RUNNER_TEMP/delisted-weekly.json" --gate full --out "$OUT/tb-delisted-gatefull.json"
          node scripts/technical/hsab/publish-ci.mjs --replay "$RUNNER_TEMP/dl-replay" --label "m9-delisted" --out "$OUT"
      - name: Hygiene
        run: |
          node scripts/market/assert-public-data-hygiene.mjs
          node scripts/technical/hsab/publish-ci.mjs --check "$OUT"
      - name: Commit (aggregates only)
        run: |
          git config user.name "vision-universe-bot"
          git config user.email "actions@users.noreply.github.com"
          git add quant/data/technical-intelligence/historical-accuracy/mission9/ci
          if git diff --cached --quiet; then echo "unveraendert"; exit 0; fi
          git commit -m "Mission IX CI: Track B delistete Kohorte (nur Kennzahlen)"
          scripts/ci/push-with-retry.sh "${GITHUB_REF_NAME}"

  track-a-daily:
    needs: gate
    if: needs.gate.outputs.mode != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      MODE: ${{ needs.gate.outputs.mode }}
      OUT: quant/data/technical-intelligence/historical-accuracy/mission9/ci
      # Mission-VIII-Tagesstichprobe (Raenge 0..1199), veroeffentlichter Symbol-Hash aus d-holdout-stage1-holdout-stage1.json
      M8_SAMPLE: '1200:457ce200ffb2be48ff178db01313217317f1ad2d493dca766d51e0e2adb781d0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bestaetigung nur einmal, nur gegen den eingefrorenen Stand
        if: needs.gate.outputs.mode == 'confirm'
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          # Der Lauf prueft genau den ausloesenden Commit (kein spaeterer Push dazwischen)
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ] || { echo "Branch hat sich seit dem Oeffnungs-Commit bewegt - verweigert."; exit 1; }
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          # einmal: weder Oeffnungsmarke noch Ergebnis auf irgendeinem Branch
          if [ -n "$(git log --all --format=%H -- "$OUT/a9-confirm-opened.json" "$OUT/a9-confirm-eval.json")" ]; then echo "Track-A-Bestaetigung wurde bereits geoeffnet - kein zweiter Lauf."; exit 1; fi
          freeze=$(printf '%s\n' "$COMMIT_MESSAGE" | head -n 1 | sed -n 's/.*freeze=\([0-9a-f]\{40\}\).*/\1/p')
          [ -n "$freeze" ] || { echo "Betreff muss freeze=<40-stelliger Commit> tragen."; exit 1; }
          git merge-base --is-ancestor "$freeze" HEAD || { echo "Freeze-Commit ist kein Vorfahr."; exit 1; }
          git diff --quiet "$freeze" HEAD -- scripts/technical quant/engines .github/workflows/technical-intelligence-mission9.yml docs/technical-intelligence/MISSION9_PREREGISTRATION.md \
            || { echo "Seit dem Freeze geaendert:"; git diff --stat "$freeze" HEAD -- scripts/technical quant/engines .github/workflows docs/technical-intelligence/MISSION9_PREREGISTRATION.md; exit 1; }
          git show "$freeze:scripts/technical/hsab/protocol9.json" > "$RUNNER_TEMP/p9.json"
          git show "$freeze:docs/technical-intelligence/MISSION9_PREREGISTRATION.md" | sha256sum | cut -d' ' -f1 > "$RUNNER_TEMP/pre.sha"
          node -e 'const p=require(process.argv[1]),s=require("fs").readFileSync(process.argv[2],"utf8").trim(); if(p.status!=="PREREGISTERED"||p.preregistration.sha256!==s||!p.freeze||!Object.keys(p.freeze.engineFiles||{}).length){console.error("Freeze-Commit nicht praeregistriert");process.exit(1)}' "$RUNNER_TEMP/p9.json" "$RUNNER_TEMP/pre.sha"
          echo "FREEZE=$freeze" >> "$GITHUB_ENV"
          echo "Freeze $freeze geprueft: keine Aenderung an Code/Protokoll/Workflow/Praeregistrierung bis $GITHUB_SHA"
      - name: Read-only recovery preflight
        env:
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_REGION: ${{ secrets.VU_HISTORY_S3_REGION }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
        run: node scripts/market/preflight-zero-cost.mjs --operation RECOVERY --gate FULL_UNIVERSE --out "$RUNNER_TEMP/preflight.json"
      - name: Restore canonical history to runner-private state
        env:
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_REGION: ${{ secrets.VU_HISTORY_S3_REGION }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
        run: >-
          node scripts/market/sync-history-store.mjs --pull --gate FULL_UNIVERSE --concurrency 24
          --preflight "$RUNNER_TEMP/preflight.json" --work-dir "$RUNNER_TEMP/canonical-history" --report "$RUNNER_TEMP/sync.json"
      - name: "Stage 1, disjoint daily sample (ranks 1200..2399; dev = seal only, no outcomes)"
        run: |
          set -euo pipefail
          # nach der einmaligen Oeffnung braucht der Dev-Modus keinen weiteren Tageslauf
          if [ "$MODE" = "dev" ] && [ -f "$OUT/a9-confirm-opened.json" ]; then echo "Bestaetigung bereits geoeffnet - Dev-Stage-1 entfaellt."; exit 0; fi
          node --max-old-space-size=6144 scripts/technical/hsab/replay.mjs --work-dir "$RUNNER_TEMP/canonical-history" \
            --universe quant/data/market/scale/universe-ELIGIBLE_US_EQUITY.json --sample-symbols 1200 --sample-offset 1200 --disjoint-from "$M8_SAMPLE" \
            --from 2017-01-01 --to 2026-09-30 --grid month --workers "$(nproc)" --out "$RUNNER_TEMP/a9"
          mkdir -p "$OUT"
          node scripts/technical/hsab/publish-ci.mjs --replay "$RUNNER_TEMP/a9" --label "a9-confirm-$MODE" --out "$OUT"
      - name: Same sample as the dev Stage 1 (confirm only)
        if: needs.gate.outputs.mode == 'confirm'
        run: |
          set -euo pipefail
          node -e 'const a=require(process.argv[1]),b=require(process.argv[2]); if(a.symbols.sha256!==b.symbols.sha256){console.error("Stichprobe weicht vom Dev-Stage-1 ab");process.exit(1)}' "$PWD/$OUT/a9-confirm-confirm-stage1.json" "$PWD/$OUT/a9-confirm-dev-stage1.json"
      - name: Opening marker, pushed BEFORE Stage 2 (an aborted opening stays consumed)
        if: needs.gate.outputs.mode == 'confirm'
        run: |
          set -euo pipefail
          git config user.name "vision-universe-bot"
          git config user.email "actions@users.noreply.github.com"
          printf '{"opened":"%s","commit":"%s","freeze":"%s","run":"%s"}\n' "$(date -u +%FT%TZ)" "$GITHUB_SHA" "$FREEZE" "$GITHUB_RUN_ID" > "$OUT/a9-confirm-opened.json"
          git add "$OUT/a9-confirm-opened.json" "$OUT/a9-confirm-confirm-stage1.json"
          git commit -m "Mission IX CI: Track-A-Bestaetigung geoeffnet (Marke vor Stage 2)"
          scripts/ci/push-with-retry.sh "${GITHUB_REF_NAME}"
      - name: Stage 2 + Track A (confirm only; results are not printed to the log)
        if: needs.gate.outputs.mode == 'confirm'
        run: |
          set -euo pipefail
          sha=$(sha256sum docs/technical-intelligence/MISSION9_PREREGISTRATION.md | cut -d' ' -f1)
          node --max-old-space-size=7168 scripts/technical/hsab/evaluate.mjs --records "$RUNNER_TEMP/a9" --phase A9_CONFIRM --protocol scripts/technical/hsab/protocol9.json \
            --work-dir "$RUNNER_TEMP/canonical-history" --open-holdout "$sha" --dump-events "$RUNNER_TEMP/a9-events.jsonl.gz" --out "$OUT/a9-confirm-eval.json"
          node --max-old-space-size=7168 scripts/technical/hsab/track-a.mjs --events "$RUNNER_TEMP/a9-events.jsonl.gz" --eval "$OUT/a9-confirm-eval.json" --out "$OUT/a9-confirm-tracka.json" > /dev/null
      - name: Hygiene
        run: |
          node scripts/market/assert-public-data-hygiene.mjs
          node scripts/technical/hsab/publish-ci.mjs --check "$OUT"
      - name: Commit (aggregates only)
        run: |
          git config user.name "vision-universe-bot"
          git config user.email "actions@users.noreply.github.com"
          git add quant/data/technical-intelligence/historical-accuracy/mission9/ci
          if git diff --cached --quiet; then echo "unveraendert"; exit 0; fi
          git commit -m "Mission IX CI: Track A Tagesstichprobe (${MODE}, nur Kennzahlen)"
          scripts/ci/push-with-retry.sh "${GITHUB_REF_NAME}"
