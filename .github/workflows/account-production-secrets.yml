name: Konten — Produktions-Secrets setzen (Freigabe)
# Schreibt Zugangsdaten als Worker-Secrets von vu-account (konto.visionuniverse.de). SENSIBEL: laeuft nur
# nach ausdruecklicher Freigabe des Owners (docs/accounts/FREIGABEN.md):
#   freigabe  Umgebung account-production (Required reviewers = Owner); prueft die Freigabe-Historie
#             dieses Laufs zusaetzlich selbst (fail closed); setzt auf Wunsch den Stripe-Live-Schluessel
#   supabase  Umgebung account-dev, erst nach "freigabe" und erneuter Pruefung der Freigabe:
#             SUPABASE_SECRET_KEY, BREVO_API_KEY
# Code und oeffentliche Werte rollt "Konten — Produktion automatisch" ohne Freigabe aus.
# Kein Wert wird ausgegeben (oeffentliches Repository).
on:
  workflow_dispatch:
    inputs:
      supabase_brevo:
        description: 'Supabase- und Brevo-Schluessel aus account-dev in den Worker schreiben'
        type: boolean
        default: true
      stripe_key:
        description: 'Stripe-Live-Schluessel (und Webhook-Geheimnis, falls hinterlegt) aus account-production schreiben'
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: account-production-secrets-${{ github.ref_name }}
  cancel-in-progress: false
env:
  WRANGLER: wrangler@4.147.0
jobs:
  freigabe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: account-production
    steps:
      - name: Owner-Freigabe pruefen (fail closed)
        env: {GH_TOKEN: '${{ github.token }}', RUN_ID: '${{ github.run_id }}', REPO: '${{ github.repository }}', REF: '${{ github.ref }}', APPROVER: dennismueller10x-sudo, ENV_NAME: account-production}
        run: |
          set -euo pipefail
          [ "$REF" = refs/heads/main ] || { echo "::error::Nur von main"; exit 1; }
          json=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/approvals")
          ok=$(jq --arg u "$APPROVER" --arg e "$ENV_NAME" '[.[] | select(.state=="approved" and .user.login==$u and any(.environments[]; .name==$e))] | length' <<<"$json")
          [ "$ok" -ge 1 ] || { echo "::error::Keine Freigabe durch $APPROVER fuer $ENV_NAME"; exit 1; }
      - uses: actions/checkout@v4
        if: inputs.stripe_key
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: inputs.stripe_key
        with:
          node-version: '22'
      - name: Stripe-Schluessel zu Cloudflare
        if: inputs.stripe_key
        working-directory: workers/vu-account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          KEY: ${{ secrets.VU_ACCOUNT_STRIPE_SECRET_KEY }}
          WHSEC: ${{ secrets.VU_ACCOUNT_STRIPE_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          case "$KEY" in
            rk_live_*) echo "Stripe: Restricted Key, Live";;
            sk_live_*) echo "::error::Standard-Secret-Key (sk_live_) abgelehnt - bitte Restricted Key (rk_live_) verwenden"; exit 1;;
            *) echo "::error::VU_ACCOUNT_STRIPE_SECRET_KEY fehlt oder ist kein Live-Restricted-Key"; exit 1;;
          esac
          put() { printf '%s' "$2" | npx --yes "$WRANGLER" secret put "$1" --env production > /dev/null 2>&1 && echo "$1 hinterlegt" || { echo "::error::$1 nicht hinterlegt"; exit 1; }; }
          put STRIPE_SECRET_KEY "$KEY"
          if [ -n "$WHSEC" ]; then [[ "$WHSEC" == whsec_* ]] || { echo "::error::VU_ACCOUNT_STRIPE_WEBHOOK_SECRET muss whsec_ sein"; exit 1; }; put STRIPE_WEBHOOK_SECRET "$WHSEC"; fi

  supabase:
    needs: freigabe
    if: inputs.supabase_brevo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: account-dev
    steps:
      - name: Owner-Freigabe dieses Laufs erneut pruefen (fail closed)
        env: {GH_TOKEN: '${{ github.token }}', RUN_ID: '${{ github.run_id }}', REPO: '${{ github.repository }}', APPROVER: dennismueller10x-sudo, ENV_NAME: account-production}
        run: |
          set -euo pipefail
          json=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/approvals")
          ok=$(jq --arg u "$APPROVER" --arg e "$ENV_NAME" '[.[] | select(.state=="approved" and .user.login==$u and any(.environments[]; .name==$e))] | length' <<<"$json")
          [ "$ok" -ge 1 ] || { echo "::error::Keine Freigabe durch $APPROVER fuer $ENV_NAME"; exit 1; }
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Secrets zu Cloudflare (Supabase, Brevo)
        working-directory: workers/vu-account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SEC: ${{ secrets.VU_ACCOUNT_SUPABASE_SECRET_KEY }}
          BREVO: ${{ secrets.BREVO_API_KEY }}
        run: |
          set -euo pipefail
          put() { printf '%s' "$2" | npx --yes "$WRANGLER" secret put "$1" --env production > /dev/null 2>&1 && echo "$1 hinterlegt" || { echo "::error::$1 nicht hinterlegt"; exit 1; }; }
          [[ "$SEC" == sb_secret_* ]] || { echo "::error::VU_ACCOUNT_SUPABASE_SECRET_KEY fehlt oder ist kein sb_secret_"; exit 1; }
          put SUPABASE_SECRET_KEY "$SEC"
          if [ -n "$BREVO" ]; then put BREVO_API_KEY "$BREVO"; else echo "::warning::BREVO_API_KEY fehlt - keine Kuendigungsbestaetigungen per E-Mail"; fi
