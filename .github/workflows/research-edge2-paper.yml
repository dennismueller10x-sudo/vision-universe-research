name: Edge 2 - Papierdepot EDGE2-PAPER (Forschung, vorwaerts)

# Rechnet die in docs/research/edge2/PROTOKOLL.json ausgewaehlte Teil-1-Variante (docs/research/edge2/paper/CONFIG.json)
# unveraendert vorwaerts und haengt an das hash-verkettete Ledger docs/research/edge2/paper/ledger.jsonl an.
# Forschung, nicht zertifiziert; kein echtes Geld, keine Orders, keine Produktflaeche, keine Rendite im Ledger.
# Eingaben wie im Backtest: R2-Tagesbalken (nur Runner) und SEC-Fundamentaldaten wie erstmals eingereicht.
# ADR-005: Spitze des eigenen Zweigs, push-with-retry.sh, Concurrency je Zweig, Eingaben nur ueber env.
# Zeitplan: core/registry/schedule.json, Takt ueber den Cloudflare-Wecker (RUNBOOK §10).
run-name: ${{ inputs.zeitplan && format('{0} · Takt {1}', github.workflow, inputs.zeitplan) || '' }}
on:
  workflow_dispatch:
    inputs:
      zeitplan:
        description: 'Vom Cloudflare-Wecker gesetzt (Cron des Termins, core/registry/schedule.json); manuell leer lassen'
        type: string
        default: ''
      today:
        description: 'Stichtag YYYY-MM-DD (leer = heute)'
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: research-edge2-paper-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  record:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Konfiguration vorhanden
        id: c
        run: |
          set -euo pipefail
          if [ -f docs/research/edge2/paper/CONFIG.json ]; then echo "on=1" >> "$GITHUB_OUTPUT"; else echo "on=0" >> "$GITHUB_OUTPUT"; echo "Keine Papierkonfiguration, nichts zu tun."; fi
      - name: Tests
        if: steps.c.outputs.on == '1'
        run: node --test scripts/research/edge2/edge2.test.cjs
      - name: Lesender Vorabcheck (Nullkostengrenze)
        if: steps.c.outputs.on == '1'
        env:
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_REGION: ${{ secrets.VU_HISTORY_S3_REGION }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
        run: >-
          node scripts/market/preflight-zero-cost.mjs --operation RECOVERY --gate FULL_UNIVERSE
          --out "$RUNNER_TEMP/paper-preflight.json"
      - name: Tagesbalken aus der Historienablage (nur Runner)
        if: steps.c.outputs.on == '1'
        env:
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_REGION: ${{ secrets.VU_HISTORY_S3_REGION }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
        run: >-
          node scripts/market/sync-history-store.mjs --pull --gate FULL_UNIVERSE --concurrency 24
          --preflight "$RUNNER_TEMP/paper-preflight.json"
          --work-dir "$RUNNER_TEMP/canonical-history"
          --report "$RUNNER_TEMP/paper-sync.json"
      - name: SEC-Fundamentaldaten wie erstmals eingereicht (oeffentlich, companyfacts.zip)
        if: steps.c.outputs.on == '1'
        run: |
          set -euo pipefail
          python3 scripts/quant/portfolio/build_pit_fundamentals.py --out "$RUNNER_TEMP/pit-fundamentals" --bulk --workers 4
      - name: Woche aufzeichnen
        if: steps.c.outputs.on == '1'
        env:
          IN_TODAY: ${{ inputs.today }}
        run: |
          set -euo pipefail
          extra=(); if [ -n "${IN_TODAY:-}" ]; then [[ "$IN_TODAY" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || exit 2; extra=(--today "$IN_TODAY"); fi
          node --max-old-space-size=12288 scripts/research/edge2/paper.cjs --work-dir "$RUNNER_TEMP/canonical-history" --fundamentals "$RUNNER_TEMP/pit-fundamentals" "${extra[@]}"
          rm -rf "$RUNNER_TEMP/canonical-history"
      - name: Ledger committen
        if: steps.c.outputs.on == '1'
        run: |
          set -euo pipefail
          git config user.name "vision-universe-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/research/edge2/paper/ledger.jsonl 2>/dev/null || true
          if git diff --cached --quiet; then echo "Nichts aufzuzeichnen."; exit 0; fi
          git commit -m "EDGE2-PAPER: Woche aufgezeichnet (Lauf ${GITHUB_RUN_ID})"
          scripts/ci/push-with-retry.sh "${GITHUB_REF_NAME}"
