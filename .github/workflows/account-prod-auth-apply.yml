name: Konten — Supabase Auth Produktion (Ops, vor dem Merge)
# Stellt Supabase Auth der Produktionsdatenbank (qiytbnpoqvldsatpfkeh) ein,
# mit Brevo als SMTP. Dasselbe Skript wie account-production-auth.yml (#979),
# fester Commit. Oeffnet die Registrierung NICHT.
#   Job 1 istzustand: Secrets vorhanden, Brevo-Absender freigegeben, SMTP-Login
#                     (ohne Versand), Auth-Istzustand, Schreibrecht des Tokens.
#   Job 2 setzen:     SMTP, dann Vorlagen und Regeln; gesetzte Werte erneut
#                     auslesen; eine Test-E-Mail ueber Brevo-SMTP an die
#                     Kontoadresse des Brevo-Kontos (kein Nutzerkonto).
# Jeder Job braucht eine eigene Freigabe; Job 2 nur, wenn Job 1 alles gruen meldet.
on:
  push:
    branches: [ops/supabase-dev-migrations]
    paths: ['.github/workflows/account-prod-auth-apply.yml', 'ops/production/auth.trigger']
permissions:
  contents: read
  actions: read
concurrency:
  group: account-prod-auth-apply-${{ github.ref_name }}
  cancel-in-progress: false
env:
  SOURCE_SHA: e621636c15cf2dfce8d83d89c441d84a42549150
  REF: qiytbnpoqvldsatpfkeh
  SENDER: konto@visionuniverse.de
jobs:
  istzustand:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: account-dev
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Freigabe pruefen (fail closed)
        env: {GH_TOKEN: '${{ github.token }}', RUN_ID: '${{ github.run_id }}', REPO: '${{ github.repository }}', APPROVER: dennismueller10x-sudo, ENV_NAME: account-dev}
        run: |
          set -euo pipefail
          json=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/approvals")
          ok=$(jq --arg u "$APPROVER" --arg e "$ENV_NAME" '[.[] | select(.state=="approved" and .user.login==$u and any(.environments[]; .name==$e))] | length' <<<"$json")
          [ "$ok" -ge 1 ] || { echo "::error::Keine Freigabe durch $APPROVER fuer $ENV_NAME"; exit 1; }
      - name: Istzustand, Brevo-Absender, SMTP-Login, Schreibrecht (ohne Aenderung, ohne Versand)
        id: check
        env:
          PAT: ${{ secrets.VU_ACCOUNT_SUPABASE_ACCESS_TOKEN }}
          SMTP_LOGIN: ${{ secrets.VU_ACCOUNT_BREVO_SMTP_LOGIN }}
          SMTP_KEY: ${{ secrets.VU_ACCOUNT_BREVO_SMTP_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: |
          set +e -uo pipefail   # Fehler sammeln statt beim ersten abbrechen; Ergebnis am Ende
          ready=true; fail(){ echo "::error::$1"; ready=false; }
          yn(){ [ -n "$1" ] && echo ja || echo nein; }
          echo "Secrets: SMTP-Login=$(yn "$SMTP_LOGIN") SMTP-Schluessel=$(yn "$SMTP_KEY") Zugriffstoken=$(yn "$PAT") Brevo-API=$(yn "$BREVO_API_KEY")"
          [ -n "$SMTP_LOGIN" ] && [ -n "$SMTP_KEY" ] || fail "SMTP-Zugangsdaten fehlen"
          bv(){ curl -s -o "$2" -w '%{http_code}' -H "api-key: $BREVO_API_KEY" -H 'accept: application/json' -H 'User-Agent: VisionUniverse-Brevo/1.0' "https://api.brevo.com/v3$1"; }
          code=$(bv /senders s.json); echo "Brevo-Absender lesbar: $code"
          sender=$(jq -r --arg e "$SENDER" '[.senders[]? | select((.email|ascii_downcase)==$e)][0] | if . then "vorhanden aktiv=\(.active)" else "nicht angelegt" end' s.json 2>/dev/null)
          echo "Absender $SENDER: $sender"
          code=$(bv /senders/domains d.json); domain=$(jq -r '[.domains[]? | select(.domain_name=="visionuniverse.de")][0] | if . then "verifiziert=\(.verified) authentifiziert=\(.authenticated)" else "nicht registriert" end' d.json 2>/dev/null)
          echo "Domain visionuniverse.de: $domain"
          case "$sender" in "vorhanden aktiv=true") ;; *) [[ "$domain" == "verifiziert=true authentifiziert=true" ]] && echo "::warning::$SENDER ist kein eigener Brevo-Absender; Versand stuetzt sich auf die authentifizierte Domain" || fail "Absender $SENDER in Brevo nicht freigegeben";; esac
          rm -f s.json d.json
          # SMTP-Anmeldung pruefen ohne Versand (STARTTLS + AUTH, dann NOOP)
          if curl -s --max-time 30 --ssl-reqd --url smtp://smtp-relay.brevo.com:587 --user "$SMTP_LOGIN:$SMTP_KEY" -X NOOP -o /dev/null; then echo "SMTP-Anmeldung bei smtp-relay.brevo.com:587: OK"; else fail "SMTP-Anmeldung fehlgeschlagen (curl $?)"; fi
          api=https://api.supabase.com/v1/projects/$REF
          code=$(curl -s -o a.json -w '%{http_code}' -H "Authorization: Bearer $PAT" "$api/config/auth"); echo "Auth Config lesen: $code"
          if [ "$code" = 200 ]; then
            echo "Istzustand:"; jq -r '{site_url, uri_allow_list_gesetzt: ((.uri_allow_list // "") != ""), password_min_length, hook_before_user_created_enabled, smtp_host, betreff_bestaetigung_deutsch: ((.mailer_subjects_confirmation // "") | test("Vision Universe"))}' a.json
            code=$(curl -s -o /dev/null -w '%{http_code}' -X PATCH -H "Authorization: Bearer $PAT" -H 'Content-Type: application/json' -d "$(jq -c '{site_url}' a.json)" "$api/config/auth")
            echo "Schreibprobe (unveraenderter Wert): $code"; [ "$code" = 200 ] || fail "Token ohne Schreibrecht"
          else fail "Auth-Konfiguration nicht lesbar"; fi
          rm -f a.json
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          [ "$ready" = true ]

  setzen:
    needs: istzustand
    if: needs.istzustand.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: account-dev
    steps:
      - name: Freigabe pruefen (fail closed)
        env: {GH_TOKEN: '${{ github.token }}', RUN_ID: '${{ github.run_id }}', REPO: '${{ github.repository }}', APPROVER: dennismueller10x-sudo, ENV_NAME: account-dev}
        run: |
          set -euo pipefail
          json=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/approvals")
          ok=$(jq --arg u "$APPROVER" --arg e "$ENV_NAME" '[.[] | select(.state=="approved" and .user.login==$u and any(.environments[]; .name==$e))] | length' <<<"$json")
          [ "$ok" -ge 1 ] || { echo "::error::Keine Freigabe durch $APPROVER fuer $ENV_NAME"; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Auth einstellen (SMTP, dann Vorlagen und Regeln)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.VU_ACCOUNT_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: qiytbnpoqvldsatpfkeh
          VU_ACCOUNT_API_ORIGIN: https://konto.visionuniverse.de
          BREVO_SMTP_LOGIN: ${{ secrets.VU_ACCOUNT_BREVO_SMTP_LOGIN }}
          BREVO_SMTP_KEY: ${{ secrets.VU_ACCOUNT_BREVO_SMTP_KEY }}
          VU_MAIL_SENDER: konto@visionuniverse.de
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          node scripts/account/supabase-auth-config.mjs --production
      - name: Gesetzte Werte auslesen
        env:
          PAT: ${{ secrets.VU_ACCOUNT_SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsS -o a.json -H "Authorization: Bearer $PAT" "https://api.supabase.com/v1/projects/$REF/config/auth"
          jq -r '{site_url, uri_allow_list, mailer_autoconfirm, mailer_secure_email_change_enabled, security_update_password_require_reauthentication, password_min_length, password_required_characters_gesetzt: ((.password_required_characters // "") != ""), refresh_token_rotation_enabled, security_refresh_token_reuse_interval, hook_before_user_created_enabled, hook_before_user_created_uri, smtp_host, smtp_port, smtp_admin_email, smtp_sender_name, smtp_user_gesetzt: ((.smtp_user // "") != ""), rate_limit_email_sent, smtp_max_frequency, mailer_subjects_confirmation, mailer_subjects_recovery, mailer_subjects_email_change, vorlage_link_bestaetigung: ((.mailer_templates_confirmation_content // "") | test("ConfirmationURL")), disable_signup}' a.json
          rm -f a.json
      - name: Test-E-Mail ueber Brevo-SMTP (an die Kontoadresse des Brevo-Kontos)
        env:
          SMTP_LOGIN: ${{ secrets.VU_ACCOUNT_BREVO_SMTP_LOGIN }}
          SMTP_KEY: ${{ secrets.VU_ACCOUNT_BREVO_SMTP_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: |
          set -euo pipefail
          to=$(curl -fsS -H "api-key: $BREVO_API_KEY" -H 'accept: application/json' -H 'User-Agent: VisionUniverse-Brevo/1.0' https://api.brevo.com/v3/account | jq -r '.email // empty')
          [ -n "$to" ] || { echo "::error::Kontoadresse des Brevo-Kontos nicht lesbar"; exit 1; }
          echo "::add-mask::$to"
          id="vu-smtp-$(date -u +%Y%m%dT%H%M%SZ)"
          printf 'From: Vision Universe <%s>\r\nTo: %s\r\nSubject: Vision Universe – SMTP-Test %s\r\nMIME-Version: 1.0\r\nContent-Type: text/plain; charset=utf-8\r\n\r\nTestnachricht der Einrichtung (Supabase Auth ueber Brevo-SMTP).\r\nKennung: %s\r\nKein Handlungsbedarf.\r\n' "$SENDER" "$to" "$id" "$id" > mail.txt
          curl -sS --max-time 60 --ssl-reqd --url smtp://smtp-relay.brevo.com:587 --user "$SMTP_LOGIN:$SMTP_KEY" \
            --mail-from "$SENDER" --mail-rcpt "$to" --upload-file mail.txt
          rm -f mail.txt
          echo "Test-E-Mail angenommen von smtp-relay.brevo.com, Kennung $id (Betreff), Empfaenger: Kontoadresse des Brevo-Kontos."
