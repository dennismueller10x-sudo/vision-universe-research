name: Konten — Supabase Auth Produktion (Ops, vor dem Merge)
# Einmaliger Lauf vor dem Merge von #979: dasselbe Skript wie
# account-production-auth.yml, fester Commit. Job 1 Probelauf, Job 2 setzt -
# jeder Job braucht eine eigene Freigabe. Oeffnet die Registrierung nicht.
# Job 1 dokumentiert den Istzustand und prueft das Schreibrecht des Tokens
# (Schreibprobe mit unveraendertem Wert); Job 2 setzt nur, wenn sie gelingt.
on:
  push:
    branches: [ops/supabase-dev-migrations]
    paths: ['.github/workflows/account-prod-auth-apply.yml', 'ops/production/auth.trigger']
permissions:
  contents: read
  actions: read
concurrency:
  group: account-prod-auth-apply-${{ github.ref_name }}
  cancel-in-progress: false
env:
  SOURCE_SHA: 9b73a44f6e57a65a18132429d5528ee8f3214e9a
jobs:
  istzustand:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: account-dev
    outputs:
      can_write: ${{ steps.probe.outputs.can_write }}
    steps:
      - name: Freigabe pruefen (fail closed)
        env: {GH_TOKEN: '${{ github.token }}', RUN_ID: '${{ github.run_id }}', REPO: '${{ github.repository }}', APPROVER: dennismueller10x-sudo, ENV_NAME: account-dev}
        run: |
          set -euo pipefail
          json=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/approvals")
          ok=$(jq --arg u "$APPROVER" --arg e "$ENV_NAME" '[.[] | select(.state=="approved" and .user.login==$u and any(.environments[]; .name==$e))] | length' <<<"$json")
          [ "$ok" -ge 1 ] || { echo "::error::Keine Freigabe durch $APPROVER fuer $ENV_NAME"; exit 1; }
      - name: Istzustand Auth und Schreibrecht des Tokens (ohne Aenderung)
        id: probe
        env:
          PAT: ${{ secrets.VU_ACCOUNT_SUPABASE_ACCESS_TOKEN }}
          REF: qiytbnpoqvldsatpfkeh
        run: |
          set -uo pipefail
          api=https://api.supabase.com/v1/projects/$REF
          echo "Token-Art: $(case "$PAT" in sbp_fc*) echo scoped;; sbp_*) echo klassisch;; *) echo unbekannt;; esac)"
          echo "Project Settings lesen (GET Projekt): $(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $PAT" "$api")"
          code=$(curl -s -o a.json -w '%{http_code}' -H "Authorization: Bearer $PAT" "$api/config/auth"); echo "Auth Config lesen: $code"
          [ "$code" = 200 ] || { echo "::error::Auth-Konfiguration nicht lesbar"; echo "can_write=false" >> "$GITHUB_OUTPUT"; exit 1; }
          echo "Istzustand:"
          jq -r '{site_url, uri_allow_list_gesetzt: ((.uri_allow_list // "") != ""), mailer_autoconfirm, password_min_length, password_required_characters_gesetzt: ((.password_required_characters // "") != ""), security_update_password_require_reauthentication, hook_before_user_created_enabled, smtp_eigenes: ((.smtp_host // "") != ""), betreff_bestaetigung_deutsch: ((.mailer_subjects_confirmation // "") | test("Vision Universe")), betreff_email_aenderung_deutsch: ((.mailer_subjects_email_change // "") | test("Vision Universe"))}' a.json
          # Schreibprobe ohne Wirkung: denselben site_url-Wert zuruecksenden.
          body=$(jq -c '{site_url}' a.json)
          code=$(curl -s -o w.json -w '%{http_code}' -X PATCH -H "Authorization: Bearer $PAT" -H 'Content-Type: application/json' -d "$body" "$api/config/auth")
          echo "Schreibprobe (unveraenderter Wert): $code $(jq -r '.message // empty' w.json 2>/dev/null | head -c 160)"
          rm -f a.json w.json
          if [ "$code" = 200 ]; then echo "can_write=true" >> "$GITHUB_OUTPUT"; else echo "can_write=false" >> "$GITHUB_OUTPUT"; echo "::warning::Token ohne Schreibrecht (Project Settings + Auth Config, je Read-write) - 'setzen' wird uebersprungen"; fi
  setzen:
    needs: istzustand
    if: needs.istzustand.outputs.can_write == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: account-dev
    steps:
      - name: Freigabe pruefen (fail closed)
        env: {GH_TOKEN: '${{ github.token }}', RUN_ID: '${{ github.run_id }}', REPO: '${{ github.repository }}', APPROVER: dennismueller10x-sudo, ENV_NAME: account-dev}
        run: |
          set -euo pipefail
          json=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/approvals")
          ok=$(jq --arg u "$APPROVER" --arg e "$ENV_NAME" '[.[] | select(.state=="approved" and .user.login==$u and any(.environments[]; .name==$e))] | length' <<<"$json")
          [ "$ok" -ge 1 ] || { echo "::error::Keine Freigabe durch $APPROVER fuer $ENV_NAME"; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Auth einstellen
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.VU_ACCOUNT_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: qiytbnpoqvldsatpfkeh
          VU_ACCOUNT_API_ORIGIN: https://konto.visionuniverse.de
          BREVO_SMTP_LOGIN: ${{ secrets.VU_ACCOUNT_BREVO_SMTP_LOGIN }}
          BREVO_SMTP_KEY: ${{ secrets.VU_ACCOUNT_BREVO_SMTP_KEY }}
          VU_MAIL_SENDER: konto@visionuniverse.de
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          node scripts/account/supabase-auth-config.mjs --production
