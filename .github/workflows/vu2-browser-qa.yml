name: VU2 Browser QA
on:
  pull_request:
    paths:
      - 'vu2/**'
      - 'quant/ui/charts.js'
      - 'quant/technical/app.js'
      - 'quant/api/product-services.js'
      - 'scripts/vu2/**'
      - '.github/workflows/vu2-browser-qa.yml'
permissions:
  contents: read
jobs:
  experience:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test dependency
        run: npm install --prefix /tmp/vu2-qa playwright@1.58.2
      - name: Install Chromium
        run: /tmp/vu2-qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Test desktop and mobile preview
        env:
          NODE_PATH: /tmp/vu2-qa/node_modules
          VU_QA_OUTPUT: /tmp/vu2-screenshots
        run: node scripts/vu2/browser-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vu2-desktop-mobile
          path: /tmp/vu2-screenshots
          retention-days: 14
