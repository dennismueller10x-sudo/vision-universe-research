name: Discover PR149 recovery
on:
  push:
    branches: [codex/discover-extreme-return-hygiene]
    paths: ['.github/workflows/discover-pr149-recovery.yml']
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/discover-extreme-return-hygiene
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate deterministic Discover delivery
        run: node scripts/discover/build-discover-data.mjs
      - name: Commit release artifacts and remove recovery workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add discover/data
          git rm .github/workflows/discover-pr149-recovery.yml
          git commit -m "Complete Discover eligibility release artifacts"
          git push origin HEAD:codex/discover-extreme-return-hygiene
