name: Company Intelligence (isolated preview)
on:
  schedule:
    - cron: '17 */6 * * *'
  pull_request:
    paths: ['company-intelligence/**', 'scripts/company_intelligence/**', 'docs/COMPANY_INTELLIGENCE.md', '.github/workflows/company-intelligence.yml']
  push:
    branches: [main]
    paths: ['company-intelligence/**', 'scripts/company_intelligence/**', 'docs/COMPANY_INTELLIGENCE.md', '.github/workflows/company-intelligence.yml']
  workflow_dispatch:
    inputs:
      acceptance:
        description: 'Isolated authenticated R2 acceptance across three fresh runners; no deployment'
        type: boolean
        default: false
      tickers:
        description: 'Comma-separated master tickers (blank = resumable batch)'
        type: string
        default: 'AAPL,NVDA,TSLA,MSFT,XPEV,PLTR,SOFI,ROOT,U,XYZ,TOST,TGT,AFRM,META,GOOG,GOOGL,ACU,SGI'
      live_sources:
        description: 'Opt in to public feeds, SEC metadata and IR discovery'
        type: boolean
        default: false
      durable_state:
        description: 'Use isolated state in the existing R2 bucket (strict restore; no cache fallback)'
        type: boolean
        default: false
      initialize_state:
        description: 'Explicitly initialize a missing R2 namespace on its first run'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: company-intelligence-state
  cancel-in-progress: false
jobs:
  validate:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Isolated parsers, resolver, failure states and static API
        run: |
          python3 -m unittest discover -s scripts/company_intelligence/tests -v
          node --test scripts/company_intelligence/tests/*.test.mjs
      - name: Existing products and SEC regressions
        run: |
          node --test quant/tests/*.test.mjs discover/tests/*.test.mjs scripts/supertrader/tests/*.test.mjs screener/tests/*.test.mjs
          python3 scripts/quant/cli.py test
          node --test scripts/access-gate/build.test.mjs scripts/vu2/resource-budget.test.mjs ask/tests/*.test.mjs academy/engines/*.test.mjs worker/tests/*.test.mjs
          python3 -m unittest discover -s scripts/vu2 -p 'test_*.py'
      - name: Reject changes to protected production paths
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF"
          changed=$(git diff --name-only "origin/$BASE_REF...HEAD" -- quant discover supertrader screener dashboard providers scripts/quant scripts/universe scripts/market scripts/vu2 api server vercel.json)
          if [ -n "$changed" ]; then echo "$changed"; exit 1; fi
  preview:
    if: always() && ((github.event_name == 'workflow_dispatch' && !inputs.acceptance && needs.validate.result == 'success') || (github.event_name == 'schedule' && vars.COMPANY_INTELLIGENCE_ENABLED == 'true' && vars.COMPANY_INTELLIGENCE_STATE_READY == 'true'))
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate isolated engine before a scheduled batch
        if: github.event_name == 'schedule'
        run: |
          python3 -m unittest discover -s scripts/company_intelligence/tests
          node --test scripts/company_intelligence/tests/*.test.mjs
      - name: Strict durable-state restore (dedicated namespace)
        if: inputs.durable_state || github.event_name == 'schedule'
        env:
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_REGION: ${{ secrets.VU_HISTORY_S3_REGION }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
          INITIALIZE: ${{ inputs.initialize_state }}
          BRANCH: ${{ github.ref_name }}
          STATE_READY: ${{ vars.COMPANY_INTELLIGENCE_STATE_READY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_API: ${{ secrets.CLOUDFLARE_API }}
        run: |
          node scripts/company_intelligence/privacy.mjs
          if [ "$STATE_READY" != true ]; then echo 'Durable state requires verified non-public bucket access and namespace readiness.'; exit 1; fi
          namespace=$(python3 -c 'import hashlib, os; print("branch-" + hashlib.sha256(os.environ["BRANCH"].encode()).hexdigest()[:24])')
          args=(pull --namespace "$namespace" --file "$RUNNER_TEMP/intelligence-state.tar.gz")
          if [ "$INITIALIZE" = true ]; then args+=(--initialize); fi
          node scripts/company_intelligence/sync-state.mjs "${args[@]}"
          if [ -f "$RUNNER_TEMP/intelligence-state.tar.gz" ]; then
            python3 scripts/company_intelligence/checkpoint.py restore --state .company-intelligence --snapshot "$RUNNER_TEMP/intelligence-state.tar.gz"
          fi
      - name: Bounded resumable preview batch
        env:
          TICKERS: ${{ inputs.tickers }}
          LIVE_SOURCES: ${{ inputs.live_sources || github.event_name == 'schedule' }}
          SEC_USER_AGENT: "VisionUniverseResearch info@visionuniverse.de"
        run: |
          if [ '${{ inputs.durable_state }}' != true ] && [ '${{ github.event_name }}' != schedule ]; then echo 'Ephemeral preview only; private state is not retained in GitHub caches or artifacts.'; fi
          args=(backfill --limit 25 --request-budget 160 --max-seconds 480)
          if [ -n "$TICKERS" ]; then args+=(--tickers "$TICKERS"); fi
          if [ "$LIVE_SOURCES" = 'true' ]; then args+=(--network --sec-fetch --sec-documents --discover-ir); fi
          if [ '${{ github.event_name }}' = schedule ]; then
            args=(sec-stream --stream-days 3 --limit 75 --request-budget 160 --max-seconds 480 --network --sec-fetch --sec-documents --sec-document-issuers 4)
          fi
          python3 scripts/company_intelligence/cli.py run --all-offline
          if [ "$LIVE_SOURCES" = true ]; then
            python3 scripts/company_intelligence/cli.py discover-catalogue --network --request-budget 6 --max-seconds 120
            args+=(--discover-sites --materials)
          fi
          python3 scripts/company_intelligence/cli.py "${args[@]}"
          if [ "$LIVE_SOURCES" = true ] && [ -z "$TICKERS" ]; then
            python3 scripts/company_intelligence/cli.py discover-backfill --network --discover-sites --discover-ir --limit 5 --request-budget 30 --max-seconds 120
          fi
      - name: Preserve and verify durable state (also after isolated source failures)
        if: success() && (inputs.durable_state || github.event_name == 'schedule')
        env:
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_REGION: ${{ secrets.VU_HISTORY_S3_REGION }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
          INITIALIZE: ${{ inputs.initialize_state }}
          BRANCH: ${{ github.ref_name }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_API: ${{ secrets.CLOUDFLARE_API }}
        run: |
          node scripts/company_intelligence/privacy.mjs
          python3 scripts/company_intelligence/checkpoint.py pack --state .company-intelligence --snapshot "$RUNNER_TEMP/intelligence-state.tar.gz"
          namespace=$(python3 -c 'import hashlib, os; print("branch-" + hashlib.sha256(os.environ["BRANCH"].encode()).hexdigest()[:24])')
          args=(push --namespace "$namespace" --file "$RUNNER_TEMP/intelligence-state.tar.gz")
          if [ "$INITIALIZE" = true ]; then args+=(--initialize); fi
          node scripts/company_intelligence/sync-state.mjs "${args[@]}"
      - name: Reviewable snapshots and health (no deployment)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: company-intelligence-preview-${{ github.run_id }}
          path: |
            .company-intelligence/public/
            .company-intelligence/latest-run.json
            .company-intelligence/coverage.json
          retention-days: 14
  acceptance-a:
    if: github.event_name == 'workflow_dispatch' && inputs.acceptance
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove private bucket configuration before any state write
        env:
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_REGION: ${{ secrets.VU_HISTORY_S3_REGION }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_API: ${{ secrets.CLOUDFLARE_API }}
        run: node scripts/company_intelligence/privacy.mjs
      - name: Independent durable runner (no cache or state artifact transfer)
        env:
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_REGION: ${{ secrets.VU_HISTORY_S3_REGION }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
          NAMESPACE: acceptance-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          mkdir -p .verification/acceptance
          state="$RUNNER_TEMP/intelligence-a"
          snapshot="$RUNNER_TEMP/acceptance.tar.gz"
          evidence=.verification/acceptance/evidence.json
          node scripts/company_intelligence/sync-state.mjs pull --namespace "$NAMESPACE" --file "$snapshot" --initialize
          if [ -f "$snapshot" ]; then echo 'Acceptance namespace already exists; refuse replacement.'; exit 1; fi
          python3 scripts/company_intelligence/acceptance.py prepare --state "$state" --evidence "$evidence"
          python3 scripts/company_intelligence/checkpoint.py pack --state "$state" --snapshot "$snapshot"
          node scripts/company_intelligence/sync-state.mjs push --namespace "$NAMESPACE" --file "$snapshot" --initialize
      - uses: actions/upload-artifact@v4
        with:
          name: intelligence-acceptance-a-${{ github.run_id }}
          path: .verification/acceptance/evidence.json
          retention-days: 14
  acceptance-b:
    if: github.event_name == 'workflow_dispatch' && inputs.acceptance
    needs: acceptance-a
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recheck non-public bucket before restoring private state
        env:
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_API: ${{ secrets.CLOUDFLARE_API }}
        run: node scripts/company_intelligence/privacy.mjs
      - uses: actions/download-artifact@v4
        with:
          name: intelligence-acceptance-a-${{ github.run_id }}
          path: .verification/acceptance
      - name: Independent durable runner (no cache or state artifact transfer)
        env:
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_REGION: ${{ secrets.VU_HISTORY_S3_REGION }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
          NAMESPACE: acceptance-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          mkdir -p .verification/acceptance
          state="$RUNNER_TEMP/intelligence-b"
          snapshot="$RUNNER_TEMP/acceptance.tar.gz"
          evidence=.verification/acceptance/evidence.json
          node scripts/company_intelligence/sync-state.mjs pull --namespace "$NAMESPACE" --file "$snapshot"
          python3 scripts/company_intelligence/checkpoint.py restore --state "$state" --snapshot "$snapshot"
          python3 scripts/company_intelligence/acceptance.py advance --state "$state" --evidence "$evidence"
          python3 scripts/company_intelligence/checkpoint.py pack --state "$state" --snapshot "$snapshot"
          node scripts/company_intelligence/sync-state.mjs push --namespace "$NAMESPACE" --file "$snapshot"
      - uses: actions/upload-artifact@v4
        with:
          name: intelligence-acceptance-b-${{ github.run_id }}
          path: .verification/acceptance/evidence.json
          retention-days: 14
  acceptance-c:
    if: github.event_name == 'workflow_dispatch' && inputs.acceptance
    needs: acceptance-b
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recheck non-public bucket before restoring private state
        env:
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_API: ${{ secrets.CLOUDFLARE_API }}
        run: node scripts/company_intelligence/privacy.mjs
      - uses: actions/download-artifact@v4
        with:
          name: intelligence-acceptance-b-${{ github.run_id }}
          path: .verification/acceptance
      - name: Independent durable runner (no cache or state artifact transfer)
        env:
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_REGION: ${{ secrets.VU_HISTORY_S3_REGION }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
          NAMESPACE: acceptance-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          mkdir -p .verification/acceptance
          state="$RUNNER_TEMP/intelligence-c"
          snapshot="$RUNNER_TEMP/acceptance.tar.gz"
          evidence=.verification/acceptance/evidence.json
          node scripts/company_intelligence/sync-state.mjs pull --namespace "$NAMESPACE" --file "$snapshot"
          python3 scripts/company_intelligence/checkpoint.py restore --state "$state" --snapshot "$snapshot"
          python3 scripts/company_intelligence/acceptance.py verify --state "$state" --evidence "$evidence"
      - uses: actions/upload-artifact@v4
        with:
          name: intelligence-acceptance-c-${{ github.run_id }}
          path: .verification/acceptance/evidence.json
          retention-days: 14
