name: Company Intelligence (isolated preview)
on:
  # Legacy isolated lanes are dispatch-only; production has one scoped scheduler.
  pull_request:
    paths: ['company-intelligence/**', 'scripts/company_intelligence/**', 'docs/COMPANY_INTELLIGENCE.md', '.github/workflows/company-intelligence.yml']
  push:
    branches: [main]
    paths: ['company-intelligence/**', 'scripts/company_intelligence/**', 'docs/COMPANY_INTELLIGENCE.md', '.github/workflows/company-intelligence.yml']
  workflow_dispatch:
    inputs:
      continuous_refresh:
        description: 'Scoped autonomous refresh: verify isolated state or publish on main only'
        type: choice
        options: [none, verify, publish, full-qa]
        default: none
      production_release:
        description: 'Approved exact cohort: validate or publish consumer only; fresh accepted R2 restore, no crawl or polling'
        type: choice
        options: [none, validate, publish, enable, disable, numeric]
        default: none
      accepted_handoff:
        description: "Exact recovered checkpoint: issue encrypted bounded PUT or accept and fresh restore; no crawl/deploy"
        type: choice
        options: [none, issue, accept]
        default: none
      current_restore_only:
        description: 'Read-only exact current-state R2 restore; no initialization, polling, upload or deployment'
        type: boolean
        default: false
      consumer_review:
        description: 'Read-only current restore plus live delivery audit and protected V1/V2 browser review; no state writes'
        type: choice
        options: [none, before, after]
        default: none
      pilot:
        description: 'Controlled cohort: fresh-runner private restore, incremental update, verified consumer publication; no public gate change'
        type: boolean
        default: false
      pilot_initialize:
        description: 'Explicit first-run initialization of the dedicated pilot namespace'
        type: boolean
        default: false
      pilot_network:
        description: 'Bounded public feed polling during the controlled pilot'
        type: boolean
        default: false
      acceptance:
        description: 'Isolated authenticated R2 acceptance across three fresh runners; no deployment'
        type: boolean
        default: false
      acceptance_universe:
        description: 'Use the actual entire master and existing facts in private acceptance; zero external-source polling'
        type: boolean
        default: false
      tickers:
        description: 'Comma-separated master tickers (blank = resumable batch)'
        type: string
        default: 'AAPL,NVDA,TSLA,MSFT,XPEV,PLTR,SOFI,ROOT,U,XYZ,TOST,TGT,AFRM,META,GOOG,GOOGL,ACU,SGI'
      live_sources:
        description: 'Opt in to public feeds, SEC metadata and IR discovery'
        type: boolean
        default: false
      durable_state:
        description: 'Use isolated state in the existing R2 bucket (strict restore; no cache fallback)'
        type: boolean
        default: false
      initialize_state:
        description: 'Explicitly initialize a missing R2 namespace on its first run'
        type: boolean
        default: false
permissions:
  contents: read
# PR-Laeufe bekommen eine eigene Gruppe je PR. Die gemeinsame Gruppe
# 'company-intelligence-state' bleibt den Laeufen vorbehalten, die sie brauchen (main,
# Zeitplan, Dispatch). Vorher konnte ein wartender PR-Lauf einen
# wartenden Lauf dieser Gruppe verdraengen (Audit 03.10.2026).
concurrency:
  # Consumer-only release jobs read the frozen accepted checkpoint and serialize
  # their own namespace. They neither evict nor write the private polling state.
  group: ${{ github.event_name == 'pull_request' && format('company-intelligence-state-pr-{0}', github.event.pull_request.number) || inputs.continuous_refresh == 'verify' && format('company-intelligence-acceptance-{0}', github.run_id) || inputs.continuous_refresh == 'full-qa' && format('company-intelligence-full-qa-{0}', github.run_id) || inputs.production_release != '' && inputs.production_release != 'none' && 'company-intelligence-consumer-production-d700d480d9b2858eb8fa34f4' || inputs.current_restore_only && format('company-intelligence-read-only-{0}', github.run_id) || 'company-intelligence-state' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  continuous-full-qa:
    # Read only actual production. Market-data Pages runs must not evict this
    # full structural acceptance; no source/R2 writer or deployment is involved.
    if: github.event_name == 'workflow_dispatch' && inputs.continuous_refresh == 'full-qa'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Existing full browser runtime
        run: |
          npm install --prefix /tmp/ci-full-qa --no-audit --no-fund playwright@1.55.0
          node scripts/company_intelligence/install-browser-deps.mjs /tmp/ci-full-qa/node_modules/.bin/playwright
      - name: All real production stocks, viewports and themes
        env:
          NODE_PATH: /tmp/ci-full-qa/node_modules
          RESEARCH_ACCESS_PASSWORD: ${{ secrets.RESEARCH_ACCESS_PASSWORD }}
        run: |
          node scripts/company_intelligence/protected-hydration-qa.mjs
          node scripts/company_intelligence/live-production-qa.mjs --out "$RUNNER_TEMP/full-qa/fast"
          node scripts/company_intelligence/discover-beta-qa.mjs --url https://research.visionuniverse.de --candidate docs/company-intelligence/full-data-release-candidate.json --production --phase actual --out "$RUNNER_TEMP/full-qa/cohort"
          node scripts/company_intelligence/discover-beta-qa.mjs --url https://research.visionuniverse.de --candidate docs/company-intelligence/full-data-release-candidate.json --production --phase dark --out "$RUNNER_TEMP/full-qa/dark"
          node scripts/company_intelligence/consumer-experience-qa.mjs --version after --out "$RUNNER_TEMP/full-qa/v2"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: continuous-full-production-qa-${{ github.run_id }}
          path: ${{ runner.temp }}/full-qa/
          retention-days: 14
  continuous:
    if: github.event_name == 'workflow_dispatch' && inputs.continuous_refresh == 'publish'
    needs: validate
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/company-intelligence-refresh.yml
    with:
      verification: false
    secrets: inherit
  continuous-verify:
    # Isolated namespace acceptance has no production side effects. Full product
    # regression validation runs independently and still gates publication/merge.
    if: github.event_name == 'workflow_dispatch' && inputs.continuous_refresh == 'verify'
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/company-intelligence-refresh.yml
    with:
      verification: true
    secrets: inherit
  production-numeric:
    if: github.event_name == 'workflow_dispatch' && inputs.production_release == 'numeric' && !inputs.current_restore_only && !inputs.acceptance && !inputs.pilot && (inputs.accepted_handoff == '' || inputs.accepted_handoff == 'none')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Three targeted existing-provider prices and SEC share disclosures; no state write
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
        run: node scripts/company_intelligence/numeric-band-review.mjs --evidence "$RUNNER_TEMP/numeric-band-review.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: numeric-band-review-${{ github.run_id }}
          path: ${{ runner.temp }}/numeric-band-review.json
          retention-days: 14
  production-gate:
    if: github.event_name == 'workflow_dispatch' && (inputs.production_release == 'enable' || inputs.production_release == 'disable') && !inputs.current_restore_only && !inputs.acceptance && !inputs.pilot && (inputs.accepted_handoff == '' || inputs.accepted_handoff == 'none')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact verified consumer gate only; accepted private checkpoint is untouched
        env:
          MODE: ${{ inputs.production_release }}
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_REGION: ${{ secrets.VU_HISTORY_S3_REGION }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
        run: node scripts/company_intelligence/production-release.mjs "$MODE"
  production-consumer:
    if: github.event_name == 'workflow_dispatch' && (inputs.production_release == 'validate' || inputs.production_release == 'publish') && !inputs.current_restore_only && !inputs.acceptance && !inputs.pilot && (inputs.accepted_handoff == '' || inputs.accepted_handoff == 'none')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/checkout@v4
        with:
          ref: abbea154a90ffece598e494530eea38661a20a95
          path: .accepted-engine
      - uses: actions/checkout@v4
        with:
          ref: 5a3ca18d3099df1f916e922e409aa01cb4a33436
          path: .accepted-original-engine
      - name: Verify private R2 and restore authoritative accepted checkpoint only
        env:
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_REGION: ${{ secrets.VU_HISTORY_S3_REGION }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_API: ${{ secrets.CLOUDFLARE_API }}
        run: |
          node scripts/company_intelligence/privacy.mjs
          node scripts/company_intelligence/sync-state.mjs pull --namespace accepted-20261006-21cc611a43b06f488418b58a --file "$RUNNER_TEMP/accepted.tar.gz"
          python3 scripts/company_intelligence/accepted_state_verify.py --snapshot "$RUNNER_TEMP/accepted.tar.gz" --state "$RUNNER_TEMP/accepted-state" --engine "$GITHUB_WORKSPACE/.accepted-engine" --original-engine "$GITHUB_WORKSPACE/.accepted-original-engine" --expected company-intelligence/config/accepted-state-handoff.json --evidence "$RUNNER_TEMP/production-restore.json"
          python3 scripts/company_intelligence/verify_consumer_handoff.py --state "$RUNNER_TEMP/accepted-state" --consumer "$RUNNER_TEMP/production-consumer" --evidence "$RUNNER_TEMP/production-restore.json"
      - name: Targeted current numeric mid, small and micro band review
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
        run: node scripts/company_intelligence/numeric-band-review.mjs --evidence "$RUNNER_TEMP/numeric-band-review.json"
      - name: Final actual Discover cohort on packaged candidate before publication
        env:
          NODE_PATH: /tmp/company-intelligence-qa/node_modules
        run: |
          npm install --prefix /tmp/company-intelligence-qa --no-audit --no-fund playwright@1.55.0
          /tmp/company-intelligence-qa/node_modules/.bin/playwright install --with-deps chromium
          node scripts/vu2/build-release.mjs --output="$RUNNER_TEMP/production-site"
          node scripts/company_intelligence/stage-discover-preview.mjs --consumer "$RUNNER_TEMP/production-consumer" --release "$RUNNER_TEMP/production-site"
          python3 -m http.server 8793 --bind 127.0.0.1 --directory "$RUNNER_TEMP/production-site" > "$RUNNER_TEMP/production-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          node scripts/company_intelligence/discover-beta-qa.mjs --production --url http://127.0.0.1:8793 --candidate docs/company-intelligence/full-data-release-candidate.json --phase actual --out "$RUNNER_TEMP/production-cohort-qa"
          node scripts/company_intelligence/discover-beta-qa.mjs --production --url http://127.0.0.1:8793 --candidate docs/company-intelligence/full-data-release-candidate.json --phase dark --out "$RUNNER_TEMP/production-dark-qa"
      - name: Preserve full content derivative separately and prove fresh R2 restore
        if: inputs.production_release == 'publish'
        env:
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_REGION: ${{ secrets.VU_HISTORY_S3_REGION }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
        run: |
          namespace=$(python3 -c 'import json; print(json.load(open("'"$RUNNER_TEMP"'/production-restore.json"))["contentAugmentation"]["namespace"])')
          case "$namespace" in content-top46-*) ;; *) exit 1 ;; esac
          python3 - <<'PY'
          import json,os,sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from company_intelligence.store import atomic_json
          root=Path(os.environ['RUNNER_TEMP'])
          content=json.loads((root/'production-restore.json').read_text())['contentAugmentation']
          path=root/'accepted-state/latest-run.json'
          prior=json.loads(path.read_text())
          assert prior['export']['generation']=='21cc611a43b06f488418b58a'
          atomic_json(path,{'generatedAt':content['asOf'],'export':content['export'],'contentReviewHash':content['reviewHash'],'basis':'FULL_ACCEPTED_STATE_PLUS_REVIEWED_TOP46_CONTENT','acceptedBaselineRun':prior})
          PY
          python3 scripts/company_intelligence/checkpoint.py pack --state "$RUNNER_TEMP/accepted-state" --snapshot "$RUNNER_TEMP/content-state.tar.gz" > "$RUNNER_TEMP/content-backup.json"
          node scripts/company_intelligence/sync-state.mjs push --namespace "$namespace" --file "$RUNNER_TEMP/content-state.tar.gz" --initialize > "$RUNNER_TEMP/content-remote-preservation.json"
          node scripts/company_intelligence/sync-state.mjs pull --namespace "$namespace" --file "$RUNNER_TEMP/content-fresh.tar.gz" > "$RUNNER_TEMP/content-remote-readback.json"
          digest=$(python3 -c 'import json; print(json.load(open("'"$RUNNER_TEMP"'/content-backup.json"))["sha256"])')
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          expected=json.loads((root/'content-backup.json').read_text())
          actual=json.loads((root/'content-remote-readback.json').read_text())
          assert actual['status']=='RESTORED' and actual['sha256']==expected['sha256'] and actual['bytes']==expected['bytes']
          PY
          python3 scripts/company_intelligence/checkpoint.py restore --snapshot "$RUNNER_TEMP/content-fresh.tar.gz" --state "$RUNNER_TEMP/content-genuinely-fresh-state" --sha256 "$digest"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          content=json.loads((root/'production-restore.json').read_text())['contentAugmentation']
          restored=json.loads((root/'content-genuinely-fresh-state/latest-run.json').read_text())
          assert restored['export']==content['export'] and restored['contentReviewHash']==content['reviewHash'] and restored['generatedAt']==content['asOf']
          assert restored['acceptedBaselineRun']['export']['generation']=='21cc611a43b06f488418b58a'
          PY
          cp "$RUNNER_TEMP/production-restore.json" "$RUNNER_TEMP/content-fresh-restore-evidence.json"
          python3 scripts/company_intelligence/verify_consumer_handoff.py --state "$RUNNER_TEMP/content-genuinely-fresh-state" --consumer "$RUNNER_TEMP/production-content-fresh-consumer" --evidence "$RUNNER_TEMP/content-fresh-restore-evidence.json"
          # Read back the immutable baseline again; this release never writes it.
          node scripts/company_intelligence/sync-state.mjs pull --namespace accepted-20261006-21cc611a43b06f488418b58a --file "$RUNNER_TEMP/accepted-after-content.tar.gz" > "$RUNNER_TEMP/accepted-after-content-readback.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          value=json.loads((Path(os.environ['RUNNER_TEMP'])/'accepted-after-content-readback.json').read_text())
          assert value['status']=='RESTORED' and value['sha256']=='2368931508ec869fed1246733465b15dd550a6bcaec1d2154aed2359cb7ba6f9'
          PY
      - name: Approved immutable consumer publication and independent read-back
        if: inputs.production_release == 'publish'
        env:
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_REGION: ${{ secrets.VU_HISTORY_S3_REGION }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
        run: |
          node scripts/company_intelligence/production-release.mjs publish --directory "$RUNNER_TEMP/production-content-fresh-consumer" > "$RUNNER_TEMP/production-publication.json"
          node --input-type=module <<'NODE'
          import {verifyProductionConsumer} from './scripts/company_intelligence/production-release.mjs';
          import {createS3DriverFromEnv} from './scripts/market/storage/s3-driver.mjs';
          import {mkdirSync} from 'node:fs';
          const release=process.env.RUNNER_TEMP+'/production-read-back';mkdirSync(release);
          console.log(JSON.stringify(await verifyProductionConsumer(createS3DriverFromEnv(),release)));
          NODE
      - name: Counts, hashes, numeric QA and consumer-safe screenshots only
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: controlled-production-acceptance-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/production-restore.json
            ${{ runner.temp }}/numeric-band-review.json
            ${{ runner.temp }}/production-publication.json
            ${{ runner.temp }}/content-backup.json
            ${{ runner.temp }}/content-remote-preservation.json
            ${{ runner.temp }}/content-remote-readback.json
            ${{ runner.temp }}/content-fresh-restore-evidence.json
            ${{ runner.temp }}/accepted-after-content-readback.json
            ${{ runner.temp }}/production-read-back/company-intelligence-delivery.json
            ${{ runner.temp }}/production-cohort-qa/
            ${{ runner.temp }}/production-dark-qa/
          retention-days: 14
  validate:
    if: github.event_name != 'schedule' && !inputs.current_restore_only && inputs.production_release != 'disable' && inputs.production_release != 'enable' && inputs.production_release != 'numeric' && (inputs.accepted_handoff == '' || inputs.accepted_handoff == 'none')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Keep complete ancestry for the independent baseline; only historic
          # file bodies are lazy. Current and baseline files remain exact.
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Isolated parsers, resolver, failure states and static API
        run: |
          python3 -m unittest discover -s scripts/company_intelligence/tests -v
          node --test scripts/company_intelligence/tests/*.test.mjs
      - name: Existing products and SEC regressions
        env:
          PRODUCTION_RELEASE_MODE: ${{ inputs.production_release }}
        run: |
          if [ "$PRODUCTION_RELEASE_MODE" = validate ] || [ "$PRODUCTION_RELEASE_MODE" = publish ] || [ -f company-intelligence/config/top46-content-review.json ]; then
            node scripts/company_intelligence/classify-production-regressions.mjs
          else
            node --test quant/tests/*.test.mjs discover/tests/*.test.mjs scripts/supertrader/tests/*.test.mjs screener/tests/*.test.mjs
          fi
          python3 scripts/quant/cli.py test
          node --test scripts/access-gate/build.test.mjs scripts/vu2/resource-budget.test.mjs ask/tests/*.test.mjs academy/engines/*.test.mjs worker/tests/*.test.mjs
          python3 -m unittest discover -s scripts/vu2 -p 'test_*.py'
      - name: Reject changes to protected production paths
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF"
          changed=$(git diff --name-only "origin/$BASE_REF...HEAD" -- quant discover supertrader screener dashboard providers scripts/quant scripts/universe scripts/market scripts/vu2 api server vercel.json)
          # Stock-page hooks shift audit line references; findings must remain identical.
          python3 - <<'PY_AUDIT'
          import json, os, subprocess
          from pathlib import Path
          path = 'quant/data/market/fx/currency-debt-register.json'
          old = json.loads(subprocess.check_output(['git', 'show', 'origin/' + os.environ['BASE_REF'] + ':' + path]))
          new = json.loads(Path(path).read_text())
          assert len(old['entries']) == len(new['entries'])
          for a, b in zip(old['entries'], new['entries']):
              if a != b:
                  assert a['file'] == b['file'] == 'discover/ui/detail.js'
                  a.pop('line'); b.pop('line')
          assert old == new, 'Currency audit findings changed beyond source-line references'
          PY_AUDIT
          unexpected=$(printf '%s\n' "$changed" | sed '/^quant\/index.html$/d; /^quant\/app\/page-stock.js$/d; /^quant\/data\/market\/fx\/currency-debt-register.json$/d; /^discover\/index.html$/d; /^discover\/ui\/detail.js$/d;  /^$/d')
          if [ -n "$unexpected" ]; then echo "$unexpected"; exit 1; fi
  preview:
    if: always() && (inputs.continuous_refresh == '' || inputs.continuous_refresh == 'none') && !inputs.current_restore_only && (inputs.production_release == '' || inputs.production_release == 'none') && (inputs.accepted_handoff == '' || inputs.accepted_handoff == 'none') && ((github.event_name == 'workflow_dispatch' && !inputs.acceptance && !inputs.pilot && needs.validate.result == 'success') || (github.event_name == 'schedule' && github.event.schedule == '17 */4 * * *' && vars.COMPANY_INTELLIGENCE_ENABLED == 'true' && vars.COMPANY_INTELLIGENCE_PILOT_ENABLED != 'true' && vars.COMPANY_INTELLIGENCE_STATE_READY == 'true'))
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate isolated engine before a scheduled batch
        if: github.event_name == 'schedule'
        run: |
          python3 -m unittest discover -s scripts/company_intelligence/tests
          node --test scripts/company_intelligence/tests/*.test.mjs
      - name: Strict durable-state restore (dedicated namespace)
        if: inputs.durable_state || github.event_name == 'schedule'
        env:
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_REGION: ${{ secrets.VU_HISTORY_S3_REGION }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
          INITIALIZE: ${{ inputs.initialize_state }}
          BRANCH: ${{ github.ref_name }}
          STATE_READY: ${{ vars.COMPANY_INTELLIGENCE_STATE_READY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_API: ${{ secrets.CLOUDFLARE_API }}
        run: |
          node scripts/company_intelligence/privacy.mjs
          if [ "$STATE_READY" != true ]; then echo 'Durable state requires verified non-public bucket access and namespace readiness.'; exit 1; fi
          namespace=$(python3 -c 'import hashlib, os; print("branch-" + hashlib.sha256(os.environ["BRANCH"].encode()).hexdigest()[:24])')
          args=(pull --namespace "$namespace" --file "$RUNNER_TEMP/intelligence-state.tar.gz")
          if [ "$INITIALIZE" = true ]; then args+=(--initialize); fi
          node scripts/company_intelligence/sync-state.mjs "${args[@]}"
          if [ -f "$RUNNER_TEMP/intelligence-state.tar.gz" ]; then
            python3 scripts/company_intelligence/checkpoint.py restore --state .company-intelligence --snapshot "$RUNNER_TEMP/intelligence-state.tar.gz"
          fi
      - name: Bounded resumable preview batch
        env:
          TICKERS: ${{ inputs.tickers }}
          LIVE_SOURCES: ${{ inputs.live_sources || github.event_name == 'schedule' }}
          SEC_USER_AGENT: "VisionUniverseResearch info@visionuniverse.de"
          IN_DURABLE_STATE: ${{ inputs.durable_state }}
        run: |
          if [ "$IN_DURABLE_STATE" != true ] && [ '${{ github.event_name }}' != schedule ]; then echo 'Ephemeral preview only; private state is not retained in GitHub caches or artifacts.'; fi
          args=(backfill --limit 25 --request-budget 160 --max-seconds 480)
          if [ -n "$TICKERS" ]; then args+=(--tickers "$TICKERS"); fi
          if [ "$LIVE_SOURCES" = 'true' ]; then args+=(--network --sec-fetch --sec-documents --discover-ir); fi
          if [ '${{ github.event_name }}' = schedule ]; then
            args=(sec-stream --stream-days 3 --limit 75 --request-budget 160 --max-seconds 480 --network --sec-fetch --sec-documents --sec-document-issuers 4)
          fi
          python3 scripts/company_intelligence/cli.py run --all-offline
          if [ "$LIVE_SOURCES" = true ]; then
            python3 scripts/company_intelligence/cli.py discover-catalogue --network --request-budget 6 --max-seconds 120
            args+=(--discover-sites --materials)
          fi
          python3 scripts/company_intelligence/cli.py "${args[@]}"
          if [ "$LIVE_SOURCES" = true ] && [ -z "$TICKERS" ]; then
            python3 scripts/company_intelligence/cli.py discover-backfill --network --discover-sites --discover-ir --limit 5 --request-budget 30 --max-seconds 120
          fi
      - name: Preserve and verify durable state (also after isolated source failures)
        if: success() && (inputs.durable_state || github.event_name == 'schedule')
        env:
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_REGION: ${{ secrets.VU_HISTORY_S3_REGION }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
          INITIALIZE: ${{ inputs.initialize_state }}
          BRANCH: ${{ github.ref_name }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_API: ${{ secrets.CLOUDFLARE_API }}
        run: |
          node scripts/company_intelligence/privacy.mjs
          python3 scripts/company_intelligence/checkpoint.py pack --state .company-intelligence --snapshot "$RUNNER_TEMP/intelligence-state.tar.gz"
          namespace=$(python3 -c 'import hashlib, os; print("branch-" + hashlib.sha256(os.environ["BRANCH"].encode()).hexdigest()[:24])')
          args=(push --namespace "$namespace" --file "$RUNNER_TEMP/intelligence-state.tar.gz")
          if [ "$INITIALIZE" = true ]; then args+=(--initialize); fi
          node scripts/company_intelligence/sync-state.mjs "${args[@]}"
      - name: Reviewable snapshots and health (no deployment)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: company-intelligence-preview-${{ github.run_id }}
          path: |
            .company-intelligence/public/
            .company-intelligence/latest-run.json
            .company-intelligence/coverage.json
          retention-days: 14
  current-state-restore:
