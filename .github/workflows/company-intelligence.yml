          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_API: ${{ secrets.CLOUDFLARE_API }}
        run: |
          node scripts/company_intelligence/privacy.mjs
          namespace=$(python3 -c 'import json; print(json.load(open("company-intelligence/config/accepted-state-handoff.json"))["namespace"])')
          node scripts/company_intelligence/sync-state.mjs pull --namespace "$namespace" --file "$RUNNER_TEMP/current-state.tar.gz"
      - name: Fresh exact accepted restore and both pinned producer exports
        run: |
          python3 scripts/company_intelligence/accepted_state_verify.py \
