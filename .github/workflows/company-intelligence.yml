            --engine "$GITHUB_WORKSPACE/.accepted-engine" --original-engine "$GITHUB_WORKSPACE/.accepted-original-engine" \
            --expected company-intelligence/config/accepted-state-handoff.json \
            --evidence "$RUNNER_TEMP/current-restore-evidence.json"
      - name: Reproduce exact reviewed consumer cohort from the fresh private R2 restore
        run: |
          python3 scripts/company_intelligence/verify_consumer_handoff.py --state "$RUNNER_TEMP/current-fresh-state" --consumer "$RUNNER_TEMP/fresh-consumer-cohort" --evidence "$RUNNER_TEMP/current-restore-evidence.json"
      - name: Audit accepted ledger through all live consumer assets; counts only
        if: inputs.consumer_review != '' && inputs.consumer_review != 'none'
        run: |
          python3 scripts/company_intelligence/consumer_delivery_audit.py --state "$RUNNER_TEMP/current-fresh-state" \
            --raw "$RUNNER_TEMP/current-fresh-state/public/company-intelligence/data" --consumer "$RUNNER_TEMP/fresh-consumer-cohort" \
            --origin https://research.visionuniverse.de --out "$RUNNER_TEMP/consumer-review/delivery-audit.json"
      - name: Protected real production browser review; no query opt-in
        if: inputs.consumer_review != '' && inputs.consumer_review != 'none'
        env:
          RESEARCH_ACCESS_PASSWORD: ${{ secrets.RESEARCH_ACCESS_PASSWORD }}
          NODE_PATH: /tmp/consumer-review/node_modules
          REVIEW_VERSION: ${{ inputs.consumer_review }}
        run: |
          npm install --prefix /tmp/consumer-review playwright@1.51.1 --no-audit --no-fund
          node scripts/company_intelligence/install-browser-deps.mjs /tmp/consumer-review/node_modules/.bin/playwright
          # Manual after-review is read-only and has its own concurrency group.
          # It must not be displaced by a newer scheduled market-data deployment.
          if [ "$REVIEW_VERSION" = after ]; then
            node scripts/company_intelligence/live-production-qa.mjs --out "$RUNNER_TEMP/consumer-review/production-fast"
            node scripts/company_intelligence/discover-beta-qa.mjs --url https://research.visionuniverse.de --candidate docs/company-intelligence/full-data-release-candidate.json --production --phase actual --out "$RUNNER_TEMP/consumer-review/discover-quant"
            node scripts/company_intelligence/discover-beta-qa.mjs --url https://research.visionuniverse.de --candidate docs/company-intelligence/full-data-release-candidate.json --production --phase dark --out "$RUNNER_TEMP/consumer-review/dark"
          fi
          node scripts/company_intelligence/consumer-experience-qa.mjs --version "$REVIEW_VERSION" --out "$RUNNER_TEMP/consumer-review/browser"
      - name: Public-safe aggregate audit and protected browser evidence only
        if: always() && inputs.consumer_review != '' && inputs.consumer_review != 'none'
        uses: actions/upload-artifact@v4
        with:
          name: consumer-review-${{ inputs.consumer_review }}-${{ github.run_id }}
          path: ${{ runner.temp }}/consumer-review/
          retention-days: 14
      - name: Hashes and counts only; no checkpoint, ledger or source-health artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-state-restore-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/current-restore-evidence.json
          retention-days: 14

