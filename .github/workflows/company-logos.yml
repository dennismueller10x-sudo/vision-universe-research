name: Firmenlogos (Wikimedia Commons fuer Discover)

# Laedt je Titel des Discover-Universums hoechstens ein Firmenlogo aus
# Wikimedia Commons - zugeordnet ueber die SEC-CIK (Wikidata P5531), sonst
# ueber Ticker + Boerse mit Namensabgleich - und nur, wenn die Commons-Datei
# gemeinfrei ist oder unter CC0, CC BY oder CC BY-SA steht. Urheber und
# Lizenz landen je Titel in discover/logos/credits.json und stehen auf der
# Aktienseite (scripts/discover/build-company-logos.mjs).
#
# Die Laufzeitumgebung der Entwicklung erreicht Wikimedia nicht; der Abruf
# laeuft deshalb hier. Aendert nichts ausser discover/logos/.
#
# Ausloeser: Dispatch, woechentlich montags, oder ein Push mit der Marke
# `[company-logos]`.

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'
  push:
    branches:
      - 'claude/**'

permissions:
  contents: write

concurrency:
  group: company-logos
  cancel-in-progress: false

jobs:
  logos:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[company-logos]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Logos aus Wikimedia Commons (nur freie Lizenzen)
        run: node scripts/discover/build-company-logos.mjs

      - name: Pruefung (Zuordnung, Lizenzen, jede Datei belegt)
        run: node --test discover/tests/company-logos.test.mjs

      - name: Commit und Push
        run: |
          git config user.name "vision-universe-bot"
          git config user.email "bot@visionuniverse.de"
          git add -A discover/logos
          if git diff --cached --quiet; then echo "Keine Aenderung."; exit 0; fi
          Z=$(node -e 'const s=require("./discover/logos/summary.json"); console.log(s.withLogo+"/"+s.universe+" ("+s.pct+" %)")')
          git commit -m "Firmenlogos: $Z Titel mit Logo aus Wikimedia Commons"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin HEAD:"${{ github.ref_name }}"

      - name: Zusammenfassung
        if: always()
        run: |
          {
            echo '### Firmenlogos'
            echo ''
            if [ -f discover/logos/summary.json ]; then
              node -e 'const s=require("./discover/logos/summary.json"); console.log("| Kennzahl | Wert |"); console.log("|---|---|"); console.log("| Universum | "+s.universe+" |"); console.log("| mit Logo | "+s.withLogo+" ("+s.pct+" %) |"); console.log("| neu geladen | "+s.downloaded+" |"); console.log("| nach Zuordnung | "+JSON.stringify(s.byVia)+" |"); console.log("| nach Lizenz | "+JSON.stringify(s.byLicense)+" |"); console.log("| ohne Logo | "+JSON.stringify(s.excluded)+" |");'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
