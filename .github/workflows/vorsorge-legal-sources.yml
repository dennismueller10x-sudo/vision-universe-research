name: Vorsorge Rechtsquellen (Primaertexte fuer die Foerderregeln)

# Laedt die amtlichen Primaerquellen der Foerderregeln (Bundesgesetzblatt,
# BMF, Bundestag), legt Text, Hash und Abrufzeit unter
# vorsorge/data/funding-rules/sources/ ab und committet sie. Amtliche Werke
# sind gemeinfrei (§ 5 UrhG). Erst mit diesem Text darf eine Regeldatei
# primaryVerified = true tragen - und nur fuer Werte, die woertlich darin
# stehen.
#
# Ausloesung: Push auf claude/** mit [vorsorge-legal] in der Commit-Nachricht
# oder workflow_dispatch.

on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/vorsorge-legal-sources.yml', 'scripts/vorsorge/fetch-legal-sources.sh']

permissions:
  contents: write

concurrency:
  group: vorsorge-legal-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[vorsorge-legal]')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Werkzeug
        run: sudo apt-get install -y -qq poppler-utils > /dev/null
      - name: Primaerquellen laden
        run: bash scripts/vorsorge/fetch-legal-sources.sh
      - name: Veroeffentlichen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vorsorge/data/funding-rules/sources
          git commit -q -m "Vorsorge: Primaerquellen der Foerderregeln geladen (Lauf ${{ github.run_id }})" || { echo "Keine Aenderung."; exit 0; }
          bash scripts/ci/push-with-retry.sh "${{ github.ref_name }}"
