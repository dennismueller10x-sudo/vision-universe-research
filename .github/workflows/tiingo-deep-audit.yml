name: Tiingo deep audit (isolated read-only evidence)
on:
  push:
    branches: [codex/tiingo-deep-audit-20261002]
    paths:
      - '.github/workflows/tiingo-deep-audit.yml'
      - 'audits/tiingo-2026-10-02/runtime/probe.py'
      - 'audits/tiingo-2026-10-02/*/probes.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tiingo-deep-audit-read-only
  cancel-in-progress: false
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Bounded account evidence (no production writes)
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
        run: python audits/tiingo-2026-10-02/runtime/probe.py --out "$RUNNER_TEMP/tiingo-audit"
      - name: Ensure tracked production baseline remains untouched
        run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tiingo-deep-account-evidence
          path: ${{ runner.temp }}/tiingo-audit/account_evidence.json
          retention-days: 30
          if-no-files-found: error
