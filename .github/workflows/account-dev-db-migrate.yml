name: Konten — Dev-Datenbank migrieren (vision-universe-dev)
# Einmaliger, abgesicherter Lauf fuer das Supabase-ENTWICKLUNGSprojekt
# vision-universe-dev (qiytbnpoqvldsatpfkeh). Liegt nur auf dem Branch
# ops/supabase-dev-migrations (nie auf main, kein PR), weil workflow_dispatch
# nur auf dem Standardbranch moeglich ist.
#
# Sicherungen:
#   * Umgebung account-dev mit "Required reviewers": jeder Lauf wartet auf die Freigabe des Owners
#   * zusaetzlich fail-closed: der erste Schritt bricht ab, wenn die GitHub-Freigabe-Historie
#     dieses Laufs keine Freigabe des Owners fuer account-dev enthaelt (schuetzt auch dann,
#     wenn die Umgebung versehentlich ohne Required reviewers konfiguriert ist)
#   * nur dieses Projekt (Ref im Verbindungs-URI), nur die Quelle PR #945 auf festem Commit
#   * Pruefsummen aller 8 Migrationen und der Seed-Datei
#   * Historie 1-4 muss exakt mit den Originaldateien uebereinstimmen, sonst Abbruch
#   * offizielle CLI: supabase db push (Probelauf zuerst), kein migration repair, kein reset
#   * Tests laufen je in einer Transaktion und enden mit Rollback
#   * kein Wert wird ausgegeben (oeffentliches Repository)
on:
  push:
    branches: [ops/supabase-dev-migrations]
    # Nur Aenderungen an Tests/Generator starten einen Lauf (nicht andere Ops-Workflows).
    paths: ['ops/supabase-dev/**']
permissions:
  contents: read
  actions: read
concurrency:
  group: account-dev-db-migrate-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: account-dev
    env:
      PROJECT_REF: qiytbnpoqvldsatpfkeh
      SOURCE_SHA: f562b7fc032f8163b394a9364027ffdc01b5ffc1
      SUPABASE_CLI: supabase@2.122.0
    steps:
      - name: Freigabe des Owners pruefen (fail closed, vor jedem Datenbankzugriff)
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          APPROVER: dennismueller10x-sudo
        run: |
          set -euo pipefail
          json=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/approvals")
          ok=$(jq --arg u "$APPROVER" '[.[] | select(.state == "approved" and .user.login == $u
                 and any(.environments[]; .name == "account-dev"))] | length' <<<"$json")
          [ "$ok" -ge 1 ] || { echo "::error::Keine Freigabe durch $APPROVER fuer account-dev - Abbruch ohne jede Aenderung"; exit 1; }
          echo "Freigabe durch $APPROVER fuer account-dev liegt vor."

      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Quelle pruefen (Commit und Pruefsummen)
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          cd source/supabase
          test "$(ls migrations/*.sql | wc -l)" -eq 8
          md5sum -c --strict <<'SUMS'
          c0da5d2550d6f5b65c176b6dcfff24fb  migrations/20261025000100_accounts_core.sql
          bdc72c4f4982e7a63c9b5cfff37b9f31  migrations/20261025000200_plans_entitlements.sql
          88d684b3e560394c1671d8423357e85a  migrations/20261025000300_billing.sql
          e50ae9082e99a44c0e0d2a2158f9c4de  migrations/20261025000400_watchlists.sql
          ffe7df3f83b7e93a9aa483025fcce1e2  migrations/20261026000100_cancellation_confirmation.sql
          c634b631832be9134abf46f204a938ba  migrations/20261027000100_cancellation_processing.sql
          1c20f339588184d9685688c942378bbb  migrations/20261027000200_registration_gate.sql
          c5c54ab6afe0417275e14a2da274d233  migrations/20261028000100_watchlist_personal.sql
          32e3c3e2836fb4f00fa1982f8d6a48f8  seed.sql
          SUMS

      - name: Ziel pruefen (nur vision-universe-dev, Historie 1-4 unveraendert)
        env:
          DB_URL: ${{ secrets.VU_ACCOUNT_SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          [[ "$DB_URL" == postgresql://* && "$DB_URL" == *"$PROJECT_REF"* ]] \
            || { echo "::error::VU_ACCOUNT_SUPABASE_DB_URL fehlt oder gehoert nicht zu $PROJECT_REF"; exit 1; }
          have=$(psql -X -q -t -A -v ON_ERROR_STOP=1 -d "$DB_URL" -c "select string_agg(version || ':' || coalesce(case when version <= '20261025000400' then md5(statements[1]) end, '-'), ',' order by version) from supabase_migrations.schema_migrations")
          base='20261025000100:c0da5d2550d6f5b65c176b6dcfff24fb,20261025000200:bdc72c4f4982e7a63c9b5cfff37b9f31,20261025000300:88d684b3e560394c1671d8423357e85a,20261025000400:e50ae9082e99a44c0e0d2a2158f9c4de'
          case "$have" in
            "$base") echo "Historie 1-4 unveraendert, 5-8 offen." ;;
            "$base",*) rest=${have#"$base",}
              [[ "$rest" =~ ^(20261026000100:-)?(,?20261027000100:-)?(,?20261027000200:-)?(,?20261028000100:-)?$ ]] \
                || { echo "::error::Unerwartete Eintraege in der Historie: $rest"; exit 1; }
              echo "Historie 1-4 unveraendert, bereits eingespielt: $rest" ;;
            *) echo "::error::Historie 1-4 weicht ab: $have"; exit 1 ;;
          esac
          users=$(psql -X -q -t -A -d "$DB_URL" -c "select count(*) from auth.users")
          echo "Konten im Projekt: $users (werden nicht veraendert)"

      - name: Arbeitsverzeichnis fuer die CLI (ohne Aenderung am Repository)
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/sb"; mkdir -p "$work"; cd "$work"
          npx --yes "$SUPABASE_CLI" init --yes > /dev/null
          mkdir -p supabase/migrations
          cp "$GITHUB_WORKSPACE"/source/supabase/migrations/*.sql supabase/migrations/
          cp "$GITHUB_WORKSPACE"/source/supabase/seed.sql supabase/seed.sql

      - name: Probelauf (supabase migration list, db push --dry-run)
        env:
          DB_URL: ${{ secrets.VU_ACCOUNT_SUPABASE_DB_URL }}
        working-directory: ${{ runner.temp }}/sb
        run: |
          set -euo pipefail
          npx "$SUPABASE_CLI" migration list --db-url "$DB_URL"
          npx "$SUPABASE_CLI" db push --dry-run --include-seed --db-url "$DB_URL"

      - name: Einspielen (supabase db push)
        env:
          DB_URL: ${{ secrets.VU_ACCOUNT_SUPABASE_DB_URL }}
        working-directory: ${{ runner.temp }}/sb
        run: npx "$SUPABASE_CLI" db push --include-seed --yes --db-url "$DB_URL"

      - name: Nachkontrolle (Historie, ersetzte Objekte, Seed)
        env:
          DB_URL: ${{ secrets.VU_ACCOUNT_SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          q() { psql -X -q -t -A -v ON_ERROR_STOP=1 -d "$DB_URL" -c "$1"; }
          test "$(q "select count(*) from supabase_migrations.schema_migrations where version in ('20261025000100','20261025000200','20261025000300','20261025000400','20261026000100','20261027000100','20261027000200','20261028000100')")" -eq 8
          test "$(q "select count(*) from supabase_migrations.schema_migrations")" -eq 8
          test "$(q "select to_regprocedure('public.billing_cancellation_request(uuid,text,text,text,text)') is null and to_regprocedure('public.billing_record_cancellation(jsonb)') is not null")" = t
          test "$(q "select count(*) from public.plan_prices where livemode = false")" -eq 4
          test "$(q "select count(*) from public.plan_prices where livemode = true")" -eq 0
          npx "$SUPABASE_CLI" db push --dry-run --db-url "$DB_URL" --workdir "$RUNNER_TEMP/sb" | tee "$RUNNER_TEMP/after.txt"
          grep -q 'up to date' "$RUNNER_TEMP/after.txt"
          echo "8 Migrationen, Seed (4 Testpreise, livemode=false) und Objekte geprueft."

      - name: SQL-/RLS-Tests 01-08 (je eine Transaktion, endet mit Rollback)
        env:
          DB_URL: ${{ secrets.VU_ACCOUNT_SUPABASE_DB_URL }}
        run: |
          set -uo pipefail
          fail=0
          for f in ops/supabase-dev/tests/t0*.sql; do
            out=$(psql -X -q -d "$DB_URL" -c "$(cat "$f")" 2>&1) || true   # Erfolg endet absichtlich mit Rollback-Fehler
            if grep -q 'VU_TEST_PASSED_ROLLBACK' <<<"$out"; then echo "ok    $f"
            else echo "FEHLER $f"; grep -E 'ERROR|ASSERT|EXPECTED' <<<"$out" | head -3; fail=1; fi
          done
          left=$(psql -X -q -t -A -d "$DB_URL" -c "select (select count(*) from auth.users where email like '%@example.test') + (select count(*) from pg_namespace where nspname = 'tests')")
          [ "$left" = 0 ] || { echo "::error::Testreste gefunden"; fail=1; }
          exit $fail
