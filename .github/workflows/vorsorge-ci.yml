name: Vorsorge CI

# Prueft die Produktsaeule Vorsorge: Engines (Mathe, Performance, Risiko,
# ETF-Stamm, Provider-Adapter, Foerderung, X-Ray, Monitor), den Daten-
# Contract der ausgelieferten Dateien und dass der Daten-Build
# reproduzierbar ist.

on:
  push:
    branches: [main]
    paths: ['vorsorge/**', 'scripts/vorsorge/**', '.github/workflows/vorsorge-ci.yml']
  pull_request:
    paths: ['vorsorge/**', 'scripts/vorsorge/**', '.github/workflows/vorsorge-ci.yml', 'assets/site-navigation.js']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Engine- und Contract-Tests
        run: node --test "vorsorge/tests/*.test.mjs"
      - name: Daten-Build ist reproduzierbar
        run: |
          node scripts/vorsorge/build-etf-data.mjs --quiet
          if [ -n "$(git status --porcelain -- vorsorge)" ]; then
            git status --short -- vorsorge | head -20
            echo "Der Neubau ergibt andere Vorsorge-Daten als der eingecheckte Stand."
            exit 1
          fi
          echo "Build reproduzierbar."
      - name: Seite bindet Navigation, Engines und Disclaimer ein
        run: |
          page=vorsorge/index.html
          grep -q 'vu-navigation' "$page"
          grep -q 'site-navigation.css' "$page"
          grep -q 'keine individuelle Anlage-, Steuer- oder Rechtsberatung' vorsorge/app.js
          for e in vorsorge-math etf-analytics etf-master etf-provider xray funding monitor; do grep -q "engines/$e.js" "$page" || { echo "$e fehlt"; exit 1; }; done
      - name: Public-Data-Hygiene
        run: node scripts/market/assert-public-data-hygiene.mjs
