name: Vercel — Nachweis der geschuetzten Vorschau

# Prueft die auf Vercel ausgelieferte Vorschau von aussen. Zwei Fragen,
# die getrennt bleiben muessen:
#
#   OHNE Zugangsmittel  -> muss abgewiesen werden
#   MIT  Zugangsmittel  -> muss die vollen 5.684 Titel zeigen
#
# Der wichtigere Teil braucht KEIN Geheimnis: die Abweisung ist genau der
# Fall "ein Fremder ruft auf". Er laeuft deshalb immer.
#
# Das Zugangsmittel ist Vercels Protection-Bypass-Token fuer Automaten.
# Es belegt, dass die Schutzschicht einen berechtigten Aufrufer
# durchlaesst - NICHT, dass die SSO-Anmeldung eines Menschen funktioniert.
# Der Bericht schreibt diesen Unterschied selbst hin.
#
# Einrichtung siehe docs/VERCEL_PROTECTED_PREVIEW.md. Ohne die beiden
# Eintraege laeuft der Workflow trotzdem - er weist dann aus, was er
# nicht pruefen konnte, statt es als bestanden zu melden.

on:
  workflow_dispatch:
    inputs:
      preview_url:
        description: 'Adresse der Vercel-Vorschau (leer = Variable VERCEL_PREVIEW_URL)'
        required: false
        type: string
  # Nach jedem Push auf den Vorschauzweig: die Schutzschicht ist eine
  # Projekteinstellung, und Einstellungen aendert man versehentlich.
  push:
    branches:
      - 'claude/vercel-protected-preview'
    paths:
      - 'vercel.json'
      - '.vercelignore'
      - 'scripts/preview/**'
      - 'scripts/site/verify-vercel-preview.mjs'
      - '.github/workflows/vercel-preview-verify.yml'

permissions:
  contents: read

jobs:
  nachweis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Node 22, nicht 20: der Echtzeit-Weiterleiter benutzt den globalen
      # WebSocket-Client, den es erst ab 22 gibt. Unter 20 meldete die
      # Messung NO_WEBSOCKET_RUNTIME - richtig gemeldet, aber die
      # Laufzeit war das Problem, nicht der Code.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Ohne Browser laufen V1 bis V5 und V8/V9; V6/V7 werden dann
      # ausdruecklich als nicht geprueft ausgewiesen. Mit Browser laufen
      # sie mit. --with-deps bleibt weg: der apt-Schritt ist an einem
      # fremden Paketspiegel gescheitert, der mit dieser Seite nichts zu
      # tun hat.
      - name: Browser holen
        run: npm i -D playwright@1.47.2 && npx playwright install chromium
        continue-on-error: true

      - name: Vorschau pruefen
        env:
          VERCEL_PREVIEW_URL: ${{ inputs.preview_url || vars.VERCEL_PREVIEW_URL }}
          # Optional. Fehlt es, bleibt der Zugang von innen ungeprueft -
          # und der Bericht sagt das.
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          # Ohne Adresse kann dieser Lauf nichts messen. Er meldet dann
          # ROT - nicht weil etwas kaputt ist, sondern weil "geschuetzt"
          # unbelegt bleibt, und ein unbelegter Schutz darf nicht gruen
          # aussehen. Die Zusammenfassung sagt, was fehlt.
          if [ -z "$VERCEL_PREVIEW_URL" ]; then
            {
              echo "## Nicht geprueft — Einrichtung unvollstaendig"
              echo ""
              echo "**Der Code ist nicht defekt.** Es fehlt die Adresse der Vorschau,"
              echo "also konnte nichts gemessen werden. Ein unbelegter Schutz wird hier"
              echo "bewusst nicht gruen gemeldet."
              echo ""
              echo "Zu setzen unter *Settings → Secrets and variables → Actions*:"
              echo ""
              echo "| Art | Name | Wert |"
              echo "|---|---|---|"
              echo "| Variable | \`VERCEL_PREVIEW_URL\` | \`https://<projekt>.vercel.app\` |"
              echo "| Secret (optional) | \`VERCEL_AUTOMATION_BYPASS_SECRET\` | Vercel → Protection Bypass for Automation |"
              echo ""
              echo "Ohne das Secret laeuft der wichtigste Teil trotzdem: die Abweisung"
              echo "eines Aufrufs ohne Zugangsmittel. Alles Weitere wird dann als"
              echo "\`SKIPPED\` ausgewiesen, nicht als bestanden."
              echo ""
              echo "Anleitung: \`docs/VERCEL_PROTECTED_PREVIEW.md\`"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Vorschau-Adresse fehlt::Repository-Variable VERCEL_PREVIEW_URL setzen (siehe Zusammenfassung)"
            exit 2
          fi
          node scripts/site/verify-vercel-preview.mjs --base "$VERCEL_PREVIEW_URL"

      # ------------------------------------------------------------------
      # ZWEIGLOKAL: der Produktnachweis auf dem vollen Universum.
      #
      # Er haette gern eine eigene Datei, und die gab es auch schon
      # (full-universe-proof-verify.yml). GitHub hat sie nicht angenommen:
      # ein Workflow ist erst dispatchbar, wenn seine Datei auf dem
      # Standardzweig liegt - der Aufruf endete mit 404. Dieser Zweig darf
      # main nicht anfassen, also haengt der Schritt hier an einem bereits
      # eingetragenen Workflow.
      #
      # Er misst etwas anderes als die Schritte darueber: nicht die
      # interne Pruefansicht, sondern /universe/ - Suche, Einzeltitel,
      # Screener und Chart, mit einem echten Browser auf 1440 px und
      # 390 px. Faellt die Datei weg, faellt nur dieser Schritt weg.
      - name: Full-Universe-Produktnachweis pruefen
        if: hashFiles('scripts/proof/verify-product-proof.mjs') != ''
        env:
          VERCEL_PREVIEW_URL: ${{ inputs.preview_url || vars.VERCEL_PREVIEW_URL }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/proof/verify-product-proof.mjs --base "$VERCEL_PREVIEW_URL"

      # Und die integrierte Eigentuemer-Vorschau (/vu2/ mit der Bruecke).
      # Auch dieser Schritt haengt zweiglokal hier, aus demselben Grund:
      # eine eigene Workflow-Datei ist erst dispatchbar, wenn sie auf dem
      # Standardzweig liegt.
      - name: Integrierte Eigentuemer-Vorschau pruefen
        if: hashFiles('scripts/proof/verify-owner-preview.mjs') != ''
        env:
          VERCEL_PREVIEW_URL: ${{ inputs.preview_url || vars.VERCEL_PREVIEW_URL }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/proof/verify-owner-preview.mjs --base "$VERCEL_PREVIEW_URL"

      # Der Live-Chart, gemessen im Browser gegen den echten Anbieter.
      # Er laeuft LOKAL im Runner, weil der Schluessel hier liegt und in
      # der Vercel-Umgebung (noch) nicht: gemessen wird damit der WEG
      # Browser -> Serverfunktion -> Anbieter, nicht die fremde
      # Einstellung. Ausserhalb der Handelszeiten zaehlt er null und sagt
      # das auch - er erfindet keine Bewegung.
      # always(): diese Messung sagt gerade dann am meisten, wenn ein
      # Schritt davor rot war - sie trennt "der Weg ist kaputt" von
      # "eine Einstellung fehlt".
      - name: Live-Chart im Produkt messen
        if: always() && hashFiles('scripts/proof/measure-live-chart.mjs') != ''
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
        run: |
          node scripts/preview/build-preview-dataset.mjs
          node scripts/proof/build-product-proof.mjs
          node scripts/proof/measure-live-chart.mjs --window-ms 75000

      # Ganz zum Schluss, in zwei Zeilen: was melden die beiden
      # Serverfunktionen der AUSGELIEFERTEN Vorschau gerade? Die
      # ausfuehrlichen Nachweise stehen weiter oben; diese Zeilen stehen
      # hier, weil sie die Frage sind, die nach einer Aenderung an der
      # Umgebung als erste gestellt wird.
      - name: Serverfunktionen — Zustand in der Auslieferung
        if: always()
        env:
          VERCEL_PREVIEW_URL: ${{ inputs.preview_url || vars.VERCEL_PREVIEW_URL }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          node -e '
            const base = process.env.VERCEL_PREVIEW_URL.replace(/\/$/, "");
            const kopf = { "x-vercel-protection-bypass": process.env.VERCEL_AUTOMATION_BYPASS_SECRET || "" };
            const zeige = (name, text) => console.log("  " + name.padEnd(10) + text);
            (async () => {
              const i = await fetch(base + "/api/intraday/?ticker=AAPL&freq=5min&days=3", { headers: kopf })
                .then(r => r.json()).catch(e => ({ state: "FETCH_FAILED", reason: String(e.message) }));
              zeige("intraday", i.state + (i.bars ? " · " + i.bars.length + " Bars · " + i.first + " bis " + i.last : "") +
                (i.reason ? " · " + i.reason : ""));
              const res = await fetch(base + "/api/realtime/?tickers=AAPL", { headers: kopf });
              const leser = res.body.getReader(); const dek = new TextDecoder();
              let puffer = "", zustand = "keine Antwort", ticks = 0, laufzeit = null, grund = "";
              const ende = Date.now() + 30000;
              while (Date.now() < ende) {
                const { done, value } = await leser.read(); if (done) break;
                puffer += dek.decode(value, { stream: true });
                for (const block of puffer.split("\n\n")) {
                  const art = (block.match(/^event: (.+)$/m) || [])[1];
                  const roh = (block.match(/^data: (.+)$/m) || [])[1];
                  if (!art || !roh) continue;
                  let d; try { d = JSON.parse(roh); } catch (e) { continue; }
                  if (art === "status") { zustand = d.state; if (d.runtime) laufzeit = d.runtime;
                    if (d.reason) grund = d.reason; if (d.providerCode !== undefined && d.providerCode !== null) grund += " (Code " + d.providerCode + ")"; }
                  if (art === "tick") ticks = d.seq;
                }
                if (zustand !== "keine Antwort" && zustand !== "CONNECTED") break;
              }
              try { await leser.cancel(); } catch (e) { /* egal */ }
              zeige("realtime", zustand + " · Aktualisierungen " + ticks + (laufzeit ? " · Laufzeit " + laufzeit : "") +
                (grund ? " · " + grund : ""));
            })();
          '

      - name: Bericht sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vercel-preview-verification
          path: |
            quant/data/site/vercel-preview-verification.json
            quant/data/site/full-universe-proof-verification.json
            quant/data/site/proof-shots/**
            quant/data/site/owner-preview-verification.json
            quant/data/site/owner-preview-shots/**
            quant/data/site/live-chart-measurement.json
            quant/data/site/live-chart-shots/**
          if-no-files-found: warn
