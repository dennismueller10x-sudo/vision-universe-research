name: Cloudflare — Intraday-Wecker ausrollen

# =============================================================================
# EIN EIGENER WORKFLOW, WEIL vu-live NICHT ANGEFASST WIRD
#
# Der Auftrag vom 21.09.2026 (§14) sagt: an der Realtime-Laufzeit nichts
# aendern - kein neuer WebSocket-Dienst, kein neues Durable Object, kein
# Umbau. cloudflare-deploy.yml rollt vu-live aus und bleibt deshalb
# unberuehrt. Der Wecker bekommt seinen eigenen Weg.
#
# WAS DER WECKER IST
#
# Ein Cron auf Cloudflare, der den bestehenden Taktgeber-Workflow weckt.
# Er holt keine Kurse, speichert nichts und kennt keine Daten (siehe
# worker-waker/src/index.mjs und die Tests WK-1 bis WK-18).
#
# WARUM DIESER WORKFLOW DEN SCHLUESSEL NICHT ANFASST
#
# Seit der Eigentuemerentscheidung vom 21.09.2026 weist sich der Wecker
# ueber eine GitHub App aus (App ID 5023229, installiert auf genau
# diesem Repository, Berechtigung "Actions: read and write"). Ihr
# privater Schluessel ist das einzige echte Geheimnis der Kette.
#
# Frueher stand hier ein Schritt, der ein PAT aus einem GitHub-Secret
# nach Cloudflare weiterreichte. Das ist jetzt bewusst weg. Ein
# Schluessel, der durch einen Actions-Lauf laeuft, existiert danach an
# drei Orten statt an einem: im GitHub-Secret, im Runner-Speicher und
# bei Cloudflare. Der private App-Schluessel geht deshalb direkt vom
# Rechner des Eigentuemers zu Cloudflare und beruehrt GitHub nie.
#
# Was dieser Workflow stattdessen tut: er rollt den Wecker aus und sieht
# NACH, ob das Secret dort liegt (`wrangler secret list` nennt Namen,
# nie Werte). Fehlt es, sagt er das deutlich - ein Wecker, der
# stillschweigend nichts tut, waere schlimmer als keiner.
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      dryRun:
        description: 'Nur pruefen, nichts ausrollen'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: vu-intraday-waker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Wecker ausrollen
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Der Wecker haelt seinen eigenen Vertrag ein
        run: node --test worker-waker/tests/waker.test.mjs

      - name: Liegt der Cloudflare-Zugang vor?
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Kein CLOUDFLARE_API_TOKEN. Ohne Cloudflare-Zugang kein Wecker."
            exit 1
          fi

      - name: Ausrollen
        if: ${{ !inputs.dryRun }}
        working-directory: worker-waker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx --yes wrangler@4 deploy 2>&1 | sed -E 's/[0-9a-f]{32}/<maskiert>/g'

      # `wrangler secret list` gibt Namen und Typen aus, nie Werte. Die
      # Ausgabe wird trotzdem nicht roh gedruckt - gepruefte Anwesenheit
      # genuegt, und was nicht gedruckt wird, kann auch nicht versehentlich
      # in einem Protokoll landen.
      - name: Liegt der App-Schluessel bei Cloudflare?
        id: schluessel
        if: ${{ !inputs.dryRun }}
        working-directory: worker-waker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if npx --yes wrangler@4 secret list 2>/dev/null | grep -q 'GITHUB_APP_PRIVATE_KEY'; then
            echo "vorhanden=true" >> "$GITHUB_OUTPUT"
            echo "GITHUB_APP_PRIVATE_KEY ist hinterlegt."
          else
            echo "vorhanden=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GITHUB_APP_PRIVATE_KEY fehlt bei Cloudflare. Der Wecker laeuft, loest aber nichts aus."
          fi

      - name: Kein Schluessel im Bericht
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/market/assert-no-secrets.mjs --all

      - name: Zusammenfassung
        if: always()
        run: |
          {
            echo '### Intraday-Wecker'
            echo ''
            echo 'Ausweis: **GitHub App 5023229**, installiert auf diesem Repository,'
            echo 'Berechtigung Actions read and write. Kein PAT mehr.'
            echo ''
            if [ "${{ steps.schluessel.outputs.vorhanden }}" = "true" ]; then
              echo 'Der private App-Schluessel liegt bei Cloudflare — der Wecker kann'
              echo 'sich ein Installationstoken holen und den Taktgeber ausloesen.'
            else
              echo '**Der private App-Schluessel fehlt bei Cloudflare.** Der Wecker laeuft,'
              echo 'meldet bei jedem Takt `keinSchluessel` und loest nichts aus.'
              echo ''
              echo 'Einmalig auf dem Rechner des Eigentuemers, nicht hier:'
              echo ''
              echo '```'
              echo 'cd worker-waker'
              echo 'npx wrangler@4 secret put GITHUB_APP_PRIVATE_KEY < /pfad/zur/app.pem'
              echo '```'
              echo ''
              echo 'Der Schluessel geht damit direkt zu Cloudflare und beruehrt GitHub nie.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
