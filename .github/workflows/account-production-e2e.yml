name: Konten — Ende-zu-Ende auf Produktion
# Prueft den ausgerollten Worker https://konto.visionuniverse.de gegen die
# Produktionsdatenbank mit zwei kurzlebigen Testkonten (scripts/account/prod-e2e.mjs):
# Registrierungssperre, Login/Logout, Watchlist auf zwei Geraeten, Trennung der
# Konten, Free/Plus/Pro (manuelle Freigabe, keine Zahlung), Abrechnung gesperrt,
# Webhook ohne Signatur abgewiesen, Export, Kontoloeschung. Die Testkonten und
# ihre Positivlisten-Eintraege werden am Ende entfernt. Oeffnet die
# Registrierung nicht und loest keine Zahlung aus. Nur von Hand, mit Freigabe.
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: account-production-e2e-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: account-dev
    steps:
      - name: Freigabe pruefen (fail closed)
        env: {GH_TOKEN: '${{ github.token }}', RUN_ID: '${{ github.run_id }}', REPO: '${{ github.repository }}', APPROVER: dennismueller10x-sudo, ENV_NAME: account-dev}
        run: |
          set -euo pipefail
          json=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/approvals")
          ok=$(jq --arg u "$APPROVER" --arg e "$ENV_NAME" '[.[] | select(.state=="approved" and .user.login==$u and any(.environments[]; .name==$e))] | length' <<<"$json")
          [ "$ok" -ge 1 ] || { echo "::error::Keine Freigabe durch $APPROVER fuer $ENV_NAME"; exit 1; }
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ende-zu-Ende
        env:
          VU_ACCOUNT_API_ORIGIN: https://konto.visionuniverse.de
          VU_SITE_ORIGIN: https://research.visionuniverse.de
          SUPABASE_URL: https://qiytbnpoqvldsatpfkeh.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.VU_ACCOUNT_SUPABASE_SECRET_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VU_ACCOUNT_SUPABASE_PUBLISHABLE_KEY }}
          DB_URL: ${{ secrets.VU_ACCOUNT_SUPABASE_DB_URL }}
          VU_E2E_DOMAIN: visionuniverse.de
          VU_E2E_SQL: psql "$DB_URL" -v ON_ERROR_STOP=1 -q -X
        run: |
          set -euo pipefail
          [[ "$DB_URL" == postgresql://*qiytbnpoqvldsatpfkeh* ]] || { echo "::error::VU_ACCOUNT_SUPABASE_DB_URL fehlt oder gehoert nicht zum Produktionsprojekt"; exit 1; }
          node scripts/account/prod-e2e.mjs
