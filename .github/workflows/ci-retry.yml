name: ci-retry

# Wiederholt einen roten PR-Lauf genau einmal, wenn ALLE roten Jobs an Infrastruktur scheitern
# (apt-DNS, Netz, Spiegel, Runner-Verlust; scripts/ci/infra-retry.mjs). Echte Testfehler bleiben rot.
on:
  workflow_run:
    workflows:
      - 'CI (Pruefungen je Produkt)'
      - 'Core - Tests, Datenqualitaet, Systemzustand'
      - 'Quant CI'
      - 'Quant 2.0 Production Pages'
      - 'Currency & FX — Capability- und Datennachweis'
      - 'App - Android Bauprobe (ungesignt, kein Upload)'
    types: [completed]

permissions:
  actions: write
  contents: read

concurrency:
  group: ci-retry-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  retry:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Infrastruktur-Signatur suchen, einmal neu starten
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: node scripts/ci/infra-retry.mjs
