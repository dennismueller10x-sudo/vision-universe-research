name: Shell Quality Gates
# Gemeinsame Vision-Universe-Shell (assets/site-navigation.js): Kopf, Produkt-
# Leiste und globales Menue auf allen sechs Produkten. Prueft im gebauten
# Pages-Auslieferungsartefakt Deep Links, aktiven Zustand nach Reload,
# Zurueck/Vor, Menue (Scroll-Sperre, Escape, Fokus), Theme-Wechsel, Ueberlauf
# und Seitenende - in Chromium (390 bis 1440 px) und in WebKit (iPhone-Profil).
on:
  pull_request:
    paths: ['assets/site-navigation.js', 'assets/site-navigation.css', 'assets/product-icons.svg', 'assets/product-hero.css', 'assets/hero-visuals/**', 'discover/*.js', 'discover/*.css', 'discover/index.html', 'quant/app/**', 'quant/index.html', 'vorsorge/app.*', 'vorsorge/ui/**', 'screener/*.js', 'screener/*.css', 'supertrader/assets/**', 'hedgefonds/app.*', 'scripts/quality/shell-browser-qa.mjs', 'scripts/quality/vu3-regression-qa.mjs', 'scripts/quality/fundamental-compare-qa.mjs', 'elliott/**', 'fundamental/**', 'scripts/fundamental/**', 'scripts/vu2/build-release.mjs', '.github/workflows/shell-ci.yml']
  push:
    branches: [main]
    paths: ['assets/site-navigation.js', 'assets/site-navigation.css', 'assets/product-icons.svg', 'assets/product-hero.css', 'assets/hero-visuals/**', 'discover/*.js', 'discover/*.css', 'discover/index.html', 'quant/app/**', 'quant/index.html', 'vorsorge/app.*', 'vorsorge/ui/**', 'screener/*.js', 'screener/*.css', 'supertrader/assets/**', 'hedgefonds/app.*', 'scripts/quality/shell-browser-qa.mjs', 'scripts/quality/vu3-regression-qa.mjs', 'scripts/quality/fundamental-compare-qa.mjs', 'elliott/**', 'fundamental/**', 'scripts/fundamental/**', '.github/workflows/shell-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shell-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  shell:
    # Browser aus dem Playwright-Image statt apt-get bei jedem Lauf - Begruendung beim Job vu3-regression.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - name: Workspace fuer git freigeben (Container laeuft als root, build-release.mjs ruft git ls-files)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Shell tests
        run: node --test "core/tests/shell-navigation.test.mjs" discover/tests/navigation-theme.test.mjs quant/tests/site-navigation.test.mjs
      - name: Build screener universe from committed product data
        run: node scripts/screener/build-universe.mjs
      - name: Browser dependencies (Chromium und WebKit liegen im Image)
        run: |
          npm install --prefix /tmp/shell-qa-deps --no-audit --no-fund playwright@1.56.1
          node -e "const pw=require('/tmp/shell-qa-deps/node_modules/playwright');for(const b of [pw.chromium,pw.webkit])require('fs').accessSync(b.executablePath())"
      - name: Build exact Pages delivery artifact
        run: node scripts/vu2/build-release.mjs --output="$RUNNER_TEMP/shell-release"
      - name: Browser QA (Chromium 390, 430, 768, 1024, 1440 · WebKit iPhone 390, 430 and 1024)
        env:
          PLAYWRIGHT_PATH: /tmp/shell-qa-deps/node_modules/playwright
        run: |
          mkdir -p /tmp/shell-evidence
          node scripts/ci/static-server.mjs --dir="$RUNNER_TEMP/shell-release" --port=8765 > /tmp/shell-evidence/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in 1 2 3 4 5; do curl --fail --silent http://127.0.0.1:8765/quant/ > /dev/null && break; sleep 1; done
          chromium_status=0
          webkit_status=0
          node scripts/quality/shell-browser-qa.mjs --url=http://127.0.0.1:8765 --out=/tmp/shell-evidence/chromium || chromium_status=$?
          node scripts/quality/shell-browser-qa.mjs --engine=webkit --viewports=390x844,430x932,1024x768 --url=http://127.0.0.1:8765 --out=/tmp/shell-evidence/webkit || webkit_status=$?
          test "$chromium_status" -eq 0 && test "$webkit_status" -eq 0
      - name: Preserve screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shell-browser-evidence
          path: /tmp/shell-evidence
          if-no-files-found: warn
  vu3-regression:
    # VU3-Regression (scripts/quality/vu3-regression-qa.mjs): Wege zwischen den Welten (dieselbe Aktie bleibt dieselbe),
    # Farbschema ueber die Welten, Visual-First-Bausteine je Welt und Kontrast (axe color-contrast) hell/dunkel, 390/1440 px.
    # Eigener Job neben shell, damit dessen 40-Minuten-Budget unberuehrt bleibt. Europa-Routen bewusst ausgenommen.
    # Browser und ihre Systembibliotheken kommen aus dem offiziellen Playwright-Image (Version = playwright@ unten).
    # Vorher installierte `playwright install --with-deps` sie bei jedem Lauf per apt-get vom Ubuntu-Spiegel des
    # Runners: rund 100 MB (WebKit: GStreamer, FFmpeg, Schriften) mit zeitweise unter 100 KB/s - die Installation
    # allein lief in das 40-Minuten-Limit, bevor eine Pruefung startete. Node 22 und git bringt das Image mit;
    # Python nicht, deshalb liefert scripts/ci/static-server.mjs die Seiten aus (Verhalten wie http.server).
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - name: Workspace fuer git freigeben (Container laeuft als root, build-release.mjs ruft git ls-files)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build screener universe from committed product data
        run: node scripts/screener/build-universe.mjs
      - name: Browser dependencies (axe-core; Chromium und WebKit liegen im Image)
        run: |
          npm install --prefix /tmp/vu3-qa-deps --no-audit --no-fund playwright@1.56.1 axe-core@4.10.3
          node -e "const pw=require('/tmp/vu3-qa-deps/node_modules/playwright');for(const b of [pw.chromium,pw.webkit])require('fs').accessSync(b.executablePath())"
      - name: Build exact Pages delivery artifact
        run: node scripts/vu2/build-release.mjs --output="$RUNNER_TEMP/vu3-release"
      - name: VU3 regression (Chromium all sections · WebKit iPhone journeys, theme, Visual First)
        env:
          PLAYWRIGHT_PATH: /tmp/vu3-qa-deps/node_modules/playwright
          AXE_PATH: /tmp/vu3-qa-deps/node_modules/axe-core/axe.min.js
        run: |
          mkdir -p /tmp/vu3-evidence
          node scripts/ci/static-server.mjs --dir="$RUNNER_TEMP/vu3-release" --port=8765 > /tmp/vu3-evidence/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in 1 2 3 4 5; do curl --fail --silent http://127.0.0.1:8765/quant/ > /dev/null && break; sleep 1; done
          chromium_status=0
          webkit_status=0
          node scripts/quality/vu3-regression-qa.mjs --url=http://127.0.0.1:8765 --out=/tmp/vu3-evidence/chromium || chromium_status=$?
          node scripts/quality/vu3-regression-qa.mjs --engine=webkit --only=journeys,theme,visual --url=http://127.0.0.1:8765 --out=/tmp/vu3-evidence/webkit || webkit_status=$?
          test "$chromium_status" -eq 0 && test "$webkit_status" -eq 0
      - name: Preserve results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vu3-regression-evidence
          path: /tmp/vu3-evidence
          if-no-files-found: warn
  fundamental-compare:
    # Fundamental: mehrere Kennzahlen in einem Verlauf (scripts/quality/fundamental-compare-qa.mjs) gezielt im
    # iPhone-Profil von WebKit (390 und 430 px, hell und dunkel): "+ Kennzahl", Auswahl im mobilen Dialog,
    # synchrones Ablesen per Antippen, Achsen und Legende, Touch-Flaechen, Vollbild, Entfernen bis zur
    # Ausgangsansicht (Balken, Branchenvergleich). Dazu derselbe Lauf in Chromium (mobil, mit Touch).
    # Eigener Job neben shell und vu3-regression, damit deren 40-Minuten-Budget unberuehrt bleibt.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - name: Workspace fuer git freigeben (Container laeuft als root, build-release.mjs ruft git ls-files)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build screener universe from committed product data
        run: node scripts/screener/build-universe.mjs
      - name: Browser dependencies (Chromium und WebKit liegen im Image)
        run: |
          npm install --prefix /tmp/fu-qa-deps --no-audit --no-fund playwright@1.56.1
          node -e "const pw=require('/tmp/fu-qa-deps/node_modules/playwright');for(const b of [pw.chromium,pw.webkit])require('fs').accessSync(b.executablePath())"
      - name: Build exact Pages delivery artifact
        run: node scripts/vu2/build-release.mjs --output="$RUNNER_TEMP/fu-release"
      - name: Fundamental compare (WebKit iPhone 390, 430 · Chromium 390, 430)
        env:
          PLAYWRIGHT_PATH: /tmp/fu-qa-deps/node_modules/playwright
        run: |
          set -euo pipefail
          mkdir -p /tmp/fu-evidence
          node scripts/ci/static-server.mjs --dir="$RUNNER_TEMP/fu-release" --port=8765 > /tmp/fu-evidence/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in 1 2 3 4 5; do curl --fail --silent http://127.0.0.1:8765/fundamental/ > /dev/null && break; sleep 1; done
          webkit_status=0
          chromium_status=0
          node scripts/quality/fundamental-compare-qa.mjs --engine=webkit --viewports=390x844,430x932 --url=http://127.0.0.1:8765 --out=/tmp/fu-evidence/webkit || webkit_status=$?
          node scripts/quality/fundamental-compare-qa.mjs --engine=chromium --viewports=390x844,430x932 --url=http://127.0.0.1:8765 --out=/tmp/fu-evidence/chromium || chromium_status=$?
          test "$webkit_status" -eq 0 && test "$chromium_status" -eq 0
      - name: Preserve screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fundamental-compare-evidence
          path: /tmp/fu-evidence
          if-no-files-found: warn
