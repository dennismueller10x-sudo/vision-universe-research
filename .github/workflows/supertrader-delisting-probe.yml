name: Supertrader Probeabruf delisteter Titel

# Einmalige Machbarkeitsmessung fuer einen validierbaren Backtest
# (scripts/supertrader/probe/delisting-probe.mjs). Nur manuell oder ueber die
# Marke [supertrader-probe] in einer Commit-Nachricht auf claude/**.
# ~90 Anfragen im bestehenden Abonnement; schreibt und committet nichts,
# gibt nur Anzahlen/Daten/Verhaeltnisse aus (keine Kursniveaus).
on:
  workflow_dispatch:
  push:
    branches:
      - 'claude/**'
permissions:
  contents: read
concurrency:
  group: supertrader-delisting-probe
  cancel-in-progress: false
jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[supertrader-probe]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probeabruf (Anzahlen, keine Kurse)
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
        run: node scripts/supertrader/probe/delisting-probe.mjs
