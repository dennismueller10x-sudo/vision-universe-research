name: Forschung (Buendel research)

# Buendel `research` (core/registry/workflow-bundles.json, Plan Neustart §3, A-Doc): manuelle Forschungslaeufe und Studien.
# Neu erzeugt mit dem Generator (08.11.2026) aus den Quellen der Stufen 1-3 (Git-Stand vor ihrer Loeschung) und weiteren Quellen.
# Nicht hier: company-intelligence-* (Sperre), research-signals-s2 (Matrix mit Workflow-Concurrency),
# sec-fundamentals-universe (pull_request), supertrader-research-snapshot (Workflow-Concurrency mit parallelen Jobs),
# supertrader-validation/-st-hist-top5/-st9-v13-study (eigene Stufe mit Supertrader-Vertragstests).
# Teile (Schritte unveraendert; Job-Bedingungen der Quelle bleiben und werden mit der Auswahl verknuepft):
#   portfolio                    vormals quant-portfolio-research.yml
#   mustervolumen                vormals pattern-research-volume.yml
#   labor                        vormals research-labor.yml
#   vorsorge-recht               vormals vorsorge-legal-sources.yml
#   muster-gesamtrendite         vormals quant-pattern-total-return-check.yml
#   elliott-register             vormals elliott-prospective-registry.yml
#   vorsorge-etf                 vormals vorsorge-etf-sources.yml
#   emerging-leaders             vormals emerging-leaders-study.yml
#   v13-archiv                   vormals quant-v13-archive.yml
#   etf-universum                vormals vorsorge-etf-universe.yml
#   delisting-probe              vormals supertrader-delisting-probe.yml
#   hausstrategie-forschung      vormals supertrader-house.yml
# Der Job `auswahl` bildet die Ausloeser der Quellen nach (Dispatch `teil`, Zeitplan am Cron, Push nach
# Zweig/Pfad, workflow_run nach Name/Typ/Zweig, repository_dispatch nach Typ). Generiert, siehe A-Doc.

on:
  workflow_dispatch:
    inputs:
      teil:
        description: 'Welcher Teil'
        type: choice
        required: true
        options:
          - portfolio
          - mustervolumen
          - labor
          - vorsorge-recht
          - muster-gesamtrendite
          - elliott-register
          - vorsorge-etf
          - emerging-leaders
          - etf-universum
          - delisting-probe
          - hausstrategie-forschung
      mode:
        description: 'portfolio: portfolios (Musterportfolios) oder holdout-quant (Holdout 2008-2015, einmalig, nur versiegelt)'
        required: false
        default: portfolios
        type: choice
        options: [portfolios, holdout-quant]
      reviewer_public_key_b64: {description: 'portfolio: Nur holdout-quant: oeffentlicher RSA-Schluessel (PEM, base64 in einer Zeile) der Steuerung', required: false, default: '', type: string}
      phase: {description: 'labor: dev, test oder holdout', required: false, default: dev}
      max_weeks: {description: 'elliott-register: Hoechstens so viele fehlende Wochen nachholen (1-4)', default: '2'}
      job: {description: 'vorsorge-etf: probe | euprobe | nport | fundamentals', default: probe}
      limit: {description: 'etf-universum: Hoechstzahl neu abgefragter Ticker (0 = alle)', default: '0'}
      per_hour: {description: 'etf-universum: Anfragen je Stunde (Drossel)', default: '4500'}
      nur_zusatz: {description: 'etf-universum: Nur, was noch nicht im Universum steht (Zusatz-ETFs aus dem Company Master und neu gelistete ETFs)', type: boolean, default: false}
      delisting_probe_mode:
        description: 'delisting-probe: probe (Kursanfragen, ~65) oder list-stats (nur Tickerliste)'
        type: choice
        options: [probe, list-stats]
        default: probe
      hausstrategie_forschung_mode:
        type: choice
        options: [dev-smoke, dev, holdout, hs2-dev-smoke, hs2-dev, hs2-holdout, sec-pit-r13, hs3-dev, hs3-holdout, hs3d1-dev, hs3d1-holdout, hs3d2-dev, hs3d2-holdout, hs3d3-dev, hs3d3-holdout, hs4-full, hs4oos]
        default: dev-smoke
        description: 'hausstrategie-forschung:'
  schedule:
    - cron: '23 9 * * 6'   # elliott-register
    - cron: '47 7 * * 0'   # elliott-register
    - cron: '17 6 * * 1'   # elliott-register
    - cron: '41 5 * * 3'   # elliott-register
  push:
    branches:
      - 'claude/**'

permissions:
  contents: read

jobs:
  auswahl:
    name: Auswahl des Teils
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      portfolio: ${{ steps.wahl.outputs.portfolio }}
      mustervolumen: ${{ steps.wahl.outputs.mustervolumen }}
      labor: ${{ steps.wahl.outputs.labor }}
      vorsorge_recht: ${{ steps.wahl.outputs.vorsorge_recht }}
      muster_gesamtrendite: ${{ steps.wahl.outputs.muster_gesamtrendite }}
      elliott_register: ${{ steps.wahl.outputs.elliott_register }}
      vorsorge_etf: ${{ steps.wahl.outputs.vorsorge_etf }}
      emerging_leaders: ${{ steps.wahl.outputs.emerging_leaders }}
      v13_archiv: ${{ steps.wahl.outputs.v13_archiv }}
      etf_universum: ${{ steps.wahl.outputs.etf_universum }}
      delisting_probe: ${{ steps.wahl.outputs.delisting_probe }}
      hausstrategie_forschung: ${{ steps.wahl.outputs.hausstrategie_forschung }}
    steps:
      - name: Teil waehlen
        id: wahl
        env:
          # Eingaben und Ereignisdaten nur ueber env: (ADR-005)
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          REF: ${{ github.ref }}
          TEIL: ${{ inputs.teil }}
          SCHEDULE: ${{ github.event.schedule }}
          WR_NAME: ${{ github.event.workflow_run.name }}
          WR_BRANCH: ${{ github.event.workflow_run.head_branch }}
          COMMITS: ${{ toJSON(github.event.commits) }}
          INPUTS: ${{ toJSON(inputs) }}
        run: |
          python3 - <<'PY'
          import fnmatch, json, os, re
          SPEC = json.loads(r"""{"delisting-probe": {"crons": [], "dispatch": true, "push": {"branches": ["claude/**"]}, "required": []}, "elliott-register": {"crons": ["23 9 * * 6", "47 7 * * 0", "17 6 * * 1", "41 5 * * 3"], "dispatch": true, "required": []}, "emerging-leaders": {"crons": [], "dispatch": true, "push": {"branches": ["claude/**"]}, "required": []}, "etf-universum": {"crons": [], "dispatch": true, "push": {"branches": ["claude/**"], "paths": ["products/vorsorge/producer/**", "vorsorge/engines/**", ".github/workflows/research.yml"]}, "required": []}, "hausstrategie-forschung": {"crons": [], "dispatch": true, "push": {"branches": ["claude/**"]}, "required": []}, "labor": {"crons": [], "dispatch": true, "push": {"branches": ["claude/**"]}, "required": ["phase"]}, "muster-gesamtrendite": {"crons": [], "dispatch": true, "push": {"branches": ["claude/**"]}, "required": []}, "mustervolumen": {"crons": [], "dispatch": true, "push": {"branches": ["claude/**"]}, "required": []}, "portfolio": {"crons": [], "dispatch": true, "push": {"branches": ["claude/**"]}, "required": []}, "v13-archiv": {"crons": [], "dispatch": false, "push": {"branches": ["claude/**"]}, "required": []}, "vorsorge-etf": {"crons": [], "dispatch": true, "push": {"branches": ["claude/**"], "paths": ["products/vorsorge/producer/**", "vorsorge/engines/**", ".github/workflows/research.yml"]}, "required": []}, "vorsorge-recht": {"crons": [], "dispatch": true, "push": {"branches": ["claude/**"], "paths": [".github/workflows/research.yml", "products/vorsorge/producer/fetch-legal-sources.sh"]}, "required": []}}""")
          ev, ref = os.environ.get("EVENT", ""), os.environ.get("REF", "")
          def glob_re(p):
              # GitHub-Filtermuster: ** beliebig, * ohne '/', ? ein Zeichen, [..] Klasse; Praefix '!' = Ausschluss
              out, i = "", 0
              while i < len(p):
                  c = p[i]
                  if p.startswith("**/", i): out += "(?:.*/)?"; i += 3; continue
                  if p.startswith("**", i): out += ".*"; i += 2; continue
                  if c == "*": out += "[^/]*"
                  elif c == "?": out += "[^/]"
                  elif c == "[":
                      j = p.index("]", i); out += p[i:j + 1]; i = j + 1; continue
                  else: out += re.escape(c)
                  i += 1
              return re.compile("^" + out + "$")
          def match_list(pats, value):
              ok = False
              for p in pats:
                  neg = p.startswith("!")
                  if glob_re(p[1:] if neg else p).match(value): ok = not neg
              return ok
          def files():
              try: commits = json.loads(os.environ.get("COMMITS") or "[]") or []
              except Exception: commits = []
              fs = set()
              for c in commits:
                  for k in ("added", "modified", "removed"): fs.update(c.get(k) or [])
              return fs, len(commits)
          def push_ok(r):
              if ref.startswith("refs/heads/"):
                  name = ref[11:]
                  if "branches" in r and not match_list(r["branches"], name): return False
                  if "branches-ignore" in r and match_list(r["branches-ignore"], name): return False
                  if ("tags" in r) and "branches" not in r and "branches-ignore" not in r: return False
              elif ref.startswith("refs/tags/"):
                  name = ref[10:]
                  if "tags" in r and not match_list(r["tags"], name): return False
                  if "tags-ignore" in r and match_list(r["tags-ignore"], name): return False
                  if ("branches" in r or "branches-ignore" in r) and "tags" not in r and "tags-ignore" not in r: return False
              else: return False
              if "paths" in r or "paths-ignore" in r:
                  fs, n = files()
                  if not fs:
                      # Ereignis ohne Dateiliste (z. B. neuer Zweig): GitHub wertet Pfade dann gegen den Standardzweig aus; hier konservativ: ausloesen
                      return n == 0
                  if "paths" in r and not any(match_list(r["paths"], f) for f in fs): return False
                  if "paths-ignore" in r and all(match_list(r["paths-ignore"], f) for f in fs): return False
              return True
          out = {}
          for teil, r in SPEC.items():
              v = False
              if ev == "workflow_dispatch":
                  v = bool(r.get("dispatch")) and os.environ.get("TEIL") == teil
                  if v:
                      # Pflichteingaben der Quelle gelten nur fuer ihren Teil (im Buendel optional)
                      vals = json.loads(os.environ.get("INPUTS") or "{}") or {}
                      fehlt = [n for n in (r.get("required") or []) if str(vals.get(n) if vals.get(n) is not None else "").strip() == ""]
                      if fehlt: raise SystemExit("Pflichteingabe fehlt fuer Teil " + teil + ": " + ", ".join(fehlt))
              elif ev == "schedule": v = os.environ.get("SCHEDULE") in (r.get("crons") or [])
              elif ev == "push": v = "push" in r and push_ok(r["push"])
              elif ev == "workflow_run" and "workflow_run" in r:
                  w = r["workflow_run"]; b = os.environ.get("WR_BRANCH", "")
                  v = os.environ.get("WR_NAME") in w["workflows"] and os.environ.get("ACTION") in w["types"]
                  if v and w.get("branches") is not None: v = match_list(w["branches"], b)
                  if v and w.get("branches-ignore") is not None: v = not match_list(w["branches-ignore"], b)
              elif ev == "repository_dispatch" and "repository_dispatch" in r:
                  t = r["repository_dispatch"]; v = t is None or os.environ.get("ACTION") in t
              out[teil.replace("-", "_")] = "true" if v else "false"
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              for k, v in out.items(): fh.write(k + "=" + v + "\n"); print(k + "=" + v)
          PY

  # --- portfolio: vormals quant-portfolio-research.yml
  portfolio:
    needs: [auswahl]
    if: >-
      needs.auswahl.outputs.portfolio == 'true' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[quant-portfolio-research]') || contains(github.event.head_commit.message, '[edge-e3:') || contains(github.event.head_commit.message, '[edge2:'))
    permissions: {contents: write}
    concurrency:
      group: quant-portfolio-research-${{ github.ref_name }}-${{ (github.event_name == 'push' && !contains(github.event.head_commit.message, '[quant-portfolio-research]') && !contains(github.event.head_commit.message, '[edge-e3:') && !contains(github.event.head_commit.message, '[edge2:')) && github.run_id || 'run' }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Market Pulse und andere Daten, die nur noch im Datenzweig wachsen (core/registry/data-branch.json).
      - name: Datenzweig in den Arbeitsbaum
        run: scripts/ci/seed-data-branch.sh alle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Modus aus der Commit-Nachricht
        id: m
        env:
          MSG: ${{ github.event.head_commit.message }}
          IN_MODE: ${{ inputs.mode }}
          REVIEWER_B64: ${{ inputs.reviewer_public_key_b64 }}
        run: |
          set -euo pipefail
          m=$(printf '%s' "$MSG" | grep -oE '\[edge-e3:(dev-quant|test-quant)\]' | head -1 | sed -E 's/\[edge-e3:([a-z-]+)\]/\1/' || true)
          if printf '%s' "$MSG" | grep -qF '[edge2:dev]'; then m=edge2; fi
          if printf '%s' "$MSG" | grep -qF '[edge2:blind-build]'; then m=edge2-blind-build; fi
          if printf '%s' "$MSG" | grep -qF '[edge2:blind-resolve]'; then m=edge2-blind-resolve; fi
          if printf '%s' "$MSG" | grep -qF '[edge2:blind2-build]'; then m=edge2-blind2-build; fi
          if printf '%s' "$MSG" | grep -qF '[edge2:blind2-resolve]'; then m=edge2-blind2-resolve; fi
          if printf '%s' "$MSG" | grep -qF '[edge2:dna-learn]'; then m=edge2-dna-learn; fi
          if printf '%s' "$MSG" | grep -qF '[edge2:dna-test]'; then m=edge2-dna-test; fi
          if [ "${IN_MODE:-}" = "holdout-quant" ]; then
            m=holdout-quant
            [[ "$REVIEWER_B64" =~ ^[A-Za-z0-9+/=]+$ ]] || { echo "REVIEWER_KEY_REQUIRED"; exit 2; }
            mkdir -p "$RUNNER_TEMP/holdout/upload"
            printf '%s' "$REVIEWER_B64" | base64 -d > "$RUNNER_TEMP/holdout/reviewer.pem"
            openssl pkey -pubin -in "$RUNNER_TEMP/holdout/reviewer.pem" -noout || { echo "REVIEWER_KEY_NOT_A_PUBLIC_KEY"; exit 2; }
          fi
          echo "mode=${m:-portfolios}" >> "$GITHUB_OUTPUT"
          echo "Modus: ${m:-portfolios}"

      - name: R2-Zugang vorhanden
        env:
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
          V13_ARCHIVE_PRIVATE_KEY: ${{ secrets.V13_ARCHIVE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for v in VU_HISTORY_S3_ENDPOINT VU_HISTORY_S3_BUCKET VU_HISTORY_S3_ACCESS_KEY_ID VU_HISTORY_S3_SECRET_ACCESS_KEY V13_ARCHIVE_PRIVATE_KEY; do
            if [ -z "${!v}" ]; then echo "::error::$v fehlt"; exit 1; fi
          done

      - name: Lesender Vorabcheck (Nullkostengrenze)
        env:
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_REGION: ${{ secrets.VU_HISTORY_S3_REGION }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
        run: >-
          node scripts/market/preflight-zero-cost.mjs --operation RECOVERY --gate FULL_UNIVERSE
          --out "$RUNNER_TEMP/portfolio-preflight.json"

      - name: Tagesbalken aus der Historienablage (nur Runner)
        env:
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_REGION: ${{ secrets.VU_HISTORY_S3_REGION }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
        run: >-
          node scripts/market/sync-history-store.mjs --pull --gate FULL_UNIVERSE --concurrency 24
          --preflight "$RUNNER_TEMP/portfolio-preflight.json"
          --work-dir "$RUNNER_TEMP/canonical-history"
          --report "$RUNNER_TEMP/portfolio-sync.json"

      - name: Delistete Titel aus dem V13-Archiv (privater Schluessel nur in diesem Schritt)
        env:
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_REGION: ${{ secrets.VU_HISTORY_S3_REGION }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
          V13_ARCHIVE_PRIVATE_KEY: ${{ secrets.V13_ARCHIVE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          node scripts/quant/v13/archive/r2-restore.mjs --mode extract --parts v13-derived,v13-raw \
            --dest "$RUNNER_TEMP/priv" --manifest docs/quant-recovery/v13/archive/manifest-1.2.0.json --prefix research-snapshots/quant-v13/archive-1.2.0/
          first=$(python3 -I -c 'import json,sys;r=json.load(open(sys.argv[1]));f=r["columns"];rows=r["rows"];i=f.index("chainId");s=f.index("status");print(next(x[i] for x in rows if x[s]=="QUALIFIED"))' docs/quant-recovery/v13/delisted/register-1.0.0.json)
          hit=$(find "$RUNNER_TEMP/priv/v13-derived" -name "$first.json" -print -quit); test -n "$hit"
          echo "DELISTED_DIR=$(dirname "$hit")" >> "$GITHUB_ENV"
          rawf=$(find "$RUNNER_TEMP/priv/v13-raw" -name 'series.jsonl.gz' -print -quit); test -n "$rawf"
          echo "DELISTED_RAW_DIR=$RUNNER_TEMP/priv/v13-raw" >> "$GITHUB_ENV"
          echo "Rohdateien: $(find "$RUNNER_TEMP/priv/v13-raw" -name 'series.jsonl.gz' | wc -l)"
          echo "Reihen: $(find "$(dirname "$hit")" -maxdepth 1 -name '*.json' | wc -l)"

      - name: SEC-Fundamentaldaten wie erstmals eingereicht (oeffentlich, companyfacts.zip)
        run: |
          set -euo pipefail
          python3 scripts/quant/portfolio/build_pit_fundamentals.py --out "$RUNNER_TEMP/pit-fundamentals" --bulk --workers 4

      - name: Musterportfolios rechnen
        if: steps.m.outputs.mode == 'portfolios'
        run: |
          set -euo pipefail
          mkdir -p docs/quant/research/portfolio-v1
          node --max-old-space-size=12288 scripts/quant/portfolio/model-portfolios.cjs \
            --work-dir "$RUNNER_TEMP/canonical-history" --delisted-dir "$DELISTED_DIR" --delisted-raw-dir "$DELISTED_RAW_DIR" \
            --fundamentals "$RUNNER_TEMP/pit-fundamentals" --sensitivity \
            --out docs/quant/research/portfolio-v1/model-portfolios.json
          node scripts/quant/portfolio/render-model-portfolios.cjs --in docs/quant/research/portfolio-v1/model-portfolios.json \
            --out docs/quant/research/portfolio-v1/MODEL_PORTFOLIOS.md
          node scripts/quant/portfolio/export-model-portfolios-bundle.cjs
          rm -rf "$RUNNER_TEMP/priv" "$RUNNER_TEMP/canonical-history"

      - name: Holdout 2008-2015 Quant (einmalig, Protokoll gepinnt, nur versiegelt)
        if: steps.m.outputs.mode == 'holdout-quant'
        env:
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_REGION: ${{ secrets.VU_HISTORY_S3_REGION }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          umask 077
          H="$RUNNER_TEMP/holdout"
          node --test scripts/research/holdout/holdout.test.cjs
          node --max-old-space-size=12288 scripts/research/holdout/quant-holdout.cjs \
            --work-dir "$RUNNER_TEMP/canonical-history" --delisted-dir "$DELISTED_DIR" --delisted-raw-dir "$DELISTED_RAW_DIR" \
            --fundamentals "$RUNNER_TEMP/pit-fundamentals" --out "$H/out" --reviewer-key "$H/reviewer.pem" > "$H/run.log" 2>&1 || { tail -n 20 "$H/run.log" | grep -vE '[0-9]\.[0-9]{3,}' || true; exit 1; }
          cp "$H/out/quant-holdout.public.json" "$H/out"/quant-holdout.sealed.*.json "$H/upload/"
          grep -q '"schema":"supertrader-sealed-1.0.0"' "$H/upload/quant-holdout.sealed.owner.json"
          node -e 'const p=require(process.argv[1]); for (const k of ["totalReturn","cagr","maxDrawdown","sharpe"]) if (JSON.stringify(p).includes("\""+k+"\"")) { console.log("METRIC_IN_PUBLIC_PART"); process.exit(1); }' "$H/upload/quant-holdout.public.json"
          cat "$H/upload/quant-holdout.public.json"
          find "$H/out" -type f -exec shred -u {} +
          rm -rf "$RUNNER_TEMP/priv" "$RUNNER_TEMP/canonical-history"
      - uses: actions/upload-artifact@v4
        if: steps.m.outputs.mode == 'holdout-quant'
        with:
          name: holdout-quant-${{ github.run_id }}
          path: ${{ runner.temp }}/holdout/upload
          retention-days: 7
          if-no-files-found: error

      - name: Edge 2 rechnen (Protokoll gepinnt, Ergebnis versiegelt)
        if: steps.m.outputs.mode == 'edge2'
        run: |
          set -euo pipefail
          umask 077
          X="$RUNNER_TEMP/edge2"
          mkdir -p "$X" docs/research/edge2/results
          node --test scripts/research/edge2/edge2.test.cjs
          node --max-old-space-size=12288 scripts/research/edge2/run-edge2.cjs \
            --work-dir "$RUNNER_TEMP/canonical-history" --delisted-dir "$DELISTED_DIR" --delisted-raw-dir "$DELISTED_RAW_DIR" \
            --fundamentals "$RUNNER_TEMP/pit-fundamentals" --out "$X/out" --reviewer-key docs/research/edge2/reviewer-public.pem > "$X/run.log" 2>&1 || { tail -n 30 "$X/run.log" | grep -vE '[0-9]\.[0-9]{3,}' || true; exit 1; }
          grep -E '^\{"(id|panel)"' "$X/run.log" | grep -vE '[0-9]\.[0-9]{3,}' || true
          grep -q '"schema":"supertrader-sealed-1.0.0"' "$X/out/edge2.sealed.owner.json"
          node -e 'const t=require("fs").readFileSync(process.argv[1],"utf8"); for (const k of ["totalReturn","cagr","maxDrawdown","sharpe","weeklyReturns"]) if (t.includes("\""+k+"\"")) { console.log("METRIC_IN_PUBLIC_PART"); process.exit(1); }' "$X/out/edge2.public.json"
          cp "$X/out/edge2.public.json" "$X/out/edge2.sealed.owner.json" "$X/out/edge2.sealed.reviewer.json" docs/research/edge2/results/
          cat docs/research/edge2/results/edge2.public.json
          find "$X" -type f -exec shred -u {} +
          rm -rf "$RUNNER_TEMP/priv" "$RUNNER_TEMP/canonical-history"

      - name: Edge 2 blinder KI-Backtest (Pakete bauen oder Auswahlen aufloesen)
        if: startsWith(steps.m.outputs.mode, 'edge2-blind')
        env:
          MODE: ${{ steps.m.outputs.mode }}
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_REGION: ${{ secrets.VU_HISTORY_S3_REGION }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          umask 077
          X="$RUNNER_TEMP/edge2-blind"
          study=v1; dir=docs/research/edge2/ki/blind
          case "$MODE" in edge2-blind2-*) study=v2; dir=docs/research/edge2/ki/blind-v2 ;; esac
          mkdir -p "$X" "$dir"
          node --test scripts/research/edge2/blind.test.cjs
          phase=build; case "$MODE" in *-resolve) phase=resolve ;; esac
          node --max-old-space-size=12288 scripts/research/edge2/run-blind.cjs --phase "$phase" --study "$study" \
            --work-dir "$RUNNER_TEMP/canonical-history" --delisted-dir "$DELISTED_DIR" --delisted-raw-dir "$DELISTED_RAW_DIR" \
            --fundamentals "$RUNNER_TEMP/pit-fundamentals" --out "$X/out" > "$X/run.log" 2>&1 || { tail -n 30 "$X/run.log" | grep -vE '[0-9]\.[0-9]{3,}' || true; exit 1; }
          cat "$X/run.log" | grep -vE '[0-9]\.[0-9]{3,}' | tail -n 5 || true
          test ! -e "$X/out/keys.plain.json"
          for f in "$X/out"/*; do case "$(basename "$f")" in packets.json|*.sealed.owner.json|*.sealed.reviewer.json|blind-result.public.json) cp "$f" "$dir/" ;; esac; done
          find "$X" -type f -exec shred -u {} +
          rm -rf "$RUNNER_TEMP/priv" "$RUNNER_TEMP/canonical-history"

      - name: Edge 2 Gewinner-DNA (Formel lernen oder pruefen)
        if: steps.m.outputs.mode == 'edge2-dna-learn' || steps.m.outputs.mode == 'edge2-dna-test'
        env:
          MODE: ${{ steps.m.outputs.mode }}
        run: |
          set -euo pipefail
          umask 077
          X="$RUNNER_TEMP/edge2-dna"
          mkdir -p "$X" docs/research/edge2/dna
          phase=learn; [ "$MODE" = "edge2-dna-test" ] && phase=test
          node --max-old-space-size=12288 scripts/research/edge2/run-dna.cjs --phase "$phase" \
            --work-dir "$RUNNER_TEMP/canonical-history" --delisted-dir "$DELISTED_DIR" --delisted-raw-dir "$DELISTED_RAW_DIR" \
            --fundamentals "$RUNNER_TEMP/pit-fundamentals" --out "$X/out" > "$X/run.log" 2>&1 || { tail -n 30 "$X/run.log" | grep -vE '[0-9]\.[0-9]{3,}' || true; exit 1; }
          tail -n 3 "$X/run.log" | grep -vE '"(cagr|sharpe|totalReturn)"' || true
          for f in "$X/out"/*; do case "$(basename "$f")" in RULE_FIXED.json|dna.public.json|dna.sealed.owner.json|dna.sealed.reviewer.json) cp "$f" docs/research/edge2/dna/ ;; esac; done
          find "$X" -type f -exec shred -u {} +
          rm -rf "$RUNNER_TEMP/priv" "$RUNNER_TEMP/canonical-history"

      - name: E3-Phase rechnen (Protokoll eingefroren, Hash geprueft)
        if: steps.m.outputs.mode != 'portfolios' && steps.m.outputs.mode != 'holdout-quant' && !startsWith(steps.m.outputs.mode, 'edge2')
        env:
          PHASE: ${{ steps.m.outputs.mode }}
        run: |
          set -euo pipefail
          node --test scripts/research/edge/study.test.cjs scripts/research/edge/edge-quant.test.cjs
          node --max-old-space-size=12288 scripts/research/edge/run-e3.cjs --phase "$PHASE" \
            --work-dir "$RUNNER_TEMP/canonical-history" --delisted-dir "$DELISTED_DIR" --delisted-raw-dir "$DELISTED_RAW_DIR" \
            --fundamentals "$RUNNER_TEMP/pit-fundamentals"
          node scripts/research/edge/run-e3.cjs --phase report
          rm -rf "$RUNNER_TEMP/priv" "$RUNNER_TEMP/canonical-history"

      - name: Tests und Datenhygiene
        run: |
          node --test quant/tests/portfolio-standard.test.mjs quant/tests/model-portfolios-result.test.mjs workers/vu-account/tests/backtests.test.mjs
          # Der Hygiene-Check scannt das ganze Repository. Fundstellen ausserhalb der eigenen Ausgabepfade bestehen schon auf main
          # und gehoeren anderen Erzeugern; dieser Lauf scheitert nur an Fundstellen in seinen eigenen Pfaden.
          set +e; node scripts/market/assert-public-data-hygiene.mjs > "$RUNNER_TEMP/hygiene.txt" 2>&1; rc=$?; set -e
          if [ "$rc" -ne 0 ]; then
            echo "Hygiene-Fundstellen gesamt: $(grep -c '^  - ' "$RUNNER_TEMP/hygiene.txt" || true)"
            if grep -E '^  - (docs/research/edge|docs/research/edge2|docs/quant/research/portfolio-v1|workers/vu-account/data/model-portfolios-bundle)' "$RUNNER_TEMP/hygiene.txt"; then exit 1; fi
            echo "::warning::Hygiene-Fundstellen nur ausserhalb der Ausgabepfade dieses Laufs (bestehen auf main)."
          fi

      - name: Ergebnis auf den aktuellen Zweig committen
        if: steps.m.outputs.mode != 'holdout-quant'
        env:
          MODE: ${{ steps.m.outputs.mode }}
        run: |
          git config user.name "vision-universe-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/quant/research/portfolio-v1 workers/vu-account/data/model-portfolios-bundle.json docs/research/edge
          if [ -d docs/research/edge2/results ]; then git add docs/research/edge2/results; fi
          if [ -d docs/research/edge2/ki/blind ]; then git add docs/research/edge2/ki/blind; fi
          if [ -d docs/research/edge2/ki/blind-v2 ]; then git add docs/research/edge2/ki/blind-v2; fi
          if [ -d docs/research/edge2/dna ]; then git add docs/research/edge2/dna; fi
          if git diff --cached --quiet; then echo "Ergebnis unveraendert."; exit 0; fi
          git commit -m "Quant-Forschungslauf ${MODE} (Lauf ${GITHUB_RUN_ID})"
          scripts/ci/push-with-retry.sh "${GITHUB_REF_NAME}"

  # --- mustervolumen: vormals pattern-research-volume.yml
  mustervolumen:
    needs: [auswahl]
    if: >-
      needs.auswahl.outputs.mustervolumen == 'true' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[pattern-research-volume]'))
    permissions: {contents: write}
    concurrency:
      group: pattern-research-volume-${{ github.ref_name }}-${{ (github.event_name == 'push' && !contains(github.event.head_commit.message, '[pattern-research-volume]')) && github.run_id || 'run' }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      # Spitze des Zweigs, nicht der Ausloese-Commit (wartende Laeufe, Audit 03.10.2026).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Market Pulse und andere Daten, die nur noch im Datenzweig wachsen (core/registry/data-branch.json).
      - name: Datenzweig in den Arbeitsbaum
        run: scripts/ci/seed-data-branch.sh alle

      - name: Existing R2 credentials are available
        env:
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
        run: |
          for v in VU_HISTORY_S3_ENDPOINT VU_HISTORY_S3_BUCKET VU_HISTORY_S3_ACCESS_KEY_ID VU_HISTORY_S3_SECRET_ACCESS_KEY; do
            if [ -z "${!v}" ]; then echo "::error::$v fehlt"; exit 1; fi
          done

      - name: Measured read-only recovery preflight
        env:
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_REGION: ${{ secrets.VU_HISTORY_S3_REGION }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
        run: >-
          node scripts/market/preflight-zero-cost.mjs --operation RECOVERY --gate FULL_UNIVERSE
          --out "$RUNNER_TEMP/pattern-volume-preflight.json"

      - name: Restore existing canonical history to runner-private state
        env:
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_REGION: ${{ secrets.VU_HISTORY_S3_REGION }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
        run: >-
          node scripts/market/sync-history-store.mjs --pull --gate FULL_UNIVERSE --concurrency 24
          --preflight "$RUNNER_TEMP/pattern-volume-preflight.json"
          --work-dir "$RUNNER_TEMP/canonical-history"
          --report "$RUNNER_TEMP/pattern-volume-sync.json"

      - name: Pattern Research study with volume features (pattern-research-1.1.0)
        run: >-
          node --max-old-space-size=6144 scripts/quant/build-pattern-research.mjs
          --work-dir "$RUNNER_TEMP/canonical-history"

      - name: Pattern Research fundamental overlay (same engine version)
        run: node --max-old-space-size=6144 scripts/quant/build-pattern-research-fundamentals.mjs

      - name: VU Pattern Match (reads the studies just written)
        run: node --max-old-space-size=6144 scripts/quant/build-pattern-match.mjs

      - name: Contract and regression tests
        run: node --test quant/tests/pattern-research.test.mjs quant/tests/pattern-research-volume.test.mjs quant/tests/pattern-unavailability.test.mjs

      - name: Public data hygiene
        run: node scripts/market/assert-public-data-hygiene.mjs

      - name: Volume findings (aggregates only)
        run: |
          node -e '
            const s = require("./quant/data/product/pattern-research-v1/study.json");
            const m = require("./quant/methodology/pattern-research-v1.json");
            const vol = new Set(m.candidates.filter((c) => c.addedIn).map((c) => c.id));
            console.log({ methodology: s.methodologyVersion, hypotheses: s.primary.hypotheses, baseRate: s.primary.baseRate, volumeCoverage: s.population.volumeCoverage });
            console.log("1.0.0 allein:", JSON.stringify(s.primary.correctionV100Only));
            for (const f of s.findings.filter((f) => f.patternId.split("+").some((id) => vol.has(id)))) {
              console.log([f.verdict, "lift=" + f.lift, "oos=" + (f.outOfSample && f.outOfSample.lift), "n=" + f.support, "w=" + f.winners, "loss=" + f.lossLift, "p=" + f.pValue, f.patternId].join("  "));
            }'

      - name: Commit the study to the current branch
        run: |
          git config user.name "vision-universe-bot"
          git config user.email "actions@users.noreply.github.com"
          git add quant/data/product/pattern-research-v1 quant/data/product/pattern-research-fundamentals-v1 quant/data/product/pattern-match-v1
          if git diff --cached --quiet; then echo "Studie unveraendert."; exit 0; fi
          git commit -m "Gewinnerstudie pattern-research-1.1.0 mit Volumenmerkmalen neu gerechnet (Lauf ${GITHUB_RUN_ID})"
          scripts/ci/push-with-retry.sh "${GITHUB_REF_NAME}"

      - name: Retain metadata evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pattern-research-volume-evidence
          path: |
            ${{ runner.temp }}/pattern-volume-preflight.json
            ${{ runner.temp }}/pattern-volume-sync.json
            quant/data/product/pattern-research-v1/study.json
          if-no-files-found: warn
          retention-days: 30

  # --- labor: vormals research-labor.yml
  labor:
    needs: [auswahl]
    if: >-
      needs.auswahl.outputs.labor == 'true' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[labor:'))
    permissions: {contents: write}
    concurrency:
      group: research-labor-${{ github.ref_name }}-${{ (github.event_name == 'push' && !contains(github.event.head_commit.message, '[labor:')) && github.run_id || 'run' }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Market Pulse und andere Daten, die nur noch im Datenzweig wachsen (core/registry/data-branch.json).
      - name: Datenzweig in den Arbeitsbaum
        run: scripts/ci/seed-data-branch.sh alle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Phase bestimmen
        id: m
        env:
          MSG: ${{ github.event.head_commit.message }}
          INPUT_PHASE: ${{ inputs.phase }}
        run: |
          set -euo pipefail
          p="${INPUT_PHASE:-}"
          if [ -z "$p" ]; then p=$(printf '%s' "$MSG" | grep -oE '\[labor:(dev|test|holdout)\]' | head -1 | sed -E 's/\[labor:([a-z]+)\]/\1/' || true); fi
          case "$p" in dev|test|holdout) ;; *) echo "::error::Phase unbekannt: '$p'"; exit 1;; esac
          echo "phase=$p" >> "$GITHUB_OUTPUT"; echo "Phase: $p"

      - name: Labor-Tests (synthetisch) und Protokoll-Hash
        run: |
          set -euo pipefail
          node --test scripts/research/labor/labor.test.cjs scripts/research/labor/labor-stock.test.cjs scripts/research/labor/build-insider.test.mjs
          python3 -m unittest discover -s scripts/research/labor/tests -p 'test_*.py'

      - name: R2-Zugang vorhanden
        env:
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
          V13_ARCHIVE_PRIVATE_KEY: ${{ secrets.V13_ARCHIVE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for v in VU_HISTORY_S3_ENDPOINT VU_HISTORY_S3_BUCKET VU_HISTORY_S3_ACCESS_KEY_ID VU_HISTORY_S3_SECRET_ACCESS_KEY V13_ARCHIVE_PRIVATE_KEY; do
            if [ -z "${!v}" ]; then echo "::error::$v fehlt"; exit 1; fi
          done

      - name: Lesender Vorabcheck (Nullkostengrenze)
        env:
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_REGION: ${{ secrets.VU_HISTORY_S3_REGION }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
        run: >-
          node scripts/market/preflight-zero-cost.mjs --operation RECOVERY --gate FULL_UNIVERSE
          --out "$RUNNER_TEMP/labor-preflight.json"

      - name: Tagesbalken aus der Historienablage (nur Runner)
        env:
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_REGION: ${{ secrets.VU_HISTORY_S3_REGION }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
        run: >-
          node scripts/market/sync-history-store.mjs --pull --gate FULL_UNIVERSE --concurrency 24
          --preflight "$RUNNER_TEMP/labor-preflight.json"
          --work-dir "$RUNNER_TEMP/canonical-history"
          --report "$RUNNER_TEMP/labor-sync.json"

      - name: Delistete Titel aus dem V13-Archiv (privater Schluessel nur in diesem Schritt)
        env:
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_REGION: ${{ secrets.VU_HISTORY_S3_REGION }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
          V13_ARCHIVE_PRIVATE_KEY: ${{ secrets.V13_ARCHIVE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          node scripts/quant/v13/archive/r2-restore.mjs --mode extract --parts v13-derived,v13-raw \
            --dest "$RUNNER_TEMP/priv" --manifest docs/quant-recovery/v13/archive/manifest-1.2.0.json --prefix research-snapshots/quant-v13/archive-1.2.0/
          first=$(python3 -I -c 'import json,sys;r=json.load(open(sys.argv[1]));f=r["columns"];rows=r["rows"];i=f.index("chainId");s=f.index("status");print(next(x[i] for x in rows if x[s]=="QUALIFIED"))' docs/quant-recovery/v13/delisted/register-1.0.0.json)
          hit=$(find "$RUNNER_TEMP/priv/v13-derived" -name "$first.json" -print -quit); test -n "$hit"
          echo "DELISTED_DIR=$(dirname "$hit")" >> "$GITHUB_ENV"
          echo "DELISTED_RAW_DIR=$RUNNER_TEMP/priv/v13-raw" >> "$GITHUB_ENV"

      - name: SEC companyfacts.zip (oeffentlich, einmal geladen)
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || 'VisionUniverseResearch info@visionuniverse.de' }}
        run: |
          set -euo pipefail
          curl -sSfL --retry 4 --retry-delay 10 -A "$SEC_USER_AGENT" -o "$RUNNER_TEMP/companyfacts.zip" \
            https://www.sec.gov/Archives/edgar/daily-index/xbrl/companyfacts.zip
          ls -l "$RUNNER_TEMP/companyfacts.zip"

      - name: SEC-Fundamentaldaten wie erstmals eingereicht (Lesart ORIGINAL)
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || 'VisionUniverseResearch info@visionuniverse.de' }}
        run: |
          set -euo pipefail
          python3 scripts/quant/portfolio/build_pit_fundamentals.py --out "$RUNNER_TEMP/pit-fundamentals" --archive "$RUNNER_TEMP/companyfacts.zip" --workers 4

      - name: Gewinnueberraschung (SUE) aus companyfacts
        run: |
          set -euo pipefail
          python3 scripts/research/labor/build_sue.py --companyfacts "$RUNNER_TEMP/companyfacts.zip" \
            --fund-index "$RUNNER_TEMP/pit-fundamentals/index.json" --out "$RUNNER_TEMP/labor-events/sue.json"
          rm -f "$RUNNER_TEMP/companyfacts.zip"

      - name: SEC Insider Transactions Data Sets (Form 3/4/5, Quartale 2007q1 bis 2026q3)
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || 'VisionUniverseResearch info@visionuniverse.de' }}
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/form345"; mkdir -p "$d"
          for y in $(seq 2007 2026); do for q in 1 2 3 4; do
            n="${y}q${q}"; if [ "$n" \> "2026q3" ]; then continue; fi
            code=$(curl -sSL --retry 3 --retry-delay 5 -A "$SEC_USER_AGENT" -o "$d/${n}_form345.zip" -w '%{http_code}' \
              "https://www.sec.gov/files/structureddata/data/insider-transactions-data-sets/${n}_form345.zip" || true)
            if [ "$code" != "200" ]; then echo "::warning::Insider-Datensatz $n: HTTP $code"; rm -f "$d/${n}_form345.zip"; fi
            sleep 0.3
          done; done
          ls "$d" | wc -l
          node scripts/research/labor/build-insider.mjs --datasets "$d" --fund-index "$RUNNER_TEMP/pit-fundamentals/index.json" \
            --from 2007q1 --to 2026q3 --out "$RUNNER_TEMP/labor-events/insider.json"
          rm -rf "$d"

      - name: Labor-Phase rechnen (Protokoll eingefroren, Hash geprueft)
        env:
          PHASE: ${{ steps.m.outputs.phase }}
        run: |
          set -euo pipefail
          node --max-old-space-size=12288 scripts/research/labor/run-labor.cjs --phase "$PHASE" \
            --work-dir "$RUNNER_TEMP/canonical-history" --delisted-dir "$DELISTED_DIR" --delisted-raw-dir "$DELISTED_RAW_DIR" \
            --fundamentals "$RUNNER_TEMP/pit-fundamentals" --insider "$RUNNER_TEMP/labor-events/insider.json" --sue "$RUNNER_TEMP/labor-events/sue.json"
          rm -rf "$RUNNER_TEMP/priv" "$RUNNER_TEMP/canonical-history" "$RUNNER_TEMP/labor-events"

      - name: Keine Zahlen im Klartext (nur versiegelt)
        run: |
          set -euo pipefail
          for f in docs/research/labor/runs/*-public.json docs/research/labor/runs/selection.json; do
            [ -f "$f" ] || continue
            if grep -qE '"(cagr|totalReturn|sharpe|maxDrawdown|returns|equity)"' "$f"; then echo "::error::$f enthaelt Kennzahlen"; exit 1; fi
          done

      - name: Ergebnis auf den aktuellen Zweig committen
        env:
          PHASE: ${{ steps.m.outputs.phase }}
        run: |
          git config user.name "vision-universe-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/research/labor/runs
          if git diff --cached --quiet; then echo "Ergebnis unveraendert."; exit 0; fi
          git commit -m "Strategie-Labor Phase ${PHASE} (Lauf ${GITHUB_RUN_ID})"
          scripts/ci/push-with-retry.sh "${GITHUB_REF_NAME}"

  # --- vorsorge-recht: vormals vorsorge-legal-sources.yml
  vorsorge-recht:
    needs: [auswahl]
    if: >-
      needs.auswahl.outputs.vorsorge_recht == 'true' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[vorsorge-legal]'))
    permissions: {contents: write}
    concurrency:
      group: vorsorge-legal-${{ github.ref_name }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      # Market Pulse und andere Daten, die nur noch im Datenzweig wachsen (core/registry/data-branch.json).
      - name: Datenzweig in den Arbeitsbaum
        run: scripts/ci/seed-data-branch.sh alle
      - name: Werkzeug
        run: sudo apt-get install -y -qq poppler-utils > /dev/null
      - name: Primaerquellen laden
        run: bash products/vorsorge/producer/fetch-legal-sources.sh
      - name: Veroeffentlichen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vorsorge/data/funding-rules/sources
          git commit -q -m "Vorsorge: Primaerquellen der Foerderregeln geladen (Lauf ${{ github.run_id }})" || { echo "Keine Aenderung."; exit 0; }
          bash scripts/ci/push-with-retry.sh "${{ github.ref_name }}"

  # --- muster-gesamtrendite: vormals quant-pattern-total-return-check.yml
  muster-gesamtrendite:
    needs: [auswahl]
    if: >-
      needs.auswahl.outputs.muster_gesamtrendite == 'true' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[pattern-total-return-check]'))
    permissions: {contents: read}
    concurrency:
      group: quant-pattern-total-return-check-${{ github.ref_name }}-${{ (github.event_name == 'push' && !contains(github.event.head_commit.message, '[pattern-total-return-check]')) && github.run_id || 'run' }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Market Pulse und andere Daten, die nur noch im Datenzweig wachsen (core/registry/data-branch.json).
      - name: Datenzweig in den Arbeitsbaum
        run: scripts/ci/seed-data-branch.sh alle

      - name: Existing R2 credentials are available
        env:
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
        run: |
          for v in VU_HISTORY_S3_ENDPOINT VU_HISTORY_S3_BUCKET VU_HISTORY_S3_ACCESS_KEY_ID VU_HISTORY_S3_SECRET_ACCESS_KEY; do
            if [ -z "${!v}" ]; then echo "::error::$v fehlt"; exit 1; fi
          done

      - name: Measured read-only recovery preflight
        env:
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_REGION: ${{ secrets.VU_HISTORY_S3_REGION }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
        run: >-
          node scripts/market/preflight-zero-cost.mjs --operation RECOVERY --gate FULL_UNIVERSE
          --out "$RUNNER_TEMP/pattern-check/preflight.json"

      - name: Restore existing canonical history to runner-private state (read only)
        env:
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_REGION: ${{ secrets.VU_HISTORY_S3_REGION }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
        run: >-
          node scripts/market/sync-history-store.mjs --pull --gate FULL_UNIVERSE --concurrency 24
          --preflight "$RUNNER_TEMP/pattern-check/preflight.json"
          --work-dir "$RUNNER_TEMP/canonical-history"
          --report "$RUNNER_TEMP/pattern-check/sync.json"

      # Vorher: genau der regulaere Schritt "Materialize Pattern Research
      # study", nur mit --out statt des Produktpfads.
      - name: Pattern Research - Kursrendite (vorher, wie der regulaere Schritt)
        run: >-
          node --max-old-space-size=6144 scripts/quant/build-pattern-research.mjs
          --work-dir "$RUNNER_TEMP/canonical-history"
          --return-basis price --out "$RUNNER_TEMP/pattern-price"

      - name: Pattern Research - Gesamtrendite (nachher)
        run: >-
          node --max-old-space-size=6144 scripts/quant/build-pattern-research.mjs
          --work-dir "$RUNNER_TEMP/canonical-history"
          --return-basis total --out "$RUNNER_TEMP/pattern-tr"

      # Gepaart: Kursrendite auf genau der Gesamtrendite-Population (reine
      # Populationsauswahl, Forschungslauf, verlangt --out).
      - name: Pattern Research - Kursrendite auf der Gesamtrendite-Population (gepaart)
        run: >-
          node --max-old-space-size=8192 scripts/quant/build-pattern-research.mjs
          --work-dir "$RUNNER_TEMP/canonical-history"
          --return-basis price --population total-return --out "$RUNNER_TEMP/pattern-price-trpop"

      - name: Vergleich vorher/nachher und gepaart A/B/C (nur Aggregate)
        run: >-
          node scripts/quant/research/compare-pattern-return-basis.mjs
          --price "$RUNNER_TEMP/pattern-price" --total "$RUNNER_TEMP/pattern-tr"
          --price-population "$RUNNER_TEMP/pattern-price-trpop"
          --out "$RUNNER_TEMP/pattern-check/pattern-total-return-comparison.json"
          --summary-out "$RUNNER_TEMP/pattern-check/pattern-total-return-full-check.json"
          --paired-out "$RUNNER_TEMP/pattern-check/pattern-total-return-paired-full.json"
          --paired-summary-out "$RUNNER_TEMP/pattern-check/pattern-total-return-paired.json"

      # Was die Zertifizierung mit dieser Studie saehe (vorbereitete
      # Anbindung, nicht aktiv): --pattern-study liest die Gesamtrendite-
      # Studie, --out schreibt ins RUNNER_TEMP. Das committete Zertifikat
      # bleibt unberuehrt.
      - name: Zertifizierungsanbindung mit der Gesamtrendite-Studie (nur Probe)
        run: |
          set -euo pipefail
          node scripts/quant/build-backtest-certification.mjs \
            --pattern-study "$RUNNER_TEMP/pattern-tr/study.json" \
            --out "$RUNNER_TEMP/pattern-check/backtest-certification-with-tr.json"
          node -e '
            const d = require(process.env.RUNNER_TEMP + "/pattern-check/backtest-certification-with-tr.json");
            const k = d.kinds.find((x) => x.id === "PATTERN_EVIDENCE");
            console.log(JSON.stringify({ status: k.status, reason: k.reason, gates: k.gates.map((g) => [g.id, g.state, g.reason]) }));'

      - name: Arbeitsbaum unveraendert (kein Produktartefakt geschrieben)
        run: |
          set -euo pipefail
          git status --porcelain
          test -z "$(git status --porcelain)"

      - name: Retain comparison evidence only (no daily bars)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pattern-total-return-check
          path: |
            ${{ runner.temp }}/pattern-check/*.json
            ${{ runner.temp }}/pattern-price/study.json
            ${{ runner.temp }}/pattern-tr/study.json
            ${{ runner.temp }}/pattern-price-trpop/study.json
            ${{ runner.temp }}/pattern-price-trpop/paired-diagnostics.json
          if-no-files-found: warn
          retention-days: 30

      # Abbruch laut FV-5 erst NACH dem Hochladen, damit die Ausschluesse
      # pruefbar bleiben.
      - name: Abdeckung erreicht? (BELOW_MINIMUM_SHARE bricht ab)
        run: |
          set -euo pipefail
          STATE=$(node -e 'console.log(require(process.env.RUNNER_TEMP + "/pattern-check/pattern-total-return-full-check.json").state)')
          echo "Zustand: $STATE"
          if [ "$STATE" != "PASS" ]; then echo "::error::BELOW_MINIMUM_SHARE - zuerst die Ausschluesse pruefen (Runbook R3)"; exit 1; fi

  # --- elliott-register: vormals elliott-prospective-registry.yml
  elliott-register:
    needs: [auswahl]
    if: >-
      needs.auswahl.outputs.elliott_register == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    permissions: {contents: write, issues: write}
    concurrency:
      group: elliott-prospective-registry
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      REG: quant/data/technical-intelligence/elliott-registry
      LONG: quant/data/market/discover-series-long
    steps:
      # Spitze des Branches, nicht der ausloesende Commit: ein Lauf, der hinter einem anderen ansteht, sieht so
      # das Register, das der vorige gerade geschrieben hat.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Market Pulse und andere Daten, die nur noch im Datenzweig wachsen (core/registry/data-branch.json).
      - name: Datenzweig in den Arbeitsbaum
        run: scripts/ci/seed-data-branch.sh alle

      - name: Register vor dem Lauf pruefen
        run: node scripts/technical/elliott-registry/verify.mjs --registry "$REG"

      - name: Faellig?
        id: due
        run: |
          node scripts/technical/elliott-registry/register.mjs --registry "$REG" --pending | tee -a "$GITHUB_OUTPUT"

      - name: Produkt-Eingang sichern (committete Langreihen = Eingang des veroeffentlichten Produkts)
        if: steps.due.outputs.pending != ''
        run: cp -r "$LONG" "$RUNNER_TEMP/product-input"

      - name: Wochenschluesse runner-seitig aus der Historienablage
        if: steps.due.outputs.pending != ''
        env:
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_REGION: ${{ secrets.VU_HISTORY_S3_REGION }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
        run: node scripts/market/publish-long-series.mjs

      # Exit 0 = alles registriert, 3 = fruehere Wochen registriert, eine spaetere nicht (wird committet, Lauf
      # danach rot), sonst = nichts registriert (rot, nichts zu committen).
      - name: Registrieren (Identitaet pruefen, fehlende Wochen nachholen)
        id: reg
        if: steps.due.outputs.pending != ''
        env:
          MAX_WEEKS_INPUT: ${{ inputs.max_weeks }}
        run: |
          set +e
          MW="${MAX_WEEKS_INPUT:-2}"
          case "$MW" in 1|2|3|4) ;; *) echo "::error::max_weeks muss 1-4 sein"; exit 1;; esac
          node --max-old-space-size=6144 scripts/technical/elliott-registry/register.mjs --weekly-dir "$LONG" \
            --registry "$REG" --workers "$(nproc)" --max-weeks "$MW" \
            --product-input-dir "$RUNNER_TEMP/product-input" --identity-sample 120 \
            --data-source "publish-long-series.mjs (runner, Historienablage)" 2>&1 | tee "$RUNNER_TEMP/register.log"
          rc=${PIPESTATUS[0]}
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" != "0" ] && [ "$rc" != "3" ]; then exit "$rc"; fi

      - name: Pruefen (Kette, Snapshots, Identitaet, nur anhaengen gegen den Stand vor dem Lauf)
        if: steps.due.outputs.pending != ''
        run: node scripts/technical/elliott-registry/verify.mjs --registry "$REG" --against-git HEAD

      - name: Auswerten (nur abgelaufene Horizonte)
        if: steps.due.outputs.pending != ''
        run: node scripts/technical/elliott-registry/evaluate-registry.mjs --weekly-dir "$LONG" --registry "$REG" --out "$REG/reports/latest.json"

      - name: Langreihen nicht committen (gehoeren long-series.yml)
        if: always() && steps.due.outputs.pending != ''
        run: |
          git checkout -- "$LONG"
          git clean -fdq "$LONG"

      - name: Commit (nur Register)
        if: steps.due.outputs.pending != ''
        run: |
          git config user.name "vision-universe-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$REG"
          if git diff --cached --quiet; then echo "unveraendert"; exit 0; fi
          git commit -m "Elliott Prospective Registry: $(node -e 'const h=require("./'"$REG"'/HEAD.json");console.log("seq "+h.seq)')"
          scripts/ci/push-with-retry.sh "${GITHUB_REF_NAME}"

      - name: Teilweise nachgeholt → rot
        if: steps.reg.outputs.rc == '3'
        run: |
          echo "::error::Nicht alle faelligen Wochen registriert (siehe Log der Stufe Registrieren). Der naechste Zeitplan holt nach."
          exit 1

      - name: Zusammenfassung
        if: always()
        run: |
          {
            echo "### Elliott Prospective Registry"
            echo "* Faellig: ${{ steps.due.outputs.pending || 'nichts' }} (${{ steps.due.outputs.count || '0' }} Woche/n)"
            echo "* Exit Registrierung: ${{ steps.reg.outputs.rc || '-' }}"
            node -e 'const h=require("./'"$REG"'/HEAD.json");console.log("* Ledger: seq "+h.seq)' || true
            # if statt "[ -f ] &&": unter bash -e beendete das fehlende Log (No-Op-Lauf) die Stufe mit Code 1
            if [ -f "$RUNNER_TEMP/register.log" ]; then echo '```'; tail -n 5 "$RUNNER_TEMP/register.log" | cut -c1-900; echo '```'; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Alarm (Issue oeffnen oder kommentieren)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Elliott-Registry: Wochenlauf fehlgeschlagen"
          BODY="Lauf ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} (${{ github.event_name }}, ${GITHUB_REF_NAME}) ist rot. Faellig war: ${{ steps.due.outputs.pending || 'unbekannt' }}. Der naechste Zeitplan holt fehlende Wochen nach; ohne Behebung bleibt die Woche offen."
          N=$(gh issue list --repo "${{ github.repository }}" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number' || true)
          if [ -n "$N" ]; then gh issue comment "$N" --repo "${{ github.repository }}" --body "$BODY"; else gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body "$BODY"; fi

