          git add vorsorge/data vorsorge/etf vorsorge/sitemap.xml
          git commit -q -m "Vorsorge: Kostenquoten (SEC RR) und europaeische ETF-Listings (ESMA FIRDS, GLEIF) (Lauf ${{ github.run_id }})" || { echo "Keine Aenderung."; exit 0; }
          bash scripts/ci/push-with-retry.sh "${{ github.ref_name }}"

  # --- emerging-leaders: vormals emerging-leaders-study.yml
  emerging-leaders:
    needs: [auswahl]
    if: >-
      needs.auswahl.outputs.emerging_leaders == 'true' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[emerging-leaders-study]'))
    permissions: {contents: write}
    concurrency:
      group: emerging-leaders-study-${{ github.ref_name }}-${{ (github.event_name == 'push' && !contains(github.event.head_commit.message, '[emerging-leaders-study]')) && github.run_id || 'run' }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Market Pulse und andere Daten, die nur noch im Datenzweig wachsen (core/registry/data-branch.json).
      - name: Datenzweig in den Arbeitsbaum
        run: scripts/ci/seed-data-branch.sh alle

      - name: Engine and study contract tests (before any data is read)
        run: node --test quant/tests/emerging-leaders.test.mjs quant/tests/emerging-leaders-study.test.mjs

      - name: Existing R2 credentials are available
        env:
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          for v in VU_HISTORY_S3_ENDPOINT VU_HISTORY_S3_BUCKET VU_HISTORY_S3_ACCESS_KEY_ID VU_HISTORY_S3_SECRET_ACCESS_KEY; do
            if [ -z "${!v}" ]; then echo "::error::$v fehlt"; exit 1; fi
          done

      - name: Measured read-only recovery preflight
        env:
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_REGION: ${{ secrets.VU_HISTORY_S3_REGION }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
        run: >-
          node scripts/market/preflight-zero-cost.mjs --operation RECOVERY --gate FULL_UNIVERSE
          --out "$RUNNER_TEMP/el-preflight.json"

      - name: Restore existing canonical history to runner-private state
        env:
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_REGION: ${{ secrets.VU_HISTORY_S3_REGION }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
        run: >-
          node scripts/market/sync-history-store.mjs --pull --gate FULL_UNIVERSE --concurrency 24
          --preflight "$RUNNER_TEMP/el-preflight.json"
          --work-dir "$RUNNER_TEMP/canonical-history"
          --report "$RUNNER_TEMP/el-sync.json"

      - name: Emerging Leaders study (emerging-leaders-1.0.0)
        env:
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_REGION: ${{ secrets.VU_HISTORY_S3_REGION }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
        run: >-
          node --max-old-space-size=6144 scripts/quant/build-emerging-leaders-study.mjs
          --work-dir "$RUNNER_TEMP/canonical-history"

      - name: Public data hygiene
        run: node scripts/market/assert-public-data-hygiene.mjs

      - name: Findings (aggregates only)
        run: |
          node -e '
            const s = require("./quant/data/product/emerging-leaders-v1/study.json");
            console.log({ status: s.status, evidence: s.evidenceStatus, gate: s.gate, selection: s.selection.chosen, calendar: s.calendar, coverage: s.coverage, sources: s.dataSources, dev: s.development });
            for (const p of Object.keys(s.results)) for (const m of Object.keys(s.results[p])) {
              const r = s.results[p][m][63];
              if (r && r.dates) console.log([p, m, "n=" + r.dates, "names=" + r.avgNames, "gross=" + r.meanExcessGross, "t=" + r.tNW, "netBase=" + r.meanExcessNet.BASE, "spread=" + r.spreadVsUniverse.mean, "spreadT=" + r.spreadVsUniverse.t, "ic=" + (r.ic && r.ic.mean), "icT=" + (r.ic && r.ic.t)].join("  "));
            }
            console.log("random", JSON.stringify(s.random), "fm", JSON.stringify(s.famaMacBeth));'

      - name: Commit the study to the current branch
        run: |
          set -euo pipefail
          git config user.name "vision-universe-bot"
          git config user.email "actions@users.noreply.github.com"
          git add quant/data/product/emerging-leaders-v1
          if git diff --cached --quiet; then echo "Studie unveraendert."; exit 0; fi
          git commit -m "Emerging-Leaders-Studie emerging-leaders-1.0.0 gerechnet (Lauf ${GITHUB_RUN_ID})"
          scripts/ci/push-with-retry.sh "${GITHUB_REF_NAME}"

      - name: Retain metadata evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emerging-leaders-study-evidence
          path: |
            ${{ runner.temp }}/el-preflight.json
            ${{ runner.temp }}/el-sync.json
            quant/data/product/emerging-leaders-v1/study.json
          if-no-files-found: warn
          retention-days: 30

  # --- v13-archiv: vormals quant-v13-archive.yml
  v13-archiv:
    needs: [auswahl]
    if: >-
      needs.auswahl.outputs.v13_archiv == 'true' && (contains(github.event.head_commit.message, '[v13-archive:'))
    permissions: {contents: read}
    concurrency:
      group: quant-v13-archive-${{ github.ref_name }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Market Pulse und andere Daten, die nur noch im Datenzweig wachsen (core/registry/data-branch.json).
      - name: Datenzweig in den Arbeitsbaum
        run: scripts/ci/seed-data-branch.sh alle
      - name: Modus aus der Commit-Nachricht
        id: m
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          m=$(printf '%s' "$MSG" | grep -oE '\[v13-archive:(usage|put|get|verify|keycheck|restore|demos|catalog|keyaudit|regen|verify2)\]' | head -1 | sed -E 's/\[v13-archive:([a-z0-9]+)\]/\1/')
          test -n "$m"
          echo "mode=$m" >> "$GITHUB_OUTPUT"
      - name: Lesegeneration aus readers.json (ohne Secret)
        id: g
        run: |
          set -euo pipefail
          node scripts/quant/v13/archive/reader-generation.mjs >> "$GITHUB_OUTPUT"
      - name: R2 (nur Zaehlungen im Log)
        if: steps.m.outputs.mode == 'usage' || steps.m.outputs.mode == 'put' || steps.m.outputs.mode == 'get' || steps.m.outputs.mode == 'verify'
        env:
          MODE: ${{ steps.m.outputs.mode }}
          READ_MANIFEST: ${{ steps.g.outputs.manifest }}
          READ_PREFIX: ${{ steps.g.outputs.prefix }}
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_REGION: ${{ secrets.VU_HISTORY_S3_REGION }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/a"
          # usage/put: fest 1.2.0 (schreibend bzw. Vorpruefung dazu); get/verify: Lesegeneration
          P=research-snapshots/quant-v13/archive-1.2.0/
          M=docs/quant-recovery/v13/archive/manifest-1.2.0.json
          case "$MODE" in
            usage) node scripts/quant/v13/archive/presign.mjs --mode usage --manifest "$M" --prefix "$P" ;;
            put) node scripts/quant/v13/archive/presign.mjs --mode put --manifest "$M" --prefix "$P" --out "$RUNNER_TEMP/a/urls.json" ;;
            get) node scripts/quant/v13/archive/presign.mjs --mode get --manifest "$READ_MANIFEST" --prefix "$READ_PREFIX" --out "$RUNNER_TEMP/a/urls.json" ;;
            verify) node scripts/quant/v13/archive/presign.mjs --mode verify --manifest "$READ_MANIFEST" --prefix "$READ_PREFIX" ;;
          esac
      - name: Schluesselprobe und Wiederherstellung auf dem Runner (privater Schluessel nur in diesem Schritt)
        if: steps.m.outputs.mode == 'keycheck' || steps.m.outputs.mode == 'restore'
        env:
          MODE: ${{ steps.m.outputs.mode }}
          READ_MANIFEST: ${{ steps.g.outputs.manifest }}
          READ_PREFIX: ${{ steps.g.outputs.prefix }}
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_REGION: ${{ secrets.VU_HISTORY_S3_REGION }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
          V13_ARCHIVE_PRIVATE_KEY: ${{ secrets.V13_ARCHIVE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          node scripts/quant/v13/archive/r2-restore.mjs --mode "$MODE" --manifest "$READ_MANIFEST" --prefix "$READ_PREFIX"
      - name: Private Teile fuer Demofaelle bzw. Katalog wiederherstellen (privater Schluessel nur in diesem Schritt)
        if: steps.m.outputs.mode == 'demos' || steps.m.outputs.mode == 'catalog'
        env:
          READ_MANIFEST: ${{ steps.g.outputs.manifest }}
          READ_PREFIX: ${{ steps.g.outputs.prefix }}
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_REGION: ${{ secrets.VU_HISTORY_S3_REGION }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
          V13_ARCHIVE_PRIVATE_KEY: ${{ secrets.V13_ARCHIVE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          node scripts/quant/v13/archive/r2-restore.mjs --mode extract --parts v13-derived,v10-factor-panel \
            --dest "$RUNNER_TEMP/priv" --manifest "$READ_MANIFEST" --prefix "$READ_PREFIX"
      - name: Demofaelle neu bauen, gegenrechnen, vergleichen (Ausgabe nur Zaehlungen)
        if: steps.m.outputs.mode == 'demos'
        run: |
          set -euo pipefail
          P="$RUNNER_TEMP/priv"; O="$RUNNER_TEMP/demo-out"; mkdir -p "$O"
          first=$(python3 -I -c 'import json,sys;r=json.load(open(sys.argv[1]));f=r["fields"] if "fields" in r else r["columns"];rows=r["rows"];i=f.index("chainId");s=f.index("status");print(next(x[i] for x in rows if x[s]=="QUALIFIED"))' docs/quant-recovery/v13/delisted/register-1.0.0.json)
          hit=$(find "$P/v13-derived" -name "$first.json" -print -quit)
          test -n "$hit"
          DL=$(dirname "$hit")
          PANEL=$(find "$P/v10-factor-panel" -name 'panel.jsonl.gz' -print -quit)
          test -n "$PANEL"
          echo "Reihen im Verzeichnis: $(find "$DL" -maxdepth 1 -name '*.json' | wc -l), Panel: $(stat -c %s "$PANEL") B"
          node --max-old-space-size=12288 scripts/quant/research/build-backtest-demos.cjs --out "$O/demos" \
            --cache "$RUNNER_TEMP/demo-cache" --private-delisted "$DL" --private-factor-panel "$PANEL" --qa-dir "$RUNNER_TEMP/demo-qa"
          python3 -I scripts/quant/verify-backtest-runner.py --qa-dir "$RUNNER_TEMP/demo-qa" --private-delisted "$DL" --out "$O/verify-report.json"
          node scripts/quant/research/compare-backtest-demos.cjs --a docs/quant/backtest-demos --b "$O/demos" \
            --out "$O/comparison.json" --markdown-out "$O/comparison.md"
          rm -rf "$P" "$RUNNER_TEMP/demo-qa" "$RUNNER_TEMP/demo-cache"
      - name: Backtest-Katalog rechnen, gegenrechnen, Integritaet pruefen (Ausgabe nur Zaehlungen)
        if: steps.m.outputs.mode == 'catalog'
        run: |
          set -euo pipefail
          P="$RUNNER_TEMP/priv"; O="$RUNNER_TEMP/catalog-out"; mkdir -p "$O"
          first=$(python3 -I -c 'import json,sys;r=json.load(open(sys.argv[1]));f=r["columns"];rows=r["rows"];i=f.index("chainId");s=f.index("status");print(next(x[i] for x in rows if x[s]=="QUALIFIED"))' docs/quant-recovery/v13/delisted/register-1.0.0.json)
          hit=$(find "$P/v13-derived" -name "$first.json" -print -quit); test -n "$hit"; DL=$(dirname "$hit")
          PANEL=$(find "$P/v10-factor-panel" -name 'panel.jsonl.gz' -print -quit); test -n "$PANEL"
          node --max-old-space-size=12288 scripts/quant/research/build-backtest-catalog.cjs --out "$O/catalog" \
            --cache "$RUNNER_TEMP/catalog-cache" --private-delisted "$DL" --private-factor-panel "$PANEL" --qa-dir "$RUNNER_TEMP/catalog-qa"
          python3 -I scripts/quant/verify-backtest-runner.py --qa-dir "$RUNNER_TEMP/catalog-qa" --private-delisted "$DL" --out "$O/verify-report.json"
          node -e 'const C=require("./scripts/quant/research/build-backtest-catalog.cjs");const v=C.catalogViolations(process.argv[1]);console.log(JSON.stringify({violations:v.length}));if(v.length)process.exit(1)' "$O/catalog"
          rm -rf "$P" "$RUNNER_TEMP/catalog-qa" "$RUNNER_TEMP/catalog-cache"
      - uses: actions/upload-artifact@v4
        if: steps.m.outputs.mode == 'catalog'
        with:
          name: v13-archive-catalog-${{ github.run_id }}
          path: ${{ runner.temp }}/catalog-out
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: steps.m.outputs.mode == 'demos'
        with:
          name: v13-archive-demos-${{ github.run_id }}
          path: ${{ runner.temp }}/demo-out
          retention-days: 7
          if-no-files-found: error
      - name: Schluesselpruefung aller Manifeste (nur Laengen, privater Schluessel nur in diesem Schritt)
        if: steps.m.outputs.mode == 'keyaudit'
        env:
          V13_ARCHIVE_PRIVATE_KEY: ${{ secrets.V13_ARCHIVE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          D=docs/quant-recovery/v13/archive
          ms="$D/manifest-1.0.0.json,$D/manifest-1.1.0.json,$D/manifest-1.2.0.json"
          G2=docs/quant-recovery/v13-archive-gen2/manifest-2.0.0.json
          if [ -f "$G2" ]; then ms="$ms,$G2"; fi
          node scripts/quant/v13/archive/gen2.mjs --mode keyaudit --manifests "$ms" --out "$RUNNER_TEMP/g2/keyaudit.json"
      - name: Neue Generation 2.0.0 aus geprueftem 1.2.0-Klartext (neuer Praefix, kein Ueberschreiben)
        if: steps.m.outputs.mode == 'regen'
        env:
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_REGION: ${{ secrets.VU_HISTORY_S3_REGION }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
          V13_ARCHIVE_PRIVATE_KEY: ${{ secrets.V13_ARCHIVE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          node scripts/quant/v13/archive/gen2.mjs --mode regen --old-manifest docs/quant-recovery/v13/archive/manifest-1.2.0.json \
            --old-prefix research-snapshots/quant-v13/archive-1.2.0/ --prefix research-snapshots/quant-v13/archive-2.0.0/ --version 2.0.0 --out-dir "$RUNNER_TEMP/g2"
      - name: Unabhaengige Wiederherstellung der Generation 2.0.0 (eigener Lauf, nur neue Objekte)
        if: steps.m.outputs.mode == 'verify2'
        env:
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_REGION: ${{ secrets.VU_HISTORY_S3_REGION }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
          V13_ARCHIVE_PRIVATE_KEY: ${{ secrets.V13_ARCHIVE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          node scripts/quant/v13/archive/gen2.mjs --mode verify2 --manifest docs/quant-recovery/v13-archive-gen2/manifest-2.0.0.json \
            --old-manifest docs/quant-recovery/v13/archive/manifest-1.2.0.json --prefix research-snapshots/quant-v13/archive-2.0.0/ --out "$RUNNER_TEMP/g2/verify2.json"
      - uses: actions/upload-artifact@v4
        if: always() && (steps.m.outputs.mode == 'keyaudit' || steps.m.outputs.mode == 'regen' || steps.m.outputs.mode == 'verify2')
        with:
          name: v13-archive-${{ steps.m.outputs.mode }}-${{ github.run_id }}
          path: ${{ runner.temp }}/g2
          retention-days: 30
          if-no-files-found: warn
      - name: URLs verschluesseln (AES-256 + RSA-OAEP), Klartext loeschen
        if: steps.m.outputs.mode == 'put' || steps.m.outputs.mode == 'get'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/a"
          # Passphrase als Hex-Zeile (-pass file: liest nur bis zum ersten \n bzw. NUL; Befund 01.11.2026)
          openssl rand -hex 32 > k.bin
          openssl enc -aes-256-cbc -pbkdf2 -iter 100000 -salt -pass file:k.bin -in urls.json -out urls.json.enc
          openssl pkeyutl -encrypt -pubin -inkey "$GITHUB_WORKSPACE/docs/quant-recovery/v13/archive/archive-pub.pem" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in k.bin -out k.bin.enc
          shred -u k.bin urls.json
          mkdir out && mv urls.json.enc k.bin.enc out/
      - uses: actions/upload-artifact@v4
        if: steps.m.outputs.mode == 'put' || steps.m.outputs.mode == 'get'
        with:
          name: v13-archive-${{ steps.m.outputs.mode }}-${{ github.run_id }}
          path: ${{ runner.temp }}/a/out
          retention-days: 1
          if-no-files-found: error

  # --- etf-universum: vormals vorsorge-etf-universe.yml
  etf-universum:
    needs: [auswahl]
    if: >-
      needs.auswahl.outputs.etf_universum == 'true' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[vorsorge-ingest'))
    permissions: {contents: write}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    # Nebenlaeufigkeit am Job: Pushes ohne Marker werden uebersprungen, statt
    # als wartende Laeufe einen laufenden Ingest zu blockieren.
    concurrency:
      group: vorsorge-etf-universe-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Market Pulse und andere Daten, die nur noch im Datenzweig wachsen (core/registry/data-branch.json).
      - name: Datenzweig in den Arbeitsbaum
        run: scripts/ci/seed-data-branch.sh alle

      - name: Ist ein Zugang hinterlegt?
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
        run: |
          if [ -z "$TIINGO_API_KEY" ]; then echo "Kein TIINGO_API_KEY hinterlegt."; exit 1; fi
          echo "Zugang vorhanden."

      - name: Laufparameter
        id: params
        env:
          MSG: ${{ github.event.head_commit.message }}
          # Eingaben nur ueber env: - nie direkt in das Skript interpoliert (Script-Injection, Audit 03.10.2026).
          IN_LIMIT: ${{ github.event.inputs.limit }}
          IN_PER_HOUR: ${{ github.event.inputs.per_hour }}
        run: |
          limit="$IN_LIMIT"; per_hour="$IN_PER_HOUR"
          case "$limit$per_hour" in *[!0-9]*) echo "::error::limit und per_hour muessen Zahlen sein"; exit 1;; esac
          if printf '%s' "$MSG" | grep -q '\[vorsorge-ingest-canary\]'; then limit=40; fi
          echo "limit=${limit:-0}" >> "$GITHUB_OUTPUT"
          echo "per_hour=${per_hour:-4500}" >> "$GITHUB_OUTPUT"
          echo "Limit ${limit:-0}, Drossel ${per_hour:-4500}/h"

      - name: Arbeitsablage wiederherstellen (Checkpoint)
        uses: actions/cache/restore@v4
        with:
          path: .market-cache/vorsorge
          key: vorsorge-ingest-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vorsorge-ingest-${{ github.ref_name }}-
            vorsorge-ingest-

      - name: ETF-Universum von Tiingo aufnehmen
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          IN_NUR_ZUSATZ: ${{ github.event.inputs.nur_zusatz }}
        run: |
          extra=""
          if [ "$IN_NUR_ZUSATZ" = "true" ]; then extra="--only-extra"; fi
          node products/vorsorge/producer/ingest-tiingo-etfs.mjs --limit "${{ steps.params.outputs.limit }}" --per-hour "${{ steps.params.outputs.per_hour }}" --max-minutes 290 $extra

      - name: Arbeitsablage sichern (auch bei Abbruch)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .market-cache/vorsorge
          key: vorsorge-ingest-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Rohzeilen und Berichte als Artefakt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vorsorge-etf-ingest-${{ github.run_id }}
          path: |
            .market-cache/vorsorge/raw-etf-rows.json
            vorsorge/data/ingest/
          retention-days: 30
          if-no-files-found: warn

      - name: Vorsorge-Stamm bauen
        run: node products/vorsorge/producer/build-etf-data.mjs

      - name: Tests, Qualitaets-Gates, Hygiene
        run: |
          node --test "products/vorsorge/tests/*.test.mjs"
          node products/vorsorge/producer/assert-vorsorge-data.mjs
          # Hygiene ueber alle oeffentlichen Daten. Nach einer Universumsaenderung startet security-master-eligibility.yml
          # diesen Lauf und die Technical-Materialisierung gleichzeitig; bis die Materialisierung fertig ist, stehen dort
          # noch ausgeschiedene Titel (06.11.2026: 30 ETFs). Diese Datei gehoert nicht Vorsorge und wird hier nicht
          # committet - wie im Eignungs-Schritt darf nur dieser Rest bleiben, alles andere bleibt rot.
          set +e
          node scripts/market/assert-public-data-hygiene.mjs > "$RUNNER_TEMP/hygiene.txt" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/hygiene.txt"
          if [ "$rc" != 0 ]; then
            rest="$(grep -E '^ *- ' "$RUNNER_TEMP/hygiene.txt" | grep -v 'quant/data/product/technical-signals-v1/' || true)"
            if [ -n "$rest" ] || ! grep -qE '^ *- ' "$RUNNER_TEMP/hygiene.txt"; then echo "::error::Hygiene-Befunde ausserhalb der laufenden Materialisierung"; exit 1; fi
            echo "::warning::Hygiene: nur Technical-Signale ausserhalb des Umfangs (Materialisierung zieht nach)"
          fi

      - name: Kein Schluessel in Daten oder Berichten
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
        run: |
          if grep -rqF -- "$TIINGO_API_KEY" vorsorge/ .market-cache/vorsorge/ 2>/dev/null; then echo "Schluessel in den Daten gefunden"; exit 1; fi
          echo "Kein Schluessel gefunden."

      - name: Veroeffentlichen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vorsorge/data vorsorge/etf vorsorge/sitemap.xml 2>/dev/null || git add vorsorge/data vorsorge/etf
          git commit -q -m "Vorsorge: ETF-Universum aus Tiingo aufgenommen (Lauf ${{ github.run_id }})" || { echo "Keine Aenderung."; exit 0; }
          bash scripts/ci/push-with-retry.sh "${{ github.ref_name }}"

  # --- delisting-probe: vormals supertrader-delisting-probe.yml
  delisting-probe:
    needs: [auswahl]
    if: >-
      needs.auswahl.outputs.delisting_probe == 'true' && (github.event_name == 'workflow_dispatch' || (contains(github.event.head_commit.message, '[supertrader-probe]') || contains(github.event.head_commit.message, '[supertrader-probe:list-stats]')))
    permissions: {contents: read}
    concurrency:
      group: supertrader-delisting-probe
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Market Pulse und andere Daten, die nur noch im Datenzweig wachsen (core/registry/data-branch.json).
      - name: Datenzweig in den Arbeitsbaum
        run: scripts/ci/seed-data-branch.sh alle
      - name: Probeabruf (Anzahlen, keine Kurse)
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
        run: node scripts/supertrader/probe/delisting-probe.mjs ${{ (inputs.delisting_probe_mode == 'list-stats' || contains(github.event.head_commit.message, '[supertrader-probe:list-stats]')) && '--list-stats' || '' }}

  # --- hausstrategie-forschung: vormals supertrader-house.yml
  hausstrategie-forschung:
    needs: [auswahl]
    if: >-
      needs.auswahl.outputs.hausstrategie_forschung == 'true' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[house:'))
    permissions: {contents: write}
    concurrency:
      group: supertrader-house-${{ (github.event_name == 'push' && !contains(github.event.head_commit.message, '[house:')) && github.run_id || 'main' }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Market Pulse und andere Daten, die nur noch im Datenzweig wachsen (core/registry/data-branch.json).
      - name: Datenzweig in den Arbeitsbaum
        run: scripts/ci/seed-data-branch.sh alle
      - name: Modus bestimmen
        id: mode
        env:
          MSG: ${{ github.event.head_commit.message }}
          INPUT: ${{ inputs.hausstrategie_forschung_mode }}
        run: |
          m="$INPUT"
          case "$MSG" in *"[house:hs4oos]"*) m=hs4oos;; *"[house:hs4-full]"*) m=hs4-full;; *"[house:sec-pit-r13]"*) m=sec-pit-r13;; *"[house:hs3d3-dev]"*) m=hs3d3-dev;; *"[house:hs3d3-holdout]"*) m=hs3d3-holdout;; *"[house:hs3d2-dev]"*) m=hs3d2-dev;; *"[house:hs3d2-holdout]"*) m=hs3d2-holdout;; *"[house:hs3d1-dev]"*) m=hs3d1-dev;; *"[house:hs3d1-holdout]"*) m=hs3d1-holdout;; *"[house:hs3-dev]"*) m=hs3-dev;; *"[house:hs3-holdout]"*) m=hs3-holdout;; *"[house:hs2-dev-smoke]"*) m=hs2-dev-smoke;; *"[house:hs2-dev]"*) m=hs2-dev;; *"[house:hs2-holdout]"*) m=hs2-holdout;; *"[house:dev-smoke]"*) m=dev-smoke;; *"[house:dev]"*) m=dev;; *"[house:holdout]"*) m=holdout;; esac
          echo "mode=${m:-dev-smoke}" >> "$GITHUB_OUTPUT"
      - name: Tests der Hausstrategie
        run: node --test scripts/supertrader/tests/house-hs1.test.mjs
      - name: Auswertung (verschluesselt)
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_REGION: ${{ secrets.VU_HISTORY_S3_REGION }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
          NODE_OPTIONS: --max-old-space-size=14000
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          case "$MODE" in
            dev-smoke) node scripts/supertrader/house/analyze.mjs --mode dev --limit 600 --out "$RUNNER_TEMP/val" ;;
            dev) node scripts/supertrader/house/analyze.mjs --mode dev --out "$RUNNER_TEMP/val" ;;
            holdout) node scripts/supertrader/house/analyze.mjs --mode holdout --out "$RUNNER_TEMP/val" ;;
            hs2-dev-smoke) node scripts/supertrader/house/analyze.mjs --set hs2 --mode dev --limit 600 --out "$RUNNER_TEMP/val" ;;
            hs2-dev) node scripts/supertrader/house/analyze.mjs --set hs2 --mode dev --out "$RUNNER_TEMP/val" ;;
            sec-pit-r13) node scripts/supertrader/validation/sec-pit.mjs --r13 --out "$RUNNER_TEMP/val" ;;
            hs3-dev) node scripts/supertrader/house/analyze.mjs --set hs3 --mode dev --out "$RUNNER_TEMP/val" ;;
            hs4oos)
              # Einmaliger Test 2008-2015 (PREREGISTRATION-HS4-OOS2008.json): erst SEC-Aktienzahl im HOLDOUT-Namensraum, dann die Auswertung.
              ST_WINDOW=HOLDOUT node scripts/supertrader/validation/sec-pit.mjs --r13 --out "$RUNNER_TEMP/secpit"
              ST_WINDOW=HOLDOUT node scripts/supertrader/house/analyze.mjs --set hs4oos --mode oos --out "$RUNNER_TEMP/val" ;;
            hs4-full) node scripts/supertrader/house/analyze.mjs --set hs4 --mode full --out "$RUNNER_TEMP/val" ;;
            hs3d3-dev) node scripts/supertrader/house/analyze.mjs --set hs3d3 --mode dev --out "$RUNNER_TEMP/val" ;;
            hs3d3-holdout) node scripts/supertrader/house/analyze.mjs --set hs3d3 --mode holdout --out "$RUNNER_TEMP/val" ;;
            hs3d2-dev) node scripts/supertrader/house/analyze.mjs --set hs3d2 --mode dev --out "$RUNNER_TEMP/val" ;;
            hs3d2-holdout) node scripts/supertrader/house/analyze.mjs --set hs3d2 --mode holdout --out "$RUNNER_TEMP/val" ;;
            hs3d1-dev) node scripts/supertrader/house/analyze.mjs --set hs3d1 --mode dev --out "$RUNNER_TEMP/val" ;;
            hs3d1-holdout) node scripts/supertrader/house/analyze.mjs --set hs3d1 --mode holdout --out "$RUNNER_TEMP/val" ;;
            hs3-holdout) node scripts/supertrader/house/analyze.mjs --set hs3 --mode holdout --out "$RUNNER_TEMP/val" ;;
            hs2-holdout) node scripts/supertrader/house/analyze.mjs --set hs2 --mode holdout --out "$RUNNER_TEMP/val" ;;
          esac
      - name: Verschluesseltes Ergebnis ablegen
        if: always()
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -e
          ls "$RUNNER_TEMP/val"/*.sealed.json >/dev/null 2>&1 || { echo "kein Ergebnis"; exit 0; }
          for f in "$RUNNER_TEMP/val"/*.sealed.json; do grep -q '"schema":"supertrader-sealed-1.0.0"' "$f" || { echo "nicht verschluesselt - Abbruch"; exit 1; }; done
          mkdir -p "$RUNNER_TEMP/res" && cd "$RUNNER_TEMP/res"
          git init -q && git remote add origin "https://x-access-token:${TOKEN}@github.com/${REPO}.git"
          git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch -q --depth 1 origin claude/vu-house-strategy-results; then git checkout -q -b r FETCH_HEAD; else git checkout -q --orphan r; fi
          stamp=$(date -u +%Y%m%dT%H%M%SZ)
          for f in "$RUNNER_TEMP/val"/*.sealed.json; do cp "$f" "${stamp}-$(basename "$f")"; done
          git add -A && git commit -q -m "Hausstrategie ${MODE} ${stamp} (verschluesselt, run ${GITHUB_RUN_ID})"
          for i in 1 2 3 4; do git push -q origin r:claude/vu-house-strategy-results && break; sleep $((i*5)); git fetch -q --depth 1 origin claude/vu-house-strategy-results && git rebase -q FETCH_HEAD || true; done
          echo "abgelegt: ${stamp}"
