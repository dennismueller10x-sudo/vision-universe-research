# =========================================================================
# EXTERNAL SOCIAL INTELLIGENCE — BEOBACHTEN, NICHT VEROEFFENTLICHEN
#
# Dieser Workflow ruft den bereits vorhandenen Worker-Endpunkt
# /social/meta/hashtag-search auf und legt das Ergebnis als
# Beobachtungsartefakt ab.
#
# Er veroeffentlicht NICHTS. Er liest oeffentliche Medien zu Hashtags,
# die der Hashtag-Portfolio-Manager vorher aus dem Content Universe
# abgeleitet hat.
#
# -------------------------------------------------------------------------
# WARUM UEBER ACTIONS UND NICHT AUS DER ENTWICKLUNGSUMGEBUNG
# -------------------------------------------------------------------------
#
# Gemessen: die Entwicklungsumgebung erreicht social.visionuniverse.de
# nicht (der Egress-Proxy lehnt den CONNECT-Tunnel mit 403 ab) und
# fuehrt weder VU_SOCIAL_WORKER_URL noch VU_SOCIAL_ADMIN_KEY.
#
# Die Zugangsdaten liegen dort, wo sie hingehoeren: als Repository-
# Secrets. Derselbe Weg hat in diesem Projekt schon den Cloudflare-
# Preflight und den Smoke-Publish getragen.
#
# -------------------------------------------------------------------------
# DIE KNAPPE RESSOURCE
# -------------------------------------------------------------------------
#
# Meta erlaubt 30 EINZIGARTIGE Hashtags je rollierendem 7-Tage-Fenster.
# WELCHE abgefragt werden, entscheidet der Portfolio-Manager auf
# VU-Seite - nicht dieser Workflow und nicht der Worker. Ein Sensor, der
# selbst bestimmt, wann er messen darf, ist kein Sensor mehr.
#
# Der Plan wird vor dem Aufruf ausgegeben und die Grenze geprueft. Ein
# Plan, der den Rahmen sprengen wuerde, bricht den Lauf ab.
# =========================================================================
name: Social External Observe

on:
  workflow_dispatch:
    inputs:
      edge:
        description: 'top (was Reichweite hatte) oder recent (was gerade passiert)'
        type: choice
        options: [top, recent]
        default: top
      max_new:
        description: 'Hoechstens so viele NEUE Hashtags oeffnen'
        type: string
        default: '8'

concurrency:
  group: social-external-observe
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Plan aus dem Content Universe ableiten
        id: plan
        run: |
          set -euo pipefail
          node scripts/social/plan-hashtag-observation.mjs \
            --max-new "${{ inputs.max_new }}" --out tmp/observe
          echo "tags=$(cat tmp/observe/tags.txt)" >> "$GITHUB_OUTPUT"

      - name: Beobachten
        if: steps.plan.outputs.tags != ''
        env:
          WORKER: ${{ secrets.VU_SOCIAL_WORKER_URL }}
          KEY: ${{ secrets.VU_SOCIAL_ADMIN_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${WORKER:-}" ] || [ -z "${KEY:-}" ]; then
            echo "::error::VU_SOCIAL_WORKER_URL oder VU_SOCIAL_ADMIN_KEY fehlt. Ohne sie kann nichts beobachtet werden."
            exit 1
          fi
          mkdir -p tmp/observe
          # Der Schluessel reist in der Kopfzeile, nie in der Adresse:
          # Adressen landen in Protokollen und bei Cloudflare.
          code=$(curl -sS -o tmp/observe/raw.json -w '%{http_code}' \
            -H "Authorization: Bearer $KEY" \
            --get --data-urlencode "tags=${{ steps.plan.outputs.tags }}" \
            --data-urlencode "edge=${{ inputs.edge }}" \
            "$WORKER/social/meta/hashtag-search" || echo 000)
          echo "HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::Der Hashtag-Endpunkt antwortet mit HTTP $code."
            cat tmp/observe/raw.json || true
            exit 1
          fi

      - name: Zu Mustern abstrahieren
        if: steps.plan.outputs.tags != ''
        run: |
          set -euo pipefail
          # Hier werden fremde Inhalte NICHT gespeichert. Die Rohantwort
          # wird in Muster uebersetzt und danach verworfen.
          node scripts/social/ingest-external-observation.mjs \
            --raw tmp/observe/raw.json --write

      - name: Beobachtung festschreiben
        if: steps.plan.outputs.tags != ''
        run: |
          set -euo pipefail
          if git diff --quiet -- social/data/; then
            echo "Keine Aenderung."
            exit 0
          fi
          git config user.name "vision-universe-bot"
          git config user.email "bot@visionuniverse.de"
          git add social/data/external-observations.json social/data/hashtag-portfolio.json
          git commit -m "External Social Intelligence: Beobachtung ${{ inputs.edge }}"
          git push
