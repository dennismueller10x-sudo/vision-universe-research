name: Integrate shared navigation
on:
  push:
    branches: [main]
    paths: ['**/*.html', 'scripts/sync-navigation.mjs']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: sync-navigation
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Spitze des Zweigs, nicht der Ausloese-Commit (wartende Laeufe, Audit 03.10.2026)
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/sync-navigation.mjs
      - name: Save navigation integration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add '*.html'
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Integrate shared navigation on new pages'
          # Einheitlicher Push (scripts/ci/push-with-retry.sh): neu aufsetzen, wiederholen, bei echtem Konflikt laut scheitern - kein '|| true' (Plattform-Audit 03.10.2026).
          scripts/ci/push-with-retry.sh "${GITHUB_REF_NAME}"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
