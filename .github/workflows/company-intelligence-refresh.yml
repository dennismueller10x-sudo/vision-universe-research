name: Company Intelligence Continuous Production Refresh
on:
  schedule:
    - cron: '17 */4 * * *'
    # Weitere Schedule-Slots gehoeren NICHT hierher: jeder Schedule-Lauf besetzt die
    # Schreibergruppe, ein neuer wartender verdraengt den alten. Redundanz liefert
    # company-intelligence-refresh-watchdog.yml (eigene Gruppe, dispatcht nur bei Veraltung).
  workflow_dispatch:
    inputs:
      verification:
        description: 'Independent isolated R2 runner; never advances production'
        type: boolean
        default: true
      universe:
        description: 'Isolated full-universe scaling verification; requires verification'
        type: boolean
        default: false
      financial:
        description: 'Financial projection; true (default) keeps every dispatch as before'
        type: boolean
        default: true
  workflow_call:
    inputs:
      verification:
        type: boolean
        default: false
      universe:
        type: boolean
        default: false
      financial:
        type: boolean
        default: true
permissions:
  contents: read
  actions: write
concurrency:
  group: company-intelligence-continuous-${{ inputs.verification && 'verification' || 'production' }}
  cancel-in-progress: false
jobs:
  gate:
    # Frische-Wache und zustandsbasiertes Finanz-Gate. Nur GitHub-Actions-Metadaten
    # (keine R2-Zugriffe, keine Provider). Laeuft nach Erhalt der Concurrency-Gruppe,
    # sieht also den Stand NACH dem vorherigen Lauf. Fehler -> run=true, financial=true.
    if: vars.COMPANY_INTELLIGENCE_REFRESH_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
      financial: ${{ steps.gate.outputs.financial }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          sparse-checkout: |
            scripts/company_intelligence
            company-intelligence/config
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Freshness guard and financial gate
        id: gate
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_FINANCIAL: ${{ inputs.financial }}
        run: node scripts/company_intelligence/scheduler-gate.mjs
  refresh:
    needs: gate
    # Ohne klares Gate-Urteil (Fehler, uebersprungen) laeuft der Refresh: nur ein
    # ausdrueckliches run=false ueberspringt ihn.
    if: ${{ !cancelled() && vars.COMPANY_INTELLIGENCE_REFRESH_ENABLED != 'false' && needs.gate.outputs.run != 'false' }}
    runs-on: ubuntu-latest
    # Measured full pipeline is 25 min before Pages wait and live QA.
    # Source/request budgets remain fixed; publication and rollback need headroom.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Record job start (hard deadline for bounded live re-verification)
        # Ueberschreitet ein Schritt das Job-Timeout, wird er cancelled statt failure und der Rollback liefe nicht.
        # refresh-live-verify.mjs plant darum alle Wiederholungen gegen JOB_STARTED_AT + 60 min - 10 min Reserve.
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: abbea154a90ffece598e494530eea38661a20a95
          path: .accepted-identities
          sparse-checkout: |
            company-master
            company-intelligence
            quant/data/sec
            quant/data/universe
            docs/company-intelligence
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Scope, policy and failure-safety contracts
        run: |
          node --test scripts/company_intelligence/tests/continuous-refresh.test.mjs scripts/company_intelligence/tests/refresh-publication.test.mjs
          python3 -m unittest discover -s scripts/company_intelligence/tests -p 'test_continuous_refresh.py'
      - name: Existing browser runtime; no AI dependency
        run: |
          npm install --prefix /tmp/ci-refresh --no-audit --no-fund playwright@1.55.0
          node scripts/company_intelligence/install-browser-deps.mjs /tmp/ci-refresh/node_modules/.bin/playwright
      - name: Check private bucket is not public
        env:
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_API: ${{ secrets.CLOUDFLARE_API }}
        run: node scripts/company_intelligence/privacy.mjs
      - name: Restore, bounded refresh, fresh restore, validate and commit consumer
        env:
          NODE_PATH: /tmp/ci-refresh/node_modules
          VERIFICATION: ${{ inputs.verification }}
          UNIVERSE: ${{ inputs.universe }}
          FINANCIAL: ${{ needs.gate.outputs.financial }}
          RESEARCH_ACCESS_PASSWORD: ${{ secrets.RESEARCH_ACCESS_PASSWORD }}
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_REGION: ${{ secrets.VU_HISTORY_S3_REGION }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
        run: |
          options=()
          if [ "$VERIFICATION" = true ]; then options+=(--verification); fi
          if [ "$UNIVERSE" = true ] && [ "$VERIFICATION" = true ]; then options+=(--universe --source-audit); fi
          # Finanz-Refresh zustandsbasiert (scheduler-gate.mjs): nur ein ausdrueckliches
          # FINANCIAL=false (Schedule-Urteil oder Dispatch-Eingabe) schaltet ihn aus;
          # jede Unklarheit (leere Ausgabe, Gate-Fehler) laesst ihn an.
          if [ "$FINANCIAL" != false ]; then options+=(--financial); fi
          node scripts/company_intelligence/refresh-run.mjs --temporary "$RUNNER_TEMP/ci-refresh" --identity-root .accepted-identities "${options[@]}"
      - name: Record financial refresh decision
        if: ${{ !cancelled() }}
        env:
          FINANCIAL: ${{ needs.gate.outputs.financial }}
        run: echo "FINANCIAL_REFRESH=$([ "$FINANCIAL" != false ] && echo on || echo off)" >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy existing Pages pipeline and verify actual production generation
        id: deploy_live
        if: inputs.verification != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_PATH: /tmp/ci-refresh/node_modules
          RESEARCH_ACCESS_PASSWORD: ${{ secrets.RESEARCH_ACCESS_PASSWORD }}
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_REGION: ${{ secrets.VU_HISTORY_S3_REGION }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
        run: |
          # Geschlossenes Gate (DISABLED/STAGED, sauber aus R2 gelesen): stageProduction liefert kein delivery.json aus, die
          # Live-Pruefung endete sonst deterministisch in PRODUCTION_PUBLICATION_SLO_FAILED samt erneutem Rollback (Lauf 38652800358).
          # Jeder andere Ausgang (AVAILABLE, Lesefehler, Absturz) laesst den strengen Pfad unten unveraendert laufen.
          if node scripts/company_intelligence/refresh-publication.mjs closed; then
            echo "::notice::Production gate closed; refresh stays private, no live verification and no rollback."
            exit 0
          fi
          gh workflow run pages-release.yml --ref main
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const expected=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/ci-refresh/health.json')).consumerGeneration;
          const deadline=Date.now()+15*60000;let served=false;
          while(Date.now()<deadline){
            try{const response=await fetch('https://research.visionuniverse.de/company-intelligence-delivery.json?refresh='+Date.now(),{signal:AbortSignal.timeout(15000)});const d=await response.json();if(d.generation===expected){served=true;break;}}catch{}
            await new Promise(r=>setTimeout(r,10000));
          }
          if(!served)throw Error('PRODUCTION_PUBLICATION_SLO_FAILED');
          NODE
          # Live-QA mit begrenzter, lesender Wiederholung NUR bei belegtem transientem Auslieferungsfehler (Mischstand, STALE, 5xx;
          # Klassifikator und Propagationsbeweis aus Pages-Release). Echte Fehler und erschoepfte Obergrenze enden mit Exit 1:
          # der Schritt "Fail closed" unten rollt dann wie bisher sofort zurueck.
          node scripts/company_intelligence/refresh-live-verify.mjs --out "$RUNNER_TEMP/ci-refresh/live-qa.json"
          node scripts/company_intelligence/refresh-run.mjs observe --health "$RUNNER_TEMP/ci-refresh/health.json"
      - name: Fail closed on actual production regression
        if: failure() && steps.deploy_live.outcome == 'failure' && inputs.verification != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_REGION: ${{ secrets.VU_HISTORY_S3_REGION }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
        run: |
          node scripts/company_intelligence/refresh-run.mjs rollback || true
          node scripts/company_intelligence/production-release.mjs disable || true
          gh workflow run pages-release.yml --ref main -f company_intelligence_off=true
      - name: Aggregate health only; private state never uploaded as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: company-intelligence-refresh-health-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ci-refresh/health.json
            ${{ runner.temp }}/ci-refresh/candidate-qa.json
            ${{ runner.temp }}/ci-refresh/candidate-qa.json-failure.png
            ${{ runner.temp }}/ci-refresh/live-qa.json
            ${{ runner.temp }}/ci-refresh/live-qa.json.verify.json
          retention-days: 14
      - name: Mark successful run (mode and financial state for the next freshness guard)
        if: success()
        env:
          VERIFICATION: ${{ inputs.verification }}
          FINANCIAL: ${{ needs.gate.outputs.financial }}
        run: |
          mode=production; if [ "$VERIFICATION" = true ]; then mode=verification; fi
          fin=financial; if [ "$FINANCIAL" = false ]; then fin=plain; fi
          echo "$mode $fin" > "$RUNNER_TEMP/ci-refresh-mode.txt"
          echo "MARKER=ci-refresh-mode-${GITHUB_RUN_ID}-${mode}-${fin}" >> "$GITHUB_ENV"
      - name: Upload run marker
        if: success()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MARKER }}
          path: ${{ runner.temp }}/ci-refresh-mode.txt
          retention-days: 14
