name: SEC Fundamentals CI

on:
  push:
    branches: [main]
    paths:
      - "quant/**"
      - "scripts/quant/**"
      - "docs/SEC_*.md"
      - ".github/workflows/sec-fundamentals-ci.yml"
  pull_request:
    paths:
      - "quant/**"
      - "scripts/quant/**"
      - "docs/SEC_*.md"
      - ".github/workflows/sec-fundamentals-ci.yml"
  workflow_dispatch:
    inputs:
      run_gate_100:
        description: "Run the live Phase-2 eligible-company Gate 100 and upload reports"
        required: false
        default: false
        type: boolean

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Compile every pipeline module
        run: python3 -m compileall -q scripts/quant

      - name: Run the SEC ingestion test suite (Python, no network)
        run: python3 scripts/quant/cli.py test

      - name: Run the whole quant test suite (JS, no network)
        # The SEC adapter is part of the existing quant system, so it is not
        # enough to run its own tests: the Phase 1-3 suite has to stay green too.
        run: node --test "quant/tests/*.test.mjs"

      - name: Verify the SEC adapter satisfies the existing provider interface
        run: |
          node -e '
            const path = require("path");
            const Provider = require("./quant/engines/provider.js");
            const Adapter = require("./providers/sec/adapter.js");
            const provider = Adapter.createSecProvider();
            const missing = Provider.missingMethods("FundamentalDataProvider", provider);
            if (missing.length) {
              console.error("SEC adapter does not implement FundamentalDataProvider:", missing);
              process.exit(1);
            }
            // It must NOT claim interfaces it cannot serve.
            for (const iface of ["MarketDataProvider", "EstimateDataProvider", "CorporateActionsProvider"]) {
              if (Provider.implementsInterface(iface, provider)) {
                console.error("SEC adapter must not claim " + iface);
                process.exit(1);
              }
            }
            console.log("SEC adapter interface contract OK");
          '

      - name: Reject a second architecture
        shell: bash
        run: |
          # The SEC workstream must not grow its own provider abstraction,
          # capability matrix, PIT rule, factor engine or backtester alongside
          # the existing ones. These are the names that would signal it.
          if grep -rniE "class .*Provider(Registry|Abstraction)|CAPABILITY_SETS|def (run_backtest|backtest_symbol)|def score_universe" scripts/quant/sec/; then
            echo "::error::scripts/quant/sec/ appears to duplicate an existing quant layer"
            exit 1
          fi
          for gone in scripts/quant/sec/factors.py scripts/quant/sec/backtest_bridge.py; do
            if [ -f "$gone" ]; then
              echo "::error::$gone duplicates an existing engine and must stay removed"
              exit 1
            fi
          done
          # Capabilities are declared once, in the shared profile file.
          if grep -rn "CAPABILITIES = {" scripts/quant/sec/; then
            echo "::error::capabilities must be declared in quant/config/provider-profiles.json"
            exit 1
          fi
          echo "no parallel architecture detected"

      - name: Validate configuration files
        run: |
          python3 - <<'PY'
          import json, sys
          sys.path.insert(0, "scripts")
          from quant.sec.registry import MetricRegistry

          registry = MetricRegistry.load()
          print("metric registry:", registry.version, len(registry.names()), "metrics")

          profiles = json.load(open("quant/config/provider-profiles.json"))
          assert "sec-edgar" in profiles["providers"], "SEC provider profile missing"
          print("provider profile: sec-edgar present")

          universe = json.load(open("quant/config/sec-universe.json"))
          assert universe["companies"], "universe must not be empty"
          for entry in universe["companies"]:
              assert entry["ticker"] and entry["cik"], entry
          print("universe:", [c["ticker"] for c in universe["companies"]])
          PY

      - name: Validate the generated SEC data JSON
        run: |
          python3 - <<'PY'
          import json, pathlib
          # Only what THIS pipeline generates. quant/data/*.json belongs to the
          # earlier phases and follows their own convention (asOf,
          # methodologyVersion, dataSnapshotId); asserting the SEC convention
          # over the whole directory failed on eight files this branch never
          # wrote. The check had never run before the first pull request, which
          # is exactly how it survived that long.
          root = pathlib.Path("quant/data/sec")
          paths = sorted(root.glob("*.json")) + sorted(root.glob("*/*.json"))
          assert paths, "no generated SEC artifacts found"
          # Two naming conventions, on purpose. Below the canonical boundary the
          # SEC layer uses snake_case; at and above it the payload follows
          # quant/engines/schema.js, which is camelCase. An artifact must carry
          # its provenance in one of the two, never in neither.
          SNAKE = ("schema_version", "generated_at_utc")
          CAMEL = ("schema", "generatedAtUtc")
          for path in paths:
              payload = json.loads(path.read_text(encoding="utf-8"))
              assert isinstance(payload, dict), path
              stamped = any(key in payload for key in SNAKE + CAMEL)
              assert stamped, f"{path} carries neither {SNAKE} nor {CAMEL}"
              assert "versions" in payload, f"{path} has no version stamp"
              print(f"{path}: OK ({path.stat().st_size} bytes)")
          PY

      - name: Validate the data inspector page
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          path = "quant/data-inspector/index.html"
          html = open(path, encoding="utf-8").read()

          class Checker(HTMLParser):
              def error(self, message):
                  raise AssertionError(message)

          Checker().feed(html)
          assert "<vu-navigation></vu-navigation>" in html, "shared navigation missing"
          # The inspector is a quant page and must use the quant shell, not a
          # second UI stack of its own.
          assert "/quant/ui/shell.js" in html, "shared quant shell missing"
          assert "/quant/ui/quant.css" in html, "shared quant design system missing"
          print(f"{path}: OK ({len(html)} bytes)")
          PY

      - name: Reject company-specific logic in the pipeline
        # The rule lives in a script, not in this file, so it can be run before
        # pushing and is covered by the test suite. The previous grep matched
        # comments and __pycache__ alongside code: naming the company whose real
        # data exposed a defect is how findings are documented here, and a
        # binary .pyc is not source at all.
        run: python3 scripts/quant/check_company_agnostic.py

      - name: Enforce data hygiene
        shell: bash
        run: |
          # Raw SEC payloads and normalized factbooks must never be committed.
          # raw/ and facts/ are large and regenerable and stay local. canonical/
          # is the opposite: it IS the data layer the adapter serves, so it is
          # committed like quant/data/securities.json.
          for forbidden in quant/data/sec/raw quant/data/sec/facts .sec-cache .quant-state; do
            if git ls-files --error-unmatch "$forbidden" >/dev/null 2>&1; then
              echo "::error::$forbidden is tracked but must stay local"
              exit 1
            fi
          done
          # Committed artifacts stay small enough to review in a diff.
          oversized="$(find quant/data/sec -type f -size +2M 2>/dev/null || true)"
          if [ -n "$oversized" ]; then
            echo "::error::files over 2MB under quant/data/sec:"; echo "$oversized"; exit 1
          fi
          # This budget covers what THIS pipeline writes. It used to measure all
          # of quant/data, where more than half belongs to earlier phases and to
          # Phase 4A market data -- so it failed on growth this workflow neither
          # caused nor controls, and would equally have failed their next commit.
          # A repository-wide budget is a repository-wide job.
          # 8MB against a measured 5.9MB: enough headroom for the five
          # validation companies to keep growing a little, tight enough that a
          # committed raw payload or factbook trips it immediately.
          total="$(du -sk quant/data/sec | cut -f1)"
          if [ "$total" -gt 8192 ]; then
            echo "::error::quant/data/sec is ${total}KB, over the 8MB budget"
            du -sk quant/data/sec/* | sort -rn
            exit 1
          fi
          echo "data hygiene OK (quant/data/sec: ${total}KB of 8192KB)"

      - name: Reject secrets in the SEC pipeline
        shell: bash
        run: |
          # The SEC APIs need no key. Anything that looks like one is a mistake.
          if grep -rniE '(api[_-]?key|secret|token|password)[[:space:]]*=[[:space:]]*["'"'"'][A-Za-z0-9_\-]{16,}' scripts/quant/ quant/; then
            echo "::error::possible credential committed"
            exit 1
          fi
          echo "no credentials found"

      - name: Confirm the existing backtest engine is untouched by the bridge
        shell: bash
        run: |
          # The bridge imports scripts/dashboard/backtest_technicals.py; a change
          # to that file is a change to the production technical pipeline and
          # must not arrive through a SEC-pipeline pull request.
          if git diff --name-only origin/main...HEAD 2>/dev/null | grep -q '^scripts/dashboard/'; then
            echo "::error::this pipeline must not modify scripts/dashboard/"
            exit 1
          fi
          echo "scripts/dashboard/ untouched"

  gate-100:
    name: Phase 2 live Gate 100 (manual only)
    if: github.event_name == 'workflow_dispatch' && inputs.run_gate_100
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      SEC_USER_AGENT: "VisionUniverseResearch info@visionuniverse.de"
      GATE_STORE: .sec-data/gates/gate-100-phase2.sqlite
      GATE_RUN_ID: gate-100-phase2-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Start measured run
        run: |
          mkdir -p .sec-data/gates .sec-data/reports .sec-data/universe/samples
          date +%s > .sec-data/gates/start-epoch.txt

      - name: Build current SEC universe and deterministic candidate sample
        run: |
          python3 scripts/quant/cli.py universe \
            --output .sec-data/universe/current.json \
            --sample-sizes 500

      - name: Classify candidates and select exactly 100 eligible companies
        run: |
          python3 scripts/quant/cli.py eligibility \
            --universe .sec-data/universe/samples/gate-500.json \
            --output .sec-data/reports/gate-100-eligibility.json \
            --eligible-output .sec-data/universe/samples/gate-100-eligible.json \
            --target-eligible 100 \
            --max-candidates 500

      - name: Simulate interruption after ten eligible companies
        id: partial
        continue-on-error: true
        run: |
          set +e
          python3 scripts/quant/cli.py ingest \
            --universe .sec-data/universe/samples/gate-100-eligible.json \
            --run-id "$GATE_RUN_ID" \
            --store sqlite --store-path "$GATE_STORE" \
            --limit 10
          status=$?
          cp ".quant-state/checkpoint-${GATE_RUN_ID}.json" \
             .sec-data/reports/gate-100-resume-partial.json
          python3 - <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from quant.sec.store import SqliteFactStore
          store = SqliteFactStore(Path(".sec-data/gates/gate-100-phase2.sqlite"))
          hashes = {}
          for cik in store.list_companies():
              body = json.dumps(store.read_company(cik), sort_keys=True,
                                separators=(",", ":")).encode()
              hashes[cik] = hashlib.sha256(body).hexdigest()
          Path(".sec-data/reports/gate-100-resume-partial-hashes.json").write_text(
              json.dumps(hashes, indent=2) + "\n")
          PY
          exit $status

      - name: Resume the same Gate 100 run
        id: resume
        continue-on-error: true
        run: |
          set +e
          python3 scripts/quant/cli.py ingest \
            --universe .sec-data/universe/samples/gate-100-eligible.json \
            --run-id "$GATE_RUN_ID" \
            --store sqlite --store-path "$GATE_STORE"
          status=$?
          cp ".quant-state/checkpoint-${GATE_RUN_ID}.json" \
             .sec-data/reports/gate-100-resume-complete.json
          python3 - <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from quant.sec.store import SqliteFactStore
          before_path = Path(".sec-data/reports/gate-100-resume-partial-hashes.json")
          before = json.loads(before_path.read_text()) if before_path.exists() else {}
          store = SqliteFactStore(Path(".sec-data/gates/gate-100-phase2.sqlite"))
          after = {}
          for cik in store.list_companies():
              body = json.dumps(store.read_company(cik), sort_keys=True,
                                separators=(",", ":")).encode()
              after[cik] = hashlib.sha256(body).hexdigest()
          changed = sorted(cik for cik, digest in before.items()
                           if after.get(cik) != digest)
          result = {"schemaVersion": 1,
                    "status": "PASS" if before and not changed else "FAIL",
                    "successfulBeforeInterruption": len(before),
                    "successfulAfterResume": len(after),
                    "previouslySuccessfulChangedCiks": changed}
          Path(".sec-data/reports/gate-100-resume-validation.json").write_text(
              json.dumps(result, indent=2) + "\n")
          PY
          exit $status

      - name: Build measured Gate 100 and alias-coverage reports
        id: report
        continue-on-error: true
        run: |
          set +e
          python3 scripts/quant/cli.py scale-report \
            --gate 100 \
            --universe .sec-data/universe/samples/gate-100-eligible.json \
            --output .sec-data/reports/gate-100-phase2.json \
            --store sqlite --store-path "$GATE_STORE"
          scale_status=$?
          python3 scripts/quant/cli.py alias-discovery \
            --universe .sec-data/universe/samples/gate-100-eligible.json \
            --output .sec-data/reports/gate-100-alias-discovery.json
          alias_status=$?
          test $scale_status -eq 0 -a $alias_status -eq 0

      - name: Prove canonical idempotency on an identical third invocation
        id: idempotency
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          import sys
          sys.path.insert(0, "scripts")
          from quant.sec.store import SqliteFactStore
          store = SqliteFactStore(Path(".sec-data/gates/gate-100-phase2.sqlite"))
          hashes = {}
          for cik in store.list_companies():
              body = json.dumps(store.read_company(cik), sort_keys=True,
                                separators=(",", ":")).encode()
              hashes[cik] = hashlib.sha256(body).hexdigest()
          Path(".sec-data/reports/gate-100-idempotency-before.json").write_text(
              json.dumps(hashes, indent=2) + "\n")
          PY
          set +e
          python3 scripts/quant/cli.py ingest \
            --universe .sec-data/universe/samples/gate-100-eligible.json \
            --run-id "$GATE_RUN_ID" \
            --store sqlite --store-path "$GATE_STORE"
          ingest_status=$?
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          import sys
          sys.path.insert(0, "scripts")
          from quant.sec.store import SqliteFactStore
          store = SqliteFactStore(Path(".sec-data/gates/gate-100-phase2.sqlite"))
          before = json.loads(Path(
              ".sec-data/reports/gate-100-idempotency-before.json").read_text())
          after = {}
          for cik in store.list_companies():
              body = json.dumps(store.read_company(cik), sort_keys=True,
                                separators=(",", ":")).encode()
              after[cik] = hashlib.sha256(body).hexdigest()
          changed = sorted(cik for cik in set(before) | set(after)
                           if before.get(cik) != after.get(cik))
          result = {"schemaVersion": 1, "status": "PASS" if not changed else "FAIL",
                    "companiesBefore": len(before), "companiesAfter": len(after),
                    "changedCiks": changed}
          Path(".sec-data/reports/gate-100-idempotency.json").write_text(
              json.dumps(result, indent=2) + "\n")
          raise SystemExit(0 if result["status"] == "PASS" else 1)
          PY
          compare_status=$?
          test $ingest_status -eq 0 -a $compare_status -eq 0

      - name: Re-ingest and compare the Golden Five
        id: golden
        continue-on-error: true
        run: |
          set +e
          python3 scripts/quant/cli.py ingest \
            --universe quant/config/sec-universe.json \
            --run-id "golden-phase2-${{ github.run_id }}" \
            --store sqlite --store-path .sec-data/gates/golden-phase2.sqlite
          ingest_status=$?
          python3 scripts/quant/cli.py golden-regression \
            --universe quant/config/sec-universe.json \
            --output .sec-data/reports/golden-five-phase2.json \
            --store sqlite --store-path .sec-data/gates/golden-phase2.sqlite
          regression_status=$?
          test $ingest_status -eq 0 -a $regression_status -eq 0

      - name: Assemble the hard Gate 100 verdict
        id: verdict
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, time
          from pathlib import Path
          def read(name):
              path = Path(".sec-data/reports") / name
              return json.loads(path.read_text()) if path.exists() else {}
          eligibility = read("gate-100-eligibility.json")
          gate = read("gate-100-phase2.json")
          partial = read("gate-100-resume-partial.json")
          complete = read("gate-100-resume-complete.json")
          idem = read("gate-100-idempotency.json")
          resume = read("gate-100-resume-validation.json")
          golden = read("golden-five-phase2.json")
          partial_done = len(partial.get("completed", {}))
          complete_done = len(complete.get("completed", {}))
          categories = eligibility.get("byEntityClassification", {})
          checks = {
              "exactly100Eligible": eligibility.get("eligible") == 100,
              "classificationFailuresZero": eligibility.get("classificationFailures") == 0,
              "expectedExclusionsReported": eligibility.get("expectedExclusions", 0) > 0,
              "sectorProfilesPresent": all(categories.get(name, 0) > 0 for name in (
                  "OPERATING_COMPANY", "BANK", "INSURANCE", "REIT")),
              "gateReportPass": gate.get("status") == "PASS",
              "all100Stored": complete_done == 100,
              "noRealFailures": not complete.get("failed"),
              "resumeSkippedPriorSuccesses": (resume.get("status") == "PASS"
                                                and 0 < partial_done <= 10
                                                and complete_done == 100),
              "idempotency": idem.get("status") == "PASS",
              "pitCoverage100Percent": gate.get("pitCoverage") == 1.0,
              "pitViolationsZero": gate.get("pitViolations") == 0,
              "canonicalViolationsZero": gate.get("canonicalViolations") == 0,
              "goldenFiveRegression": golden.get("status") == "PASS",
          }
          status = "PASS" if all(checks.values()) else "FAIL"
          start = int(Path(".sec-data/gates/start-epoch.txt").read_text())
          result = {"schemaVersion": 1, "status": status, "checks": checks,
                    "runtimeSecondsEndToEnd": int(time.time()) - start,
                    "recommendation": ("READY FOR GATE 500" if status == "PASS"
                                       else "NOT READY")}
          Path(".sec-data/reports/gate-100-validation.json").write_text(
              json.dumps(result, indent=2) + "\n")
          print(json.dumps(result, indent=2))
          raise SystemExit(0 if status == "PASS" else 1)
          PY

      - name: Upload compact Gate 100 evidence (never raw SEC data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sec-gate-100-phase2-${{ github.run_id }}
          path: |
            .sec-data/reports/*.json
            .sec-data/universe/samples/gate-100-eligible.json
          if-no-files-found: error
          retention-days: 14

      - name: Fail the job unless every hard Gate 100 check passed
        if: always()
        run: |
          python3 - <<'PY'
          import json
          report = json.load(open(".sec-data/reports/gate-100-validation.json"))
          assert report["status"] == "PASS", report
          PY
