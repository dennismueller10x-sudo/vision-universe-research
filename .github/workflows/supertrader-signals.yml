name: Supertrader Signale

# Taeglicher Strategie-Lauf. Liest ausschliesslich die bereits committeten
# kanonischen Artefakte (technische Materialisierung, Wochenreihen, Regime,
# Frische) und schreibt nur supertrader/. Keine Anbieterabrufe, keine
# Secrets, keine eigene Datenpipeline: die Kursdaten kommen aus der
# bestehenden Discovery-Infrastruktur.
#
# ZEITPUNKT: Die technische Materialisierung entsteht naechtlich nach dem
# Marktdaten-Refresh (~04:15 UTC). Der Lauf um 06:17 UTC Di-Sa verarbeitet
# die Sitzungen Mo-Fr. Der Build ist idempotent: ein Lauf ohne neuen
# Handelstag aendert nichts und committet nichts.
#
# AUSLIEFERUNG: Ein Push mit GITHUB_TOKEN loest keine weiteren Workflows aus.
# Die bestehende Pages-Auslieferung laeuft ohnehin werktags im 5-Minuten-Takt
# ab 13:00 UTC und nimmt den Stand mit - vor US-Handelsbeginn.
#
# MODUS prune-dead-refs (nur workflow_dispatch): weist Titel aus, die das
# gueltige Discover-Universum nicht mehr fuehrt - sonst nichts. Kein
# Minutenabruf, kein voller Build, keine Markt- oder Quant-Daten; Signale,
# Werte und Stand bleiben byte-gleich. Fuer Naechte, in denen das Universum
# committet ist, die Materialisierung aber scheiterte (27.10.2026, BZH).
# Siehe scripts/supertrader/prune-dead-refs.mjs.
#
# TAGESLAUF DER RESEARCH-KANDIDATEN: Nach einem vollen Lauf (mode=build) stoesst der Job `sf8` den Tageslauf
# supertrader-sf8-candidates.yml mit mode=auto an - nur auf main und nur mit SF8_CANDIDATES_ENABLED und
# SF8_AUTO_PUBLISH. Beide lesen dieselbe technische Materialisierung der Nachtkette. Ein Fehler der Signale haelt den
# Anstoss nicht auf (eigener Job), ein Fehler des Anstosses macht die Signale nicht rot; der Tageslauf hat einen
# eigenen Rueckfall-Zeitplan und meldet sich selbst ueber den Pipeline-Alarm.
on:
  schedule:
    - cron: '17 6 * * 2-6'
  workflow_dispatch:
    inputs:
      mode:
        description: 'build = voller Strategie-Lauf; prune-dead-refs = nur entfallene Titel ausweisen'
        type: choice
        options:
          - build
          - prune-dead-refs
        default: build
permissions:
  contents: write
# Concurrency: Gruppe noch ohne Zweig (ADR-005 (5) offen). Alle Laeufe bisher auf main (22 von 22 Anstoessen); die
# Umstellung braucht zugleich core/tests/supertrader-chain.test.mjs (SC5) und die Laufliste in
# scripts/ci/supertrader-chain.mjs (wartende Laeufe nur von main zaehlen) - eigener Core-PR, nicht in Gate A.
concurrency:
  group: supertrader-signals
  cancel-in-progress: false
jobs:
  signals:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MODE: ${{ inputs.mode || 'build' }}
    steps:
      # ADR-005 (1): Spitze des eigenen Zweigs. Der Commit-Schritt rebased auf origin/$GITHUB_REF_NAME und pusht
      # dorthin; ein fest verdrahtetes `ref: main` haette bei einem Lauf auf einem anderen Zweig main-Code getestet
      # und den main-Stand auf diesen Zweig geschoben. Auf main ist es dasselbe wie vorher.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Minutenquelle fuer Kauf-Stop-Tage (IEX, nur Zaehlwerte im Log, Datei ausserhalb des Repositorys)
        if: env.MODE == 'build'
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          SUPERTRADER_INTRADAY_CACHE: ${{ runner.temp }}/supertrader-intraday.json
        run: node scripts/supertrader/intraday-prefetch.mjs
      - name: Strategie-Lauf (deterministisch, append-only Signalprotokoll)
        if: env.MODE == 'build'
        env:
          SUPERTRADER_INTRADAY_CACHE: ${{ runner.temp }}/supertrader-intraday.json
        run: node scripts/supertrader/build.mjs
      - name: Entfallene Titel ausweisen (fail closed, keine Marktdaten)
        if: env.MODE == 'prune-dead-refs'
        run: node scripts/supertrader/prune-dead-refs.mjs
      - name: Integritaet vor dem Commit (Lifecycle, Gates, Historie)
        run: node --test "scripts/supertrader/tests/*.test.mjs"
      - name: Commit
        run: |
          stand=$(node -e 'console.log(require("./supertrader/data/signals.json").asOf)')
          if [ "$MODE" = "prune-dead-refs" ]; then
            nachricht="Supertrader: entfallene Titel ausgewiesen (Stand ${stand} unveraendert)"
          else
            nachricht="Supertrader: Signale aktualisiert (Stand ${stand})"
          fi
          bash scripts/ci/commit-and-push.sh "$nachricht" supertrader/
  sf8:
    needs: signals
    if: >-
      always() && github.ref == 'refs/heads/main' && (inputs.mode || 'build') == 'build' &&
      vars.SF8_CANDIDATES_ENABLED == 'true' && vars.SF8_AUTO_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Tageslauf der Research-Kandidaten anstossen (mode=auto)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run supertrader-sf8-candidates.yml --repo "$GITHUB_REPOSITORY" --ref main -f mode=auto
