name: Forschung - Strategie-Labor (Strang G, vorregistriert)

# Strang G: systematische Strategiesuche nach docs/research/labor/PROTOKOLL.md (eingefroren, SHA-256 im Runner geprueft).
# Forschung, nicht zertifiziert. Phasen: dev (Suche 2016-2023, Auswahl), test (Pruefung 2024-01-01 bis 2026-10-02, nur nach
# committeter Auswahl), holdout (2008-2015, nur mit docs/research/labor/HOLDOUT_FREIGABE.md der Steuerung).
# Eingaben nur im Runner, nie committet: kanonische Tagesbalken (R2), delistete Titel (V13-Archiv), SEC companyfacts.zip,
# SEC Insider Transactions Data Sets. Committet wird nur docs/research/labor/runs/: oeffentliche Zustaende und Urteile ohne
# Zahlen sowie versiegelte Ergebnisse (*.sealed.json, nur mit dem privaten Schluessel des Empfaengers lesbar).
#
# Ausloeser: manuell (Eingabe phase) oder die Marke [labor:dev|test|holdout] in der Commit-Nachricht auf claude/**.
on:
  workflow_dispatch:
    inputs:
      phase:
        description: 'dev, test oder holdout'
        required: true
        default: dev
  push:
    branches:
      - 'claude/**'

permissions:
  contents: write

concurrency:
  group: research-labor-${{ github.ref_name }}-${{ (github.event_name == 'push' && !contains(github.event.head_commit.message, '[labor:')) && github.run_id || 'run' }}
  cancel-in-progress: false

jobs:
  run:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[labor:')
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Phase bestimmen
        id: m
        env:
          MSG: ${{ github.event.head_commit.message }}
          INPUT_PHASE: ${{ inputs.phase }}
        run: |
          set -euo pipefail
          p="${INPUT_PHASE:-}"
          if [ -z "$p" ]; then p=$(printf '%s' "$MSG" | grep -oE '\[labor:(dev|test|holdout)\]' | head -1 | sed -E 's/\[labor:([a-z]+)\]/\1/' || true); fi
          case "$p" in dev|test|holdout) ;; *) echo "::error::Phase unbekannt: '$p'"; exit 1;; esac
          echo "phase=$p" >> "$GITHUB_OUTPUT"; echo "Phase: $p"

      - name: Labor-Tests (synthetisch) und Protokoll-Hash
        run: |
          set -euo pipefail
          node --test scripts/research/labor/labor.test.cjs scripts/research/labor/labor-stock.test.cjs scripts/research/labor/build-insider.test.mjs
          python3 -m unittest discover -s scripts/research/labor/tests -p 'test_*.py'

      - name: R2-Zugang vorhanden
        env:
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
          V13_ARCHIVE_PRIVATE_KEY: ${{ secrets.V13_ARCHIVE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for v in VU_HISTORY_S3_ENDPOINT VU_HISTORY_S3_BUCKET VU_HISTORY_S3_ACCESS_KEY_ID VU_HISTORY_S3_SECRET_ACCESS_KEY V13_ARCHIVE_PRIVATE_KEY; do
            if [ -z "${!v}" ]; then echo "::error::$v fehlt"; exit 1; fi
          done

      - name: Lesender Vorabcheck (Nullkostengrenze)
        env:
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_REGION: ${{ secrets.VU_HISTORY_S3_REGION }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
        run: >-
          node scripts/market/preflight-zero-cost.mjs --operation RECOVERY --gate FULL_UNIVERSE
          --out "$RUNNER_TEMP/labor-preflight.json"

      - name: Tagesbalken aus der Historienablage (nur Runner)
        env:
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_REGION: ${{ secrets.VU_HISTORY_S3_REGION }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
        run: >-
          node scripts/market/sync-history-store.mjs --pull --gate FULL_UNIVERSE --concurrency 24
          --preflight "$RUNNER_TEMP/labor-preflight.json"
          --work-dir "$RUNNER_TEMP/canonical-history"
          --report "$RUNNER_TEMP/labor-sync.json"

      - name: Delistete Titel aus dem V13-Archiv (privater Schluessel nur in diesem Schritt)
        env:
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_REGION: ${{ secrets.VU_HISTORY_S3_REGION }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
          V13_ARCHIVE_PRIVATE_KEY: ${{ secrets.V13_ARCHIVE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          node scripts/quant/v13/archive/r2-restore.mjs --mode extract --parts v13-derived,v13-raw \
            --dest "$RUNNER_TEMP/priv" --manifest docs/quant-recovery/v13/archive/manifest-1.2.0.json --prefix research-snapshots/quant-v13/archive-1.2.0/
          first=$(python3 -I -c 'import json,sys;r=json.load(open(sys.argv[1]));f=r["columns"];rows=r["rows"];i=f.index("chainId");s=f.index("status");print(next(x[i] for x in rows if x[s]=="QUALIFIED"))' docs/quant-recovery/v13/delisted/register-1.0.0.json)
          hit=$(find "$RUNNER_TEMP/priv/v13-derived" -name "$first.json" -print -quit); test -n "$hit"
          echo "DELISTED_DIR=$(dirname "$hit")" >> "$GITHUB_ENV"
          echo "DELISTED_RAW_DIR=$RUNNER_TEMP/priv/v13-raw" >> "$GITHUB_ENV"

      - name: SEC companyfacts.zip (oeffentlich, einmal geladen)
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || 'VisionUniverseResearch info@visionuniverse.de' }}
        run: |
          set -euo pipefail
          curl -sSfL --retry 4 --retry-delay 10 -A "$SEC_USER_AGENT" -o "$RUNNER_TEMP/companyfacts.zip" \
            https://www.sec.gov/Archives/edgar/daily-index/xbrl/companyfacts.zip
          ls -l "$RUNNER_TEMP/companyfacts.zip"

      - name: SEC-Fundamentaldaten wie erstmals eingereicht (Lesart ORIGINAL)
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || 'VisionUniverseResearch info@visionuniverse.de' }}
        run: |
          set -euo pipefail
          python3 scripts/quant/portfolio/build_pit_fundamentals.py --out "$RUNNER_TEMP/pit-fundamentals" --archive "$RUNNER_TEMP/companyfacts.zip" --workers 4

      - name: Gewinnueberraschung (SUE) aus companyfacts
        run: |
          set -euo pipefail
          python3 scripts/research/labor/build_sue.py --companyfacts "$RUNNER_TEMP/companyfacts.zip" \
            --fund-index "$RUNNER_TEMP/pit-fundamentals/index.json" --out "$RUNNER_TEMP/labor-events/sue.json"
          rm -f "$RUNNER_TEMP/companyfacts.zip"

      - name: SEC Insider Transactions Data Sets (Form 3/4/5, Quartale 2007q1 bis 2026q3)
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || 'VisionUniverseResearch info@visionuniverse.de' }}
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/form345"; mkdir -p "$d"
          for y in $(seq 2007 2026); do for q in 1 2 3 4; do
            n="${y}q${q}"; if [ "$n" \> "2026q3" ]; then continue; fi
            code=$(curl -sSL --retry 3 --retry-delay 5 -A "$SEC_USER_AGENT" -o "$d/${n}_form345.zip" -w '%{http_code}' \
              "https://www.sec.gov/files/structureddata/data/insider-transactions-data-sets/${n}_form345.zip" || true)
            if [ "$code" != "200" ]; then echo "::warning::Insider-Datensatz $n: HTTP $code"; rm -f "$d/${n}_form345.zip"; fi
            sleep 0.3
          done; done
          ls "$d" | wc -l
          node scripts/research/labor/build-insider.mjs --datasets "$d" --fund-index "$RUNNER_TEMP/pit-fundamentals/index.json" \
            --from 2007q1 --to 2026q3 --out "$RUNNER_TEMP/labor-events/insider.json"
          rm -rf "$d"

      - name: Labor-Phase rechnen (Protokoll eingefroren, Hash geprueft)
        env:
          PHASE: ${{ steps.m.outputs.phase }}
        run: |
          set -euo pipefail
          node --max-old-space-size=12288 scripts/research/labor/run-labor.cjs --phase "$PHASE" \
            --work-dir "$RUNNER_TEMP/canonical-history" --delisted-dir "$DELISTED_DIR" --delisted-raw-dir "$DELISTED_RAW_DIR" \
            --fundamentals "$RUNNER_TEMP/pit-fundamentals" --insider "$RUNNER_TEMP/labor-events/insider.json" --sue "$RUNNER_TEMP/labor-events/sue.json"
          rm -rf "$RUNNER_TEMP/priv" "$RUNNER_TEMP/canonical-history" "$RUNNER_TEMP/labor-events"

      - name: Keine Zahlen im Klartext (nur versiegelt)
        run: |
          set -euo pipefail
          for f in docs/research/labor/runs/*-public.json docs/research/labor/runs/selection.json; do
            [ -f "$f" ] || continue
            if grep -qE '"(cagr|totalReturn|sharpe|maxDrawdown|returns|equity)"' "$f"; then echo "::error::$f enthaelt Kennzahlen"; exit 1; fi
          done

      - name: Ergebnis auf den aktuellen Zweig committen
        env:
          PHASE: ${{ steps.m.outputs.phase }}
        run: |
          git config user.name "vision-universe-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/research/labor/runs
          if git diff --cached --quiet; then echo "Ergebnis unveraendert."; exit 0; fi
          git commit -m "Strategie-Labor Phase ${PHASE} (Lauf ${GITHUB_RUN_ID})"
          scripts/ci/push-with-retry.sh "${GITHUB_REF_NAME}"
