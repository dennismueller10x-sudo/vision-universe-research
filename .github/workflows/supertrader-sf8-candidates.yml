name: Supertrader 8 Research-Kandidaten (Tageslauf)

# Tageslauf der quellentreuen Research-Kandidaten (Supertrader 8.0, 13 Strategien C01-C13).
#
# ZWEI WEGE, EIN WORKFLOW (keine zweite Pipeline):
#   * manuell (workflow_dispatch, mode=manual): wie bei der ersten Veroeffentlichung. Commit nur mit commit=true UND
#     dem freigegebenen Fingerabdruck expected_sha256 (docs/SUPERTRADER_8_FIRST_RELEASE.md).
#   * automatisch (mode=auto: Anstoss am Ende von supertrader-signals.yml nach der Nachtkette, Rueckfall-Zeitplan):
#     Commit ohne Mensch nur, wenn der Veroeffentlichungsvertrag sf8-auto-publication-1.0.0 erfuellt ist
#     (scripts/supertrader/source-faithful/product/publication-contract.mjs, docs/SUPERTRADER_9_DAILY_OPERATIONS.md):
#     reproduzierbar (zwei Laeufe, gleicher Fingerabdruck), DQ-SF8-1..8 PASS, Forschungsstatus unveraendert,
#     dieselben Fachmodelle, neuere Sitzung, plausible Mengen, freigegebene Registry. Sonst kein Commit, roter Lauf,
#     Alarm-Issue; der veroeffentlichte Stand bleibt stehen.
#
# SCHALTER (Owner): SF8_CANDIDATES_ENABLED schaltet den Workflow ueberhaupt ein. SF8_AUTO_PUBLISH schaltet den
# automatischen Weg ein (Zeitplan und Anstoss); ohne ihn laeuft der Zeitplan leer (Job uebersprungen).
#
# Liest nur bereits committete Artefakte (Tagesbalken technical-signals-v1, Wochenreihen, Stammdaten, SEC-SIC,
# Kalender). Kein Anbieterabruf, keine Secrets, keine Kosten. Alle 13 Strategien bleiben LIVE_NOT_APPROVED;
# VALIDATED_TRADE_SIGNAL bleibt gesperrt. Fehlen Eingaben oder sind sie veraltet, bricht die Eingangspruefung ab
# (Exit 3) und es entsteht kein neuer Stand.
#
# Commit-Protokoll ADR-005: Spitze des Branches auschecken, push-with-retry.sh, Concurrency je Branch.
on:
  # Rueckfall, falls der Anstoss nach der Nachtkette ausbleibt (Nachtkette endet ~04:10 UTC, Zeitplaene kommen
  # bis zu 7 h spaet). Di-Sa fuer die Sitzungen Mo-Fr. Ein Lauf auf eine schon veroeffentlichte Sitzung committet nichts.
  schedule:
    - cron: '43 11 * * 2-6'
  workflow_dispatch:
    inputs:
      mode:
        description: 'manual = Commit nur mit commit=true und expected_sha256; auto = Veroeffentlichungsvertrag (nur main)'
        type: choice
        options:
          - manual
          - auto
        default: manual
      commit:
        description: 'nur mode=manual: Ergebnis nach supertrader/data/sf-candidates committen (sonst nur CI-Artefakt)'
        type: boolean
        default: false
      expected_sha256:
        description: 'nur mode=manual: Fingerabdruck des geprueften oeffentlichen Stands (aus einem Lauf ohne Commit); Pflicht fuer commit=true'
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: supertrader-sf8-candidates-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  candidates:
    if: vars.SF8_CANDIDATES_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || vars.SF8_AUTO_PUBLISH == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      auto: ${{ steps.mode.outputs.auto }}
      decision: ${{ steps.contract.outputs.decision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Weg bestimmen (automatisch nur auf main, nur mit SF8_AUTO_PUBLISH)
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          IN_MODE: ${{ inputs.mode }}
          AUTO_SWITCH: ${{ vars.SF8_AUTO_PUBLISH }}
        run: |
          set -euo pipefail
          auto=false
          if [ "$EVENT" = "schedule" ] || [ "$IN_MODE" = "auto" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then echo "::error::automatischer Weg nur auf main"; exit 1; fi
            if [ "$AUTO_SWITCH" != "true" ]; then echo "::error::automatischer Weg nur mit SF8_AUTO_PUBLISH=true"; exit 1; fi
            auto=true
          fi
          echo "auto=${auto}" >> "$GITHUB_OUTPUT"
          echo "Weg: $([ "$auto" = true ] && echo automatisch || echo manuell)"

      - name: Produkt- und Vertragstests (rot = kein neuer Stand)
        run: node --test "scripts/supertrader/tests/sf-*.test.mjs"

      - name: Eingangspruefung und Kandidatenlauf (Abbruch bei fehlenden oder veralteten Eingaben)
        env:
          OUT: ${{ runner.temp }}/sf8-candidates
          STATS: ${{ runner.temp }}/sf8-stats.json
        run: |
          set -euo pipefail
          heute="$(date -u +%F)"
          echo "SF8_LAUFTAG=${heute}" >> "$GITHUB_ENV"
          prev=()
          if [ -f supertrader/data/sf-candidates/index.json ]; then prev=(--previous supertrader/data/sf-candidates); fi
          node --max-old-space-size=4096 scripts/supertrader/source-faithful/product/build-candidates.mjs \
            --out "$OUT" --stats "$STATS" --require-current "$heute" "${prev[@]}"

      - name: Oeffentliche Teile bereitstellen (ohne records/)
        env:
          OUT: ${{ runner.temp }}/sf8-candidates
          PUB: ${{ runner.temp }}/sf8-public
        run: |
          set -euo pipefail
          rm -rf "$PUB"
          mkdir -p "$PUB"
          cp "$OUT/summary.json" "$OUT/index.json" "$PUB/"
          cp -r "$OUT/strategy" "$OUT/ticker" "$PUB/"

      - name: Datenbudget (oeffentliche Teile ohne records/ hoechstens 16 MB, je Datei hoechstens 2 MB)
        env:
          PUB: ${{ runner.temp }}/sf8-public
        run: |
          set -euo pipefail
          bytes=$(find "$PUB" -type f -printf '%s\n' | awk '{s+=$1} END {print s+0}')
          echo "oeffentliche Teile: ${bytes} Bytes"
          if [ "$bytes" -gt 16777216 ]; then echo "::error::sf-candidates ${bytes} Bytes ueber dem Budget"; exit 1; fi
          gross=$(find "$PUB" -type f -size +2048k)
          if [ -n "$gross" ]; then echo "::error::Datei ueber 2 MB: $gross"; exit 1; fi

      # V3: dieselben Regeln, die core-ci.yml auf main anwendet (DQ-SF8-1..8: Frische, Identitaet, Stufensperren,
      # keine Order-/Stopmarken unter MODELED, Quarantaene, Ergebnisvertraege, Budget, Preisabgleich V4), hier gegen
      # das Laufergebnis VOR einem Commit. Fail closed: fehlen die Regeln (Core-PR nicht gemergt), ist das rot.
      - name: Datenqualitaet DQ-SF8 des Laufergebnisses (rot = kein neuer Stand)
        env:
          PUB: ${{ runner.temp }}/sf8-public
          REPORT: ${{ runner.temp }}/sf8-dq.json
        run: |
          set -euo pipefail
          node scripts/core/data-quality.mjs --only=sf8 --sf8-dir="$PUB" --sf8-activated --json > "$REPORT"
          node -e '
            const r = require(process.env.REPORT);
            const sf8 = (r.rules || []).filter((x) => /^DQ-SF8-[1-8]$/.test(x.id));
            for (const x of sf8) console.log(x.status + " " + x.id + " " + x.title + " [" + x.failed + "/" + x.checked + "]" + (x.status === "PASS" ? "" : " " + x.samples.slice(0, 5).join("; ")));
            if (sf8.length !== 8) { console.log("::error::DQ-SF8-Regeln fehlen (" + sf8.length + " von 8) - Core-Registrierung V2/V3 nicht gemergt"); process.exit(1); }
            if (sf8.some((x) => x.status !== "PASS" || x.checked === 0)) { console.log("::error::DQ-SF8 nicht bestanden"); process.exit(1); }
          '

      # Erste Veroeffentlichung (docs/SUPERTRADER_8_FIRST_RELEASE.md): ein Lauf ohne Commit nennt den Fingerabdruck,
      # der Owner gibt genau diesen Stand frei, der Commit-Lauf committet nur bei Gleichheit. Liste der Dateien und ihrer
      # SHA-256 in fester Reihenfolge (LC_ALL=C), daraus ein SHA-256.
      - name: Fingerabdruck des oeffentlichen Stands
        id: fp
        env:
          PUB: ${{ runner.temp }}/sf8-public
        run: |
          set -euo pipefail
          fp=$(cd "$PUB" && LC_ALL=C find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
          stand=$(node -e 'console.log(require(process.env.PUB + "/summary.json").asOf)')
          echo "sf8-public-sha256 ${fp} (Stand ${stand})"
          echo "fp=${fp}" >> "$GITHUB_OUTPUT"
          { echo "### SF8 oeffentlicher Stand ${stand}"; echo; echo "Fingerabdruck \`${fp}\`"; } >> "$GITHUB_STEP_SUMMARY"

      # Vertrag C1: derselbe Lauf noch einmal in ein zweites Verzeichnis, gleiche Eingaben, gleicher Fingerabdruck.
      - name: Zweiter, unabhaengiger Lauf (nur automatisch; Reproduzierbarkeit)
        if: steps.mode.outputs.auto == 'true'
        id: rebuild
        env:
          OUT2: ${{ runner.temp }}/sf8-candidates-2
          PUB2: ${{ runner.temp }}/sf8-public-2
        run: |
          set -euo pipefail
          heute="$SF8_LAUFTAG"
          prev=()
          if [ -f supertrader/data/sf-candidates/index.json ]; then prev=(--previous supertrader/data/sf-candidates); fi
          node --max-old-space-size=4096 scripts/supertrader/source-faithful/product/build-candidates.mjs \
            --out "$OUT2" --stats "$RUNNER_TEMP/sf8-stats-2.json" --require-current "$heute" "${prev[@]}"
          rm -rf "$PUB2"; mkdir -p "$PUB2"
          cp "$OUT2/summary.json" "$OUT2/index.json" "$PUB2/"
          cp -r "$OUT2/strategy" "$OUT2/ticker" "$PUB2/"
          fp2=$(cd "$PUB2" && LC_ALL=C find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
          echo "fp=${fp2}" >> "$GITHUB_OUTPUT"

      - name: Veroeffentlichungsvertrag (nur automatisch; BLOCKED = kein Commit, roter Lauf)
        if: steps.mode.outputs.auto == 'true'
        id: contract
        env:
          PUB: ${{ runner.temp }}/sf8-public
          REPORT: ${{ runner.temp }}/sf8-dq.json
          RECORD: ${{ runner.temp }}/sf8-publication.json
          FP: ${{ steps.fp.outputs.fp }}
          FP2: ${{ steps.rebuild.outputs.fp }}
        run: |
          set -euo pipefail
          # Dauerbetrieb nur ohne activation (V6 e, eigener Core-PR); ACTIVATING gilt nur fuer den manuellen Weg
          registry=false
          if node -e 'const d=(require("./core/registry/domains.json").domains||[]).find((x)=>x.id==="supertrader-sf8-candidates"); process.exit(d && d.artifact==="/supertrader/data/sf-candidates/summary.json" && !d.activation ? 0 : 1)'; then registry=true; fi
          # SF8-Code-Commit = der ausgecheckte Stand, aus dem Code UND Eingaben stammen. checkout mit ref: github.ref holt
          # die Spitze des Branches beim Jobstart; GITHUB_SHA ist der Stand beim Ausloesen und kann aelter sein
          # (wartender Lauf in der Concurrency-Gruppe, verspaeteter Zeitplan) - dann waere die Nachpruefung falsch.
          code_commit="$(git rev-parse HEAD)"
          node scripts/supertrader/source-faithful/product/publication-contract.mjs --next "$PUB" --prev supertrader/data/sf-candidates \
            --fingerprint "$FP" --rebuild-fingerprint "$FP2" --dq "$REPORT" --registry-ok "$registry" \
            --code-commit "$code_commit" --run "$GITHUB_RUN_ID" --out "$RECORD"
          node -e 'const r=require(process.env.RECORD);console.log("### Veroeffentlichungsvertrag "+r.contract+": "+r.decision+"\n\nStand "+r.asOf+" (veroeffentlicht "+r.previousAsOf+"), Eingaben `"+r.inputsSha256+"`"+(r.failures.length?"\n\n- "+r.failures.join("\n- "):""))' >> "$GITHUB_STEP_SUMMARY"

      - name: Vollstaendiges Ergebnis als CI-Artefakt (inklusive Vertragsdatensaetze)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sf8-candidates-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/sf8-candidates
            ${{ runner.temp }}/sf8-stats.json
            ${{ runner.temp }}/sf8-dq.json
            ${{ runner.temp }}/sf8-publication.json
          retention-days: 14

      - name: Commit (nur supertrader/data/sf-candidates, ohne records/)
        if: inputs.commit == true && steps.mode.outputs.auto != 'true'
        env:
          PUB: ${{ runner.temp }}/sf8-public
          PUSH_OWNED_PATHS: supertrader/data/sf-candidates/
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
          ACTUAL_SHA256: ${{ steps.fp.outputs.fp }}
        run: |
          set -euo pipefail
          ziel=supertrader/data/sf-candidates
          # Nur der freigegebene Stand: ohne oder mit abweichendem Fingerabdruck kein Commit
          if [ -z "$EXPECTED_SHA256" ] || [ "$EXPECTED_SHA256" != "$ACTUAL_SHA256" ]; then
            echo "::error::Fingerabdruck ${ACTUAL_SHA256} ist nicht der freigegebene Stand (expected_sha256='${EXPECTED_SHA256}') - kein Commit."
            exit 1
          fi
          # V2 und V6: ohne registrierten Erzeuger waeren die Dateien fremde Artefakte; solange der Eintrag
          # supertrader-sf8-candidates in core/registry/domains.json activation.state PREPARED_DISABLED traegt, ist
          # ein Commit eine Veroeffentlichung ohne Freigabe. Freigegeben ist er erst mit ACTIVATING (eigener,
          # freigegebener Core-PR vor dem ersten Lauf) oder ohne activation (nach dem ersten Lauf).
          if ! node -e 'const d=(require("./core/registry/domains.json").domains||[]).find((x)=>x.id==="supertrader-sf8-candidates"); process.exit(d && d.artifact==="/supertrader/data/sf-candidates/summary.json" && (!d.activation || d.activation.state==="ACTIVATING") ? 0 : 1)'; then
            echo "::error::supertrader-sf8-candidates in core/registry/domains.json fehlt oder ist nicht freigegeben (activation.state PREPARED_DISABLED, V2/V6) - kein Commit."
            exit 1
          fi
          rm -rf "$ziel"
          mkdir -p "$ziel"
          cp -r "$PUB/." "$ziel/"
          git config user.name "vision-universe-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A "$ziel"
          if git diff --cached --quiet; then echo "unveraendert"; exit 0; fi
          stand=$(node -e 'const s=require("./supertrader/data/sf-candidates/summary.json");console.log(s.asOf)')
          git commit -q -m "Supertrader 8: Research-Kandidaten (Stand ${stand}, nicht freigeschaltet)"
          scripts/ci/push-with-retry.sh "${GITHUB_REF_NAME}"

      # Automatischer Weg: genau das zweifach gepruefte Verzeichnis, ein Commit (atomar), Nachweis als Trailer.
      - name: Commit nach Vertrag (nur automatisch, nur PUBLISH)
        if: steps.mode.outputs.auto == 'true' && steps.contract.outputs.decision == 'PUBLISH'
        env:
          PUB: ${{ runner.temp }}/sf8-public
          RECORD: ${{ runner.temp }}/sf8-publication.json
          PUSH_OWNED_PATHS: supertrader/data/sf-candidates/
        run: |
          set -euo pipefail
          ziel=supertrader/data/sf-candidates
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then echo "::error::automatischer Commit nur auf main"; exit 1; fi
          rm -rf "$ziel"
          mkdir -p "$ziel"
          cp -r "$PUB/." "$ziel/"
          git config user.name "vision-universe-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A "$ziel"
          if git diff --cached --quiet; then echo "unveraendert"; exit 0; fi
          nachricht=$(node -e 'const r=require(process.env.RECORD);console.log("Supertrader 8: Research-Kandidaten (Stand "+r.asOf+", automatisch, nicht freigeschaltet)\n\nSF8-Contract: "+r.contract+"\nSF8-Fingerprint: "+r.fingerprint+"\nSF8-Inputs-SHA256: "+r.inputsSha256+"\nSF8-Source-Files-SHA256: "+r.sourceFilesSha256+"\nSF8-Previous-AsOf: "+r.previousAsOf+"\nSF8-Code-Commit: "+r.codeCommit+"\nSF8-Run: "+r.run)')
          git commit -q -m "$nachricht"
          scripts/ci/push-with-retry.sh "${GITHUB_REF_NAME}"

  # Ein roter automatischer Lauf bleibt nicht unbemerkt (wie market-data-refresh.yml): Issue mit Label pipeline-alarm,
  # ein gruener automatischer Lauf schliesst es. Der Bote veraendert den Befund nicht.
  alarm:
    needs: candidates
    if: always() && needs.candidates.result != 'skipped' && (needs.candidates.outputs.auto == 'true' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Alarm oeffnen, ergaenzen oder schliessen
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ALARM_SOURCE: supertrader-sf8-candidates
          ALARM_TITLE: Supertrader-Tageslauf ohne neuen Stand
          RESULT_CANDIDATES: ${{ needs.candidates.result }}
        run: node scripts/ci/pipeline-alarm.mjs
