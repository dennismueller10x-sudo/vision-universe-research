name: Update VISION UNIVERSE fundamentals

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Comma-separated symbols to fetch (e.g. AMZN or AMZN,NVDA). Each symbol costs 1 Twelve Data API credit."
        required: true
        default: "AMZN"

permissions:
  contents: write

jobs:
  update-fundamentals-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch fundamentals
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python scripts/dashboard/fetch_fundamentals.py --symbols "${{ github.event.inputs.symbols }}"

      - name: Verify generated-file-only scope
        shell: bash
        run: |
          unexpected="$(git diff --name-only | grep -vE '^dashboard/data/fundamental_metrics\.json$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected modified files:"
            echo "$unexpected"
            exit 1
          fi

      - name: Commit generated data
        shell: bash
        run: |
          if git diff --quiet -- dashboard/data/fundamental_metrics.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/data/fundamental_metrics.json
          git commit -m "chore: update dashboard fundamentals (${{ github.event.inputs.symbols }})"
          git push
