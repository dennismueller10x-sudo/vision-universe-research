name: Update VISION UNIVERSE fundamentals

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Comma-separated symbols to fetch (e.g. AMZN or AMZN,NVDA). Each symbol costs 4 FMP API requests (free tier: 250/day)."
        required: true
        default: "AMZN"

permissions:
  contents: write

jobs:
  update-fundamentals-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Spitze des Zweigs, nicht der Ausloese-Commit (wartende Laeufe, Audit 03.10.2026)
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch fundamentals
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          # Eingaben nur ueber env: - nie direkt in das Skript interpoliert (Script-Injection, Audit 03.10.2026).
          IN_SYMBOLS: ${{ github.event.inputs.symbols }}
        run: |
          [[ "$IN_SYMBOLS" =~ ^[A-Za-z0-9.,\ -]*$ ]] || { echo "::error::symbols: nur Ticker, Komma, Leerzeichen"; exit 1; }
          python scripts/dashboard/fetch_fundamentals.py --symbols "$IN_SYMBOLS"

      - name: Verify generated-file-only scope
        shell: bash
        run: |
          unexpected="$(git diff --name-only | grep -vE '^dashboard/data/fundamental_metrics\.json$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected modified files:"
            echo "$unexpected"
            exit 1
          fi

      - name: Commit generated data
        shell: bash
        run: |
          if git diff --quiet -- dashboard/data/fundamental_metrics.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/data/fundamental_metrics.json
          git commit -m "chore: update dashboard fundamentals"
          # Einheitlicher Push (scripts/ci/push-with-retry.sh): neu aufsetzen, wiederholen, bei echtem Konflikt laut scheitern - kein '|| true' (Plattform-Audit 03.10.2026).
          scripts/ci/push-with-retry.sh "${GITHUB_REF_NAME}"
