# Vorsorge Live-Rauchtest: Browser-QA gegen die VEROEFFENTLICHTE Seite.
# Ausloesung: Push auf claude/** mit [vorsorge-live-smoke] in der Commit-Nachricht
# (workflow_dispatch nur, solange die Datei auf main liegt). Schreibt nichts ins
# Repository; Screenshots und Bericht als Artefakt.
# Zugang ueber das Secret RESEARCH_ACCESS_PASSWORD; der Wert wird nie ausgegeben.
name: Vorsorge Live-Rauchtest

on:
  workflow_dispatch:
    inputs:
      site:
        description: 'Basis-URL der veroeffentlichten Seite'
        type: string
        default: 'https://research.visionuniverse.de'
  push:
    branches: ['claude/**']
    paths:
      - '.github/workflows/vorsorge-live-smoke.yml'
      - 'scripts/vorsorge/live-smoke.mjs'

permissions:
  contents: read

env:
  IN_SITE: ${{ inputs.site || 'https://research.visionuniverse.de' }}

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[vorsorge-live-smoke]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/vorsorge/live-smoke.mjs
            scripts/access-gate
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Playwright (Chromium)
        run: |
          npm install --prefix /tmp/pw --no-save --no-audit --no-fund playwright@1.63.0
          /tmp/pw/node_modules/.bin/playwright install --with-deps chromium
      - name: Live-Smoke
        env:
          PLAYWRIGHT_PATH: /tmp/pw/node_modules/playwright
          RESEARCH_ACCESS_PASSWORD: ${{ secrets.RESEARCH_ACCESS_PASSWORD }}
        run: node scripts/vorsorge/live-smoke.mjs "$IN_SITE" vorsorge-live-shots
      - name: Bericht in die Zusammenfassung
        if: always()
        run: test -f vorsorge-live-shots/report.md && cat vorsorge-live-shots/report.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vorsorge-live-smoke
          path: vorsorge-live-shots
