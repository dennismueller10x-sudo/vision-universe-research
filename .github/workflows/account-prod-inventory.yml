name: Konten — Produktions-Inventur (nur lesend)
# Prueft die vorhandenen Zugaenge fuer den Produktivbetrieb, ohne etwas zu
# aendern: Supabase (account-dev), Stripe Live (account-production),
# Cloudflare und Brevo (Repository-Secrets). Ausgegeben werden nur Status-
# codes, Ja/Nein, Anzahlen und oeffentliche Namen - nie Schluessel oder
# personenbezogene Daten (oeffentliches Repository).
#
# Stripe-Schreibrechte werden mit absichtlich ungueltigen Anfragen geprueft
# (unbekannter Parameter): Stripe lehnt sie ab, ohne etwas anzulegen -
# 403 = Recht fehlt, 400 = Recht vorhanden.
on:
  push:
    branches: [ops/supabase-dev-migrations]
    paths: ['.github/workflows/account-prod-inventory.yml', 'ops/production/inventory.trigger']
permissions:
  contents: read
  actions: read
concurrency:
  group: account-prod-inventory-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: account-dev
    steps:
      - name: Freigabe pruefen (fail closed)
        env: {GH_TOKEN: '${{ github.token }}', RUN_ID: '${{ github.run_id }}', REPO: '${{ github.repository }}', APPROVER: dennismueller10x-sudo, ENV_NAME: account-dev}
        run: |
          set -euo pipefail
          json=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/approvals")
          ok=$(jq --arg u "$APPROVER" --arg e "$ENV_NAME" '[.[] | select(.state=="approved" and .user.login==$u and any(.environments[]; .name==$e))] | length' <<<"$json")
          [ "$ok" -ge 1 ] || { echo "::error::Keine Freigabe fuer $ENV_NAME"; exit 1; }
      - name: Supabase pruefen
        env:
          REF: qiytbnpoqvldsatpfkeh
          SB_URL: ${{ vars.VU_ACCOUNT_SUPABASE_URL }}
          SB_URL_SECRET: ${{ secrets.VU_ACCOUNT_SUPABASE_URL }}
          PUB: ${{ secrets.VU_ACCOUNT_SUPABASE_PUBLISHABLE_KEY }}
          SEC: ${{ secrets.VU_ACCOUNT_SUPABASE_SECRET_KEY }}
          PAT: ${{ secrets.VU_ACCOUNT_SUPABASE_ACCESS_TOKEN }}
          DB_URL: ${{ secrets.VU_ACCOUNT_SUPABASE_DB_URL }}
        run: |
          set -uo pipefail
          yn(){ [ -n "$1" ] && echo ja || echo nein; }
          url="${SB_URL:-$SB_URL_SECRET}"
          echo "SUPABASE_URL: Variable=$(yn "$SB_URL") Secret=$(yn "$SB_URL_SECRET") passt_zu_Ref=$([[ "$url" == "https://$REF.supabase.co" ]] && echo ja || echo nein)"
          echo "Publishable: gesetzt=$(yn "$PUB") Form_sb_publishable=$([[ "$PUB" == sb_publishable_* ]] && echo ja || echo nein)"
          echo "Secret key: gesetzt=$(yn "$SEC") Form_sb_secret=$([[ "$SEC" == sb_secret_* ]] && echo ja || echo nein)"
          echo "Access token: gesetzt=$(yn "$PAT") Form_sbp=$([[ "$PAT" == sbp_* ]] && echo ja || echo nein)"
          base="https://$REF.supabase.co"
          echo "REST mit Publishable (plans):  $(curl -s -o /dev/null -w '%{http_code}' -H "apikey: $PUB" "$base/rest/v1/plans?select=id")"
          echo "REST mit Secret (plan_prices): $(curl -s -o /dev/null -w '%{http_code}' -H "apikey: $SEC" "$base/rest/v1/plan_prices?select=id")"
          echo "Auth-Einstellungen oeffentlich (settings): $(curl -s -o /dev/null -w '%{http_code}' -H "apikey: $PUB" "$base/auth/v1/settings")"
          code=$(curl -s -o p.json -w '%{http_code}' -H "Authorization: Bearer $PAT" "https://api.supabase.com/v1/projects/$REF")
          echo "Management-API mit Access token: $code (200 = gueltig)"
          if [ "$code" = 200 ]; then jq -r '"Projekt: \(.name) | Region \(.region) | Status \(.status)"' p.json; fi
          code=$(curl -s -o a.json -w '%{http_code}' -H "Authorization: Bearer $PAT" "https://api.supabase.com/v1/projects/$REF/config/auth")
          echo "Auth-Konfiguration lesbar: $code"
          if [ "$code" = 200 ]; then jq -r '{site_url, uri_allow_list_gesetzt: ((.uri_allow_list // "") != ""), disable_signup, external_email_enabled, mailer_autoconfirm, mailer_secure_email_change_enabled, password_min_length, password_required_characters_gesetzt: ((.password_required_characters // "") != ""), password_hibp_enabled, refresh_token_rotation_enabled, hook_before_user_created_enabled, smtp_eigenes: ((.smtp_host // "") != ""), smtp_host, smtp_admin_email_gesetzt: ((.smtp_admin_email // "") != ""), rate_limit_email_sent, mailer_otp_exp, jwt_exp, sessions_timebox, sessions_inactivity_timeout}' a.json; fi
          code=$(curl -s -o k.json -w '%{http_code}' -H "Authorization: Bearer $PAT" "https://api.supabase.com/v1/projects/$REF/api-keys?reveal=false")
          echo "API-Schluessel (nur Namen/Typen): $code"; [ "$code" = 200 ] && jq -r '.[] | "  \(.type)\t\(.name)"' k.json
          rm -f p.json a.json k.json
          echo "Datenbank:"; psql -X -q -t -A -d "$DB_URL" -c "select 'migrationen=' || (select count(*) from supabase_migrations.schema_migrations) || ' nutzer=' || (select count(*) from auth.users) || ' testpreise=' || (select count(*) from public.plan_prices where not livemode) || ' livepreise=' || (select count(*) from public.plan_prices where livemode) || ' registrierung_offen=' || (select open from public.registration_gate) || ' positivliste=' || (select count(*) from public.registration_allowlist)" || echo "  DB nicht erreichbar"

  stripe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: account-production
    steps:
      - name: Freigabe pruefen (fail closed)
        env: {GH_TOKEN: '${{ github.token }}', RUN_ID: '${{ github.run_id }}', REPO: '${{ github.repository }}', APPROVER: dennismueller10x-sudo, ENV_NAME: account-production}
        run: |
          set -euo pipefail
          json=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/approvals")
          ok=$(jq --arg u "$APPROVER" --arg e "$ENV_NAME" '[.[] | select(.state=="approved" and .user.login==$u and any(.environments[]; .name==$e))] | length' <<<"$json")
          [ "$ok" -ge 1 ] || { echo "::error::Keine Freigabe fuer $ENV_NAME - account-production hat vermutlich keine Required reviewers"; exit 1; }
      - name: Stripe Live pruefen (nur lesend, ungueltige Probeanfragen)
        env:
          KEY: ${{ secrets.VU_ACCOUNT_STRIPE_SECRET_KEY }}
        run: |
          set -uo pipefail
          case "$KEY" in rk_live_*) echo "Schluessel: Restricted, Live";; sk_live_*) echo "Schluessel: Standard-Secret, Live (zu weitreichend)";; rk_test_*|sk_test_*) echo "Schluessel: TESTMODUS";; "") echo "::error::Schluessel fehlt"; exit 1;; *) echo "::error::unbekannte Form"; exit 1;; esac
          V=2025-03-31.basil
          get(){ curl -s -o "$2" -w '%{http_code}' -u "$KEY:" -H "Stripe-Version: $V" "https://api.stripe.com$1"; }
          code=$(get /v1/account acct.json); echo "Konto lesbar: $code"
          [ "$code" = 200 ] && jq -r '"  Land \(.country) | Waehrung \(.default_currency) | Zahlungen aktiv \(.charges_enabled) | Auszahlungen aktiv \(.payouts_enabled) | Angaben vollstaendig \(.details_submitted) | offene Anforderungen \((.requirements.currently_due // []) | length) | Name gesetzt \((.business_profile.name // "") != "")"' acct.json
          echo "Lesen (200 ja, 403 Recht fehlt):"
          for p in products prices customers subscriptions invoices checkout/sessions billing_portal/configurations webhook_endpoints events tax_rates coupons charges refunds payouts balance; do printf '  %-32s %s\n' "$p" "$(get "/v1/$p?limit=1" /dev/null)"; done
          code=$(get '/v1/products?limit=100&active=true' prod.json); [ "$code" = 200 ] && echo "Aktive Live-Produkte: $(jq '.data|length' prod.json) | davon Vision Universe: $(jq '[.data[]|select(.name|test("Vision Universe"))]|length' prod.json)" && jq -r '.data[] | "  \(.name)"' prod.json
          code=$(get '/v1/prices?limit=100&active=true' pr.json); [ "$code" = 200 ] && echo "Aktive Live-Preise: $(jq '.data|length' pr.json)" && jq -r '.data[] | "  \(.lookup_key // "-")  \(.currency) \(.unit_amount) \(.recurring.interval // "einmalig")  tax=\(.tax_behavior)"' pr.json
          code=$(get '/v1/webhook_endpoints?limit=100' wh.json); [ "$code" = 200 ] && echo "Webhooks: $(jq '.data|length' wh.json)" && jq -r '.data[] | "  \(.url|sub("^https://";"")|split("/")[0])  \(.status)  Ereignisse \(.enabled_events|length)"' wh.json
          code=$(get '/v1/billing_portal/configurations?limit=10' bp.json); [ "$code" = 200 ] && echo "Portal-Konfigurationen: $(jq '.data|length' bp.json)"
          echo "Schreiben (400 = Recht vorhanden, 403 = Recht fehlt; nichts wird angelegt):"
          post(){ curl -s -o /dev/null -w '%{http_code}' -u "$KEY:" -H "Stripe-Version: $V" -d vu_probe_unbekannter_parameter=1 "https://api.stripe.com$1"; }
          for p in /v1/products /v1/prices /v1/customers /v1/checkout/sessions /v1/billing_portal/sessions /v1/billing_portal/configurations /v1/webhook_endpoints /v1/subscriptions/sub_vuprobe /v1/refunds /v1/payouts /v1/transfers /v1/payment_intents; do printf '  %-36s %s\n' "$p" "$(post "$p")"; done
          rm -f acct.json prod.json pr.json wh.json bp.json

  cloudflare-brevo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Cloudflare pruefen (nur lesend)
        env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACC: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          cf(){ curl -s -o "$2" -w '%{http_code}' -H "Authorization: Bearer $CF" "https://api.cloudflare.com/client/v4$1"; }
          echo "Konto-ID als Variable gesetzt: $([ -n "$ACC" ] && echo ja || echo nein)"
          code=$(cf /user/tokens/verify t.json); echo "Token gueltig: $code $(jq -r '.result.status // ""' t.json)"
          code=$(cf "/accounts/$ACC/workers/scripts" w.json); echo "Worker-Skripte lesbar: $code"; [ "$code" = 200 ] && jq -r '.result[] | "  \(.id)"' w.json
          code=$(cf "/accounts/$ACC/workers/subdomain" s.json); echo "workers.dev-Subdomain: $code $(jq -r '.result.subdomain // ""' s.json)"
          code=$(cf "/zones?name=visionuniverse.de" z.json); echo "Zone visionuniverse.de lesbar: $code $(jq -r '.result | length' z.json)"
          zid=$(jq -r '.result[0].id // ""' z.json)
          if [ -n "$zid" ]; then
            code=$(cf "/zones/$zid/dns_records?name=account.visionuniverse.de" d.json); echo "DNS account.visionuniverse.de: $code"; jq -r '.result[]? | "  \(.type) proxied=\(.proxied)"' d.json
            code=$(cf "/zones/$zid/workers/routes" r.json); echo "Worker-Routen lesbar: $code"; jq -r '.result[]? | "  \(.pattern) -> \(.script // "-")"' r.json
          fi
          code=$(cf "/accounts/$ACC/workers/domains" cd.json); echo "Worker-Custom-Domains: $code"; jq -r '.result[]? | "  \(.hostname) -> \(.service)"' cd.json
          code=$(cf "/accounts/$ACC/r2/buckets" b.json); echo "R2 (fuer Backups) lesbar: $code $(jq -r '(.result.buckets // []) | length' b.json) Buckets"
          rm -f t.json w.json s.json z.json d.json r.json cd.json b.json
      - name: Brevo pruefen (nur lesend)
        env:
          BK: ${{ secrets.BREVO_API_KEY }}
        run: |
          set -uo pipefail
          bv(){ curl -s -o "$2" -w '%{http_code}' -H "api-key: $BK" -H 'accept: application/json' -H 'User-Agent: VisionUniverse-Brevo/1.0' "https://api.brevo.com/v3$1"; }
          echo "Schluessel gesetzt: $([ -n "$BK" ] && echo ja || echo nein)"
          code=$(bv /account a.json); echo "Konto: $code"; [ "$code" = 200 ] && jq -r '.plan[]? | "  Tarif \(.type) Credits \(.credits // "-") \(.creditsType // "")"' a.json
          code=$(bv /senders/domains d.json); echo "Domains: $code"; jq -r '.domains[]? | "  \(.domain_name) verifiziert=\(.verified) authentifiziert=\(.authenticated)"' d.json
          code=$(bv /senders s.json); echo "Absender: $code"; jq -r '.senders[]? | "  \(.email|sub("^[^@]+";"*")) aktiv=\(.active)"' s.json
          code=$(bv /smtp/statistics/aggregatedReport?days=7 r.json); echo "Transaktions-API lesbar: $code"
          rm -f a.json d.json s.json r.json
