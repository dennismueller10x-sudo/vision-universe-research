name: Brevo | Prüfung und Struktur (kein Versand)
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Prüfung, Einrichtung oder geschützter Import; niemals Versand
        type: choice
        options: [audit, setup, import-preview, import]
        default: audit
        required: true
permissions:
  contents: read
concurrency:
  group: brevo-admin
  cancel-in-progress: false
jobs:
  account-structure-audit:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/ops/brevo-account-audit-20261012' && inputs.operation == 'audit'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 37d35e32cb19a5161b1150e608eeb87a48c6c220
          persist-credentials: false
          sparse-checkout: scripts/brevo
      - name: GET-only account label and folder verification
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_OPERATION: audit
        run: python3 scripts/brevo/account_structure_audit.py
  admin:
    if: github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: scripts/brevo
      - name: Brevo-Prüfung oder Struktureinrichtung
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_OPERATION: ${{ inputs.operation }}
          BREVO_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BREVO_IMPORT_PAYLOAD: ${{ (inputs.operation == 'import-preview' || inputs.operation == 'import') && secrets.BREVO_IMPORT_PAYLOAD || '' }}
          BREVO_IMPORT_REVIEW: ${{ inputs.operation == 'import' && secrets.BREVO_IMPORT_REVIEW || '' }}
        run: |
          set -euo pipefail
          case "$BREVO_OPERATION" in audit|setup|import-preview|import) ;; *) exit 1 ;; esac
          python3 scripts/brevo/cli.py "$BREVO_OPERATION"
