name: Brevo | Prüfung und Struktur (kein Versand)
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Prüfung, Einrichtung oder geschützter Import; niemals Versand
        type: choice
        options: [audit, setup, import-preview, import]
        default: audit
        required: true
      automations_checked:
        description: Alle aktiven Automationen tatsächlich geprüft (kein Ersatz für UI-Nachweis)
        type: boolean
        default: false
      import_triggers_excluded:
        description: Anlage, Änderung und Listenzugang lösen nachweislich keinen Flow aus
        type: boolean
        default: false
      automations_reviewed_at:
        description: Tatsächlicher Prüfzeitpunkt ISO-8601 mit Zeitzone, höchstens 24h
        type: string
        default: ''
      automation_evidence_sha256:
        description: SHA256 des privaten Nachweises, niemals Screenshot/Text/Adressen
        type: string
        default: ''
      review_prepared_sha256:
        description: prepared_sha256 aus dem privaten Übergabemanifest
        type: string
        default: ''
      dns_operation:
        description: Isolierter Domain-Betrieb; keine Kontakte oder E-Mails
        type: choice
        options: [audit, apply, verify]
        default: audit
      dns_authorize:
        description: Ausschließlich beauftragte Brevo-DNS-Ergänzung/Authentifizierung freigegeben
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: brevo-admin
  cancel-in-progress: false
jobs:
  domain_dns:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feat/brevo-domain-authentication' && inputs.operation == 'audit'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 29b4a43885ea78e029e4c2ebbdc1731f76737047
          persist-credentials: false
          sparse-checkout: scripts/brevo
      - name: Isolierte Brevo-Domain und Cloudflare-DNS-Prüfung
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_CLOUDFLARE_DNS_TOKEN: ${{ secrets.BREVO_CLOUDFLARE_DNS_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_API: ${{ secrets.CLOUDFLARE_API }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          BREVO_DNS_OPERATION: ${{ inputs.dns_operation }}
          BREVO_DNS_AUTHORIZE: ${{ inputs.dns_authorize }}
        run: python3 scripts/brevo/domain_auth.py
  admin:
    if: github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: scripts/brevo
      - name: Brevo-Prüfung oder Struktureinrichtung
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_AUTOMATIONS_CHECKED: ${{ inputs.automations_checked }}
          BREVO_IMPORT_TRIGGERS_EXCLUDED: ${{ inputs.import_triggers_excluded }}
          BREVO_AUTOMATIONS_REVIEWED_AT: ${{ inputs.automations_reviewed_at }}
          BREVO_AUTOMATION_EVIDENCE_SHA256: ${{ inputs.automation_evidence_sha256 }}
          BREVO_REVIEW_PREPARED_SHA256: ${{ inputs.review_prepared_sha256 }}
          BREVO_OPERATION: ${{ inputs.operation }}
          BREVO_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BREVO_IMPORT_PAYLOAD: ${{ (inputs.operation == 'import-preview' || inputs.operation == 'import') && secrets.BREVO_IMPORT_PAYLOAD || '' }}
          BREVO_IMPORT_REVIEW: ${{ inputs.operation == 'import' && secrets.BREVO_IMPORT_REVIEW || '' }}
        run: |
          set -euo pipefail
          case "$BREVO_OPERATION" in audit|setup|import-preview|import) ;; *) exit 1 ;; esac
          python3 scripts/brevo/cli.py "$BREVO_OPERATION"
