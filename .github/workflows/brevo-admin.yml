name: Brevo | Prüfung und Struktur (kein Versand)
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Prüfung, Einrichtung oder geschützter Import; niemals Versand
        type: choice
        options: [audit, setup, import-preview, import]
        default: audit
        required: true
permissions:
  contents: read
concurrency:
  group: brevo-admin
  cancel-in-progress: false
jobs:
  domain-inspection:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/ops/brevo-contact-audit-20261010' && inputs.operation == 'audit'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 97552029ef90af56e03fa026bdc6d842e9a94fb8
          persist-credentials: false
          sparse-checkout: scripts/brevo
      - name: Read only DNS configuration after uncertain preparation
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_OPERATION: audit
        run: /usr/bin/python3 scripts/brevo/domain_inspect.py
  domain-preparation:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/ops/brevo-contact-audit-20261010' && inputs.operation == 'setup'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: d8005aa8c6ee644a1550ff12febefd540d9bae99
          persist-credentials: false
          sparse-checkout: scripts/brevo
      - name: Prepare sender domain without DNS or email calls
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_OPERATION: setup
        run: |
          /usr/bin/python3 -c 'import cryptography'
          /usr/bin/python3 scripts/brevo/domain_prepare.py
  inventory-audit:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/ops/brevo-contact-audit-20261010' && inputs.operation == 'audit'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 56d7e958f8c2f07998a60d7825b196c1eda15f2f
          persist-credentials: false
          sparse-checkout: scripts/brevo
      - name: Read-only contact and suppression inventory
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_OPERATION: audit
        run: python3 scripts/brevo/inventory_diagnostics.py
  admin:
    if: github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: scripts/brevo
      - name: Brevo-Prüfung oder Struktureinrichtung
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_OPERATION: ${{ inputs.operation }}
          BREVO_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BREVO_IMPORT_PAYLOAD: ${{ (inputs.operation == 'import-preview' || inputs.operation == 'import') && secrets.BREVO_IMPORT_PAYLOAD || '' }}
          BREVO_IMPORT_REVIEW: ${{ inputs.operation == 'import' && secrets.BREVO_IMPORT_REVIEW || '' }}
        run: |
          set -euo pipefail
          case "$BREVO_OPERATION" in audit|setup|import-preview|import) ;; *) exit 1 ;; esac
          python3 scripts/brevo/cli.py "$BREVO_OPERATION"
