name: Supertrader interner Datentest (Validierung)

# Interner Datentest (scripts/supertrader/validation/, PREREGISTRATION.json).
# Nur manuell oder ueber eine Marke in der Commit-Nachricht auf claude/**:
#   [supertrader-validation:subset]   Teilmenge abrufen (~150 Anfragen)
#   [supertrader-validation:full]     alle offenen Listings abrufen (fortsetzbar)
#   [supertrader-validation:analyze]  Qualitaet, Universum, Backtest (keine Tiingo-Kursanfragen)
#   [supertrader-validation:analyze-smoke]  Technischer Probelauf der Auswertung (400 Reihen)
#   [supertrader-validation:methods]  Momentum, Weinstein, Darvas, Minervini (PREREGISTRATION-METHODS.json)
#   [supertrader-validation:methods-smoke]  Technischer Probelauf dazu (400 Reihen)
#   [supertrader-validation:diagnose]  Ursachenanalyse der getesteten Versionen (keine neue Hypothese)
#   [supertrader-validation:diagnose-smoke]  Technischer Probelauf dazu (400 Reihen)
#   [supertrader-validation:r7]  Vorab registrierte Runde-7-Versionen (PREREGISTRATION-R7.json)
#   [supertrader-validation:r7-smoke]  Technischer Probelauf dazu (400 Reihen)
#   [supertrader-validation:r8]  Momentum 3.0.0 + Gegenproben (PREREGISTRATION-R8.json)
#   [supertrader-validation:intraday-probe]  Zugangsprobe historische IEX-Minuten (Runde 9)
#   [supertrader-validation:r8b]  Darvas/Weinstein 3.0.0 (PREREGISTRATION-R8B.json)
#   [supertrader-validation:r8-smoke]  Technischer Probelauf dazu (400 Reihen)
#   [supertrader-validation:sources]  Frei zugaengliche Originalseiten lesen (verschluesselt, sources-r8.json)
# Eingefrorener Research-Snapshot (docs/SUPERTRADER_DURABLE_RESEARCH_SNAPSHOTS.md), zusaetzlich zur Modusmarke:
#   [supertrader-validation-snapshot:sts1-<32 hex>]  alle Eingaben aus diesem Snapshot (kein Live-Abruf)
#   [supertrader-validation-accounting:research-v1]  Research-Abrechnung (validation/accounting-contract.mjs)
# Bei workflow_dispatch ueber die Eingaben snapshot / accounting; eine Marke in der Commit-Nachricht hat Vorrang.
# Snapshot und research-v1 sind nur fuer Modi zulaessig, deren Runner sie lesen (analyze-methods.mjs, run-research.mjs);
# jeder andere Modus bricht dann ab (fail closed).
#   [supertrader-validation:sf-research]        Buchgetreue Methoden (source-faithful/runner/run-research.mjs),
#   [supertrader-validation:sf-research-smoke]  nur mit Snapshot-Marke und research-v1; Ergebnis DIAGNOSTIC_NOT_CERTIFIED
#   [supertrader-validation:sf3-research]       Supertrader-3.0-Research-Komponenten (source-faithful/research/run-sf3-research.mjs),
#   [supertrader-validation:sf3-research-smoke] gleiche Bedingungen; Engines und AG-3-Fingerabdruck unveraendert
#   [supertrader-validation:sf4-lifecycle]       Supertrader-4.0-Minervini-Trade-Lifecycle (source-faithful/research/run-sf4-lifecycle.mjs),
#   [supertrader-validation:sf4-lifecycle-smoke] gleiche Bedingungen; Modellstudie, keine Strategierendite, keine Orders
#   [supertrader-validation:sf5-lifecycle]       Supertrader-5.0-Lifecycles auf der gemeinsamen Engine (source-faithful/research/run-sf5-lifecycle.mjs),
#   [supertrader-validation:sf5-lifecycle-smoke] gleiche Bedingungen; Modellstudien, keine Strategierendite, keine Orders
#   [supertrader-validation:kk-intraday-count]   Kullamaegi EP/PS chart-first: nur Tagesscreens zaehlen (kein Abruf)
#   [supertrader-validation:kk-intraday]         dazu IEX-Minuten der Kandidatentage (Budget [kk-max-requests:N] <= 6000, Cache, fortsetzbar)
#   [supertrader-validation:kk-intraday-smoke]   technischer Probelauf (400 Reihen, Smoke-Snapshot)
# Rohreihen nur im privaten Eimer. Das Repository ist oeffentlich: Logs zeigen
# nur Fortschrittszahlen; Ergebnisse werden verschluesselt (nur der Eigentuemer
# kann sie lesen) auf den Zweig claude/supertrader-validation-results gelegt.
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [kk-intraday, kk-intraday-count, kk-intraday-smoke, sf-research, sf-research-smoke, sf3-research, sf3-research-smoke, sf4-lifecycle, sf4-lifecycle-smoke, sf5-lifecycle, sf5-lifecycle-smoke, subset, full, analyze, methods, diagnose, r7, sources, r8, r8b, r8c, intraday-probe, intraday, intraday-smoke, r9b, venue-probe, sources-minervini, cases, cases-smoke, r10b, universe-audit, r10c, cases-holdout, r10m, sec-pit, r11, cases-w4, sources-r12, r12, trend52, trend52-smoke, audit13, audit13-smoke, r13b, trend52-s1c, holdout-fetch, holdout-sec, audit14, audit14-smoke, audit14-holdout, audit14-holdout-smoke, r15-delist-cases]
        default: subset
      snapshot:
        description: 'Research-Snapshot sts1-<32 hex> (leer = Live-Eingaben wie bisher)'
        type: string
        default: ''
      accounting:
        type: choice
        options: [legacy, research-v1]
        default: legacy
  push:
    branches:
      - 'claude/**'
permissions:
  contents: write
concurrency:
  # Laeufe ohne Auftragsmarke (Pushes anderer Zweige, Job wird uebersprungen) bekommen eine eigene
  # Gruppe: sonst verdraengen sie wartende Pruefauftraege (Runde 10, zweimal beobachtet).
  # Manuell gestartete Laeufe (workflow_dispatch) laufen in eigener Gruppe: Pushes anderer Zweige
  # mit aelterer Workflow-Fassung koennen sie sonst als wartende Laeufe verdraengen (Runde 10).
  group: supertrader-validation-${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && !contains(github.event.head_commit.message, '[supertrader-validation:'))) && github.run_id || ((contains(github.event.head_commit.message, '-smoke]')) && 'smoke' || 'main') }}
  cancel-in-progress: false
jobs:
  run:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[supertrader-validation:')
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          # Spitze des Zweigs, nicht der Ausloese-Commit (wartende Laeufe, Audit 03.10.2026)
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Modus bestimmen
        id: mode
        env:
          MSG: ${{ github.event.head_commit.message }}
          INPUT: ${{ inputs.mode }}
        run: |
          m="$INPUT"
          case "$MSG" in *"[supertrader-validation:kk-intraday-count]"*) m=kk-intraday-count;; *"[supertrader-validation:kk-intraday-smoke]"*) m=kk-intraday-smoke;; *"[supertrader-validation:kk-intraday]"*) m=kk-intraday;; *"[supertrader-validation:sf5-lifecycle-smoke]"*) m=sf5-lifecycle-smoke;; *"[supertrader-validation:sf5-lifecycle]"*) m=sf5-lifecycle;; *"[supertrader-validation:sf4-lifecycle-smoke]"*) m=sf4-lifecycle-smoke;; *"[supertrader-validation:sf4-lifecycle]"*) m=sf4-lifecycle;; *"[supertrader-validation:sf3-research-smoke]"*) m=sf3-research-smoke;; *"[supertrader-validation:sf3-research]"*) m=sf3-research;; *"[supertrader-validation:sf-research-smoke]"*) m=sf-research-smoke;; *"[supertrader-validation:sf-research]"*) m=sf-research;; *"[supertrader-validation:sources]"*) m=sources;; *"[supertrader-validation:venue-probe]"*) m=venue-probe;; *"[supertrader-validation:cases-smoke]"*) m=cases-smoke;; *"[supertrader-validation:cases]"*) m=cases;; *"[supertrader-validation:sources-minervini]"*) m=sources-minervini;; *"[supertrader-validation:r8b]"*) m=r8b;; *"[supertrader-validation:intraday-probe]"*) m=intraday-probe;; *"[supertrader-validation:intraday]"*) m=intraday;; *"[supertrader-validation:r9b]"*) m=r9b;; *"[supertrader-validation:r10b]"*) m=r10b;; *"[supertrader-validation:intraday-smoke]"*) m=intraday-smoke;; *"[supertrader-validation:r8c]"*) m=r8c;; *"[supertrader-validation:r8-smoke]"*) m=r8-smoke;; *"[supertrader-validation:r8]"*) m=r8;; *"[supertrader-validation:r7-smoke]"*) m=r7-smoke;; *"[supertrader-validation:r7]"*) m=r7;; *"[supertrader-validation:diagnose-smoke]"*) m=diagnose-smoke;; *"[supertrader-validation:diagnose]"*) m=diagnose;; *"[supertrader-validation:methods-smoke]"*) m=methods-smoke;; *"[supertrader-validation:methods]"*) m=methods;; *"[supertrader-validation:analyze-smoke]"*) m=analyze-smoke;; *"[supertrader-validation:subset]"*) m=subset;; *"[supertrader-validation:full]"*) m=full;; *"[supertrader-validation:analyze]"*) m=analyze;; esac
          echo "mode=${m:-subset}" >> "$GITHUB_OUTPUT"
      - name: Snapshot- und Abrechnungsvertrag (fail closed)
        id: snap
        env:
          MSG: ${{ github.event.head_commit.message }}
          IN_SNAPSHOT: ${{ inputs.snapshot }}
          IN_ACCOUNTING: ${{ inputs.accounting }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -euo pipefail
          snap="${IN_SNAPSHOT:-}"; acc="${IN_ACCOUNTING:-legacy}"
          if [[ "${MSG:-}" =~ \[supertrader-validation-snapshot:([^]]*)\] ]]; then snap="${BASH_REMATCH[1]}"; fi
          if [[ "${MSG:-}" =~ \[supertrader-validation-accounting:([^]]*)\] ]]; then acc="${BASH_REMATCH[1]}"; fi
          if [ -n "$snap" ] && ! [[ "$snap" =~ ^sts1-[0-9a-f]{32}$ ]]; then echo "INPUT_INTEGRITY_FAILURE: SNAPSHOT_ID_FORMAT" >&2; exit 1; fi
          case "$acc" in legacy|research-v1) ;; *) echo "UNKNOWN_ACCOUNTING_MODE" >&2; exit 1;; esac
          # Nur analyze-methods.mjs liest einen Snapshot; r9b/r10b brauchen Live-Minutendaten (dort ebenfalls gesperrt).
          if [ -n "$snap" ] || [ "$acc" != legacy ]; then
            case "$MODE" in methods|methods-smoke|r7|r7-smoke|r8|r8-smoke|r8b|r8c|r10c|r10m|r11|r12|r13b|sf-research|sf-research-smoke|sf3-research|sf3-research-smoke|sf4-lifecycle|sf4-lifecycle-smoke|sf5-lifecycle|sf5-lifecycle-smoke|kk-intraday|kk-intraday-count|kk-intraday-smoke) ;;
              *) echo "INPUT_INTEGRITY_FAILURE: SNAPSHOT_OR_ACCOUNTING_NOT_SUPPORTED_FOR_MODE ($MODE)" >&2; exit 1;; esac
          fi
          # Buchgetreue Methoden: nur eingefrorener Snapshot und research-v1 (fail closed).
          case "$MODE" in sf-research|sf-research-smoke|sf3-research|sf3-research-smoke|sf4-lifecycle|sf4-lifecycle-smoke|sf5-lifecycle|sf5-lifecycle-smoke|kk-intraday|kk-intraday-count|kk-intraday-smoke)
            if [ -z "$snap" ] || [ "$acc" != research-v1 ]; then echo "INPUT_INTEGRITY_FAILURE: SF_RESEARCH_REQUIRES_SNAPSHOT_AND_RESEARCH_V1" >&2; exit 1; fi;; esac
          if [ "$acc" != legacy ] && [ -z "$snap" ]; then echo "research-v1 ohne Snapshot: Eingaben sind live (nicht eingefroren)"; fi
          args=""
          [ -n "$snap" ] && args="--snapshot $snap"
          [ "$acc" != legacy ] && args="$args --accounting $acc"
          echo "args=$args" >> "$GITHUB_OUTPUT"
          echo "Snapshot: ${snap:-keiner}; Abrechnung: $acc"
      - name: Oeffentliche Anbieterangaben zu Abrufgrenzen (Beleg, best effort)
        if: steps.mode.outputs.mode == 'subset'
        run: |
          for u in https://www.tiingo.com/about/pricing https://www.tiingo.com/documentation/general/overview https://www.tiingo.com/about/terms; do
            echo "== $u"
            curl -sL --max-time 20 "$u" | sed 's/<[^>]*>/\n/g' | grep -iE "unique symbol|symbols per month|requests per (hour|day)|per hour|per day|internal|commercial|redistribut" | sed 's/^[[:space:]]*//' | sort -u | head -40 || true
          done
      - name: Abruf (nur Fortschrittszahlen im Log)
        if: steps.mode.outputs.mode == 'subset' || steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'holdout-fetch'
        env:
          # Runde 14: Holdout 2008-2015 in eigenem privaten Namensraum (PREREGISTRATION-R14 periods.HOLDOUT).
          ST_WINDOW: ${{ steps.mode.outputs.mode == 'holdout-fetch' && 'HOLDOUT' || 'DEV' }}
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_REGION: ${{ secrets.VU_HISTORY_S3_REGION }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
        run: node scripts/supertrader/validation/fetch.mjs --mode ${{ steps.mode.outputs.mode == 'holdout-fetch' && 'full' || steps.mode.outputs.mode }} --out "$RUNNER_TEMP/val"
      - name: Auswertung (verschluesselt)
        if: steps.mode.outputs.mode == 'analyze' || steps.mode.outputs.mode == 'analyze-smoke'
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_REGION: ${{ secrets.VU_HISTORY_S3_REGION }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
          NODE_OPTIONS: --max-old-space-size=12000
        run: node scripts/supertrader/validation/analyze.mjs --out "$RUNNER_TEMP/val" ${{ steps.mode.outputs.mode == 'analyze-smoke' && '--limit 400' || '' }}
      - name: Auswertung weiterer Methoden (verschluesselt)
        if: steps.mode.outputs.mode == 'methods' || steps.mode.outputs.mode == 'methods-smoke'
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_REGION: ${{ secrets.VU_HISTORY_S3_REGION }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
          SNAP_ARGS: ${{ steps.snap.outputs.args }}
          NODE_OPTIONS: --max-old-space-size=14000
        run: node scripts/supertrader/validation/analyze-methods.mjs --out "$RUNNER_TEMP/val" ${{ steps.mode.outputs.mode == 'methods-smoke' && '--limit 400' || '' }} $SNAP_ARGS
      - name: Ursachenanalyse (verschluesselt)
        if: steps.mode.outputs.mode == 'diagnose' || steps.mode.outputs.mode == 'diagnose-smoke'
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_REGION: ${{ secrets.VU_HISTORY_S3_REGION }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
          NODE_OPTIONS: --max-old-space-size=14000
        run: node scripts/supertrader/validation/diagnose-methods.mjs --out "$RUNNER_TEMP/val" ${{ steps.mode.outputs.mode == 'diagnose-smoke' && '--limit 400' || '' }}
      - name: Runde-7-Versionen (verschluesselt)
        if: steps.mode.outputs.mode == 'r7' || steps.mode.outputs.mode == 'r7-smoke'
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_REGION: ${{ secrets.VU_HISTORY_S3_REGION }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
          SNAP_ARGS: ${{ steps.snap.outputs.args }}
          NODE_OPTIONS: --max-old-space-size=14000
        run: node scripts/supertrader/validation/analyze-methods.mjs --set r7 --out "$RUNNER_TEMP/val" ${{ steps.mode.outputs.mode == 'r7-smoke' && '--limit 400' || '' }} $SNAP_ARGS
      - name: Runde-8 Momentum 3.0.0 und Gegenproben (verschluesselt)
        if: steps.mode.outputs.mode == 'r8' || steps.mode.outputs.mode == 'r8-smoke' || steps.mode.outputs.mode == 'r8b' || steps.mode.outputs.mode == 'r8c' || steps.mode.outputs.mode == 'r9b' || steps.mode.outputs.mode == 'r10b' || steps.mode.outputs.mode == 'r10c' || steps.mode.outputs.mode == 'r10m' || steps.mode.outputs.mode == 'r11' || steps.mode.outputs.mode == 'r12' || steps.mode.outputs.mode == 'r13b'
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_REGION: ${{ secrets.VU_HISTORY_S3_REGION }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
          SNAP_ARGS: ${{ steps.snap.outputs.args }}
          NODE_OPTIONS: --max-old-space-size=14000
        run: node scripts/supertrader/validation/analyze-methods.mjs --set ${{ (steps.mode.outputs.mode == 'r8b' || steps.mode.outputs.mode == 'r8c' || steps.mode.outputs.mode == 'r9b' || steps.mode.outputs.mode == 'r10b' || steps.mode.outputs.mode == 'r10c' || steps.mode.outputs.mode == 'r10m' || steps.mode.outputs.mode == 'r11' || steps.mode.outputs.mode == 'r12' || steps.mode.outputs.mode == 'r13b') && steps.mode.outputs.mode || 'r8' }} --out "$RUNNER_TEMP/val" ${{ steps.mode.outputs.mode == 'r8-smoke' && '--limit 400' || '' }} $SNAP_ARGS
      - name: Buchgetreue Methoden, diagnostisch (Snapshot + research-v1, verschluesselt)
        if: steps.mode.outputs.mode == 'sf-research' || steps.mode.outputs.mode == 'sf-research-smoke'
        env:
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_REGION: ${{ secrets.VU_HISTORY_S3_REGION }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
          NODE_OPTIONS: --max-old-space-size=14000
          SNAP_ARGS: ${{ steps.snap.outputs.args }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -euo pipefail
          extra=""
          [ "$MODE" = sf-research-smoke ] && extra="--smoke-snapshot"
          node scripts/supertrader/source-faithful/runner/run-research.mjs --out "$RUNNER_TEMP/val" $SNAP_ARGS $extra
          cat "$RUNNER_TEMP/val"/*.public.json
      - name: Supertrader 3.0 Research-Komponenten, diagnostisch (Snapshot + research-v1, verschluesselt)
        if: steps.mode.outputs.mode == 'sf3-research' || steps.mode.outputs.mode == 'sf3-research-smoke'
        env:
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_REGION: ${{ secrets.VU_HISTORY_S3_REGION }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
          NODE_OPTIONS: --max-old-space-size=14000
          SNAP_ARGS: ${{ steps.snap.outputs.args }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -euo pipefail
          extra=""
          [ "$MODE" = sf3-research-smoke ] && extra="--smoke-snapshot"
          node scripts/supertrader/source-faithful/research/run-sf3-research.mjs --out "$RUNNER_TEMP/val" $SNAP_ARGS $extra
          cat "$RUNNER_TEMP/val"/*.public.json
      - name: Supertrader 4.0 Minervini Trade Lifecycle, diagnostische Modellstudie (Snapshot + research-v1, verschluesselt)
        if: steps.mode.outputs.mode == 'sf4-lifecycle' || steps.mode.outputs.mode == 'sf4-lifecycle-smoke'
        env:
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_REGION: ${{ secrets.VU_HISTORY_S3_REGION }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
          NODE_OPTIONS: --max-old-space-size=14000
          SNAP_ARGS: ${{ steps.snap.outputs.args }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -euo pipefail
          extra=""
          [ "$MODE" = sf4-lifecycle-smoke ] && extra="--smoke-snapshot"
          node scripts/supertrader/source-faithful/research/run-sf4-lifecycle.mjs --out "$RUNNER_TEMP/val" $SNAP_ARGS $extra
          cat "$RUNNER_TEMP/val"/*.public.json
      - name: Kullamaegi EP/PS chart-first, Tagesscreens + IEX-Minuten (Snapshot + research-v1, budgetiert, verschluesselt)
        if: steps.mode.outputs.mode == 'kk-intraday' || steps.mode.outputs.mode == 'kk-intraday-count' || steps.mode.outputs.mode == 'kk-intraday-smoke'
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_REGION: ${{ secrets.VU_HISTORY_S3_REGION }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
          NODE_OPTIONS: --max-old-space-size=14000
          SNAP_ARGS: ${{ steps.snap.outputs.args }}
          MODE: ${{ steps.mode.outputs.mode }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          extra=""
          [ "$MODE" = kk-intraday-count ] && extra="--count-only"
          [ "$MODE" = kk-intraday-smoke ] && extra="--smoke-snapshot --limit 400 --max-requests 50"
          if [ "$MODE" = kk-intraday ] && [[ "${MSG:-}" =~ \[kk-max-requests:([0-9]{1,4})\] ]]; then n="${BASH_REMATCH[1]}"; [ "$n" -le 6000 ] || { echo "KK_MAX_REQUESTS_ABOVE_6000" >&2; exit 1; }; extra="--max-requests $n"; fi
          node scripts/supertrader/source-faithful/research/run-kk-intraday.mjs --out "$RUNNER_TEMP/val" $SNAP_ARGS $extra
          cat "$RUNNER_TEMP/val"/*.public.json
      - name: Supertrader 5.0 Lifecycles (gemeinsame Engine), diagnostische Modellstudien (Snapshot + research-v1, verschluesselt)
        if: steps.mode.outputs.mode == 'sf5-lifecycle' || steps.mode.outputs.mode == 'sf5-lifecycle-smoke'
        env:
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_REGION: ${{ secrets.VU_HISTORY_S3_REGION }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
          NODE_OPTIONS: --max-old-space-size=14000
          SNAP_ARGS: ${{ steps.snap.outputs.args }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -euo pipefail
          extra=""
          [ "$MODE" = sf5-lifecycle-smoke ] && extra="--smoke-snapshot"
          node scripts/supertrader/source-faithful/research/run-sf5-lifecycle.mjs --out "$RUNNER_TEMP/val" $SNAP_ARGS $extra
          cat "$RUNNER_TEMP/val"/*.public.json
      - name: Intraday-Zugangsprobe (verschluesselt)
        if: steps.mode.outputs.mode == 'intraday-probe'
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
        run: node scripts/supertrader/validation/intraday-probe.mjs --out "$RUNNER_TEMP/val"
      - name: Intraday-Studie Kauf-Stop-Tage (verschluesselt)
        if: steps.mode.outputs.mode == 'intraday' || steps.mode.outputs.mode == 'intraday-smoke'
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_REGION: ${{ secrets.VU_HISTORY_S3_REGION }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
          NODE_OPTIONS: --max-old-space-size=14000
        run: node scripts/supertrader/validation/intraday-study.mjs --out "$RUNNER_TEMP/val" ${{ steps.mode.outputs.mode == 'intraday-smoke' && '--limit 400' || '' }}
      - name: Mehrboersen-Minuten gegen IEX (Runde 10, begrenzt, verschluesselt)
        if: steps.mode.outputs.mode == 'venue-probe'
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_REGION: ${{ secrets.VU_HISTORY_S3_REGION }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
          NODE_OPTIONS: --max-old-space-size=14000
        run: node scripts/supertrader/validation/venue-probe.mjs --out "$RUNNER_TEMP/val"
      - name: Fallpruefung Gewinner und Fehlkandidaten (Runde 10, verschluesselt)
        if: steps.mode.outputs.mode == 'cases' || steps.mode.outputs.mode == 'cases-smoke' || steps.mode.outputs.mode == 'cases-holdout' || steps.mode.outputs.mode == 'cases-w4'
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_REGION: ${{ secrets.VU_HISTORY_S3_REGION }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
          NODE_OPTIONS: --max-old-space-size=14000
        run: node scripts/supertrader/validation/case-study.mjs --out "$RUNNER_TEMP/val" ${{ steps.mode.outputs.mode == 'cases-smoke' && '--limit 600' || '' }} ${{ steps.mode.outputs.mode == 'cases-holdout' && '--holdout' || '' }} ${{ steps.mode.outputs.mode == 'cases-w4' && '--r11' || '' }}
      - name: VU Trendfolge 52W Vollportfolio (Runde 12, verschluesselt)
        if: steps.mode.outputs.mode == 'trend52' || steps.mode.outputs.mode == 'trend52-smoke' || steps.mode.outputs.mode == 'trend52-s1c'
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_REGION: ${{ secrets.VU_HISTORY_S3_REGION }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
          NODE_OPTIONS: --max-old-space-size=14000
        run: node scripts/supertrader/validation/analyze-trend52.mjs --out "$RUNNER_TEMP/val" ${{ steps.mode.outputs.mode == 'trend52-smoke' && '--limit 600' || '' }} ${{ steps.mode.outputs.mode == 'trend52-s1c' && '--classified' || '' }}
      - name: Forensischer Audit (Runde 13, verschluesselt)
        if: steps.mode.outputs.mode == 'audit13' || steps.mode.outputs.mode == 'audit13-smoke'
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_REGION: ${{ secrets.VU_HISTORY_S3_REGION }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
          NODE_OPTIONS: --max-old-space-size=14000
        run: node scripts/supertrader/validation/audit-r13.mjs --out "$RUNNER_TEMP/val" ${{ steps.mode.outputs.mode == 'audit13-smoke' && '--limit 600' || '' }}
      - name: Unabhaengiger Red-Team-Audit (Runde 14, DEV oder HOLDOUT, verschluesselt)
        if: steps.mode.outputs.mode == 'audit14' || steps.mode.outputs.mode == 'audit14-smoke' || steps.mode.outputs.mode == 'audit14-holdout' || steps.mode.outputs.mode == 'audit14-holdout-smoke'
        env:
          ST_WINDOW: ${{ (steps.mode.outputs.mode == 'audit14-holdout' || steps.mode.outputs.mode == 'audit14-holdout-smoke') && 'HOLDOUT' || 'DEV' }}
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_REGION: ${{ secrets.VU_HISTORY_S3_REGION }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
          NODE_OPTIONS: --max-old-space-size=14500
        run: node scripts/supertrader/validation/audit-r14.mjs --out "$RUNNER_TEMP/val" ${{ (steps.mode.outputs.mode == 'audit14-smoke' || steps.mode.outputs.mode == 'audit14-holdout-smoke') && '--limit 600' || '' }}
      - name: Delisting-Regressionsfaelle (Runde 15, SEC-Einreichungen, verschluesselt)
        if: steps.mode.outputs.mode == 'r15-delist-cases'
        run: node scripts/supertrader/validation/delist-cases-r15.mjs --out "$RUNNER_TEMP/val"
      - name: SEC-Gewinnhistorie zum damaligen Stand (Runde 11, privat + verschluesselt)
        if: steps.mode.outputs.mode == 'sec-pit' || steps.mode.outputs.mode == 'holdout-sec'
        env:
          ST_WINDOW: ${{ steps.mode.outputs.mode == 'holdout-sec' && 'HOLDOUT' || 'DEV' }}
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_REGION: ${{ secrets.VU_HISTORY_S3_REGION }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
          NODE_OPTIONS: --max-old-space-size=14000
        run: node scripts/supertrader/validation/sec-pit.mjs --out "$RUNNER_TEMP/val"
      - name: Universumspruefung Nicht-Aktien (Runde 10, verschluesselt)
        if: steps.mode.outputs.mode == 'universe-audit'
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_REGION: ${{ secrets.VU_HISTORY_S3_REGION }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
        run: node scripts/supertrader/validation/universe-audit.mjs --out "$RUNNER_TEMP/val"
      - name: Minervini-Quellen lesen (Runde 10, verschluesselt)
        if: steps.mode.outputs.mode == 'sources-minervini' || steps.mode.outputs.mode == 'sources-r12'
        run: node scripts/supertrader/validation/fetch-sources.mjs --out "$RUNNER_TEMP/val" --list scripts/supertrader/validation/${{ steps.mode.outputs.mode == 'sources-r12' && 'sources-r12-traderfox.json' || 'sources-r10-minervini.json' }} --name ${{ steps.mode.outputs.mode == 'sources-r12' && 'sources-r12-traderfox' || 'sources-r10-minervini' }}
      - name: Originalquellen lesen (verschluesselt)
        if: steps.mode.outputs.mode == 'sources'
        run: |
          node scripts/supertrader/validation/fetch-sources.mjs --out "$RUNNER_TEMP/val" --crawl
          node scripts/supertrader/validation/fetch-sources.mjs --out "$RUNNER_TEMP/val" --list scripts/supertrader/validation/sources-r8b.json --name sources-r8b
      - name: Verschluesseltes Ergebnis ablegen
        if: always()
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -e
          ls "$RUNNER_TEMP/val"/*.sealed.json >/dev/null 2>&1 || { echo "kein Ergebnis"; exit 0; }
          for f in "$RUNNER_TEMP/val"/*.sealed.json; do grep -q '"schema":"supertrader-sealed-1.0.0"' "$f" || { echo "nicht verschluesselt - Abbruch"; exit 1; }; done
          mkdir -p "$RUNNER_TEMP/res" && cd "$RUNNER_TEMP/res"
          git init -q && git remote add origin "https://x-access-token:${TOKEN}@github.com/${REPO}.git"
          git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch -q --depth 1 origin claude/supertrader-validation-results; then git checkout -q -b r FETCH_HEAD; else git checkout -q --orphan r; fi
          stamp=$(date -u +%Y%m%dT%H%M%SZ)
          for f in "$RUNNER_TEMP/val"/*.sealed.json; do cp "$f" "${stamp}-$(basename "$f")"; done
          git add -A && git commit -q -m "Validierung ${MODE} ${stamp} (verschluesselt, run ${GITHUB_RUN_ID})"
          git push -q origin r:claude/supertrader-validation-results
          echo "abgelegt: ${stamp}"
