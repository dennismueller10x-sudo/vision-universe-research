name: Brand Media · Higgsfield

on:
  workflow_dispatch:
    inputs:
      action:
        description: Discover, estimate, generate, one manually approved Wan I2V production, exactly three manually approved Wan T2V shots, or read-only status/download.
        type: choice
        required: true
        options: [discover, estimate, generate, produce, produce-three, status]
      model_id:
        description: Exact model ID from brand-media/higgsfield/registry.json
        type: string
        required: true
      operation:
        description: Workflow operation
        type: choice
        required: true
        options: [text_to_video, image_to_video, reference_to_video]
      prompt:
        description: Prompt text
        type: string
        required: true
      duration:
        description: Duration in seconds
        type: number
        required: true
      resolution:
        description: Resolution tier; leave blank only where the registry marks it unspecified
        type: string
        required: false
      native_audio:
        description: Enable native audio generation (sound off for mute output)
        type: boolean
        required: true
        default: true
      aspect_ratio:
        description: Aspect ratio
        type: string
        required: true
        default: '16:9'
      reference_path:
        description: Explicit repository path to a reference image (no implicit reuse)
        type: string
        required: false
      asset_id:
        description: Reference asset ID for metadata
        type: string
        required: false
      budget_usd:
        description: Numeric estimate budget for estimate/generate only; unused for produce
        type: string
        required: false
      paid_approval:
        description: Explicit approval phrase for the selected paid action; produce-three requires APPROVE-WAN-3.0-THREE-TEXT-TO-VIDEO-SHOTS.
        type: string
        required: false
      approved_estimate_usd:
        description: Exact USD estimate reviewed in the prior estimate run; generation blocks if it changed
        type: string
        required: false
      request_id:
        description: Existing Wan request ID for read-only status check and download; does not generate
        type: string
        required: false
      shot1_prompt:
        description: Separate prompt for the first Wan T2V shot (produce-three only)
        type: string
        required: false
      shot2_prompt:
        description: Separate prompt for the second Wan T2V shot (produce-three only)
        type: string
        required: false
      shot3_prompt:
        description: Separate prompt for the third Wan T2V shot (produce-three only)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: higgsfield-paid-generation
  cancel-in-progress: false

jobs:
  trusted-input-check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted main branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Show documentation-derived model registry
        if: inputs.action == 'discover'
        run: python -m json.tool brand-media/higgsfield/registry.json
      - name: Prepare request; produce-three submits exactly three sequential manually approved Wan T2V jobs
        if: inputs.action == 'estimate' || inputs.action == 'generate' || inputs.action == 'produce' || inputs.action == 'produce-three' || inputs.action == 'status'
        env:
          HIGGSFIELD_API_KEY: ${{ secrets.HIGGSFIELD_API_KEY }}
          INPUT_ACTION: ${{ inputs.action }}
          INPUT_MODEL_ID: ${{ inputs.model_id }}
          INPUT_OPERATION: ${{ inputs.operation }}
          INPUT_PROMPT: ${{ inputs.prompt }}
          INPUT_DURATION: ${{ inputs.duration }}
          INPUT_RESOLUTION: ${{ inputs.resolution }}
          INPUT_ASPECT_RATIO: ${{ inputs.aspect_ratio }}
          INPUT_NATIVE_AUDIO: ${{ inputs.native_audio }}
          INPUT_REFERENCE_PATH: ${{ inputs.reference_path }}
          INPUT_ASSET_ID: ${{ inputs.asset_id }}
          INPUT_BUDGET_USD: ${{ inputs.budget_usd }}
          INPUT_APPROVAL: ${{ inputs.paid_approval }}
          INPUT_APPROVED_ESTIMATE_USD: ${{ inputs.approved_estimate_usd }}
          INPUT_REQUEST_ID: ${{ inputs.request_id }}
          INPUT_SHOT1_PROMPT: ${{ inputs.shot1_prompt }}
          INPUT_SHOT2_PROMPT: ${{ inputs.shot2_prompt }}
          INPUT_SHOT3_PROMPT: ${{ inputs.shot3_prompt }}
        run: |
          args=(--action "$INPUT_ACTION" --model "$INPUT_MODEL_ID" --operation "$INPUT_OPERATION" \
            --prompt "$INPUT_PROMPT" --duration "$INPUT_DURATION" --resolution "$INPUT_RESOLUTION" \
            --aspect-ratio "$INPUT_ASPECT_RATIO" --native-audio "$INPUT_NATIVE_AUDIO" --reference "$INPUT_REFERENCE_PATH" \
            --asset-id "$INPUT_ASSET_ID")
          if [ -n "$INPUT_BUDGET_USD" ]; then
            args+=(--budget-usd "$INPUT_BUDGET_USD")
          fi
          if [ "$INPUT_ACTION" = generate ] || [ "$INPUT_ACTION" = produce ] || [ "$INPUT_ACTION" = produce-three ]; then
            args+=(--approval "$INPUT_APPROVAL")
          fi
          if [ "$INPUT_ACTION" = generate ]; then
            args+=(--approved-estimate-usd "$INPUT_APPROVED_ESTIMATE_USD")
          fi
          if [ "$INPUT_ACTION" = status ]; then
            args+=(--request-id "$INPUT_REQUEST_ID")
          fi
          if [ "$INPUT_ACTION" = produce-three ]; then
            args+=(--shot1-prompt "$INPUT_SHOT1_PROMPT" --shot2-prompt "$INPUT_SHOT2_PROMPT" --shot3-prompt "$INPUT_SHOT3_PROMPT")
          fi
          python brand-media/higgsfield/higgsfield.py "${args[@]}"

      - name: Verify 1080x1920 output and create compressed preview
        if: inputs.action == 'produce' || inputs.action == 'produce-three' || inputs.action == 'status'
        env:
          INPUT_ACTION: ${{ inputs.action }}
        shell: bash
        run: |
          shopt -s nullglob
          videos=(brand-media/output/higgsfield/*.mp4)
          if [ "${#videos[@]}" -ne 1 ]; then
            if [ "$INPUT_ACTION" = produce-three ]; then
              if [ "${#videos[@]}" -eq 0 ]; then
                echo "No shot completed during this run; the manifest records submitted jobs for later read-only retrieval."
                exit 0
              fi
              for video in "${videos[@]}"; do
                dimensions=$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 "$video")
                echo "Video dimensions: $dimensions"
                if [ "$dimensions" != "1080x1920" ]; then
                  echo "Provider output was not 1080x1920; original retained without transcoding." >&2
                  exit 1
                fi
                preview="${video%.mp4}-preview.mp4"
                ffmpeg -nostdin -y -i "$video" -vf scale=540:960 -c:v libx264 -preset veryfast -crf 28 -c:a aac -b:a 96k -movflags +faststart "$preview"
              done
              exit 0
            fi
            if [ "$INPUT_ACTION" = status ] && [ "${#videos[@]}" -eq 0 ]; then
              echo "Existing Wan job is not complete yet; no generation was submitted by this status action."
              exit 0
            fi
            echo "Expected exactly one original video; found ${#videos[@]}" >&2
            exit 1
          fi
          dimensions=$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 "${videos[0]}")
          echo "Video dimensions: $dimensions"
          if [ "$dimensions" != "1080x1920" ]; then
            echo "Provider output was not 1080x1920; original retained without transcoding." >&2
            exit 1
          fi
          preview="${videos[0]%.mp4}-preview.mp4"
          ffmpeg -nostdin -y -i "${videos[0]}" -vf scale=540:960 -c:v libx264 -preset veryfast -crf 28 -c:a aac -b:a 96k -movflags +faststart "$preview"

      - name: Upload HyperFrames-ready output
        if: always() && (inputs.action == 'generate' || inputs.action == 'produce' || inputs.action == 'produce-three' || inputs.action == 'status')
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: higgsfield-video-${{ github.run_id }}
          path: brand-media/output/higgsfield/
          if-no-files-found: warn
          retention-days: 14
