name: Konten (Buendel account)

# Takt vom Cloudflare-Wecker (core/registry/schedule.json, timer waker): Marke im Lauftitel, Eingang zeitplan.
run-name: ${{ inputs.zeitplan && format('{0} · Takt {1}', github.workflow, inputs.zeitplan) || '' }}

# Konten und Abos: Produktion, Sicherung, Ueberwachung. Freigabepflichtige Teile behalten ihre Umgebung
# (environment) und damit die Owner-Freigabe; siehe docs/accounts/FREIGABEN.md.
# Teile (Schritte unveraendert; Job-Bedingungen der Quelle bleiben und werden mit der Auswahl verknuepft):
#   sicherung                    vormals account-backup.yml
#   kuendigungen                 vormals account-cancellations.yml
#   db-freigabe                  vormals account-db-approved.yml
#   ueberwachung                 vormals account-monitor.yml
#   auth                         vormals account-production-auth.yml
#   pruefen                      vormals account-production-checks.yml
#   ausrollen                    vormals account-production-deploy.yml
#   stripe                       vormals account-production-stripe.yml
# Der Job `auswahl` bildet die Ausloeser der Quellen nach (Dispatch `teil`, Zeitplan am Cron, Push nach
# Zweig/Pfad, workflow_run nach Name/Typ/Zweig, repository_dispatch nach Typ). Generiert, siehe A-Doc.

on:
  workflow_dispatch:
    inputs:
      teil:
        description: 'Welcher Teil'
        type: choice
        required: false
        options:
          - sicherung
          - kuendigungen
          - db-freigabe
          - ueberwachung
          - auth
          - pruefen
          - ausrollen
          - stripe
      zeitplan:
        description: 'sicherung/ueberwachung/pruefen: Vom Cloudflare-Wecker gesetzt (Cron des Termins, core/registry/schedule.json); manuell leer lassen'
        type: 'string'
        default: ''
      action:
        description: 'kuendigungen: Aktion'
        type: choice
        options: [list, check, deliver, retry, drop, execute, assign, no-contract]
        default: list
      id: {description: 'kuendigungen: Vorgangs-ID (execute, assign, no-contract, drop; retry: leer = alle)', required: false}
      user: {description: 'kuendigungen: Konto-ID (nur assign)', required: false}
      note: {description: 'kuendigungen: Begruendung (nur drop, ohne personenbezogene Daten)', required: false}
      bestaetigung: {description: 'db-freigabe: Zur Bestaetigung genau DESTRUKTIV eintippen', type: string, required: false}
      dry_run: {description: 'auth: Probelauf (nichts aendern)', type: boolean, default: true}
      stripe_key: {description: 'ausrollen: Stripe-Schluessel aus account-production in den Worker schreiben', type: boolean, default: true}
      stripe_dry_run: {description: 'stripe: Probelauf (nichts anlegen)', type: boolean, default: true}

permissions:
  contents: read

jobs:
  auswahl:
    name: Auswahl des Teils
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sicherung: ${{ steps.wahl.outputs.sicherung }}
      kuendigungen: ${{ steps.wahl.outputs.kuendigungen }}
      db_freigabe: ${{ steps.wahl.outputs.db_freigabe }}
      ueberwachung: ${{ steps.wahl.outputs.ueberwachung }}
      auth: ${{ steps.wahl.outputs.auth }}
      pruefen: ${{ steps.wahl.outputs.pruefen }}
      ausrollen: ${{ steps.wahl.outputs.ausrollen }}
      stripe: ${{ steps.wahl.outputs.stripe }}
    steps:
      - name: Teil waehlen
        id: wahl
        env:
          # Eingaben und Ereignisdaten nur ueber env: (ADR-005)
          EVENT: ${{ inputs.zeitplan && 'schedule' || github.event_name }}
          ACTION: ${{ github.event.action }}
          REF: ${{ github.ref }}
          TEIL: ${{ inputs.teil }}
          SCHEDULE: ${{ github.event.schedule || inputs.zeitplan }}
          WR_NAME: ${{ github.event.workflow_run.name }}
          WR_BRANCH: ${{ github.event.workflow_run.head_branch }}
          COMMITS: ${{ toJSON(github.event.commits) }}
          INPUTS: ${{ toJSON(inputs) }}
        run: |
          python3 - <<'PY'
          import fnmatch, json, os, re
          SPEC = json.loads(r"""{"ausrollen": {"crons": [], "dispatch": true, "required": []}, "auth": {"crons": [], "dispatch": true, "required": []}, "db-freigabe": {"crons": [], "dispatch": true, "required": ["bestaetigung"]}, "kuendigungen": {"crons": [], "dispatch": true, "required": []}, "pruefen": {"crons": [], "dispatch": true, "required": []}, "sicherung": {"crons": [], "dispatch": true, "required": []}, "stripe": {"crons": [], "dispatch": true, "required": []}, "ueberwachung": {"crons": [], "dispatch": true, "required": []}}""")
          ev, ref = os.environ.get("EVENT", ""), os.environ.get("REF", "")
          def glob_re(p):
              # GitHub-Filtermuster: ** beliebig, * ohne '/', ? ein Zeichen, [..] Klasse; Praefix '!' = Ausschluss
              out, i = "", 0
              while i < len(p):
                  c = p[i]
                  if p.startswith("**/", i): out += "(?:.*/)?"; i += 3; continue
                  if p.startswith("**", i): out += ".*"; i += 2; continue
                  if c == "*": out += "[^/]*"
                  elif c == "?": out += "[^/]"
                  elif c == "[":
                      j = p.index("]", i); out += p[i:j + 1]; i = j + 1; continue
                  else: out += re.escape(c)
                  i += 1
              return re.compile("^" + out + "$")
          def match_list(pats, value):
              ok = False
              for p in pats:
                  neg = p.startswith("!")
                  if glob_re(p[1:] if neg else p).match(value): ok = not neg
              return ok
          def files():
              try: commits = json.loads(os.environ.get("COMMITS") or "[]") or []
              except Exception: commits = []
              fs = set()
              for c in commits:
                  for k in ("added", "modified", "removed"): fs.update(c.get(k) or [])
              return fs, len(commits)
          def push_ok(r):
              if ref.startswith("refs/heads/"):
                  name = ref[11:]
                  if "branches" in r and not match_list(r["branches"], name): return False
                  if "branches-ignore" in r and match_list(r["branches-ignore"], name): return False
                  if ("tags" in r) and "branches" not in r and "branches-ignore" not in r: return False
              elif ref.startswith("refs/tags/"):
                  name = ref[10:]
                  if "tags" in r and not match_list(r["tags"], name): return False
                  if "tags-ignore" in r and match_list(r["tags-ignore"], name): return False
                  if ("branches" in r or "branches-ignore" in r) and "tags" not in r and "tags-ignore" not in r: return False
              else: return False
              if "paths" in r or "paths-ignore" in r:
                  fs, n = files()
                  if not fs:
                      # Ereignis ohne Dateiliste (z. B. neuer Zweig): GitHub wertet Pfade dann gegen den Standardzweig aus; hier konservativ: ausloesen
                      return n == 0
                  if "paths" in r and not any(match_list(r["paths"], f) for f in fs): return False
                  if "paths-ignore" in r and all(match_list(r["paths-ignore"], f) for f in fs): return False
              return True
          out = {}
          for teil, r in SPEC.items():
              v = False
              if ev == "workflow_dispatch":
                  v = bool(r.get("dispatch")) and os.environ.get("TEIL") == teil
                  if v:
                      # Pflichteingaben der Quelle gelten nur fuer ihren Teil (im Buendel optional)
                      vals = json.loads(os.environ.get("INPUTS") or "{}") or {}
                      fehlt = [n for n in (r.get("required") or []) if str(vals.get(n) if vals.get(n) is not None else "").strip() == ""]
                      if fehlt: raise SystemExit("Pflichteingabe fehlt fuer Teil " + teil + ": " + ", ".join(fehlt))
              elif ev == "schedule": v = os.environ.get("SCHEDULE") in (r.get("crons") or [])
              elif ev == "push": v = "push" in r and push_ok(r["push"])
              elif ev == "workflow_run" and "workflow_run" in r:
                  w = r["workflow_run"]; b = os.environ.get("WR_BRANCH", "")
                  v = os.environ.get("WR_NAME") in w["workflows"] and os.environ.get("ACTION") in w["types"]
                  if v and w.get("branches") is not None: v = match_list(w["branches"], b)
                  if v and w.get("branches-ignore") is not None: v = not match_list(w["branches-ignore"], b)
              elif ev == "repository_dispatch" and "repository_dispatch" in r:
                  t = r["repository_dispatch"]; v = t is None or os.environ.get("ACTION") in t
              out[teil.replace("-", "_")] = "true" if v else "false"
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              for k, v in out.items(): fh.write(k + "=" + v + "\n"); print(k + "=" + v)
          PY

  # --- sicherung: vormals account-backup.yml, Job umgebung
  sicherung-umgebung:
    needs: [auswahl]
    if: >-
      needs.auswahl.outputs.sicherung == 'true' && (github.ref_name == 'main')
    permissions: {contents: read, actions: read}
    concurrency:
      group: account-backup-${{ github.ref_name }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.pruefen.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Umgebung account-auto vorhanden und nur fuer main?
        id: pruefen
        env: {GH_TOKEN: '${{ github.token }}', REPO: '${{ github.repository }}'}
        run: node scripts/account/check-auto-env.mjs

  # --- sicherung: vormals account-backup.yml, Job backup
  sicherung-backup:
    needs: [auswahl, sicherung-umgebung]
    if: >-
      needs.auswahl.outputs.sicherung == 'true' && (needs.sicherung-umgebung.outputs.ready == 'true')
    permissions: {contents: read, actions: read}
    concurrency:
      group: account-backup-${{ github.ref_name }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: account-auto
    steps:
      - name: Sichern und verschluesseln
        env:
          DB_URL: ${{ secrets.VU_ACCOUNT_SUPABASE_DB_URL }}
          RECIPIENT: ${{ vars.VU_ACCOUNT_BACKUP_AGE_RECIPIENT }}
        run: |
          set -euo pipefail
          [[ "$RECIPIENT" =~ ^age1[0-9a-z]{58}$ ]] || { echo "::error::VU_ACCOUNT_BACKUP_AGE_RECIPIENT fehlt (age1…) - keine Sicherung ohne Verschluesselung"; exit 1; }
          [[ "$DB_URL" == postgresql://*qiytbnpoqvldsatpfkeh* ]] || { echo "::error::VU_ACCOUNT_SUPABASE_DB_URL (account-auto) fehlt oder gehoert nicht zum Produktionsprojekt"; exit 1; }
          sudo apt-get install -y -qq age > /dev/null
          umask 077
          out="$RUNNER_TEMP/backup"; mkdir -p "$out"
          stamp=$(date -u +%Y%m%dT%H%MZ)
          docker run --rm -e DB_URL postgres:17 sh -c 'pg_dump --format=custom --no-owner --no-privileges \
              --schema=public --schema=billing --schema=auth --schema=supabase_migrations "$DB_URL"' \
            | age -r "$RECIPIENT" -o "$out/vu-accounts-$stamp.dump.age"
          size=$(stat -c %s "$out/vu-accounts-$stamp.dump.age")
          [ "$size" -gt 1000 ] || { echo "::error::Sicherung verdaechtig klein ($size Bytes)"; exit 1; }
          head -c 21 "$out/vu-accounts-$stamp.dump.age" | grep -q 'age-encryption.org' || { echo "::error::Datei ist nicht age-verschluesselt"; exit 1; }
          echo "Sicherung verschluesselt: $size Bytes"
          echo "FILE=$out/vu-accounts-$stamp.dump.age" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: vu-accounts-backup
          path: ${{ env.FILE }}
          retention-days: 30
          if-no-files-found: error

  # --- kuendigungen: vormals account-cancellations.yml
  kuendigungen:
    needs: [auswahl]
    if: >-
      needs.auswahl.outputs.kuendigungen == 'true'
    permissions: {contents: read, actions: read}
    concurrency:
      group: account-cancellations-${{ github.ref_name }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: account-dev
    steps:
      - name: Owner-Freigabe dieses Laufs pruefen (fail closed)
        env: {GH_TOKEN: '${{ github.token }}', RUN_ID: '${{ github.run_id }}', REPO: '${{ github.repository }}', APPROVER: dennismueller10x-sudo, ENV_NAME: account-dev}
        run: |
          set -euo pipefail
          json=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/approvals")
          ok=$(jq --arg u "$APPROVER" --arg e "$ENV_NAME" '[.[] | select(.state=="approved" and .user.login==$u and any(.environments[]; .name==$e))] | length' <<<"$json")
          [ "$ok" -ge 1 ] || { echo "::error::Keine Freigabe durch $APPROVER fuer $ENV_NAME"; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ausfuehren
        env:
          ACTION: ${{ inputs.action }}
          CANCELLATION_ID: ${{ inputs.id }}
          USER_ID: ${{ inputs.user }}
          NOTE: ${{ inputs.note }}
          OPERATOR: ${{ github.actor }}
          SUPABASE_URL: ${{ vars.VU_ACCOUNT_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VU_ACCOUNT_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.VU_ACCOUNT_SUPABASE_SECRET_KEY }}
          VU_ACCOUNT_API_ORIGIN: ${{ vars.VU_ACCOUNT_API_ORIGIN }}
          STRIPE_SECRET_KEY: ${{ secrets.VU_ACCOUNT_STRIPE_SECRET_KEY }}
          BREVO_API_KEY: ${{ secrets.VU_ACCOUNT_BREVO_API_KEY }}
          VU_MAIL_SENDER: ${{ vars.VU_ACCOUNT_MAIL_SENDER }}
          VU_CANCELLATION_AUTO_PROCESS: 'false'
        run: |
          set -euo pipefail
          uuid='^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
          case "$STRIPE_SECRET_KEY" in sk_live_*|rk_live_*) echo "::error::Stripe-LIVE-Schluessel abgelehnt."; exit 1;; esac
          args=("$ACTION" --redact)
          case "$ACTION" in
            execute|no-contract|assign|drop)
              [[ "$CANCELLATION_ID" =~ $uuid ]] || { echo "::error::Vorgangs-ID fehlt oder ist keine UUID"; exit 1; }
              args=("$ACTION" "$CANCELLATION_ID" "--operator=github:$OPERATOR" --redact);;
            retry)
              args=(retry "--operator=github:$OPERATOR" --redact)
              if [ -n "$CANCELLATION_ID" ]; then
                [[ "$CANCELLATION_ID" =~ $uuid ]] || { echo "::error::Vorgangs-ID ist keine UUID"; exit 1; }
                args=(retry "$CANCELLATION_ID" "--operator=github:$OPERATOR" --redact)
              fi;;
          esac
          if [ "$ACTION" = "drop" ]; then
            [[ "$NOTE" =~ ^[[:print:]]{3,200}$ && "$NOTE" != *@* ]] || { echo "::error::Begruendung fehlt (3-200 Zeichen, keine Adressen)"; exit 1; }
            args+=("--note=$NOTE")
          fi
          if [ "$ACTION" = "assign" ]; then
            [[ "$USER_ID" =~ $uuid ]] || { echo "::error::Konto-ID fehlt oder ist keine UUID"; exit 1; }
            args+=("--user=$USER_ID")
          fi
          node scripts/account/cancellations.mjs "${args[@]}"

  # --- db-freigabe: vormals account-db-approved.yml
  db-freigabe:
    needs: [auswahl]
    if: >-
      needs.auswahl.outputs.db_freigabe == 'true'
    permissions: {contents: read, actions: read}
    concurrency:
      group: account-db-approved-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      PROJECT_REF: qiytbnpoqvldsatpfkeh
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: account-dev
    steps:
      - name: Eingabe pruefen
        env:
          CONFIRM: ${{ inputs.bestaetigung }}
        run: '[ "$CONFIRM" = DESTRUKTIV ] || { echo "::error::Bestaetigung fehlt"; exit 1; }'
      - name: Owner-Freigabe dieses Laufs pruefen (fail closed)
        env: {GH_TOKEN: '${{ github.token }}', RUN_ID: '${{ github.run_id }}', REPO: '${{ github.repository }}', REF: '${{ github.ref }}', APPROVER: dennismueller10x-sudo, ENV_NAME: account-dev}
        run: |
          set -euo pipefail
          [ "$REF" = refs/heads/main ] || { echo "::error::Nur von main"; exit 1; }
          json=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/approvals")
          ok=$(jq --arg u "$APPROVER" --arg e "$ENV_NAME" '[.[] | select(.state=="approved" and .user.login==$u and any(.environments[]; .name==$e))] | length' <<<"$json")
          [ "$ok" -ge 1 ] || { echo "::error::Keine Freigabe durch $APPROVER fuer $ENV_NAME"; exit 1; }
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Plan und Einspielen (eine Transaktion; Aenderungen an Kundendaten nur mit dieser Freigabe)
        env:
          DB_URL: ${{ secrets.VU_ACCOUNT_SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          [[ "$DB_URL" == postgresql://* && "$DB_URL" == *"$PROJECT_REF"* ]] || { echo "::error::DB-URL gehoert nicht zu $PROJECT_REF"; exit 1; }
          node scripts/account/migrate-production.mjs --plan --allow-destructive
          node scripts/account/migrate-production.mjs --allow-destructive

  # --- ueberwachung: vormals account-monitor.yml
  ueberwachung:
    needs: [auswahl]
    if: >-
      needs.auswahl.outputs.ueberwachung == 'true'
    permissions: {contents: read}
    concurrency:
      group: account-monitor-${{ github.ref_name }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Kuendigungen und Bestaetigungen
        env:
          API_ORIGIN: ${{ vars.VU_ACCOUNT_API_ORIGIN }}
        run: |
          set -euo pipefail
          if [ -z "$API_ORIGIN" ]; then echo "VU_ACCOUNT_API_ORIGIN nicht gesetzt - Worker noch nicht ausgerollt."; exit 0; fi
          [[ "$API_ORIGIN" =~ ^https://[a-z0-9.-]+$ ]] || { echo "::error::VU_ACCOUNT_API_ORIGIN muss https://<host> sein"; exit 1; }
          body=$(curl --fail --silent --show-error --max-time 20 --retry 2 "$API_ORIGIN/v1/health")
          state=$(printf '%s' "$body" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const h=JSON.parse(s);console.log([h.cancellations,h.mail,h.autoProcess].join(" "))})')
          read -r cancellations mail auto <<< "$state"
          echo "Kuendigungen: $cancellations · E-Mail konfiguriert: $mail · Automatik: $auto"
          [ "$auto" = "false" ] || { echo "::error::VU_CANCELLATION_AUTO_PROCESS ist nicht false"; exit 1; }
          case "$cancellations" in
            ok) ;;
            attention) echo "::error::Kuendigungen brauchen Bearbeitung - Workflow 'Konten — Kuendigungen bearbeiten' (list/deliver)."; exit 1;;
            *) echo "::error::Zustand der Kuendigungen unbekannt (Supabase erreichbar?)"; exit 1;;
          esac

  # --- auth: vormals account-production-auth.yml
  auth:
    needs: [auswahl]
    if: >-
      needs.auswahl.outputs.auth == 'true'
    permissions: {contents: read, actions: read}
    concurrency:
      group: account-production-auth-${{ github.ref_name }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: account-dev
    steps:
      - name: Freigabe pruefen (fail closed)
        env: {GH_TOKEN: '${{ github.token }}', RUN_ID: '${{ github.run_id }}', REPO: '${{ github.repository }}', APPROVER: dennismueller10x-sudo, ENV_NAME: account-dev}
        run: |
          set -euo pipefail
          json=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/approvals")
          ok=$(jq --arg u "$APPROVER" --arg e "$ENV_NAME" '[.[] | select(.state=="approved" and .user.login==$u and any(.environments[]; .name==$e))] | length' <<<"$json")
          [ "$ok" -ge 1 ] || { echo "::error::Keine Freigabe durch $APPROVER fuer $ENV_NAME"; exit 1; }
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Auth einstellen
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.VU_ACCOUNT_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: qiytbnpoqvldsatpfkeh
          VU_ACCOUNT_API_ORIGIN: https://konto.visionuniverse.de
          BREVO_SMTP_LOGIN: ${{ secrets.VU_ACCOUNT_BREVO_SMTP_LOGIN }}
          BREVO_SMTP_KEY: ${{ secrets.VU_ACCOUNT_BREVO_SMTP_KEY }}
          VU_MAIL_SENDER: konto@visionuniverse.de
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then node scripts/account/supabase-auth-config.mjs --production --dry-run
          else node scripts/account/supabase-auth-config.mjs --production; fi

  # --- pruefen: vormals account-production-checks.yml, Job umgebung
  pruefen-umgebung:
    needs: [auswahl]
    if: >-
      needs.auswahl.outputs.pruefen == 'true' && (github.ref_name == 'main')
    permissions: {contents: read, actions: read}
    concurrency:
      group: account-production-checks-${{ github.ref_name }}
      cancel-in-progress: true
    env:
      API_ORIGIN: https://konto.visionuniverse.de
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.pruefen.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Umgebung account-auto vorhanden und nur fuer main?
        id: pruefen
        env: {GH_TOKEN: '${{ github.token }}', REPO: '${{ github.repository }}'}
        run: node scripts/account/check-auto-env.mjs

  # --- pruefen: vormals account-production-checks.yml, Job lesen
  pruefen-lesen:
    needs: [auswahl, pruefen-umgebung]
    if: >-
      needs.auswahl.outputs.pruefen == 'true' && (needs.pruefen-umgebung.outputs.ready == 'true')
    permissions: {contents: read, actions: read}
    concurrency:
      group: account-production-checks-${{ github.ref_name }}
      cancel-in-progress: true
    env:
      API_ORIGIN: https://konto.visionuniverse.de
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: account-auto
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Worker (oeffentlich)
        run: |
          set -euo pipefail
          curl -fsS "$API_ORIGIN/v1/health" | jq -c .
          curl -fsS "$API_ORIGIN/v1/plans" | jq -c '{mode, checkout, newsletter, legal}'
          for p in rechtliches/ rechtliches/impressum rechtliches/agb rechtliches/widerrufsbelehrung rechtliches/widerrufsformular \
                   rechtliches/datenschutz rechtliches/newsletter kuendigen widerrufen; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$API_ORIGIN/$p"); echo "$p $code"
            [ "$code" = 200 ] || { echo "::error::$API_ORIGIN/$p antwortet $code"; exit 1; }
          done
          node scripts/account/release-guard.mjs --toml=workers/vu-account/wrangler.toml --api="$API_ORIGIN"
      - name: Stripe (nur lesen)
        env:
          STRIPE_LIVE_KEY: ${{ secrets.VU_ACCOUNT_STRIPE_READ_KEY }}
          STRIPE_LIVE_SETUP_APPROVED: 'true'
          VU_ACCOUNT_API_ORIGIN: https://konto.visionuniverse.de
        run: |
          set -euo pipefail
          if [ -z "$STRIPE_LIVE_KEY" ]; then echo "::warning::VU_ACCOUNT_STRIPE_READ_KEY fehlt in account-auto - Stripe uebersprungen"; exit 0; fi
          [[ "$STRIPE_LIVE_KEY" == rk_live_* ]] || { echo "::error::VU_ACCOUNT_STRIPE_READ_KEY muss ein Restricted Key (rk_live_) sein"; exit 1; }
          node scripts/account/stripe-live-check.mjs
      - name: Brevo (nur lesen)
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$BREVO_API_KEY" ]; then echo "::warning::BREVO_API_KEY fehlt - Brevo uebersprungen"; exit 0; fi
          node scripts/account/brevo-setup.mjs

  # --- ausrollen: vormals account-production-deploy.yml, Job pruefen
  ausrollen-pruefen:
    needs: [auswahl]
    if: >-
      needs.auswahl.outputs.ausrollen == 'true'
    permissions: {contents: read, actions: read}
    concurrency:
      group: account-production-deploy-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      WRANGLER: wrangler@4.147.0
      PROJECT_REF: qiytbnpoqvldsatpfkeh
      API_ORIGIN: https://konto.visionuniverse.de
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tests ohne Datenbank
        run: node --test workers/vu-account/tests/unit.test.mjs workers/vu-account/tests/flows.test.mjs
      - name: Produktionskonfiguration pruefen
        working-directory: workers/vu-account
        run: |
          set -euo pipefail
          prod=$(awk '/^\[env\.production\.vars\]/{p=1;next} /^\[/{p=0} p' wrangler.toml)
          grep -qE '^VU_CANCELLATION_AUTO_PROCESS = "false"$' <<<"$prod" || { echo "::error::Produktion: VU_CANCELLATION_AUTO_PROCESS muss \"false\" sein"; exit 1; }
          grep -qE "^SUPABASE_URL = \"https://$PROJECT_REF\.supabase\.co\"$" <<<"$prod" || { echo "::error::Produktion: SUPABASE_URL zeigt nicht auf $PROJECT_REF"; exit 1; }
          grep -qE "^VU_ACCOUNT_API_ORIGIN = \"$API_ORIGIN\"$" <<<"$prod" || { echo "::error::Produktion: VU_ACCOUNT_API_ORIGIN ist nicht $API_ORIGIN"; exit 1; }
          grep -qE '^VU_REGISTRATION_ALLOWLIST = ""$' <<<"$prod" || { echo "::error::Produktion: keine Registrierungs-Positivliste (oeffentliche Registrierung)"; exit 1; }
          grep -q 'account.visionuniverse.de' <<<"$(awk '/^\[env\.production\]/{p=1} p' wrangler.toml | grep -v '^#')" && { echo "::error::account.visionuniverse.de gehoert Shopify"; exit 1; } || true
          # Oeffentlicher Pro-Checkout nur mit freigegebenen Rechtstexten, bestaetigter Fassung, Live-Freigabe und USt-Ausweis.
          node ../../scripts/account/check-public-checkout.mjs --toml=wrangler.toml
          grep -qE '^STRIPE_TAX_MODE = "(none|automatic)"$' <<<"$prod" || { echo "::error::Produktion: STRIPE_TAX_MODE muss none oder automatic sein"; exit 1; }
          for k in VU_BREVO_SYNC VU_NEWSLETTER; do grep -qE "^$k = \"(true|false)\"$" <<<"$prod" || { echo "::error::Produktion: $k muss \"true\" oder \"false\" sein"; exit 1; }; done
          for k in STRIPE_LIVE_MODE_APPROVED VU_CHECKOUT_ACCESS VU_REGISTRATION_ENABLED STRIPE_TAX_MODE VU_LEGAL_APPROVED VU_BREVO_SYNC VU_NEWSLETTER; do echo "$k = $(grep -E "^$k = " <<<"$prod" | cut -d'"' -f2)"; done
          npx --yes "$WRANGLER" deploy --dry-run --env production --outdir "$RUNNER_TEMP/bundle" > /dev/null

  # --- ausrollen: vormals account-production-deploy.yml, Job supabase
  ausrollen-supabase:
    needs: [auswahl, ausrollen-pruefen]
    if: >-
      needs.auswahl.outputs.ausrollen == 'true'
    permissions: {contents: read, actions: read}
    concurrency:
      group: account-production-deploy-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      WRANGLER: wrangler@4.147.0
      PROJECT_REF: qiytbnpoqvldsatpfkeh
      API_ORIGIN: https://konto.visionuniverse.de
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: account-dev
    steps:
      - name: Freigabe pruefen (fail closed)
        env: {GH_TOKEN: '${{ github.token }}', RUN_ID: '${{ github.run_id }}', REPO: '${{ github.repository }}', APPROVER: dennismueller10x-sudo, ENV_NAME: account-dev}
        run: |
          set -euo pipefail
          json=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/approvals")
          ok=$(jq --arg u "$APPROVER" --arg e "$ENV_NAME" '[.[] | select(.state=="approved" and .user.login==$u and any(.environments[]; .name==$e))] | length' <<<"$json")
          [ "$ok" -ge 1 ] || { echo "::error::Keine Freigabe durch $APPROVER fuer $ENV_NAME"; exit 1; }
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ausrollen (Code, oeffentliche Werte)
        working-directory: workers/vu-account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PUB: ${{ secrets.VU_ACCOUNT_SUPABASE_PUBLISHABLE_KEY }}
          SB_URL: ${{ vars.VU_ACCOUNT_SUPABASE_URL }}
          OPS_ALERT_EMAIL: ${{ vars.VU_ACCOUNT_OPS_ALERT_EMAIL }}
        run: |
          set -euo pipefail
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::CLOUDFLARE_API_TOKEN fehlt"; exit 1; }
          [[ "$PUB" == sb_publishable_* ]] || { echo "::error::VU_ACCOUNT_SUPABASE_PUBLISHABLE_KEY fehlt oder ist kein sb_publishable_"; exit 1; }
          [ -z "$SB_URL" ] || [ "$SB_URL" = "https://$PROJECT_REF.supabase.co" ] || { echo "::error::VU_ACCOUNT_SUPABASE_URL zeigt auf ein anderes Projekt"; exit 1; }
          extra=(--var "SUPABASE_PUBLISHABLE_KEY:$PUB" --var "VU_CANCELLATION_AUTO_PROCESS:false")
          if [ -n "$OPS_ALERT_EMAIL" ]; then
            [[ "$OPS_ALERT_EMAIL" =~ ^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[a-z]{2,}$ ]] || { echo "::error::VU_ACCOUNT_OPS_ALERT_EMAIL ist keine Adresse"; exit 1; }
            extra+=(--var "VU_OPS_ALERT_EMAIL:$OPS_ALERT_EMAIL")
          fi
          npx --yes "$WRANGLER" deploy --env production "${extra[@]}" 2>&1 | sed -E 's/[0-9a-f]{32}/<maskiert>/g; s/sb_publishable_[A-Za-z0-9_-]+/<oeffentlich>/g'
      - name: Secrets zu Cloudflare (Supabase, Brevo)
        working-directory: workers/vu-account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SEC: ${{ secrets.VU_ACCOUNT_SUPABASE_SECRET_KEY }}
          BREVO: ${{ secrets.BREVO_API_KEY }}
        run: |
          set -euo pipefail
          put() { printf '%s' "$2" | npx --yes "$WRANGLER" secret put "$1" --env production > /dev/null 2>&1 && echo "$1 hinterlegt" || { echo "::error::$1 nicht hinterlegt"; exit 1; }; }
          [[ "$SEC" == sb_secret_* ]] || { echo "::error::VU_ACCOUNT_SUPABASE_SECRET_KEY fehlt oder ist kein sb_secret_"; exit 1; }
          put SUPABASE_SECRET_KEY "$SEC"
          if [ -n "$BREVO" ]; then put BREVO_API_KEY "$BREVO"; else echo "::warning::BREVO_API_KEY fehlt - keine Kuendigungsbestaetigungen per E-Mail"; fi

  # --- ausrollen: vormals account-production-deploy.yml, Job stripe
  ausrollen-stripe:
    needs: [auswahl, ausrollen-supabase]
    if: >-
      needs.auswahl.outputs.ausrollen == 'true' && (inputs.stripe_key)
    permissions: {contents: read, actions: read}
    concurrency:
      group: account-production-deploy-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      WRANGLER: wrangler@4.147.0
      PROJECT_REF: qiytbnpoqvldsatpfkeh
      API_ORIGIN: https://konto.visionuniverse.de
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: account-production
    steps:
      - name: Freigabe pruefen (fail closed)
        env: {GH_TOKEN: '${{ github.token }}', RUN_ID: '${{ github.run_id }}', REPO: '${{ github.repository }}', APPROVER: dennismueller10x-sudo, ENV_NAME: account-production}
        run: |
          set -euo pipefail
          json=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/approvals")
          ok=$(jq --arg u "$APPROVER" --arg e "$ENV_NAME" '[.[] | select(.state=="approved" and .user.login==$u and any(.environments[]; .name==$e))] | length' <<<"$json")
          [ "$ok" -ge 1 ] || { echo "::error::Keine Freigabe durch $APPROVER fuer $ENV_NAME"; exit 1; }
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Stripe-Schluessel zu Cloudflare
        working-directory: workers/vu-account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          KEY: ${{ secrets.VU_ACCOUNT_STRIPE_SECRET_KEY }}
          WHSEC: ${{ secrets.VU_ACCOUNT_STRIPE_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          case "$KEY" in
            rk_live_*) echo "Stripe: Restricted Key, Live";;
            sk_live_*) echo "::error::Standard-Secret-Key (sk_live_) abgelehnt - bitte Restricted Key (rk_live_) verwenden"; exit 1;;
            *) echo "::error::VU_ACCOUNT_STRIPE_SECRET_KEY fehlt oder ist kein Live-Restricted-Key"; exit 1;;
          esac
          put() { printf '%s' "$2" | npx --yes "$WRANGLER" secret put "$1" --env production > /dev/null 2>&1 && echo "$1 hinterlegt" || { echo "::error::$1 nicht hinterlegt"; exit 1; }; }
          put STRIPE_SECRET_KEY "$KEY"
          if [ -n "$WHSEC" ]; then [[ "$WHSEC" == whsec_* ]] || { echo "::error::VU_ACCOUNT_STRIPE_WEBHOOK_SECRET muss whsec_ sein"; exit 1; }; put STRIPE_WEBHOOK_SECRET "$WHSEC"; fi
          echo "Checkout nur fuer Konten mit Rolle billing_tester (VU_CHECKOUT_ACCESS in wrangler.toml)."

  # --- ausrollen: vormals account-production-deploy.yml, Job gesundheit
  ausrollen-gesundheit:
    needs: [auswahl, ausrollen-supabase, ausrollen-stripe]
    if: >-
      needs.auswahl.outputs.ausrollen == 'true' && (always() && needs.ausrollen-supabase.result == 'success')
    permissions: {contents: read, actions: read}
    concurrency:
      group: account-production-deploy-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      WRANGLER: wrangler@4.147.0
      PROJECT_REF: qiytbnpoqvldsatpfkeh
      API_ORIGIN: https://konto.visionuniverse.de
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: /v1/health und /v1/plans
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do code=$(curl -s -o h.json -w '%{http_code}' "$API_ORIGIN/v1/health" || true); [ "$code" = 200 ] && break; sleep 10; done
          [ "$code" = 200 ] || { echo "::error::$API_ORIGIN/v1/health antwortet $code"; exit 1; }
          jq '{state, accounts, mail, autoProcess, billing: (.billing // null), cancellations}' h.json
          [ "$(jq -r .accounts h.json)" = true ] || { echo "::error::Supabase nicht angeschlossen"; exit 1; }
          [ "$(jq -r .autoProcess h.json)" = false ] || { echo "::error::autoProcess ist nicht false"; exit 1; }
          echo "/v1/plans: $(curl -s -o /dev/null -w '%{http_code}' "$API_ORIGIN/v1/plans")"

  # --- stripe: vormals account-production-stripe.yml, Job stripe
  stripe-stripe:
    needs: [auswahl]
    if: >-
      needs.auswahl.outputs.stripe == 'true'
    permissions: {contents: read, actions: read}
    concurrency:
      group: account-production-stripe-${{ github.ref_name }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: account-production
    outputs:
      has_prices: ${{ steps.setup.outputs.has_prices }}
    steps:
      - name: Freigabe pruefen (fail closed)
        env: {GH_TOKEN: '${{ github.token }}', RUN_ID: '${{ github.run_id }}', REPO: '${{ github.repository }}', APPROVER: dennismueller10x-sudo, ENV_NAME: account-production}
        run: |
          set -euo pipefail
          json=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/approvals")
          ok=$(jq --arg u "$APPROVER" --arg e "$ENV_NAME" '[.[] | select(.state=="approved" and .user.login==$u and any(.environments[]; .name==$e))] | length' <<<"$json")
          [ "$ok" -ge 1 ] || { echo "::error::Keine Freigabe durch $APPROVER fuer $ENV_NAME"; exit 1; }
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Einrichten
        id: setup
        env:
          STRIPE_LIVE_KEY: ${{ secrets.VU_ACCOUNT_STRIPE_SECRET_KEY }}
          STRIPE_LIVE_SETUP_APPROVED: 'true'
          VU_ACCOUNT_API_ORIGIN: https://konto.visionuniverse.de
          DRY_RUN: ${{ inputs.stripe_dry_run }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          umask 077
          out="$RUNNER_TEMP/stripe"; mkdir -p "$out"
          if [ "$DRY_RUN" = "true" ]; then node scripts/account/stripe-live-setup.mjs --dry-run; echo "has_prices=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          node scripts/account/stripe-live-setup.mjs --secret-out="$out/whsec" --sql-out="$RUNNER_TEMP/live-prices.sql" --portal-out="$out/portal"
          if [ -s "$out/whsec" ]; then
            ( cd workers/vu-account && npx --yes wrangler@4.147.0 secret put STRIPE_WEBHOOK_SECRET --env production < "$out/whsec" > /dev/null 2>&1 ) \
              && echo "STRIPE_WEBHOOK_SECRET im Worker hinterlegt" || { echo "::error::Webhook-Geheimnis nicht hinterlegt (Worker ausgerollt?) - in Stripe 'Roll secret' und erneut starten"; exit 1; }
          fi
          grep -qE '^bpc_[A-Za-z0-9]+$' "$out/portal" || { echo "::error::Keine Portal-Konfiguration erhalten"; exit 1; }
          ( cd workers/vu-account && npx --yes wrangler@4.147.0 secret put STRIPE_PORTAL_CONFIGURATION --env production < "$out/portal" > /dev/null 2>&1 ) \
            && echo "STRIPE_PORTAL_CONFIGURATION im Worker hinterlegt" || { echo "::error::Portal-Konfiguration nicht hinterlegt"; exit 1; }
          rm -rf "$out"
          if [ -s "$RUNNER_TEMP/live-prices.sql" ]; then echo "has_prices=true" >> "$GITHUB_OUTPUT"; else echo "has_prices=false" >> "$GITHUB_OUTPUT"; fi
      - name: Preis-IDs weitergeben (keine Geheimnisse)
        if: steps.setup.outputs.has_prices == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: live-prices-sql
          path: ${{ runner.temp }}/live-prices.sql
          retention-days: 1

  # --- stripe: vormals account-production-stripe.yml, Job preise-eintragen
  stripe-preise-eintragen:
    needs: [auswahl, stripe-stripe]
    if: >-
      needs.auswahl.outputs.stripe == 'true' && (needs.stripe-stripe.outputs.has_prices == 'true')
    permissions: {contents: read, actions: read}
    concurrency:
      group: account-production-stripe-${{ github.ref_name }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: account-dev
    steps:
      - name: Freigabe pruefen (fail closed)
        env: {GH_TOKEN: '${{ github.token }}', RUN_ID: '${{ github.run_id }}', REPO: '${{ github.repository }}', APPROVER: dennismueller10x-sudo, ENV_NAME: account-dev}
        run: |
          set -euo pipefail
          json=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/approvals")
          ok=$(jq --arg u "$APPROVER" --arg e "$ENV_NAME" '[.[] | select(.state=="approved" and .user.login==$u and any(.environments[]; .name==$e))] | length' <<<"$json")
          [ "$ok" -ge 1 ] || { echo "::error::Keine Freigabe durch $APPROVER fuer $ENV_NAME"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          name: live-prices-sql
          path: ${{ runner.temp }}/prices
      - name: plan_prices aktualisieren
        env:
          DB_URL: ${{ secrets.VU_ACCOUNT_SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          [[ "$DB_URL" == *qiytbnpoqvldsatpfkeh* ]] || { echo "::error::DB-URL gehoert nicht zum Produktionsprojekt"; exit 1; }
          f="$RUNNER_TEMP/prices/live-prices.sql"
          # Genau eine Zeile: Pro, monatlich, 1,00 EUR.
          [ "$(grep -c "^  (" "$f")" = 1 ] && grep -qE "^  \('pro_month_live', 'pro', 'stripe', 'price_[A-Za-z0-9]+', 'month', 'EUR', 100, true, true\)$" "$f" \
            || { echo "::error::Preis-SQL hat unerwartete Form"; exit 1; }
          psql -X -q -v ON_ERROR_STOP=1 -d "$DB_URL" -f "$f"
          psql -X -q -t -A -d "$DB_URL" -c "select id || ' ' || unit_amount || ' ' || billing_interval from public.plan_prices where livemode and active order by id"
