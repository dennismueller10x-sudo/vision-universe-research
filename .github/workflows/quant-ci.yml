name: Quant CI

# Prueft den Investment-Intelligence-Bereich: Engine-Logik, die kritischen
# Acceptance-Kriterien, die Gueltigkeit der praekomputierten Daten und die
# Uebereinstimmung zwischen Datenstand und Engine.

on:
  push:
    branches: [main]
    paths: ['api/history.js', 'api/status.js', 'server/r2_reader.py', 'scripts/vu2/**', 'worker/**', 'quant/**', 'elliott/**', 'providers/**', 'scripts/quant/**', 'scripts/market/**', 'scripts/technical/**', 'scripts/quality/**',
            'scripts/dashboard/price_semantics.py',
            'scripts/dashboard/migrate_adjustment_semantics.py',
            '.github/workflows/quant-ci.yml', '.github/workflows/market-data.yml']
  pull_request:
    # Full-universe refresh PRs change well over GitHub's 300-file path-filter
    # window. Keep this workflow file in those PRs so Quant CI cannot be
    # silently omitted while Discover CI still runs.
    paths: ['api/history.js', 'api/status.js', 'server/r2_reader.py', 'scripts/vu2/**', 'worker/**', 'quant/**', 'elliott/**', 'providers/**', 'scripts/quant/**', 'scripts/market/**', 'scripts/technical/**', 'scripts/quality/**',
            'scripts/dashboard/price_semantics.py',
            'scripts/dashboard/migrate_adjustment_semantics.py',
            '.github/workflows/quant-ci.yml', '.github/workflows/market-data.yml']
  workflow_dispatch:
    inputs:
      recover_v8_archives:
        description: 'Read-only V8 private archive assessment; zero provider requests'
        type: boolean
        default: false

# Nur lesen: reine Pruef-Workflows brauchen kein Schreibrecht (Audit 03.10.2026).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Engine- und Acceptance-Tests
        run: node --test "quant/tests/*.test.mjs"

      - name: Existing SEC exporter and internal PIT projection guards
        run: python3 -m unittest discover -s scripts/vu2 -p 'test*.py'

      - name: Shared relay and unchanged Discovery consumers
        run: node --test worker/tests/*.test.mjs discover/tests/live-stream.test.mjs discover/tests/live-hub.test.mjs

      - name: Methodik- und Datendateien sind gueltiges JSON
        run: |
          # Keep the exact find scope and JSON.parse validator, but avoid
          # starting tens of thousands of runtimes after universe expansion.
          set -o pipefail
          find quant/methodology quant/data quant/config -name '*.json' -print0 | node -e '
            const fs = require("node:fs");
            const files = fs.readFileSync(0, "utf8").split("\0").filter(Boolean);
            for (const file of files) {
              try { JSON.parse(fs.readFileSync(file, "utf8")); }
              catch { console.error("Invalid JSON: " + file); process.exit(1); }
            }
            console.log(files.length + " JSON-Dateien geprueft");
          '

      - name: HTML-Seiten binden die gemeinsame Shell und die Navigation ein
        # Weiterleitungen alter Adressen (quant/ui/legacy-redirect.js) sind
        # keine Seiten: sie laden bewusst keine Shell und keine Daten. Was sie
        # stattdessen tragen muessen, prueft quant/tests/no-mock-in-product.test.mjs.
        run: |
          for page in $(find quant -name 'index.html'); do
            if grep -q '/quant/ui/legacy-redirect.js' "$page"; then
              grep -q 'noindex' "$page" || { echo "$page: Weiterleitung ohne noindex"; exit 1; }
            else
              grep -q '/quant/ui/shell.js' "$page" || { echo "$page ohne quant/ui/shell.js"; exit 1; }
            fi
            grep -q 'vu-navigation' "$page" || { echo "$page ohne Vision-Universe-Navigation"; exit 1; }
            grep -q 'site-navigation.css' "$page" || { echo "$page ohne Navigations-Stylesheet"; exit 1; }
          done
          echo "$(find quant -name 'index.html' | wc -l) Seiten geprueft"

      - name: Praekomputierte Technical-Intelligence-Daten stimmen mit den Engines ueberein
        run: node scripts/technical/verify-technical-data.mjs

      - name: Chartbild-Daten (Technical Intelligence V2) stimmen mit den Engines ueberein
        run: node scripts/technical/verify-technical-intelligence.mjs

      - name: Kein Produkt rechnet selbst um (Currency Layer Regression Guard)
        # Ein zentraler Currency Layer haelt so lange, wie niemand daneben
        # eine eigene Zeile schreibt. Bricht bei FX-Arithmetik ausserhalb
        # von quant/engines/fx/ ab und haelt die Zahl der fest verdrahteten
        # Waehrungsstellen gegen ihre Grundlinie.
        run: node scripts/quality/assert-no-local-fx.mjs

      - name: Der Currency Layer rechnet an echten Titeln nach
        # Kursreihen und Fundamentals aus dem Repository, punktweise
        # nachgerechnet. Meldet ehrlich, ob mit qualifizierten FX-Kursen
        # oder mit der Testreihe gerechnet wurde (PASS vs PASS_RULES_ONLY).
        run: node scripts/quality/verify-currency-layer.mjs

      - name: Die FX-Faehigkeitssondierung laeuft ohne Zugang fehlerfrei durch
        # Dieselbe Regel wie beim Marktdatenabruf: ein fehlender Schluessel
        # ist eine Konfigurationsfrage, kein Baufehler. Ohne Secret muss
        # jede FX-Faehigkeit ungeprueft (null) bleiben.
        run: |
          node scripts/market/probe-tiingo-fx.mjs
          node -e '
            const r = require("./.market-cache/currency/tiingo-fx-probe.json");
            const werte = Object.values(r.capabilities);
            if (r.configured !== false || !werte.every((v) => v === null)) {
              throw new Error("Ohne Schluessel muss jede FX-Faehigkeit ungeprueft sein.");
            }
            console.log("FX-Faehigkeiten korrekt ungeprueft: " + werte.length + " Eintraege auf null");
          '

      - name: Keine Zugangsdaten in ausgelieferten Marktdaten
        run: node scripts/market/assert-no-secrets.mjs

      - name: Keine ungeklärten Provider-Rohdaten in oeffentlichen Pfaden
        run: node scripts/market/assert-public-data-hygiene.mjs

      - name: Der Marktdatenabruf laeuft ohne Zugang fehlerfrei durch
        # Die wichtigste Eigenschaft des Abrufs: ein fehlender Schluessel ist
        # eine Konfigurationsfrage, kein Baufehler. Ohne Secret muss das
        # Skript den Statusbericht schreiben und mit 0 enden.
        run: |
          node scripts/market/fetch-market-data.mjs
          node -e '
            const s = require("./.market-cache/twelve-data/status.json");
            if (s.configured !== false || s.dataMode !== "mock") {
              throw new Error("Ohne Schluessel muss der Status mock/unkonfiguriert sein.");
            }
            console.log("Statusbericht korrekt: dataMode=" + s.dataMode);
          '
          git diff --exit-code -- quant/data/market

      - name: Anbieterbewertung laeuft
        run: node scripts/market/evaluate-provider.mjs twelve-data > /dev/null

      - name: Anbieterqualifikation laeuft
        run: node scripts/market/qualify-providers.mjs > /dev/null

      - name: Bereinigungssemantik ist in beiden Stacks identisch
        # Die Gefahr bei einer gemeinsamen Definition ohne gemeinsame
        # Bibliothek: die JSON-Datei wird geaendert, ein Modul zieht nach,
        # das andere nicht - und der Fehler aus MEDIUM-7 ist zurueck.
        run: node scripts/market/verify-semantics-parity.mjs

      - name: Die Bereinigungs-Sperre der Dashboard-Kette greift
        # Arbeitet auf einer Kopie in einem temporaeren Verzeichnis und loest
        # beide Faelle aus: mit Stufe muss die Kette laufen, ohne muss sie
        # abbrechen. Ein Test, der den Fehlerfall nicht ausloest, prueft die
        # Sperre nicht - und die committeten Datendateien bleiben unberuehrt.
        run: |
          python3 scripts/dashboard/migrate_adjustment_semantics.py --check
          python3 scripts/dashboard/verify_adjustment_gate.py

  v8-private-archive-assessment:
    if: github.event_name == 'workflow_dispatch' && inputs.recover_v8_archives == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Exact existing main cache keys. Restore only: no mutation or cache save.
      - id: discover-cache
        uses: actions/cache/restore@v4
        with:
          path: .market-cache
          key: discover-market-cache-40047253956
      - id: tiingo-cache
        uses: actions/cache/restore@v4
        with:
          path: .market-cache/tiingo2-cache.enc
          key: tiingo2-encrypted-v1-main-39962041711
      - id: sec-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .sec-cache
            quant/data/sec/facts
            .quant-state
          key: sec-fundamentals-40087710308
      - name: Open existing authenticated cache using its original context
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
        run: node scripts/market/tiingo2-cache.mjs open --work-dir .market-cache/tiingo2 --file .market-cache/tiingo2-cache.enc --context main
      - name: Assess existing archives offline with bounded memory
        env:
          V8_DISCOVER_CACHE_HIT: ${{ steps.discover-cache.outputs.cache-hit }}
          V8_TIINGO_CACHE_HIT: ${{ steps.tiingo-cache.outputs.cache-hit }}
          V8_SEC_CACHE_HIT: ${{ steps.sec-cache.outputs.cache-hit }}
        run: node --max-old-space-size=2048 scripts/quant/audit-v8-archives.mjs .verification/v8-archives
      - name: Assert canonical data remained unchanged
        run: git diff --exit-code -- quant/data discover/data dashboard/config supertrader/data
      - uses: actions/upload-artifact@v4
        with:
          name: quant-v8-derived-archive-assessment
          path: .verification/v8-archives/archive-assessment.json
          retention-days: 14
      - name: Remove ephemeral private archive contents
        if: always()
        run: rm -rf -- .market-cache .sec-cache .quant-state quant/data/sec/facts
