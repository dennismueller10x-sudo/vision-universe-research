name: Supertrader V4 calibration (post-hoc; freeze pushed before measurement; private plaintext never uploaded)
# Research workflow of the V4 source/measurement acceptance track. It runs only on its own research branch
# with the commit tag [supertrader-v4:calibrate] (or manually). One job, one capture (V4.1: a second capture in
# another job can see store metadata written in between): V4 test suite -> canonical capture and hash-pinned
# French Data Library oracles -> V4 freeze committed and pushed (no rebase allowed) -> pinning verified ->
# measurement on the same capture -> public summary committed (verdicts, flags, counts, hashes). Private series
# are sealed to owner/session keys.
on:
  push:
    branches:
      - 'research/supertrader-source-measurement-acceptance-v4'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: supertrader-v4-calibration-${{ github.ref_name }}
  cancel-in-progress: false
env:
  V4: scripts/supertrader/research/v4
  CAL: scripts/supertrader/research/calibration
jobs:
  calibrate:
    if: contains(github.event.head_commit.message, '[supertrader-v4:calibrate]') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 2
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/supertrader/
            !/scripts/supertrader/research/tournament/sealed/
            !/scripts/supertrader/research/certification/sealed/
            /scripts/market/storage/
            /scripts/ci/
            /.github/workflows/supertrader-v4-calibration.yml
            /quant/engines/
            /quant/config/
            /quant/data/market/scale/universe-FULL_UNIVERSE.json
            /quant/data/market/security-master/eligibility.json
            /quant/data/market/security-master/company-names.json
            /quant/data/sec/consumer/
            /core/identity.js
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Freeze only the commit that triggered the run
        env:
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TRIGGER_SHA"
      - name: Private workspace outside the repository
        run: |
          set -euo pipefail
          sudo mkdir -p /workspace/private
          sudo chown -R "$USER" /workspace
          chmod 700 /workspace/private
          mkdir -p "$RUNNER_TEMP/pub"
      - name: V4 test suite must pass before the freeze
        run: node --test scripts/supertrader/tests/v4-*.test.mjs
      - name: Capture canonical dataset and pinned oracles (no measurement)
        env:
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_REGION: ${{ secrets.VU_HISTORY_S3_REGION }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
          NODE_OPTIONS: --max-old-space-size=12000
        run: |
          set -euo pipefail
          export V3_OBSERVED_AT="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          node $CAL/capture-v3-inrunner.mjs --out /workspace/private/canonical --public-out "$RUNNER_TEMP/pub/capture.json"
          node $V4/capture-oracle-v4.mjs --out /workspace/private/oracle --public-out "$RUNNER_TEMP/pub/oracle.json"
      - name: Build, commit and push the V4 freeze before any measurement (no rebase)
        env:
          BRANCH: ${{ github.ref_name }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          FREEZE="$V4/SUPERTRADER-V4-FREEZE.json"
          rm -f "$FREEZE"
          node $V4/freeze-v4.mjs build --capture-receipt "$RUNNER_TEMP/pub/capture.json" --oracle-receipt "$RUNNER_TEMP/pub/oracle.json" --out "$FREEZE"
          cp "$RUNNER_TEMP/pub/capture.json" "$V4/SUPERTRADER-V4-CAPTURE-RECEIPT.json"
          cp "$RUNNER_TEMP/pub/oracle.json" "$V4/SUPERTRADER-V4-ORACLE-CAPTURE-RECEIPT.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FREEZE" "$V4/SUPERTRADER-V4-CAPTURE-RECEIPT.json" "$V4/SUPERTRADER-V4-ORACLE-CAPTURE-RECEIPT.json"
          git commit -m "Supertrader V4.1: freeze before measurement (capture and oracle receipts, no performance)"
          scripts/ci/push-with-retry.sh "$BRANCH"
          test "$(git rev-parse HEAD^)" = "$TRIGGER_SHA"
          node $V4/freeze-v4.mjs verify --freeze "$FREEZE" --pinned
      - name: Measure on the same capture
        env:
          NODE_OPTIONS: --max-old-space-size=13000
        run: |
          set -euo pipefail
          node --expose-gc $V4/run-calibration-v4.mjs --freeze "$V4/SUPERTRADER-V4-FREEZE.json" --input-dir /workspace/private/canonical --oracle-parsed /workspace/private/oracle/oracle-parsed.json --out /workspace/private/results --public-out "$RUNNER_TEMP/pub/SUPERTRADER-V4-CALIBRATION-SUMMARY.json"
      - name: Sealed results (owner and session envelopes)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v4-sealed-calibration
          path: /workspace/private/results/*.sealed.json
          if-no-files-found: warn
          retention-days: 30
      - name: Commit the public summary
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/pub/SUPERTRADER-V4-CALIBRATION-SUMMARY.json" "$V4/SUPERTRADER-V4-CALIBRATION-SUMMARY.json"
          git add "$V4/SUPERTRADER-V4-CALIBRATION-SUMMARY.json"
          git commit -m "Supertrader V4.1: calibration public summary (verdicts, flags, counts, hashes)"
          scripts/ci/push-with-retry.sh "$BRANCH"
      - name: Remove private plaintext
        if: always()
        run: rm -rf /workspace/private
