name: Discover Im Blick (stuendlich waehrend der Sitzung)

# =============================================================================
# Die Eingangsflaeche "Im Blick" kommt aus dem Abendlauf (Schlusskurse).
# Waehrend der Sitzung schreibt der Intraday-Taktgeber alle fuenf Minuten
# Kurse fuer die Titel auf Discover-Flaechen. Dieser Workflow rechnet daraus
# ungefaehr alle zwei Stunden die Auswahl neu
# (scripts/discover/build-im-blick-live.mjs):
#
#   - keine Anbieteranfrage, kein Schluessel: gelesen werden nur committete
#     Snapshots (quant/data/market/intraday) und die EOD-Basis
#     (discover/data/im-blick/basis-US_REAL.json)
#   - geschrieben werden discover/live/im-blick-US_REAL.json (die Auswahl)
#     und discover/live/monitor-US_REAL.json (Plan, Lauf, Erfolg, Alter)
#   - intraday gibt es kein Schlusshoch, keinen Ausbruch und kein Volumen;
#     die Karte sagt "im Tagesverlauf, Stand HH:MM, unbestaetigt"
#   - nach dem Abendlauf gilt wieder die Schlusskurs-Auswahl (EOD_CURRENT)
#
# DER LAUF IST EINE FRAGE, KEIN TAKT (seit 12.10.2026)
#
# Am 12.10.2026 legte GitHub fuer den frueheren Stundenplan dieses Workflows
# keinen einzigen Lauf an (repo-weit 30 von 110 faelligen Zeitplan-Laeufen in
# 39 Stunden, die angelegten bis zu 9 Stunden zu spaet; workflow_dispatch und
# Push funktionierten). Deshalb haengt die Aktualisierung nicht mehr an einem
# pünktlichen Ausloeser:
#
#   Slots (discover/engines/refresh-plan.js): Sitzungsbeginn + 90/210/330 Min.
#   und Schluss + 20 Min., aus dem Boersenkalender (Ortszeit New York:
#   11:00, 13:00, 15:00, 16:20; verkuerzte Tage 11:00 und Schluss + 20).
#   Jeder Lauf ermittelt den zuletzt faelligen Slot und rechnet nur, wenn
#   dessen Ergebnis noch nicht veroeffentlicht ist - sonst endet er in
#   Sekunden ohne Aenderung. Ein verspaeteter, doppelter oder zu frueher
#   Ausloeser ist damit harmlos, und jeder spaetere holt einen verpassten
#   Termin nach.
#
#   Ausloeser (unabhaengig voneinander, alle gleichwertig):
#     1. Cloudflare-Wecker (worker-waker/): alle 30 Minuten (Minute 5/35,
#        15-21 UTC, Mo-Fr). Steht ausserhalb von GitHub, weckt auch den
#        Intraday-Taktgeber zuverlaessig.
#     2. GitHub-Zeitplan: Minute 27 von 15 bis 21 UTC, Mo-Fr. Deckt
#        Sommer- (15/17/19/20:20 UTC) und Winterzeit (16/18/20/21:20 UTC)
#        ab; die Zeit ausserhalb eines Slots ist ein Leerlauf. Nur noch
#        Rueckfall - er kann ausfallen oder Stunden spaeter kommen.
#     3. workflow_dispatch von Hand (force erzwingt eine Neuberechnung).
#
# KEINE ENDLOSSCHLEIFE, KEIN DAUERLAEUFER: ein Lauf dauert 30 bis 90 Sekunden.
# =============================================================================

on:
  # Kein GitHub-Cron mehr (Plan Neustart §3, ein Zeitgeber): der Cloudflare-Wecker stoesst diesen
  # Workflow direkt an (worker-waker/src/index.mjs, Minute 5 und 35, 15-21 UTC, Mo-Fr, mit Laufsperre).
  # Der fruehere Cron (27 15-21 * * 1-5) war seit dem 12.10.2026 nur noch Rueckfall.
  workflow_dispatch:
    inputs:
      source:
        description: 'Wer stoesst an (nur zur Beobachtung): cloudflare-waker | manual'
        type: string
        default: 'manual'
      force:
        description: 'Neuberechnung erzwingen, auch wenn der faellige Slot veroeffentlicht ist'
        type: boolean
        default: false

permissions:
  contents: write

# Je Zweig eine Gruppe, nie abbrechen: ein laufender Lauf wird fertig, ein
# wartender (hoechstens einer) rechnet danach gegen den dann aktuellen Stand.
concurrency:
  group: discover-im-blick-live-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Datenzweig (core/registry/data-branch.json, discoverImBlickLive, BRANCH_ONLY): der bisherige Stand
      # (Auswahl und Monitor) liegt in data/live; der Baustein entscheidet daran, ob der Slot noch offen ist.
      - name: Bisheriger Stand aus dem Datenzweig
        run: scripts/ci/seed-data-branch.sh discoverImBlickLive

      - name: Im Blick neu rechnen, wenn der faellige Slot noch offen ist
        env:
          SOURCE: ${{ github.event_name == 'schedule' && 'github-schedule' || inputs.source }}
          FORCE: ${{ inputs.force && 'true' || 'false' }}
        run: |
          set -euo pipefail
          args=(--source "${SOURCE:-unbekannt}")
          if [ "${FORCE}" = "true" ]; then args+=(--force); fi
          node scripts/discover/build-im-blick-live.mjs "${args[@]}"

      # Nur noch in den Datenzweig (nur main); die Kopie in main ist eingefroren (Rueckfall), Pages liefert
      # den Datenzweig aus. Unveraendert: push-data-branch.sh committet nichts.
      - name: In den Datenzweig (nur bei Aenderung)
        if: github.ref == 'refs/heads/main'
        run: scripts/ci/push-data-branch.sh data/live discover/live/im-blick-US_REAL.json discover/live/monitor-US_REAL.json

      # Selbstpruefung am Ende: stimmt das Ergebnis jetzt mit dem faelligen Slot
      # ueberein? Nur ein Hinweis (continue-on-error) - rot wird der Lauf nicht,
      # den Alarm gibt der Freshness-Monitor, unabhaengig von diesem Workflow.
      - name: Selbstpruefung
        continue-on-error: true
        run: node scripts/discover/check-im-blick-live.mjs --root .
