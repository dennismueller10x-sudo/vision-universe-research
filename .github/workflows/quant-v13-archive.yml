name: Quant V13 Research-Archiv (R2, verschluesselt)

# Sicherung und Wiederherstellungsprobe des privaten V13-Research-Archivs im bestehenden privaten R2-Eimer
# (Praefix research-snapshots/quant-v13/, wie docs/SUPERTRADER_DURABLE_RESEARCH_SNAPSHOTS.md).
# Das Archiv ist vor dem Upload verschluesselt (scripts/quant/v13/archive/build-archive.sh, Manifest
# docs/quant-recovery/v13/archive/manifest-1.1.0.json). Nur ueber eine Marke in der Commit-Nachricht auf claude/**:
#   [v13-archive:usage]   nur lesen: Eimerbelegung, Nullkostengrenze, Praefix frei?
#   [v13-archive:put]     wie usage, dann vorsignierte PUT-URLs (3 h), verschluesselt mit archive-pub.pem als Artefakt
#   [v13-archive:get]     vorsignierte GET-URLs (3 h) fuer die Wiederherstellungsprobe, ebenso verschluesselt
#   [v13-archive:verify]  jedes Objekt aus R2 lesen und SHA-256 gegen das Manifest pruefen
# Keine URL, kein Endpunkt und kein Secret erscheint im Log; Ausgaben nur Zaehlungen und Hashes.
on:
  push:
    branches:
      - 'claude/**'
permissions:
  contents: read
concurrency:
  group: quant-v13-archive-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  archive:
    if: contains(github.event.head_commit.message, '[v13-archive:')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Modus aus der Commit-Nachricht
        id: m
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          m=$(printf '%s' "$MSG" | grep -oE '\[v13-archive:(usage|put|get|verify)\]' | head -1 | sed -E 's/\[v13-archive:([a-z]+)\]/\1/')
          test -n "$m"
          echo "mode=$m" >> "$GITHUB_OUTPUT"
      - name: R2 (nur Zaehlungen im Log)
        env:
          MODE: ${{ steps.m.outputs.mode }}
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_REGION: ${{ secrets.VU_HISTORY_S3_REGION }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/a"
          P=research-snapshots/quant-v13/archive-1.1.0/
          M=docs/quant-recovery/v13/archive/manifest-1.1.0.json
          case "$MODE" in
            usage) node scripts/quant/v13/archive/presign.mjs --mode usage --manifest "$M" --prefix "$P" ;;
            put|get) node scripts/quant/v13/archive/presign.mjs --mode "$MODE" --manifest "$M" --prefix "$P" --out "$RUNNER_TEMP/a/urls.json" ;;
            verify) node scripts/quant/v13/archive/presign.mjs --mode verify --manifest "$M" --prefix "$P" ;;
          esac
      - name: URLs verschluesseln (AES-256 + RSA-OAEP), Klartext loeschen
        if: steps.m.outputs.mode == 'put' || steps.m.outputs.mode == 'get'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/a"
          openssl rand -out k.bin 32
          openssl enc -aes-256-cbc -pbkdf2 -iter 100000 -salt -pass file:k.bin -in urls.json -out urls.json.enc
          openssl pkeyutl -encrypt -pubin -inkey "$GITHUB_WORKSPACE/docs/quant-recovery/v13/archive/archive-pub.pem" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in k.bin -out k.bin.enc
          shred -u k.bin urls.json
          mkdir out && mv urls.json.enc k.bin.enc out/
      - uses: actions/upload-artifact@v4
        if: steps.m.outputs.mode == 'put' || steps.m.outputs.mode == 'get'
        with:
          name: v13-archive-${{ steps.m.outputs.mode }}-${{ github.run_id }}
          path: ${{ runner.temp }}/a/out
          retention-days: 1
          if-no-files-found: error
