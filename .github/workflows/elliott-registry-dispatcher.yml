name: Elliott Registry Dispatcher (Zeitplaene → Register auf main)

# WOZU: Uebergang. Das prospektive Elliott-Register (Registry 1.1.0) liegt seit der Produktmigration
# Technical Intelligence v3 auf main (Code, Ledger, Snapshots, elliott-prospective-registry.yml) und misst
# das Chartbild von main. Bis ein direkter Lauf auf main verifiziert ist, behalten die vier Zeitplaene
# ihren Platz hier und starten den Register-Workflow auf main. Danach wandern sie in den Register-Workflow
# und diese Datei entfaellt. Vorher zielte sie auf den Forschungsbranch claude/vision-universe-mission-viii-7hjwma;
# der registriert nicht mehr (ein Schreiber).
#
# Doppelstarts:
#   * Laeuft oder wartet schon ein Register-Lauf auf dem Branch, wird nicht erneut ausgeloest.
#   * Der Register-Workflow hat selbst eine Concurrency-Gruppe (elliott-prospective-registry).
#   * Er prueft in der Stufe "Faellig?", ob eine Woche fehlt. Ist nichts faellig, endet er
#     ohne Datenabruf. Die vier Zeitplaene sind damit Nachhol-Gelegenheiten, keine Mehrfachlaeufe.
#
# Ein Workflow darf mit dem eingebauten GITHUB_TOKEN workflow_dispatch ausloesen (GitHub-Ausnahme
# fuer workflow_dispatch und repository_dispatch). Ein persoenlicher Token ist nicht noetig.
#
# Der fruehere offene Architekturpunkt (main zeigte Elliott V1 aus technical-signals-v1) ist mit der
# Produktmigration erledigt: Kundenprodukt und Register-Kundensicht sind beide das Chartbild v3 von main.

on:
  schedule:
    - cron: '23 9 * * 6'
    - cron: '47 7 * * 0'
    - cron: '17 6 * * 1'
    - cron: '41 5 * * 3'
  workflow_dispatch:
    inputs:
      max_weeks:
        description: 'An den Register-Workflow: hoechstens so viele fehlende Wochen nachholen (1-4)'
        default: '2'

permissions:
  actions: write
  contents: read

concurrency:
  group: elliott-registry-dispatcher
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TARGET_REF: main
      TARGET_WORKFLOW: elliott-prospective-registry.yml
      MAX_WEEKS_INPUT: ${{ inputs.max_weeks }}
    steps:
      - name: Ziel pruefen (Branch und Register-Workflow mit workflow_dispatch)
        run: |
          set -euo pipefail
          SHA=$(gh api "repos/$REPO/branches/$TARGET_REF" --jq .commit.sha)
          echo "Zielbranch $TARGET_REF auf $SHA"
          gh api "repos/$REPO/contents/.github/workflows/$TARGET_WORKFLOW?ref=$TARGET_REF" --jq .content | base64 -d > "$RUNNER_TEMP/target.yml"
          grep -q '^  workflow_dispatch:' "$RUNNER_TEMP/target.yml" || { echo "::error::$TARGET_WORKFLOW auf $TARGET_REF hat keinen workflow_dispatch"; exit 1; }
          grep -q 'scripts/technical/elliott-registry/register.mjs' "$RUNNER_TEMP/target.yml" || { echo "::error::$TARGET_WORKFLOW auf $TARGET_REF ist nicht der Register-Workflow"; exit 1; }

      - name: Doppelstart vermeiden
        id: busy
        run: |
          set -euo pipefail
          N=0
          for st in queued in_progress waiting requested pending; do
            c=$(gh api "repos/$REPO/actions/workflows/$TARGET_WORKFLOW/runs?branch=$TARGET_REF&status=$st&per_page=1" --jq .total_count)
            N=$((N + c))
          done
          echo "busy=$N" >> "$GITHUB_OUTPUT"
          if [ "$N" -gt 0 ]; then echo "::notice::Register-Lauf auf $TARGET_REF laeuft bereits oder wartet ($N) - kein weiterer Start."; fi

      - name: Register-Workflow auf dem Zielbranch ausloesen
        if: steps.busy.outputs.busy == '0'
        id: fire
        run: |
          set -euo pipefail
          MW="${MAX_WEEKS_INPUT:-2}"
          case "$MW" in 1|2|3|4) ;; *) echo "::error::max_weeks muss 1-4 sein"; exit 1;; esac
          T0=$(date -u -d '-10 seconds' +%Y-%m-%dT%H:%M:%SZ)
          echo "t0=$T0" >> "$GITHUB_OUTPUT"
          gh workflow run "$TARGET_WORKFLOW" --repo "$REPO" --ref "$TARGET_REF" -f max_weeks="$MW"

      - name: Start bestaetigen (richtiger Workflow, richtiger Branch)
        if: steps.busy.outputs.busy == '0'
        env:
          T0: ${{ steps.fire.outputs.t0 }}
        run: |
          set -euo pipefail
          for i in $(seq 1 18); do
            RUN=$(gh api "repos/$REPO/actions/workflows/$TARGET_WORKFLOW/runs?branch=$TARGET_REF&event=workflow_dispatch&per_page=10" \
              --jq "[.workflow_runs[] | select(.created_at >= \"$T0\" and .head_branch == \"$TARGET_REF\" and .path == \".github/workflows/$TARGET_WORKFLOW\")][0] | select(. != null) | \"\(.id) \(.html_url) \(.head_sha)\"")
            if [ -n "$RUN" ]; then
              echo "Gestartet: $RUN"
              echo "### Elliott Registry Dispatcher" >> "$GITHUB_STEP_SUMMARY"
              echo "* Register-Lauf auf \`$TARGET_REF\`: $RUN" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Kein Register-Lauf auf $TARGET_REF nach dem Ausloesen gefunden"
          exit 1
