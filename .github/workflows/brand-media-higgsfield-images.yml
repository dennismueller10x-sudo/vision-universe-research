name: Brand Media · Higgsfield Bilder

on:
  workflow_dispatch:
    inputs:
      action:
        description: validate (no API call), estimate (price query only) or generate (paid, needs approval and budget)
        type: choice
        required: true
        options: [validate, estimate, generate]
      job:
        description: Job file, e.g. brand-media/kanal-2/image-jobs/bulle-baer-entwurf-1.json
        type: string
        required: true
      budget_usd:
        description: Spending cap in USD for generate; blocks when the estimate is higher
        type: string
        required: false
      paid_approval:
        description: APPROVE-HIGGSFIELD-IMAGE-JOB, or APPROVE-HIGGSFIELD-IMAGE-JOB-WITHOUT-ESTIMATE when the provider returns no price
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: higgsfield-paid-generation
  cancel-in-progress: false

jobs:
  images:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted main branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run image job; generate submits each image once, sequentially, without retries
        env:
          HIGGSFIELD_API_KEY: ${{ secrets.HIGGSFIELD_API_KEY }}
          INPUT_ACTION: ${{ inputs.action }}
          INPUT_JOB: ${{ inputs.job }}
          INPUT_BUDGET_USD: ${{ inputs.budget_usd }}
          INPUT_APPROVAL: ${{ inputs.paid_approval }}
        run: |
          set -euo pipefail
          args=(--action "$INPUT_ACTION" --job "$INPUT_JOB")
          if [ "$INPUT_ACTION" = generate ]; then
            args+=(--budget-usd "$INPUT_BUDGET_USD" --approval "$INPUT_APPROVAL")
          fi
          python brand-media/higgsfield/images.py "${args[@]}"
      - name: Contact sheet for review
        if: inputs.action == 'generate'
        continue-on-error: true
        shell: bash
        run: |
          shopt -s nullglob
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null; }
          for dir in brand-media/output/higgsfield-images/*/; do
            files=("$dir"*.png "$dir"*.jpg "$dir"*.jpeg "$dir"*.webp)
            [ "${#files[@]}" -gt 0 ] || continue
            inputs=(); filters=""
            for i in "${!files[@]}"; do
              inputs+=(-i "${files[$i]}")
              filters+="[$i:v]scale=512:512:force_original_aspect_ratio=decrease,pad=512:512:(ow-iw)/2:(oh-ih)/2:white[v$i];"
            done
            stack=""; for i in "${!files[@]}"; do stack+="[v$i]"; done
            n=${#files[@]}; cols=$(( n < 3 ? n : 3 ))
            layout=""; for i in "${!files[@]}"; do layout+="$(( (i % cols) * 512 ))_$(( (i / cols) * 512 ))|"; done
            if [ "$n" -eq 1 ]; then
              ffmpeg -nostdin -v error -y "${inputs[@]}" -filter_complex "${filters}[v0]null" -frames:v 1 "${dir}contact-sheet.jpg"
            else
              ffmpeg -nostdin -v error -y "${inputs[@]}" -filter_complex "${filters}${stack}xstack=inputs=$n:layout=${layout%|}:fill=white" -frames:v 1 "${dir}contact-sheet.jpg"
            fi
          done
      - name: Upload images
        if: always() && inputs.action == 'generate'
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: higgsfield-images-${{ github.run_id }}
          path: brand-media/output/higgsfield-images/
          if-no-files-found: warn
          retention-days: 14

  # Insights-Tageslauf (12.11.2026): Sitzungen ohne Artefakt-Download holen die Bilder per git.
  # Jeder generate-Lauf legt Bilder, manifest.json und contact-sheet.jpg zusätzlich auf dem
  # Zweig media/higgsfield-images unter <job_id>/ ab (nur dieser Zweig, nie main).
  publish:
    needs: images
    if: github.ref == 'refs/heads/main' && inputs.action == 'generate'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: higgsfield-images-publish-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: higgsfield-images-${{ github.run_id }}
          path: bilder
      - name: Bilder auf den Zweig media/higgsfield-images legen
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          ziel=media/higgsfield-images
          mkdir zweig && cd zweig
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          if git fetch -q --depth 1 origin "$ziel"; then git checkout -q -b arbeit FETCH_HEAD; else git checkout -q --orphan arbeit; fi
          for dir in ../bilder/*/; do
            job=$(basename "$dir")
            mkdir -p "$job"
            cp -R "$dir". "$job"/
          done
          git add -A
          if git diff --cached --quiet; then echo "Keine neuen Bilder."; exit 0; fi
          git commit -q -m "Higgsfield-Bilder aus Lauf ${RUN_ID}"
          for i in 1 2 3 4 5; do
            if git push -q origin "HEAD:refs/heads/${ziel}"; then echo "Bilder auf ${ziel} abgelegt."; exit 0; fi
            sleep $((i * 5))
            git fetch -q --depth 1 origin "$ziel" && git rebase -q FETCH_HEAD || true
          done
          echo "Push auf ${ziel} fehlgeschlagen." >&2
          exit 1
