name: Static Research Access Gate
on:
  push:
    paths: ['scripts/access-gate/**', 'scripts/vu2/production-smoke.mjs', '.github/workflows/research-access-ci.yml']
  pull_request:
    paths: ['scripts/access-gate/**', 'scripts/vu2/production-smoke.mjs', '.github/workflows/research-access-ci.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check whether the separate GitHub build secret is configured (no values)
        env:
          BUILD_PASSWORD: ${{ secrets.RESEARCH_ACCESS_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os
          print('GITHUB_RESEARCH_ACCESS_PASSWORD_CONFIGURED=' + str(bool(os.environ.get('BUILD_PASSWORD'))).lower())
          PY
      - run: node --test scripts/access-gate/build.test.mjs
      - name: Browser dependencies
        run: |
          npm install --prefix /tmp/research-access-qa --no-audit --no-fund playwright@1.57.0
          /tmp/research-access-qa/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Password flow, no content flash and persistent shared access in Chromium and iPhone WebKit
        env:
          PLAYWRIGHT_PATH: /tmp/research-access-qa/node_modules/playwright
        run: node scripts/access-gate/browser-qa.mjs
