name: Coming-soon | bestehendes Cloudflare-Pages-Projekt prüfen
on:
  workflow_dispatch:
    inputs:
      newsletter_operation:
        description: Newsletter-Operator (nur isolierter PR-Branch; audit sendet und schreibt nichts)
        type: choice
        options: [audit, setup, e2e]
        default: audit
      authorize_controlled_test:
        description: Nur e2e – ausdrücklich DOI und administrative Bestätigung an neue geheime Testadresse erlauben
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: landing-cloudflare-prepare-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  newsletter_server_operator:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feat/brevo-app-waitlist-doi'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: bd4510c57e9e15088f9782715aa5aa18ebc33b7e
          persist-credentials: false
          sparse-checkout: landing
      - name: Private audit or closed setup (no contact writes or emails)
        if: inputs.newsletter_operation != 'e2e'
        env:
          NEWSLETTER_OPERATOR_OPERATION: ${{ inputs.newsletter_operation }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_DOI_TEST_EMAIL: ${{ secrets.BREVO_DOI_TEST_EMAIL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          LANDING_CLOUDFLARE_API_TOKEN: ${{ secrets.LANDING_CLOUDFLARE_API_TOKEN }}
          BREVO_CLOUDFLARE_DNS_TOKEN: ${{ secrets.BREVO_CLOUDFLARE_DNS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
        run: python3 landing/scripts/newsletter-server-admin.py
      - name: Explicit controlled DOI and unsubscribe test (never main-list delivery)
        if: inputs.newsletter_operation == 'e2e' && inputs.authorize_controlled_test
        env:
          NEWSLETTER_AUTHORIZE_CONTROLLED_TEST: ${{ inputs.authorize_controlled_test && 'true' || 'false' }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_DOI_TEST_EMAIL: ${{ secrets.BREVO_DOI_TEST_EMAIL }}
        run: python3 landing/scripts/newsletter-e2e.py
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: landing
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vorhandenes vision-universe prüfen, ausschließlich GET
        env:
          LANDING_CLOUDFLARE_API_TOKEN: ${{ secrets.LANDING_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_API: ${{ secrets.CLOUDFLARE_API }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          LANDING_AUDIT_OUTPUT: ${{ runner.temp }}/landing-cloudflare-project
        run: node landing/scripts/cloudflare-prepare.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: landing-cloudflare-project
          path: ${{ runner.temp }}/landing-cloudflare-project/
          retention-days: 3
