name: Coming-soon | bestehendes Cloudflare-Pages-Projekt prüfen
on:
  workflow_dispatch:
    inputs:
      waitlist_operation:
        description: Einmalige native Migration; keine E-Mails oder Kontaktänderungen
        type: choice
        options: [audit, prepare_native, cleanup]
        default: audit
permissions:
  contents: read
concurrency:
  group: landing-cloudflare-prepare-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  waitlist_audit:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feat/brevo-app-waitlist-doi'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: f0066e03660d76a972d1be5cdbdda717b5e8093c
          persist-credentials: false
          sparse-checkout: landing
      - name: Native form prerequisites; no email or contact writes
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_DOI_TEST_EMAIL: ${{ secrets.BREVO_DOI_TEST_EMAIL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          WAITLIST_OPERATION: ${{ inputs.waitlist_operation }}
        run: python3 landing/scripts/native-form-migration.py
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: landing
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vorhandenes vision-universe prüfen, ausschließlich GET
        env:
          LANDING_CLOUDFLARE_API_TOKEN: ${{ secrets.LANDING_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_API: ${{ secrets.CLOUDFLARE_API }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          LANDING_AUDIT_OUTPUT: ${{ runner.temp }}/landing-cloudflare-project
        run: node landing/scripts/cloudflare-prepare.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: landing-cloudflare-project
          path: ${{ runner.temp }}/landing-cloudflare-project/
          retention-days: 3
