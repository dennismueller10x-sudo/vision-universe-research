name: Social Cloudflare

# Der kontrollierte Deploymentpfad fuer den Worker `vision-universe-social`.
#
# -------------------------------------------------------------------------
# WARUM NICHT AUTOMATISCH BEI JEDEM PUSH
# -------------------------------------------------------------------------
#
# `wrangler deploy` ersetzt den vorhandenen Worker vollstaendig. Ein
# Deployment ist deshalb eine Handlung mit Aussenwirkung und kein
# Nebeneffekt eines Commits. Dieser Workflow laeuft ausschliesslich auf
# ausdrueckliche Anforderung (`workflow_dispatch`).
#
# -------------------------------------------------------------------------
# DIE REIHENFOLGE IST DIE SICHERUNG
# -------------------------------------------------------------------------
#
#   preflight   liest, was dort liegt          — immer, auch vor einem Deploy
#   provision   legt KV an, traegt URL ein     — nur bei action=deploy
#   deploy      ersetzt den Worker             — nur wenn preflight es zulaesst
#   verify      prueft, was danach da ist      — inklusive Secret-Vergleich
#
# Der Preflight laeuft IMMER zuerst und im selben Lauf. Ein Preflight von
# gestern sagt nichts darueber, was heute im Worker liegt.
#
# -------------------------------------------------------------------------
# SECRETS
# -------------------------------------------------------------------------
#
# CLOUDFLARE_API_TOKEN kommt aus dem secrets-Kontext und wird nie
# ausgegeben. CLOUDFLARE_ACCOUNT_ID ist eine Variable und wird ebenfalls
# nicht gedruckt. Die Meta-Secrets im Worker werden nur bei ihren NAMEN
# genannt — Cloudflare gibt ihre Werte ohnehin nicht zurueck.

on:
  # Vor dem Merge auf main kennt die GitHub-API einen Workflow fuer einen
  # Dispatch nicht (404) — dasselbe Verhalten, das bereits in
  # sec-fundamentals-daily.yml dokumentiert ist. Ein Push, der diesen
  # Workflow selbst aendert, loest deshalb einen echten Lauf aus.
  #
  # Ein solcher Lauf fuehrt NUR den Preflight aus, solange nicht die
  # Datei workers/vision-universe-social/DEPLOY_REQUEST im Repository
  # liegt. Sie ist die Anforderung, die ein Push nicht mitbringen kann:
  # im Diff sichtbar, mit Autor und Datum, durch Loeschen zurueckziehbar.
  #
  # Der Preflight liest ausschliesslich — er kann nichts ueberschreiben,
  # und er laeuft in jedem Fall VOR jedem Deploy-Schritt.
  push:
    branches:
      - 'claude/**'
    paths:
      - '.github/workflows/social-cloudflare.yml'
      - 'scripts/social/preflight-worker.mjs'
      - 'scripts/social/provision-cloudflare.mjs'
      - 'scripts/social/verify-worker.mjs'
      # Aendert sich der Worker selbst, soll das Deployte ihm folgen —
      # sonst laeuft draussen etwas anderes als hier steht. Hier liegt
      # auch DEPLOY_REQUEST.
      - 'workers/vision-universe-social/**'

  workflow_dispatch:
    inputs:
      action:
        description: 'Was soll passieren?'
        type: choice
        required: true
        default: preflight
        options:
          - preflight
          - deploy
          - verify
      confirm_deploy:
        description: 'Nur fuer action=deploy: "DEPLOY" eintippen. Schuetzt gegen einen Fehlklick.'
        type: string
        required: false
        default: ''

permissions:
  contents: write

# Zwei gleichzeitige Deployments auf denselben Worker waeren ein Rennen
# um denselben Zustand.
concurrency:
  group: social-cloudflare
  cancel-in-progress: false

jobs:
  cloudflare:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Zugang ist konfiguriert
        # Nur pruefen, DASS etwas gesetzt ist — niemals, WAS.
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN(secret)"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID(variable)"
          if [ -n "$missing" ]; then
            echo "::error::Es fehlt:$missing"
            exit 1
          fi
          echo "Zugangsdaten sind gesetzt (Namen geprueft, keine Werte gelesen)."

      - name: Betriebsart bestimmen
        id: mode
        # Ein Dispatch kann diesen Workflow nicht ausloesen, solange er
        # nicht auf dem Default-Branch liegt (404) — deshalb laeuft er per
        # Push. Ein Push traegt aber keine Eingabefelder, und ein
        # Deployment, das einfach bei jedem Push mitlaeuft, waere genau die
        # Art Automatik, die man spaeter nicht mehr erklaeren kann.
        #
        # Die Anforderung steht deshalb als Datei im Repository:
        # workers/vision-universe-social/DEPLOY_REQUEST. Sie ist im Diff
        # sichtbar, sie hat einen Autor und ein Datum, und sie laesst sich
        # durch Loeschen zurueckziehen. Das ist mehr Nachweis als ein
        # Auswahlfeld, nicht weniger.
        run: |
          request_file="workers/vision-universe-social/DEPLOY_REQUEST"
          deploy=false
          verify=false
          reason=""

          if [ -n "${{ inputs.action }}" ]; then
            # Dispatch: die Eingabe entscheidet.
            case "${{ inputs.action }}" in
              deploy)
                if [ "${{ inputs.confirm_deploy }}" != "DEPLOY" ]; then
                  echo "::error::Fuer action=deploy muss confirm_deploy auf DEPLOY stehen."
                  exit 1
                fi
                deploy=true; verify=true; reason="Dispatch mit Bestaetigung" ;;
              verify)  verify=true;  reason="Dispatch: nur pruefen" ;;
              *)       reason="Dispatch: nur Preflight" ;;
            esac
          elif [ -f "$request_file" ]; then
            marker=$(grep -v '^[[:space:]]*#' "$request_file" | grep -v '^[[:space:]]*$' | head -1 | tr -d '[:space:]')
            if [ "$marker" = "DEPLOY" ]; then
              deploy=true; verify=true; reason="DEPLOY_REQUEST liegt im Repository"
            else
              reason="DEPLOY_REQUEST vorhanden, aber ohne die Zeile DEPLOY"
            fi
          else
            reason="Push ohne DEPLOY_REQUEST — nur Preflight"
          fi

          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          echo "verify=$verify" >> "$GITHUB_OUTPUT"
          echo "Betriebsart: deploy=$deploy verify=$verify ($reason)"
          echo "Betriebsart: deploy=\`$deploy\` verify=\`$verify\` — $reason" >> "$GITHUB_STEP_SUMMARY"

      # ----------------------------------------------------------------
      # PREFLIGHT — laeuft IMMER, auch vor einem Deployment
      # ----------------------------------------------------------------

      - name: Preflight gegen die reale Infrastruktur
        id: preflight
        run: |
          node scripts/social/preflight-worker.mjs \
            --out /tmp/cf-preflight --backup tmp/cf-backup | tee /tmp/preflight.log
          verdict=$(node -e '
            const r = require("/tmp/cf-preflight/worker-preflight.json");
            console.log(r.verdict);
          ')
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          echo "## Preflight: $verdict" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/preflight.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Zonen auf dem Konto — ist eine eigene Domain moeglich?
        id: zones
        # Meta lehnt die workers.dev-Adresse als App-Domain ab. Die
        # Alternative ist eine eigene Subdomain, und die setzt voraus,
        # dass die Zone auf DIESEM Cloudflare-Konto liegt. Das wird hier
        # gefragt statt beim Deployen herausgefunden: eine Custom Domain
        # ohne Zone laesst `wrangler deploy` fehlschlagen und reisst die
        # ganze Strecke mit.
        #
        # Nur lesend. Zonennamen stehen im oeffentlichen DNS.
        continue-on-error: true
        run: node scripts/social/provision-cloudflare.mjs --list-zones social.visionuniverse.de

      - name: Preflight-Bericht sichern
        uses: actions/upload-artifact@v4
        with:
          name: worker-preflight
          path: /tmp/cf-preflight/worker-preflight.json
          retention-days: 30

      - name: Gefahr einer Ueberschreibung fremder Logik
        id: overwrite
        # Beurteilt wird, was der vorhandene Code TUT — nicht, wie gross er
        # ist. Eine Groesse sagt darueber nichts: Cloudflares eigene
        # "Hello World"-Vorlage ist groesser als manches produktive Skript.
        run: |
          node -e '
            const report = require("/tmp/cf-preflight/worker-preflight.json");
            const existing = report.existing || {};
            const exists = existing.exists === true;
            /* Ein Worker, der nicht existiert, kann nichts ueberschreiben.
               Sonst entscheidet ausschliesslich die Klassifikation — und
               ein fehlendes Urteil gilt als NICHT sicher. */
            const foreign = exists && existing.safeToReplace !== true;
            console.log("Worker existiert:      " + exists);
            console.log("Einordnung:            " + (existing.classification ?? "unbekannt"));
            console.log("Ersetzen unbedenklich: " + String(existing.safeToReplace));
            console.log("Groesse (Bytes):       " + (existing.scriptBytes ?? "unbekannt"));
            console.log("sha256:                " + (existing.scriptSha256Prefix ?? "unbekannt"));
            console.log("Gesichert:             " + String(existing.backupWritten ?? false));
            if (existing.signals) {
              console.log("Signale:               " + JSON.stringify(existing.signals));
            }
            console.log("HALT noetig:           " + foreign);
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT,
              "foreign=" + foreign + "\nclassification=" + (existing.classification ?? "unbekannt") + "\n");
          '

      - name: Sicherung des vorhandenen Codes ablegen
        # Sie entsteht VOR jedem Deployment und macht es umkehrbar.
        # Der Preflight legt sie nur an, wenn im vorhandenen Code nichts
        # in Zugangsdatenform steht — sonst waere die Sicherung eine
        # Kopie des Geheimnisses an einen Ort mit anderem Leserkreis.
        # hashFiles sieht nur den Arbeitsbereich — ein absoluter Pfad
        # unter /tmp liefert immer den leeren Hash, und der Schritt wird
        # stillschweigend uebersprungen. Genau das ist im ersten Lauf
        # passiert: die Sicherung war geschrieben, das Artefakt fehlte.
        # tmp/ steht bereits in .gitignore.
        if: hashFiles('tmp/cf-backup/*') != ''
        uses: actions/upload-artifact@v4
        with:
          name: worker-code-before-deploy
          path: tmp/cf-backup/
          retention-days: 90

      - name: HALT — im Worker liegt fremde produktive Logik
        if: steps.overwrite.outputs.foreign == 'true'
        run: |
          {
            echo "## Deployment gesperrt"
            echo ""
            echo "Im Worker \`vision-universe-social\` liegt Code, den der Preflight als"
            echo "\`${{ steps.overwrite.outputs.classification }}\` einordnet. Ein Deployment"
            echo "wuerde ihn vollstaendig ersetzen."
            echo ""
            echo "Die Signale stehen im Schritt darueber und im Artefakt \`worker-preflight\`."
            echo "Der Quelltext wird bewusst nirgends ausgegeben."
            echo ""
            echo "**Eine Sicherung liegt als Artefakt \`worker-code-before-deploy\` bei**,"
            echo "sofern der Code nichts in Zugangsdatenform enthielt. Alternativ:"
            echo '```bash'
            echo "npx wrangler download vision-universe-social"
            echo '```'
            echo ""
            echo "Danach entscheiden, ob der Inhalt uebernommen, migriert oder verworfen wird."
            echo "Das ist eine Owner-Entscheidung und kein Schritt, den ein Workflow trifft."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Fremde produktive Logik im Worker — Deployment gesperrt."
          exit 1

      # ----------------------------------------------------------------
      # PROVISION + DEPLOY — nur auf ausdrueckliche Anforderung
      # ----------------------------------------------------------------

      - name: Secrets VOR dem Deployment festhalten
        if: steps.mode.outputs.deploy == 'true'
        # §4: die vom Owner vorbereiteten Meta-Secrets duerfen nicht
        # verschwinden. Wir halten den Vorher-Stand fest, um ihn danach
        # zu vergleichen — "wrangler erhaelt Secrets normalerweise" ist
        # keine Zusicherung, auf die man ein App-Secret setzt.
        run: |
          node scripts/social/provision-cloudflare.mjs \
            --check-secrets vorher --out-json /tmp/secrets-before.json

      - name: Minimale Infrastruktur sicherstellen (KV, oeffentliche URL)
        if: steps.mode.outputs.deploy == 'true'
        id: provision
        run: node scripts/social/provision-cloudflare.mjs --ensure-kv --resolve-url

      - name: Worker deployen
        if: steps.mode.outputs.deploy == 'true'
        id: deploy
        working-directory: workers/vision-universe-social
        run: |
          npx --yes wrangler@4 deploy 2>&1 | tee /tmp/deploy.log
          # Die tatsaechliche Adresse aus der wrangler-Ausgabe lesen. Sie ist
          # die Quelle der Wahrheit — nicht das, was wir vorher geraten haben.
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' /tmp/deploy.log | head -1 || true)
          echo "deployed_url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployte Adresse: ${url:-nicht aus der Ausgabe lesbar}"

      - name: Oeffentliche URL nachtragen, falls sie vorher unbekannt war
        if: steps.mode.outputs.deploy == 'true' && steps.deploy.outputs.deployed_url != ''
        id: fixurl
        working-directory: ${{ github.workspace }}
        run: |
          before=$(node -e '
            const fs = require("fs");
            const s = fs.readFileSync("workers/vision-universe-social/wrangler.toml", "utf8");
            const m = s.match(/^\s*PUBLIC_BASE_URL\s*=\s*"([^"]*)"/m);
            console.log(m ? m[1] : "");
          ')
          node scripts/social/provision-cloudflare.mjs --url "${{ steps.deploy.outputs.deployed_url }}"
          after=$(node -e '
            const fs = require("fs");
            const s = fs.readFileSync("workers/vision-universe-social/wrangler.toml", "utf8");
            const m = s.match(/^\s*PUBLIC_BASE_URL\s*=\s*"([^"]*)"/m);
            console.log(m ? m[1] : "");
          ')
          if [ "$before" != "$after" ]; then
            echo "Die URL war vorher nicht bekannt — erneut deployen, damit der Worker sie kennt."
            echo "redeploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "redeploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Erneut deployen, damit die Redirect-URI stimmt
        if: steps.mode.outputs.deploy == 'true' && steps.fixurl.outputs.redeploy == 'true'
        working-directory: workers/vision-universe-social
        run: npx --yes wrangler@4 deploy

      - name: Secrets NACH dem Deployment vergleichen
        if: steps.mode.outputs.deploy == 'true'
        run: node scripts/social/provision-cloudflare.mjs --compare-secrets /tmp/secrets-before.json

      - name: Konfiguration committen
        if: steps.mode.outputs.deploy == 'true'
        # KV-ID und oeffentliche URL sind Kennungen, keine Geheimnisse.
        # Sie gehoeren in die Konfiguration, damit ein spaeteres Deployment
        # reproduzierbar dasselbe trifft.
        run: |
          if git diff --quiet -- workers/vision-universe-social/wrangler.toml; then
            echo "Keine Aenderung an wrangler.toml."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workers/vision-universe-social/wrangler.toml
          git commit \
            -m "Cloudflare: KV-Namespace und oeffentliche Worker-URL eingetragen" \
            -m "Erzeugt vom Workflow social-cloudflare (action=deploy). Beides sind Kennungen und keine Geheimnisse: die Namespace-ID ist ohne API-Token wertlos, die URL ist ein oeffentlicher Hostname. In der Konfiguration stehen sie, damit ein spaeteres Deployment reproduzierbar dasselbe trifft."
          git push

      # ----------------------------------------------------------------
      # VERIFY — was ist jetzt tatsaechlich da
      # ----------------------------------------------------------------

      - name: Zustand pruefen
        if: steps.mode.outputs.deploy == 'true' || steps.mode.outputs.verify == 'true'
        run: |
          node scripts/social/verify-worker.mjs --out /tmp/cf-verify | tee /tmp/verify.log
          {
            echo "## Worker-Zustand"
            echo '```'
            cat /tmp/verify.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verifikationsbericht sichern
        if: steps.mode.outputs.deploy == 'true' || steps.mode.outputs.verify == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: worker-verify
          path: /tmp/cf-verify/worker-verify.json
          retention-days: 30

      - name: Zusammenfassung
        if: always()
        run: |
          {
            echo ""
            echo "---"
            echo "Aktion: \`${{ inputs.action || 'preflight (Push-Lauf)' }}\` · Preflight: \`${{ steps.preflight.outputs.verdict }}\`"
            echo ""
            echo "Es wurde **kein Beitrag veroeffentlicht** und **kein Meta-Login ausgefuehrt**."
            echo "Der Worker hat keinen Publishing-Endpunkt."
          } >> "$GITHUB_STEP_SUMMARY"
