name: Tiingo final coverage and historical proof (read-only)
on:
  push:
    branches: [codex/tiingo-deep-audit-20261002]
    paths:
      - '.github/workflows/tiingo-deep-audit-final.yml'
      - 'audits/tiingo-2026-10-02/runtime/final/requests/probes.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tiingo-deep-audit-read-only
  cancel-in-progress: false
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Collect additional probes without repeating primary evidence
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
        run: |
          python - <<'PY'
          import importlib.util, os
          from pathlib import Path
          path = Path('audits/tiingo-2026-10-02/runtime/probe.py')
          spec = importlib.util.spec_from_file_location('tiingo_audit', path)
          probe = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(probe)
          probe.AUDIT = path.parent / 'final'
          probe.collect(Path(os.environ['RUNNER_TEMP']) / 'tiingo-final', max_requests=100)
          PY
      - name: Ensure tracked production baseline remains untouched
        run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tiingo-deep-final-evidence
          path: ${{ runner.temp }}/tiingo-final/account_evidence.json
          retention-days: 30
          if-no-files-found: error
