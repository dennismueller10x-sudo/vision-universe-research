name: Vorsorge ETF-Primaerquellen (Probe, SEC N-PORT, ESMA FIRDS)

# Offizielle ETF-Quellen fuer Vision Universe Vorsorge.
#
# AUSLOESUNG (Push auf claude/** mit Marker in der Commit-Nachricht, oder workflow_dispatch)
#   [vorsorge-etf-probe]   Nutzungsbedingungen der Emittenten + Form der offenen Quellen
#   [vorsorge-eu-probe]    EU-Quellen: ESMA FITRS/Fondsregister, Xetra-Listen, BaFin, CBI, EZB,
#                          Tiingo-Boersenabdeckung - nur Form und Bedingungen
#   [vorsorge-nport]       SEC N-PORT (Quartals-Datasets, gemeinfrei): US-ETF-Holdings,
#                          Fondsvermoegen, Historie
#   [vorsorge-fundamentals] SEC Risk/Return (Kostenquoten) und ESMA FIRDS (Wiederverwendung
#                          mit Quellenangabe): europaeische Listings, ISIN, Handelsplatz, CFI
# Ohne Marker laeuft nichts. Der Push muss einen der unter paths genannten Pfade
# beruehren. nport und fundamentals bauen beide den ETF-Stamm neu: nacheinander ausloesen.
# Abbrechen ist kein Rueckgaengigmachen: ein Lauf, der schon im Push-Schritt ist, schreibt
# trotzdem (gesehen 05.10.2026, Lauf 37281536857). Ein Lauf checkt den Branch-Kopf bei Start aus;
# landet danach ein anderer Datencommit, scheitert sein Push an Konflikten in vorsorge/data
# (push-with-retry loest nur Quant-Artefakte auf). Dann abbrechen und neu starten (Re-run),
# der neue Versuch baut auf dem aktuellen Kopf auf.
#
# Emittenten-Datenendpunkte werden NICHT abgerufen (Bedingungen, siehe
# docs/ETF_PRIMARY_SOURCE_MATRIX.md).

on:
  workflow_dispatch:
    inputs:
      job:
        description: 'probe | euprobe | nport | fundamentals'
        default: 'probe'
  push:
    branches:
      - 'claude/**'
    paths:
      - 'scripts/vorsorge/**'
      - 'vorsorge/engines/**'
      - '.github/workflows/vorsorge-etf-sources.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: vorsorge-etf-sources-${{ github.ref_name }}
      cancel-in-progress: false
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'probe') ||
      contains(github.event.head_commit.message, '[vorsorge-etf-probe]')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Quellen pruefen
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || 'VisionUniverseResearch info@visionuniverse.de' }}
        run: node scripts/vorsorge/probe-etf-sources.mjs
      - name: Veroeffentlichen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vorsorge/data/sources/etf-source-probe.json
          git commit -q -m "Vorsorge: ETF-Quellen geprueft (Lauf ${{ github.run_id }})" || { echo "Keine Aenderung."; exit 0; }
          bash scripts/ci/push-with-retry.sh "${{ github.ref_name }}"

  euprobe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: vorsorge-etf-sources-${{ github.ref_name }}
      cancel-in-progress: false
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'euprobe') ||
      contains(github.event.head_commit.message, '[vorsorge-eu-probe]')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: EU-Quellen pruefen (Form, Kopfzeilen, Nutzungsbedingungen)
        run: node scripts/vorsorge/probe-eu-etf-sources.mjs
      - name: Veroeffentlichen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vorsorge/data/sources/etf-eu-source-probe.json
          git commit -q -m "Vorsorge: EU-ETF-Quellen geprueft (Lauf ${{ github.run_id }})" || { echo "Keine Aenderung."; exit 0; }
          bash scripts/ci/push-with-retry.sh "${{ github.ref_name }}"

  nport:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: vorsorge-etf-master-${{ github.ref_name }}   # gemeinsam mit fundamentals: beide schreiben den ETF-Stamm
      cancel-in-progress: false
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'nport') ||
      contains(github.event.head_commit.message, '[vorsorge-nport]')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: SEC N-PORT (vier Quartale) aufnehmen
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || 'VisionUniverseResearch info@visionuniverse.de' }}
          NODE_OPTIONS: --max-old-space-size=6144
        run: node scripts/vorsorge/ingest-sec-nport.mjs --max-quarters 4
      - name: SEC SIC-Codes (Wirtschaftszweig der Emittenten)
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || 'VisionUniverseResearch info@visionuniverse.de' }}
        run: node scripts/vorsorge/fetch-sec-sic.mjs
      - name: Holdings, Exposures, Change Events verdichten
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          node scripts/vorsorge/build-etf-intelligence.mjs
          node -e 'const m=require("./.market-cache/vorsorge/nport/nport-manifest.json"); delete m.series; require("fs").writeFileSync("vorsorge/data/sources/nport-manifest.json", JSON.stringify(m,null,1)+"\n")'
      - name: ETF-Stamm mit den neuen Daten neu bauen
        run: node scripts/vorsorge/build-etf-data.mjs --quiet
      - name: Tests und Hygiene
        run: |
          node --test "vorsorge/tests/*.test.mjs"
          node scripts/vorsorge/assert-vorsorge-data.mjs
          node scripts/market/assert-public-data-hygiene.mjs
      - name: Veroeffentlichen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vorsorge/data vorsorge/etf vorsorge/sitemap.xml
          git commit -q -m "Vorsorge: US-ETF-Holdings aus SEC N-PORT (Lauf ${{ github.run_id }})" || { echo "Keine Aenderung."; exit 0; }
          bash scripts/ci/push-with-retry.sh "${{ github.ref_name }}"

  fundamentals:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: vorsorge-etf-master-${{ github.ref_name }}   # gemeinsam mit nport, nie parallel
      cancel-in-progress: false
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'fundamentals') ||
      contains(github.event.head_commit.message, '[vorsorge-fundamentals]')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: SEC Risk/Return (Kostenquoten aus Prospekten)
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || 'VisionUniverseResearch info@visionuniverse.de' }}
          NODE_OPTIONS: --max-old-space-size=6144
        run: node scripts/vorsorge/ingest-sec-rr.mjs --max-quarters 6
      - name: ESMA FIRDS + GLEIF (europaeische ETF-Anteilklassen und Listings)
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: node scripts/vorsorge/ingest-esma-firds.mjs
      - name: ESMA-Fondsregister (amtlicher UCITS-Status, Verwalter, Vertriebslaender)
        run: node scripts/vorsorge/ingest-esma-funds.mjs
      - name: ETF-Stamm mit den neuen Daten neu bauen, Gates, Hygiene
        run: |
          node scripts/vorsorge/build-etf-data.mjs --quiet
          node scripts/vorsorge/assert-vorsorge-data.mjs
          node scripts/market/assert-public-data-hygiene.mjs
      - name: Veroeffentlichen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vorsorge/data vorsorge/etf vorsorge/sitemap.xml
          git commit -q -m "Vorsorge: Kostenquoten (SEC RR) und europaeische ETF-Listings (ESMA FIRDS, GLEIF) (Lauf ${{ github.run_id }})" || { echo "Keine Aenderung."; exit 0; }
          bash scripts/ci/push-with-retry.sh "${{ github.ref_name }}"
