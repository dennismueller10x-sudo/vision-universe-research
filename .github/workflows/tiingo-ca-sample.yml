name: Tiingo CA Stichprobe (einmalig, nicht fuer main)

# Gezielte Stichprobe Corporate Actions (Eigentuemerfreigabe 04.11.2026:
# hoechstens 20 Anfragen insgesamt, 3 verbraucht in Lauf 41780055920,
# hier hoechstens 17, fest im Code). Ohne Wiederholung, Zeitlimit je Anfrage,
# Abbruch bei 401/402/403/429. Laeuft nur auf diesem Branch und genau einmal:
# der Waechter bricht ab, bevor der Schluessel gelesen wird, wenn es schon
# einen anderen Lauf dieses Workflows gibt oder der Lauf eine Wiederholung ist.
# Ausgabe nur abgeleitet; keine Rohantwort, kein Commit, kein Artefakt.
# Dieser Workflow darf nicht auf main landen.

on:
  push:
    branches:
      - 'claude/tiingo-ca-probe'
    paths:
      - '.github/workflows/tiingo-ca-sample.yml'
      - 'scripts/research/tiingo-ca-sample.mjs'

permissions:
  contents: read
  actions: read

concurrency:
  group: tiingo-ca-sample-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  sample:
    if: github.event_name == 'push' && github.ref == 'refs/heads/claude/tiingo-ca-probe'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Waechter genau einmal
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          if [ "$RUN_ATTEMPT" != "1" ]; then echo "ABBRUCH: Wiederholungslauf"; exit 1; fi
          ids=$(gh api "repos/$REPO/actions/runs?branch=claude/tiingo-ca-probe&per_page=100" \
            --jq '[.workflow_runs[] | select(.path == ".github/workflows/tiingo-ca-sample.yml") | .id] | map(tostring) | join(",")')
          echo "Laeufe dieses Workflows: ${ids:-keine}"
          if [ "$ids" != "$RUN_ID" ]; then echo "ABBRUCH: nicht der einzige Lauf"; exit 1; fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/research/tiingo-ca-sample.mjs
            docs/quant-recovery/v10/corporate-actions/verdicts.json
            docs/quant-recovery/v10/corporate-actions/provider-errors.json
            quant/data/market/discover-series-long/ref_GCTK.json
            quant/data/market/discover-series-long/ref_GOVX.json
            quant/data/market/discover-series-long/ref_INBS.json
            quant/data/market/discover-series-long/ref_INO.json
            quant/data/market/discover-series-long/ref_MNPR.json
            quant/data/market/discover-series-long/ref_MTVA.json
            quant/data/market/discover-series-long/ref_ZONE.json
            quant/data/market/discover-series-long/ref_PZZA.json
            quant/data/market/discover-series-long/ref_ATYR.json
            quant/data/market/discover-series-long/ref_OMEX.json
            quant/data/market/discover-series-long/ref_ATLX.json
            quant/data/market/discover-series-long/ref_POCI.json
            quant/data/market/discover-series-long/ref_ABVC.json
            quant/data/market/discover-series-long/ref_WKSP.json
            quant/data/market/discover-series-long/ref_SCNX.json
            quant/data/market/discover-series-long/ref_PED.json
            quant/data/market/discover-series-long/ref_TXMD.json

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Stichprobe (hoechstens 17 Anfragen, nur abgeleitete Ausgabe)
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          SAMPLE_ALLOW_RUN: once
        run: node scripts/research/tiingo-ca-sample.mjs --root "$GITHUB_WORKSPACE"
