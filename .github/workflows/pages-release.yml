name: Quant 2.0 Production Pages
on:
  pull_request:
    paths:
      - 'vu2/**'
      - 'quant/**'
      - 'scripts/vu2/**'
      - 'scripts/access-gate/**'
      - '.github/workflows/pages-release.yml'
  push:
    branches: [main]
  # DIE LUECKE, DIE DIE SEITE EINFRIEREN LIESS
  #
  # Ein Push mit dem GITHUB_TOKEN loest keinen neuen Workflow-Lauf aus -
  # so verhindert GitHub Rekursion. Genau damit pushen aber die
  # Datenlaeufe. Ergebnis am 18.09.2026: 44 Bot-Commits auf main seit
  # dem Vortag, kein einziger Pages-Lauf dazu. Die ausgelieferte Seite
  # zeigte um 14:10 UTC noch die Intraday-Snapshots von 09:35, waehrend
  # in main die von 10:05 lagen - und an vier von fuenf Titeln stand
  # "Stand Do., 17.09. - nicht aktuell", obwohl der Strom lief.
  #
  # workflow_run ist kein Push und faellt nicht unter die Regel: es
  # feuert, wenn der genannte Lauf fertig ist, gleich wer ihn gestartet
  # hat. Damit erreicht jeder veroeffentlichte Datenstand auch die Seite.
  workflow_run:
    workflows:
      - "Intraday-Snapshots (Discover-Umfang waehrend der Sitzung, Universum nach Schluss)"
      - "Marktdaten-Refresh (Produktuniversum, Tageskurse + Faktoren + Discover)"
      - "SEC Consumer-Fundamentals (Produktuniversum, Bulk companyfacts)"
      # Der Taktgeber - aber er hilft hier nur am Blockende, und das ist
      # der Punkt: workflow_run feuert bei COMPLETED. Ein Block, der den
      # Takt fuenf Stunden haelt, ist fuenf Stunden lang nicht completed.
      # Der Eintrag steht trotzdem hier, damit der letzte Stand eines
      # Blocks sicher ausgeliefert wird.
      - "Intraday-Taktgeber (ein Lauf haelt den Takt)"
      # Multi-Asset-Segment des Data Core: Renditen, Leitzinsen, Rohstoffe
      # erscheinen auch am Wochenende und ausserhalb der US-Sitzung.
      - "Multi-Asset Data Core — Faehigkeiten und Daten"
      # Neue Titel bekommen ihr Logo nach dem Marktdaten-Refresh; der
      # Logo-Lauf pusht mit dem GITHUB_TOKEN und loest sonst nichts aus.
      - "Firmenlogos (Wikimedia Commons und Firmen-Websites fuer Discover)"
      # Plattform-Audit 03.10.2026: diese Datenlaeufe pushen ebenfalls mit
      # dem GITHUB_TOKEN und kamen bisher erst mit der naechsten Bruecke
      # (Mo-Fr 13-21 UTC) auf die Seite - Samstagslaeufe (Supertrader-
      # Signale, Index-Mitgliedschaft, lange Reihen) also erst am Montag.
      - "Supertrader Signale"
      - "SEC Fundamentals — Daily Incremental"
      - "Index-Mitgliedschaft (S&P 500, NASDAQ-100, Dow Jones aus Fondsbestaenden)"
      - "Lange Kursreihen (Wochenschluss fuer 5J und Max aus der Historienablage)"
      - "Company Master — Universum, Suchindex, CIK"
      - "Company-Namen (kanonische Namensschicht zum Company Master)"
      - "Kanonische Deckungskennzahlen (R2-Index, Company Master, Abgleich)"
      - "Quant 2.0 Product Intelligence Materialization"
      - "Update VISION UNIVERSE news"
      - "Update VISION UNIVERSE analyst ratings"
      - "Update Hedgefonds 13F data"
      - "Build VISION UNIVERSE Morning"
      # Die Startseite setzt nach den Datenlaeufen ihre Abbildungswerte neu ein
      # und pusht mit dem GITHUB_TOKEN.
      - "Startseite: Werte der Produktabbildungen"
    types: [completed]
    branches: [main]

  # DIE BRUECKE, SOLANGE DER EXTERNE WECKER FEHLT
  #
  # Am 21.09.2026 stellte sich heraus: der Taktgeber schreibt zwar alle
  # fuenf Minuten einen frischen Stand nach main, aber NICHTS lieferte
  # ihn aus. Push mit GITHUB_TOKEN loest keinen Lauf aus (siehe oben),
  # und workflow_run wartet auf das Blockende. Der erste Waechterlauf
  # hat genau das gemessen: "Die Auslieferung ist 40 min hinter dem
  # Repository."
  #
  # Die saubere Loesung ist ein Zyklus = ein Workflow-Lauf, geweckt von
  # aussen (worker-waker/). Die braucht ein GitHub-Token mit
  # actions:write als Cloudflare-Secret - eine Owner-Entscheidung.
  #
  # Bis dahin diese Bruecke. Sie ist ausdruecklich ein Zeitplan und
  # teilt damit den Failure Mode, der den Vorfall ausgeloest hat - aber
  # sie ist ein ANDERER Workflow als der Taktgeber, faellt also
  # unabhaengig aus. Ein verpasster Takt kostet hier fuenf Minuten
  # Auslieferung, nicht eine Stunde Datenstillstand. Ein Lauf dauert
  # rund 97 Sekunden; das Repository ist oeffentlich, Actions-Minuten
  # sind unbegrenzt.
  #
  # Warum die AUSLIEFERUNG schneller wird und nicht der Abruf:
  # verify-request-limits.mjs hat am 21.09.2026 erneut UNKNOWN /
  # PROVIDER_CONFIRMATION_REQUIRED ergeben - Tiingo nennt sein
  # Kontingent weder in einem Kontoendpunkt noch in Antwortkoepfen.
  # Belegt ist allein eine Untergrenze von 5.000 Anfragen je Stunde
  # ohne Ablehnung. Die 527 Titel brauchen damit 5:01, und §7 des
  # Auftrags verbietet, die Drossel ohne Beleg zu lockern.
  schedule:
    - cron: '*/5 13-21 * * 1-5'

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# PR-Laeufe bekommen eine eigene Gruppe je PR. Die gemeinsame Gruppe
# 'pages-production' bleibt den Laeufen vorbehalten, die sie brauchen (main,
# Zeitplan, Dispatch). Vorher konnte ein wartender PR-Lauf einen
# wartenden Lauf dieser Gruppe verdraengen (Audit 03.10.2026).
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-production-pr-{0}', github.event.pull_request.number) || 'pages-production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Ein gescheiterter Datenlauf hat nichts veroeffentlicht (siehe
    # scripts/ci/push-with-retry.sh). Dann gibt es auch nichts zu bauen.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          # Bei workflow_run zeigt github.sha auf den Commit, auf dem der
          # Datenlauf STARTETE - nicht auf den, den er erzeugt hat. Der
          # frische Stand ist der Kopf von main.
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned release compiler
        run: npm install --prefix /tmp/vu2-release esbuild@0.25.10
      - name: Build static product delivery
        run: node scripts/vu2/build-release.mjs --output="$RUNNER_TEMP/site"
      - name: Compact the reviewed browser bundle
        run: /tmp/vu2-release/node_modules/.bin/esbuild "$RUNNER_TEMP/site/quant/release-bundle.js" --minify-whitespace --charset=utf8 --legal-comments=inline --tree-shaking=false --allow-overwrite --outfile="$RUNNER_TEMP/site/quant/release-bundle.js"
      # Gegen das GEBAUTE Release, nicht gegen den Quelltext. Der
      # Unterschied ist real: dort laeuft die Seite als ein gebuendeltes
      # Skript, die Artefakte liegen unter ihren Auslieferungspfaden, und
      # .gz wird undurchsichtig ausgeliefert - der Browser entpackt es
      # NICHT transparent. Ein Smoke gegen das Repository pruefte einen
      # Pfad, den es in Produktion nicht gibt.
      - name: Production smoke over the built release
        env:
          SITE_ROOT: ${{ runner.temp }}/site
        run: |
          npm install --prefix /tmp/vu2-smoke playwright@1.55.0
          # executablePath() liefert den ERWARTETEN Pfad und prueft nicht, ob
          # die Datei existiert - als Bedingung war die Installation damit
          # immer uebersprungen und der Start scheiterte am fehlenden
          # headless_shell. Deshalb wie in allen anderen Workflows dieses
          # Repositories: unbedingt installieren, mit der gepinnten CLI.
          /tmp/vu2-smoke/node_modules/.bin/playwright install --with-deps chromium
          NODE_PATH=/tmp/vu2-smoke/node_modules node scripts/vu2/production-smoke.mjs "$SITE_ROOT"

      - name: Enforce delivery contract
        env:
          EVENT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          SITE_ROOT: ${{ runner.temp }}/site
          GH_TOKEN: ${{ github.token }}
        run: |
          # Gebaut wird, was ausgecheckt ist - und bei allem ausser
          # workflow_run muss das der Commit des Ereignisses sein ODER ein
          # neuerer Kopf, der ihn enthaelt. Die Gruppe pages-production haelt
          # einen laufenden und EINEN wartenden Lauf; ein spaet gestarteter
          # Lauf checkt den Kopf aus, der nach seinem Ereignis kam. Vorher
          # brach er dann ab, und weil die Laeufe der neueren Commits schon
          # verdraengt waren, blieb der Kopf unausgeliefert (05.10.2026,
          # Lauf 37246080180). Ein Kopf, der das Ereignis NICHT enthaelt,
          # bricht weiter ab.
          HEAD_SHA=$(git rev-parse HEAD)
          if [ "$EVENT_NAME" != "workflow_run" ] && [ "$HEAD_SHA" != "$EVENT_SHA" ]; then
            STATUS=$(gh api "repos/$GITHUB_REPOSITORY/compare/$EVENT_SHA...$HEAD_SHA" --jq .status || echo unbekannt)
            if [ "$STATUS" != "ahead" ]; then
              echo "CHECKOUT_COMMIT_MISMATCH: $HEAD_SHA != $EVENT_SHA (Vergleich: $STATUS)" >&2
              exit 1
            fi
            echo "Kopf $HEAD_SHA enthaelt das Ereignis $EVENT_SHA - ausgeliefert wird der Kopf."
          fi
          export EXPECTED_COMMIT="$HEAD_SHA"
          echo "Ausgeliefert wird $HEAD_SHA (Ereignis: $EVENT_NAME)."
          node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises';
          const report=JSON.parse(await readFile(process.env.SITE_ROOT+'/release-delivery.json','utf8'));
          if(report.sourceCommit!==process.env.EXPECTED_COMMIT) throw Error('RELEASE_COMMIT_MISMATCH');
          if(report.status!=='PASS'||report.secBytes>report.secBudget||report.secBudget!==8*1024*1024) throw Error('SEC_DELIVERY_BUDGET_FAILED');
          if(report.storage!=='EXISTING_R2_UNCHANGED') throw Error('CANONICAL_STORAGE_CHANGED');
          NODE
          test ! -d "$SITE_ROOT/quant/data/sec/canonical"
          test ! -d "$SITE_ROOT/quant/data/sec/consumer"
          test ! -d "$SITE_ROOT/quant/data/fundamentals"
          # /quant/ ist das kanonische Produkt (gebuendelt), /vu2/ und /Quant/
          # sind genau EIN Sprung dorthin - keine Umleitungskette.
          grep -F '/quant/release-bundle.js?v=' "$SITE_ROOT/quant/index.html"
          ! grep -F 'location.replace' "$SITE_ROOT/quant/index.html"
          grep -F 'location.replace("/quant/"+location.search+location.hash)' "$SITE_ROOT/vu2/index.html"
          cmp "$SITE_ROOT/vu2/index.html" "$SITE_ROOT/Quant/index.html"
      - name: Add central client-side Research access gate to every HTML route
        env:
          RESEARCH_ACCESS_PASSWORD: ${{ secrets.RESEARCH_ACCESS_PASSWORD }}
          SITE_ROOT: ${{ runner.temp }}/site
        run: |
          node --input-type=module <<'NODE'
          import {randomBytes} from 'node:crypto';
          import {writeFileSync} from 'node:fs';
          import {protectRelease} from './scripts/access-gate/build.mjs';
          // PR validation uses a disposable password; production has no fallback.
          const password = process.env.GITHUB_EVENT_NAME === 'pull_request'
            ? randomBytes(32).toString('hex') : process.env.RESEARCH_ACCESS_PASSWORD;
          // The smoke below needs the same password to log in (gate v2); kept in
          // the runner temp directory only, outside the uploaded site.
          writeFileSync(process.env.RUNNER_TEMP + '/research-access.pass', password || '', {mode: 0o600});
          console.log(JSON.stringify(await protectRelease({output: process.env.SITE_ROOT, password})));
          NODE
      - name: Production smoke through the final access-gated release
        env:
          NODE_PATH: /tmp/vu2-smoke/node_modules
          SITE_ROOT: ${{ runner.temp }}/site
          RESEARCH_ACCESS_LOGIN_FILE: ${{ runner.temp }}/research-access.pass
        run: |
          set +e
          node scripts/vu2/production-smoke.mjs "$SITE_ROOT" --access-gate
          rc=$?
          rm -f "$RESEARCH_ACCESS_LOGIN_FILE"
          exit $rc
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

  deploy:
    if: github.event_name != 'pull_request'
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy reviewed release artifact
        id: deployment
        uses: actions/deploy-pages@v4
