name: Quant 2.0 Production Pages
on:
  pull_request:
    paths:
      - 'vu2/**'
      - 'quant/**'
      - 'scripts/vu2/**'
      - '.github/workflows/pages-release.yml'
  push:
    branches: [main]
  # DIE LUECKE, DIE DIE SEITE EINFRIEREN LIESS
  #
  # Ein Push mit dem GITHUB_TOKEN loest keinen neuen Workflow-Lauf aus -
  # so verhindert GitHub Rekursion. Genau damit pushen aber die
  # Datenlaeufe. Ergebnis am 18.09.2026: 44 Bot-Commits auf main seit
  # dem Vortag, kein einziger Pages-Lauf dazu. Die ausgelieferte Seite
  # zeigte um 14:10 UTC noch die Intraday-Snapshots von 09:35, waehrend
  # in main die von 10:05 lagen - und an vier von fuenf Titeln stand
  # "Stand Do., 17.09. - nicht aktuell", obwohl der Strom lief.
  #
  # workflow_run ist kein Push und faellt nicht unter die Regel: es
  # feuert, wenn der genannte Lauf fertig ist, gleich wer ihn gestartet
  # hat. Damit erreicht jeder veroeffentlichte Datenstand auch die Seite.
  workflow_run:
    workflows:
      - "Intraday-Snapshots (Discover-Umfang waehrend der Sitzung, Universum nach Schluss)"
      - "Marktdaten-Refresh (Produktuniversum, Tageskurse + Faktoren + Discover)"
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Ein gescheiterter Datenlauf hat nichts veroeffentlicht (siehe
    # scripts/ci/push-with-retry.sh). Dann gibt es auch nichts zu bauen.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          # Bei workflow_run zeigt github.sha auf den Commit, auf dem der
          # Datenlauf STARTETE - nicht auf den, den er erzeugt hat. Der
          # frische Stand ist der Kopf von main.
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned release compiler
        run: npm install --prefix /tmp/vu2-release esbuild@0.25.10
      - name: Build static product delivery
        run: node scripts/vu2/build-release.mjs --output="$RUNNER_TEMP/site"
      - name: Compact the reviewed browser bundle
        run: /tmp/vu2-release/node_modules/.bin/esbuild "$RUNNER_TEMP/site/vu2/release-bundle.js" --minify-whitespace --charset=utf8 --legal-comments=inline --tree-shaking=false --allow-overwrite --outfile="$RUNNER_TEMP/site/vu2/release-bundle.js"
      - name: Enforce delivery contract
        env:
          EVENT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          SITE_ROOT: ${{ runner.temp }}/site
        run: |
          # Gebaut wird, was ausgecheckt ist - und bei allem ausser
          # workflow_run muss das der Commit des Ereignisses sein.
          HEAD_SHA=$(git rev-parse HEAD)
          if [ "$EVENT_NAME" != "workflow_run" ] && [ "$HEAD_SHA" != "$EVENT_SHA" ]; then
            echo "CHECKOUT_COMMIT_MISMATCH: $HEAD_SHA != $EVENT_SHA" >&2
            exit 1
          fi
          export EXPECTED_COMMIT="$HEAD_SHA"
          echo "Ausgeliefert wird $HEAD_SHA (Ereignis: $EVENT_NAME)."
          node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises';
          const report=JSON.parse(await readFile(process.env.SITE_ROOT+'/release-delivery.json','utf8'));
          if(report.sourceCommit!==process.env.EXPECTED_COMMIT) throw Error('RELEASE_COMMIT_MISMATCH');
          if(report.status!=='PASS'||report.secBytes>report.secBudget||report.secBudget!==8*1024*1024) throw Error('SEC_DELIVERY_BUDGET_FAILED');
          if(report.storage!=='EXISTING_R2_UNCHANGED') throw Error('CANONICAL_STORAGE_CHANGED');
          NODE
          test ! -d "$SITE_ROOT/quant/data/sec/canonical"
          test ! -d "$SITE_ROOT/quant/data/sec/consumer"
          test ! -d "$SITE_ROOT/quant/data/fundamentals"
          grep -F 'location.replace("/vu2/"' "$SITE_ROOT/quant/index.html"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

  deploy:
    if: github.event_name != 'pull_request'
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy reviewed release artifact
        id: deployment
        uses: actions/deploy-pages@v4
