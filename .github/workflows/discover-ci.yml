name: Discover CI

# Prueft das Discover-Modul: Engine-Logik, den Discover-Contract und die
# Uebereinstimmung zwischen den ausgelieferten Payloads und den Engines.
# Bewusst ein eigener Workflow neben quant-ci.yml: Discover erweitert das
# bestehende System, es veraendert es nicht - und das soll auch fuer die
# Pruefung gelten.

on:
  push:
    branches: [main]
    paths: ['discover/**', 'scripts/discover/**', '.github/workflows/discover-ci.yml']
  pull_request:
    paths: ['discover/**', 'scripts/discover/**', '.github/workflows/discover-ci.yml']
  workflow_dispatch:

# Nur lesen: reine Pruef-Workflows brauchen kein Schreibrecht (Audit 03.10.2026).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Zwei Commits: im pull_request-Ereignis ist HEAD der Merge-Commit,
          # HEAD^1 die aktuelle Basis. Damit sieht das Modul-Gate den PR-Diff
          # ohne Vollclone.
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Engine- und Contract-Tests
        run: node --test "discover/tests/*.test.mjs"

      - name: Ausgelieferte Daten stimmen mit den Engines ueberein
        run: node scripts/discover/verify-discover-data.mjs

      - name: Der Build ist reproduzierbar
        # Derselbe Eingabestand muss denselben Ausgabestand ergeben. Weicht
        # er ab, ist irgendwo eine Uhrzeit oder eine Zufallszahl in die
        # Rechnung geraten - und dann ist kein Vergleich zweier Staende mehr
        # aussagekraeftig. generatedAt ist die eine erlaubte Ausnahme.
        run: |
          node scripts/discover/build-discover-data.mjs > /dev/null
          git diff --stat -- discover/data > /tmp/discover-drift.txt || true
          changed=$(git diff --name-only -- discover/data | grep -v 'discover/data/meta.json' | wc -l)
          if [ "$changed" -gt 0 ]; then
            echo "Der Neubau ergibt andere Daten als der eingecheckte Stand:"
            cat /tmp/discover-drift.txt
            exit 1
          fi
          echo "Build reproduzierbar (nur meta.json traegt einen Zeitstempel)."

      - name: Discover-Seite bindet die gemeinsame Shell und die Navigation ein
        run: |
          page=discover/index.html
          grep -q '/quant/ui/shell.js' "$page" || { echo "$page ohne quant/ui/shell.js"; exit 1; }
          grep -q 'vu-navigation' "$page" || { echo "$page ohne Vision-Universe-Navigation"; exit 1; }
          grep -q 'site-navigation.css' "$page" || { echo "$page ohne Navigations-Stylesheet"; exit 1; }
          echo "Seite geprueft"

      - name: Gated Company Intelligence Stock-Hooks sind strikt additiv
        id: intelligence_scope
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git rev-parse --verify --quiet HEAD^2 >/dev/null || { echo "::error::HEAD ist kein PR-Merge-Commit"; exit 1; }
          scope="quant providers scripts/quant scripts/technical scripts/market dashboard macro academy"
          nachweise=":(exclude)quant/tests/currency-fx-matrix.test.mjs :(exclude)quant/config/currency-formatting-baseline.json :(exclude)quant/data/market/fx/currency-debt-register.json"
          geaendert=$(git diff --name-only HEAD^1 HEAD -- $scope $nachweise)
          if [ -n "$geaendert" ] && [ -f scripts/company_intelligence/check-quant-integration.mjs ]; then
            unerwartet=$(node scripts/company_intelligence/check-quant-integration.mjs HEAD^1 HEAD $geaendert)
            if [ -z "$unerwartet" ]; then
              echo "exact_stock_hooks=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Discover veraendert keine bestehende Engine
        # Der Kern des Auftrags: EXTEND, DO NOT MODIFY. Was ausserhalb von
        # discover/ und scripts/discover/ liegt, darf dieser Bereich nicht
        # anfassen - mit Ausnahme des einen Navigationseintrags.
        if: github.event_name == 'pull_request' && steps.intelligence_scope.outputs.exact_stock_hooks != 'true'
        # Ausgenommen sind allein die Currency-Nachweise, die Discover-
        # Dateipfade namentlich fuehren (Testmatrix, Formatierungs-Grundlinie,
        # Debt Register): verschiebt Discover eine Datei, muessen sie den
        # neuen Pfad kennen, sonst waere der Nachweis gruen und unwahr.
        # Der Currency Core selbst (quant/engines/fx) bleibt geschuetzt.
        # Bis 10/2026 verglich der Schritt origin/<base>...HEAD in einem
        # flachen Checkout. Ohne gemeinsame Basis bricht git diff ab, wc -l
        # zaehlte 0 und das Gate war immer gruen. Jetzt: der Merge-Commit
        # gegen seinen ersten Elternteil, und ein Git-Fehler bricht ab.
        run: |
          set -euo pipefail
          git rev-parse --verify --quiet HEAD^2 >/dev/null || { echo "::error::HEAD ist kein PR-Merge-Commit"; exit 1; }
          scope="quant providers scripts/quant scripts/technical scripts/market dashboard macro academy"
          nachweise=":(exclude)quant/tests/currency-fx-matrix.test.mjs :(exclude)quant/config/currency-formatting-baseline.json :(exclude)quant/data/market/fx/currency-debt-register.json"
          geaendert=$(git diff --name-only HEAD^1 HEAD -- $scope $nachweise)
          if [ -n "$geaendert" ]; then
            echo "Discover veraendert Dateien ausserhalb seines Moduls:"
            echo "$geaendert"
            exit 1
          fi
          echo "Keine bestehende Engine veraendert."

      - name: JSON-Dateien sind gueltig
        run: |
          files=$(find discover -name '*.json')
          for file in $files; do
            node -e "JSON.parse(require('fs').readFileSync('$file','utf8'))" || exit 1
          done
          echo "$(echo "$files" | wc -l) JSON-Dateien geprueft"
