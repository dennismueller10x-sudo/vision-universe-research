name: Supertrader Production Smoke

# Prueft die AUSGELIEFERTE Seite research.visionuniverse.de/supertrader/:
# Routen erreichbar, Artefakte gueltig und frisch, Browser-QA ohne Fehler auf
# 390 px und 1280 px. Laeuft nach jeder Pages-Auslieferung (workflow_run),
# werktags nach dem ersten Release-Fenster und auf Zuruf.
on:
  workflow_run:
    workflows: ['Quant 2.0 Production Pages']
    types: [completed]
  schedule:
    - cron: '43 13 * * 1-5'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: supertrader-live-smoke
  cancel-in-progress: true
jobs:
  smoke:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SITE: https://research.visionuniverse.de
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Routen und Artefakte
        run: |
          set -euo pipefail
          for p in /supertrader/ /supertrader/signals/ /supertrader/strategies/ /supertrader/backtests/ /supertrader/sources/ /supertrader/stock/ \
                   /supertrader/strategies/greenblatt-value/ /supertrader/strategies/momentum-breakout/ /supertrader/strategies/weinstein-stages/ \
                   /supertrader/strategies/darvas-boxes/ /supertrader/strategies/minervini-vcp/ /supertrader/strategies/vu-trendfolge-52w/ /supertrader/strategies/donchian-turtle/ \
                   /supertrader/assets/supertrader.js /supertrader/assets/st-chart.js /supertrader/assets/supertrader.css; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$SITE$p")
            echo "$code $p"; test "$code" = 200
          done
          for f in registry signals backtests coverage market sources portfolio trend52; do
            curl -sf "$SITE/supertrader/data/$f.json" -o "/tmp/$f.json"
            node -e "JSON.parse(require('fs').readFileSync('/tmp/$f.json','utf8'))"
          done
          node -e '
            const s=require("/tmp/signals.json"), b=require("/tmp/backtests.json");
            const age=(Date.now()-new Date(s.asOf+"T21:00:00Z"))/864e5;
            console.log("Stand", s.asOf, "Alter Tage", age.toFixed(1), "Zaehler", JSON.stringify(s.counts));
            if (age > 6) throw new Error("Signalstand aelter als 6 Tage");
            for (const r of b.runs) if (!r.metricsPublishable && r.metrics !== null) throw new Error("Kennzahl ohne Gates: "+r.variantId);
            // Runde 12: Modelldepot VU Trendfolge 52W und Marktampel-Versionen live; keine Gesamtrendite/Kurve veroeffentlicht.
            const reg=require("/tmp/registry.json"), t=require("/tmp/trend52.json"), pf=require("/tmp/portfolio.json");
            const st=Object.fromEntries(reg.strategies.map((x)=>[x.strategy_id,x]));
            if (!st.VU_TREND_52W || st.VU_TREND_52W.mode!=="MODEL") throw new Error("VU_TREND_52W fehlt oder falscher Modus");
            if (t.schema!=="supertrader-trend52-1.0.0" || !t.market || !t.schedule || !t.portfolio || !t.prepared) throw new Error("trend52.json unvollstaendig");
            if (JSON.stringify(t).match(/"(totalReturn|cagr|equityCurve|excessCagr)"/)) throw new Error("trend52.json enthaelt Kennzahlen");
            if (s.strategies.DARVAS_BOX.version!=="3.0.2" || s.strategies.DONCHIAN_TURTLE.version!=="2.0.2" || s.strategies.WEINSTEIN_STAGE.version!=="4.0.0") throw new Error("R13-Versionen nicht live");
            if (!pf.strategies.DARVAS_BOX.config.marketFilter || pf.strategies.DONCHIAN_TURTLE.config.marketFilter) throw new Error("Marktampel im Modellportfolio falsch (Darvas an, Turtle aus)");
            console.log("VU Trendfolge 52W: Ampel", t.market.green, "Positionen", t.portfolio.used, "Rangliste", t.prepared.candidates.length, "naechste Entscheidung", t.schedule.nextDecision);'
          # Zugangsschranke ist laut docs/RESEARCH_ACCESS_GATE.md eine clientseitige
          # Entwicklungs-/Marketing-Maske, kein Zugriffsschutz: Originaldateien unter
          # /__research/content/ sind direkt abrufbar, bis eine serverseitige Sperre
          # (PR #328) existiert. Der Smoke weist den tatsaechlichen Zustand aus.
          if curl -sf "$SITE/__research/config.json" -o /dev/null; then
            dc=$(curl -s -o /dev/null -w '%{http_code}' "$SITE/__research/content/supertrader/index.html")
            echo "Zugangsmaske aktiv; Direktzugriff /__research/content/supertrader/: HTTP $dc (dokumentiert offen, nur serverseitig lösbar)"
            curl -s "$SITE/supertrader/" | grep -q 'noindex' && echo "Maske mit noindex ausgeliefert" || { echo "Maske ohne noindex"; exit 1; }
          fi
          curl -sf "$SITE/discover/" -o /dev/null && echo "Discovery erreichbar"
          curl -sf "$SITE/vu2/" -o /dev/null && echo "Quant 2.0 erreichbar"
      - name: Browser QA gegen Produktion
        env:
          RESEARCH_ACCESS_PASSWORD: ${{ secrets.RESEARCH_ACCESS_PASSWORD }}
        run: |
          npm install --prefix /tmp/st-qa --no-audit --no-fund playwright@1.56.1
          node /tmp/st-qa/node_modules/playwright/cli.js install --with-deps chromium
          mkdir -p /tmp/site/supertrader/data
          cp /tmp/signals.json /tmp/registry.json /tmp/site/supertrader/data/
          gate=""
          if curl -sf "$SITE/__research/config.json" -o /dev/null; then gate="--access-login"; echo "Research-Zugangsmaske aktiv - Login ueber das Formular"; fi
          node scripts/supertrader/browser-qa.mjs --base="$SITE" --site=/tmp/site --out=/tmp/supertrader-prod-evidence --playwright=/tmp/st-qa/node_modules/playwright $gate
      - name: Preserve screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supertrader-production-evidence
          path: /tmp/supertrader-prod-evidence
          if-no-files-found: ignore
          retention-days: 14
