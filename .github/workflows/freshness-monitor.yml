name: Freshness-Monitor (zeigt die Seite den letzten Handelstag?)

# Vorfall 15.09.2026: research.visionuniverse.de/discover zeigte
# "Letzter Handelstag · Freitag", obwohl der Montag laengst gehandelt war -
# und nichts hat es gemeldet. Dieser Workflow misst gegen die veroeffentlichte
# Seite, ob Intraday-Verzeichnis und Discover-Daten zur letzten abgeschlossenen
# regulaeren Sitzung passen (Freshness-Vertrag, quant/engines/realtime/
# freshness.js). Ist ein Bereich STALE, wird der Lauf rot - und GitHub
# benachrichtigt den Eigentuemer. Kein Abruf beim Anbieter, kein Schluessel,
# kein Commit.
#
# Zeitplan (UTC; die Karenzen sind so gewaehlt, dass Sommer- und Winterzeit
# beide passen):
#   06:30 Di-Sa   nach dem Abendlauf und der Nacht: liegt die Vortagssitzung
#                 vor (Intraday-Universum und Tagesschluss)?
#   15:15 Mo-Fr   45 Minuten nach 09:30 EST / 105 nach 09:30 EDT: laeuft der
#                 Intraday-Takt der laufenden Sitzung?
#   23:15 Mo-Fr   nach dem Abendlauf (22:30) plus Build und Auslieferung.
# Der Zeitplan laeuft nur auf dem Default-Branch; auf Entwicklungsbranches
# dient ein Push mit der Marke `[freshness-check]` als Ausloeser.

on:
  workflow_dispatch:
    inputs:
      site:
        description: 'Basis-URL der veroeffentlichten Seite'
        type: string
        default: 'https://research.visionuniverse.de'
  schedule:
    - cron: '30 6 * * 2-6'
    - cron: '5 14 * * 1-5'
    - cron: '15 15 * * 1-5'
    - cron: '15 23 * * 1-5'
    # Im Blick (Intraday): eigener Job `imblick`. Die Termine sind so gelegt,
    # dass jeder Slot in BEIDEN Lagen (Sommer 15/17/19/20:20 UTC, Winter
    # 16/18/20/21:20 UTC) irgendwann mindestens 90 Minuten alt ist, bevor der
    # naechste faellig wird: :45 von 16 bis 19 Uhr sieht I1 (Sommer 16:45,
    # Winter 17:45) und I2 (Sommer 18:45, Winter 19:45); 22:55 sieht den
    # Schlussslot (Sommer +155, Winter +95 Min.). Der Test
    # im-blick-refresh.test.mjs (RF15) rechnet das fuer jeden Handelstag des
    # Jahres nach. Die beiden anderen Jobs nehmen diese Termine nicht an.
    - cron: '45 16-19 * * 1-5'
    - cron: '55 22 * * 1-5'
  push:
    branches:
      - 'claude/**'

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && github.event.schedule != '45 16-19 * * 1-5' && github.event.schedule != '55 22 * * 1-5') ||
      contains(github.event.head_commit.message, '[freshness-check]')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Freshness gegen die veroeffentlichte Seite
        id: live
        continue-on-error: true
        env:
          # Eingaben nur ueber env: - nie direkt in das Skript interpoliert (Script-Injection, Audit 03.10.2026).
          IN_SITE: ${{ github.event_name == 'workflow_dispatch' && inputs.site || 'https://research.visionuniverse.de' }}
        run: |
          set -o pipefail
          SITE="$IN_SITE"
          node scripts/market/check-freshness.mjs --strict --site="$SITE" | tee freshness-live.txt

      - name: Freshness des Repository-Stands (zur Einordnung)
        run: node scripts/market/check-freshness.mjs | tee freshness-repo.txt

      - name: Zusammenfassung
        if: always()
        run: |
          {
            echo '### Freshness-Monitor'
            echo ''
            echo '#### Veroeffentlichte Seite'
            echo '```'; cat freshness-live.txt 2>/dev/null || echo "kein Ergebnis"; echo '```'
            echo '#### Repository'
            echo '```'; cat freshness-repo.txt 2>/dev/null || echo "kein Ergebnis"; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Befund fuer den Alarm sichern
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: freshness-befund
          path: freshness-*.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Ergebnis
        if: steps.live.outcome == 'failure'
        run: |
          echo "::error::Die veroeffentlichte Seite zeigt nicht den letzten Handelstag (siehe Zusammenfassung)."
          exit 1

  # ===================================================================
  # DAS SICHERHEITSNETZ: STEHT DER PRODUKTSTAND AUF DER LETZTEN SITZUNG?
  #
  # Der Job darueber fragt, ob die Seite den letzten Handelstag ZEIGT.
  # Dieser hier fragt etwas anderes, und die Luecke dazwischen hat vier
  # Tage lang niemand bemerkt: ob die Produkt-Artefakte, aus denen Quant
  # seine Aussagen baut, ueberhaupt materialisiert wurden.
  #
  # Am 29.09.2026 war der Marktlauf jede Nacht gruen, die Kurse frisch -
  # und der Faktor-Stichtag stand seit dem 25.09. Ein Waechter, der nur
  # auf die Farbe von Workflows sieht, haette das nie gefunden. Dieser
  # sieht auf den Stichtag im Artefakt.
  #
  # Gemessen wird gegen `main`, weil main die Quelle des Pages-Deploys
  # ist: was hier steht, wird ausgeliefert.
  #
  # KEIN FEHLALARM AM WOCHENENDE: der Rueckstand zaehlt Handelssitzungen
  # aus dem Boersenkalender, nicht Kalendertage. Samstagmittag ist der
  # Freitag die letzte abgeschlossene Sitzung, und der Rueckstand ist 0.
  #
  # UND KEIN FEHLALARM MITTEN IN DER KETTE. Der Slot `15 23 * * 1-5` liegt
  # im Laufzeitfenster der Kette, die dieser Job ueberwacht - er ist
  # deshalb ausgenommen. Gemessen an den echten planmaessigen Laeufen:
  #
  #   nominal 22:30 -> tatsaechlich gefeuert 22:40 bis 02:11 UTC
  #   (GitHub verzoegert geplante Laeufe um bis zu 3,5 Stunden)
  #   Refresh 90 min + Materialisierung 19 min + Vertrag 2 min
  #   => fertig typisch zwischen 02:00 und 04:00 UTC
  #
  # Um 23:15 hat die Kette meist nicht einmal begonnen. Der Job wuerde
  # jede Werktagsnacht P0_DATA_PIPELINE_FROZEN melden, waehrend alles in
  # Ordnung ist. Ein Waechter, der jede Nacht schreit, wird abgeschaltet -
  # und dann fehlt er, wenn es zaehlt. Dieselbe Begruendung wie beim
  # Wochenende, nur auf der Zeitachse eines Tages.
  #
  # Der Slot `30 6 * * 2-6` ist die eigentliche Pruefung nach der Kette:
  # rund drei Stunden Reserve nach dem spaetesten beobachteten Ende.
  # Der Job `monitor` behaelt 23:15 - er misst die veroeffentlichte Seite,
  # nicht den Produktstand, und haengt nicht an dieser Kette.
  #
  # quant/tests/pipeline-freshness-contract.test.mjs leitet diese Regel
  # aus den Cron-Zeilen her, statt sie nur zu behaupten: wer einen Slot
  # ins Laufzeitfenster legt, macht den Test rot.
  # ===================================================================
  produktstand:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && github.event.schedule != '15 23 * * 1-5' && github.event.schedule != '45 16-19 * * 1-5' && github.event.schedule != '55 22 * * 1-5') ||
      contains(github.event.head_commit.message, '[freshness-check]')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Stichtag der Produkt-Artefakte gegen die letzte Sitzung
        id: stand
        run: |
          set +e
          node scripts/quant/measure-pipeline-freshness.mjs --strict \
            --out="$RUNNER_TEMP/pipeline-freshness.json"
          echo "code=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Bericht
        if: always()
        run: |
          {
            echo '### Produktstand gegen die letzte abgeschlossene Sitzung'
            echo ''
            if [ -f "$RUNNER_TEMP/pipeline-freshness.json" ]; then
              node -e '
                const j = require(process.env.RUNNER_TEMP + "/pipeline-freshness.json");
                console.log("| Stufe | Stichtag | Rueckstand (Sitzungen) | Zustand |");
                console.log("|---|---|---|---|");
                console.log("| Letzte Sitzung | " + j.LATEST_MARKET_SESSION + " | - | - |");
                console.log("| Dauerhafte Ablage | " + (j.LATEST_DURABLE_STORE_ASOF ?? "-") + " | " + (j.STORE_LAG_SESSIONS ?? "?") + " | " + j.MARKET_STORE_CURRENT + " |");
                console.log("| Produkt | " + (j.LATEST_PRODUCT_ASOF ?? "-") + " | " + (j.PRODUCT_LAG_SESSIONS ?? "?") + " | " + j.PRODUCT_MATERIALIZATION_CURRENT + " |");
                console.log("");
                console.log("**QUANT_CURRENT = " + j.QUANT_CURRENT + "**");
                console.log("");
                console.log(j.headline);
              '
            else
              echo 'Kein Bericht erzeugt.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: P0, wenn der Produktstand eingefroren ist
        if: steps.stand.outputs.code != '0'
        run: |
          echo "::error::P0_DATA_PIPELINE_FROZEN - die Produkt-Artefakte tragen nicht die letzte abgeschlossene Handelssitzung."
          exit 1

  # ===================================================================
  # ALARM: VERALTETE DISCOVER-/MARKTDATEN BLEIBEN NICHT UNBEMERKT.
  #
  # Bis 10/2026 war das Ergebnis dieses Monitors ein roter Lauf in der
  # Actions-Liste. Discover stand trotzdem bis zu drei Sitzungen still.
  # Jetzt oeffnet ein roter Befund ein Issue (Label pipeline-alarm), das
  # offen bleibt, bis ein gruener Monitorlauf es schliesst.
  # ===================================================================
  alarm:
    needs: [monitor, produktstand]
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: freshness-befund
          path: ${{ runner.temp }}/befund
      - name: Alarm oeffnen, ergaenzen oder schliessen
        # Der Bote darf den Befund nicht veraendern: ein Zustellfehler macht
        # den Lauf nicht rot (pages-release verlangt conclusion == success).
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALARM_SOURCE: freshness-monitor
          ALARM_TITLE: 'Veroeffentlichte Markt-/Discover-Daten veraltet'
          RESULT_MONITOR: ${{ needs.monitor.result }}
          RESULT_PRODUKTSTAND: ${{ needs.produktstand.result }}
          ALARM_DETAIL_FILE: ${{ runner.temp }}/befund/freshness-live.txt
        run: node scripts/ci/pipeline-alarm.mjs

  # ===================================================================
  # IM BLICK (INTRADAY): WURDE ZUM FAELLIGEN TERMIN NEU GERECHNET?
  #
  # Ein nicht gestarteter Workflow meldet keinen Fehler - es laeuft ja nichts,
  # das ihn melden koennte (12.10.2026: GitHub legte den Stundenplan von
  # `discover-im-blick-live.yml` nicht an). Dieser Job fragt deshalb das
  # ERGEBNIS: er liest discover/live/monitor-US_REAL.json von der
  # veroeffentlichten Seite und vergleicht den zuletzt faelligen Slot (aus dem
  # Boersenkalender) mit dem veroeffentlichten
  # (scripts/discover/check-im-blick-live.mjs, discover/engines/refresh-plan.js).
  # FAIL macht den Lauf rot, und GitHub benachrichtigt. Stumm bleibt er am
  # Wochenende, an Feiertagen, vor dem ersten Slot und nach dem Abendlauf.
  # Gleiche Verfahrensgrenze wie jeder Zeitplan: faellt dieser Termin aus,
  # faellt er aus - die Heilung liegt beim Wecker (worker-waker/), nicht hier.
  # ===================================================================
  imblick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      contains(github.event.head_commit.message, '[freshness-check]')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Im Blick - zum faelligen Termin neu gerechnet?
        env:
          IN_SITE: ${{ github.event_name == 'workflow_dispatch' && inputs.site || 'https://research.visionuniverse.de' }}
        run: |
          set -o pipefail
          node scripts/discover/check-im-blick-live.mjs --strict --site="$IN_SITE"
