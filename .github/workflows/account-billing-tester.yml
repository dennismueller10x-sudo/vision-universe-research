name: Konten — Testerrolle (billing_tester)
# Vergibt bzw. entfernt die Rolle billing_tester fuer GENAU EIN Konto (Live-Checkout nur fuer Tester,
# VU_CHECKOUT_ACCESS = "testers"). Nur von Hand, Umgebung account-dev (Freigabe des Owners, zusaetzlich
# selbst geprueft). Kennung ist die Konto-ID (UUID), nie eine E-Mail-Adresse: Eingaben und Protokolle sind
# oeffentlich; das Skript gibt nur eine gekuerzte ID und Zaehler aus. Oeffnet den Checkout nicht fuer andere
# und aendert keine Stripe-Einstellung. Skript und Regeln: scripts/account/billing-tester.mjs.
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Aktion'
        type: choice
        options: [status, grant, revoke]
        default: status
      user:
        description: 'Konto-ID (UUID; nur grant und revoke)'
        required: false
permissions:
  contents: read
  actions: read
concurrency:
  group: account-billing-tester-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: account-dev
    steps:
      - name: Freigabe pruefen (fail closed)
        env: {GH_TOKEN: '${{ github.token }}', RUN_ID: '${{ github.run_id }}', REPO: '${{ github.repository }}', APPROVER: dennismueller10x-sudo, ENV_NAME: account-dev}
        run: |
          set -euo pipefail
          json=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/approvals")
          ok=$(jq --arg u "$APPROVER" --arg e "$ENV_NAME" '[.[] | select(.state=="approved" and .user.login==$u and any(.environments[]; .name==$e))] | length' <<<"$json")
          [ "$ok" -ge 1 ] || { echo "::error::Keine Freigabe durch $APPROVER fuer $ENV_NAME"; exit 1; }
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ausfuehren
        env:
          ACTION: ${{ inputs.action }}
          USER_ID: ${{ inputs.user }}
          SUPABASE_URL: ${{ vars.VU_ACCOUNT_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.VU_ACCOUNT_SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail
          SUPABASE_URL="${SUPABASE_URL:-https://qiytbnpoqvldsatpfkeh.supabase.co}"
          [ "$SUPABASE_URL" = "https://qiytbnpoqvldsatpfkeh.supabase.co" ] || { echo "::error::SUPABASE_URL ist nicht das Produktionsprojekt"; exit 1; }
          [[ "$SUPABASE_SECRET_KEY" == sb_secret_* ]] || { echo "::error::VU_ACCOUNT_SUPABASE_SECRET_KEY fehlt oder ist kein sb_secret_"; exit 1; }
          export SUPABASE_URL
          case "$ACTION" in
            status) node scripts/account/billing-tester.mjs status ;;
            grant|revoke)
              [[ "$USER_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]] || { echo "::error::Konto-ID fehlt oder ist keine UUID"; exit 1; }
              node scripts/account/billing-tester.mjs "$ACTION" "--user=$USER_ID" ;;
            *) echo "::error::Unbekannte Aktion"; exit 1 ;;
          esac
