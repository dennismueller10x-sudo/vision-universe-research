name: Konten — Testerrolle fuer den Live-Checkout vergeben (Freigabe)
# Vergibt die Rolle billing_tester an genau EIN bestaetigtes Konto. Nur Konten mit dieser Rolle duerfen den
# Pro-Checkout nutzen, solange VU_CHECKOUT_ACCESS = "testers" gilt. SENSIBEL (echte Zahlung moeglich):
# nur nach Freigabe des Owners (Umgebung account-dev, Required reviewers). Eingabe ist der SHA-256 der kleingeschriebenen
# E-Mail-Adresse, damit die Adresse nirgends im oeffentlichen Repository oder Protokoll steht:
#   printf '%s' 'adresse@example.de' | tr 'A-Z' 'a-z' | sha256sum
# Entzug: aktion = entziehen. docs/accounts/FREIGABEN.md
on:
  workflow_dispatch:
    inputs:
      email_sha256:
        description: 'SHA-256 der kleingeschriebenen E-Mail-Adresse'
        type: string
        required: true
      aktion:
        description: 'vergeben oder entziehen'
        type: choice
        options: [vergeben, entziehen]
        default: vergeben
permissions:
  contents: read
  actions: read
concurrency:
  group: account-billing-tester-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  rolle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: account-dev
    steps:
      - name: Owner-Freigabe dieses Laufs pruefen (fail closed)
        env: {GH_TOKEN: '${{ github.token }}', RUN_ID: '${{ github.run_id }}', REPO: '${{ github.repository }}', REF: '${{ github.ref }}', APPROVER: dennismueller10x-sudo, ENV_NAME: account-dev}
        run: |
          set -euo pipefail
          [ "$REF" = refs/heads/main ] || { echo "::error::Nur von main"; exit 1; }
          json=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/approvals")
          ok=$(jq --arg u "$APPROVER" --arg e "$ENV_NAME" '[.[] | select(.state=="approved" and .user.login==$u and any(.environments[]; .name==$e))] | length' <<<"$json")
          [ "$ok" -ge 1 ] || { echo "::error::Keine Freigabe durch $APPROVER fuer $ENV_NAME"; exit 1; }
      - name: Rolle setzen
        env:
          DB_URL: ${{ secrets.VU_ACCOUNT_SUPABASE_DB_URL }}
          H: ${{ inputs.email_sha256 }}
          AKTION: ${{ inputs.aktion }}
        run: |
          set -euo pipefail
          [[ "$DB_URL" == *qiytbnpoqvldsatpfkeh* ]] || { echo "::error::DB-URL gehoert nicht zum Produktionsprojekt"; exit 1; }
          [[ "$H" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::Eingabe ist kein SHA-256"; exit 1; }
          # $H ist geprueft (64 Hex-Zeichen) und darf deshalb im SQL stehen.
          q() { psql -X -q -t -A -v ON_ERROR_STOP=1 -d "$DB_URL" -c "$1"; }
          who="from auth.users where encode(sha256(convert_to(lower(email), 'UTF8')), 'hex') = '$H' and email_confirmed_at is not null"
          n=$(q "select count(*) $who")
          [ "$n" = 1 ] || { echo "::error::Kein bestaetigtes Konto zu diesem Hash ($n) - erst registrieren und E-Mail bestaetigen"; exit 1; }
          if [ "$AKTION" = entziehen ]; then
            q "delete from public.user_roles where role = 'billing_tester' and user_id in (select id $who)" > /dev/null
          else
            q "insert into public.user_roles (user_id, role) select id, 'billing_tester' $who on conflict do nothing" > /dev/null
          fi
          echo "Konten mit Rolle billing_tester: $(q "select count(*) from public.user_roles where role = 'billing_tester'")"
