name: Update VISION UNIVERSE news

on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch primary-source news
        run: node scripts/dashboard/update_news.mjs
      - name: Commit fresh news data
        shell: bash
        run: |
          if git diff --quiet -- dashboard/data/news_feed.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/data/news_feed.json
          git commit -m "chore: update dashboard news"
          git push
