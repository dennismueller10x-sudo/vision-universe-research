name: Update VISION UNIVERSE news

on:
  workflow_dispatch:
  # Zeitplan zurueck (Neustart 04.11.2026, Strang A): dreimal taeglich, Minute abseits der vollen Stunde.
  schedule:
    - cron: '17 5,11,17 * * *'

permissions:
  contents: write

concurrency:
  group: update-news-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Spitze des Zweigs, nicht der Ausloese-Commit (wartende Laeufe, Audit 03.10.2026)
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch primary-source news
        run: node scripts/dashboard/update_news.mjs
      - name: Commit fresh news data
        shell: bash
        run: |
          if git diff --quiet -- dashboard/data/news_feed.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/data/news_feed.json
          git commit -m "chore: update dashboard news"
          # Einheitlicher Push (scripts/ci/push-with-retry.sh): neu aufsetzen, wiederholen, bei echtem Konflikt laut scheitern - kein '|| true' (Plattform-Audit 03.10.2026).
          scripts/ci/push-with-retry.sh "${GITHUB_REF_NAME}"
