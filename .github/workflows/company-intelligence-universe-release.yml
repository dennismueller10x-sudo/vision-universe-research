name: Company Intelligence Eligible Universe Release
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [activate, rollback, health, refreeze, restore-legacy]
        default: activate
      scaling_run:
        description: 'Successful isolated full-universe refresh run ID (required for activate, unused otherwise)'
        type: string
        required: false
      expect_generation:
        description: 'refreeze: optional guard (exact current legacy GOOD generation). restore-legacy: REQUIRED, exact generation of the frozen rollback to restore as legacy GOOD'
        type: string
        required: false
permissions:
  contents: read
  actions: write
concurrency:
  group: company-intelligence-continuous-production
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Measured full R2 readback plus two broad browser matrices and Pages wait
    # need separate rollback reserve. This changes only release headroom;
    # continuous source budgets and cadence remain unchanged.
    timeout-minutes: 120
    env:
      NODE_PATH: /tmp/universe-qa/node_modules
      PYTHONPATH: scripts
      RESEARCH_ACCESS_PASSWORD: ${{ secrets.RESEARCH_ACCESS_PASSWORD }}
      VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
      VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
      VU_HISTORY_S3_REGION: ${{ secrets.VU_HISTORY_S3_REGION }}
      VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
      VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Require a scaling run for activate (fail closed)
        if: inputs.mode == 'activate'
        env:
          SCALE_RUN: ${{ inputs.scaling_run }}
        run: |
          if ! [[ "$SCALE_RUN" =~ ^[0-9]+$ ]]; then
            echo "::error::scaling_run (numeric run ID) is required for mode=activate"
            exit 1
          fi
      - name: Require expect_generation for restore-legacy (fail closed)
        if: inputs.mode == 'restore-legacy'
        env:
          EXPECT_GENERATION: ${{ inputs.expect_generation }}
        run: |
          if ! [[ "$EXPECT_GENERATION" =~ ^[0-9a-f]{24}$ ]]; then
            echo "::error::expect_generation (24 lowercase hex characters) is required for mode=restore-legacy"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ (inputs.mode == 'health' || inputs.mode == 'refreeze' || inputs.mode == 'restore-legacy') && 1 || 0 }}
      - uses: actions/checkout@v4
        if: inputs.mode != 'health' && inputs.mode != 'refreeze' && inputs.mode != 'restore-legacy'
        with:
          ref: abbea154a90ffece598e494530eea38661a20a95
          path: .accepted-identities
          sparse-checkout: |
            company-master
            company-intelligence
            quant/data/universe
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser and policy contracts
        if: inputs.mode != 'health' && inputs.mode != 'refreeze' && inputs.mode != 'restore-legacy'
        run: |
          node --test scripts/company_intelligence/tests/*.test.mjs
          python3 -m unittest discover -s scripts/company_intelligence/tests -p 'test_universe_*.py'
          npm install --prefix /tmp/universe-qa --no-audit --no-fund playwright@1.55.0
          node scripts/company_intelligence/install-browser-deps.mjs /tmp/universe-qa/node_modules/.bin/playwright
          node scripts/company_intelligence/navigation-lifecycle-qa.mjs
      - name: Verify scale receipt from an ancestor of production code
        if: inputs.mode == 'activate'
        env:
          SCALE_RUN: ${{ inputs.scaling_run }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          import {mkdirSync} from 'node:fs';
          const id=process.env.SCALE_RUN;assert(/^\d+$/.test(id));
          const r=JSON.parse(execFileSync('gh',['api','repos/'+process.env.GITHUB_REPOSITORY+'/actions/runs/'+id],{encoding:'utf8'}));
          assert.equal(r.conclusion,'success');assert.equal(r.path,'.github/workflows/company-intelligence-refresh.yml');
          execFileSync('git',['merge-base','--is-ancestor',r.head_sha,process.env.GITHUB_SHA]);
          // Scaling acceptance expires on a scheduler, engine, gate or storage change.
          const paths=['scripts/company_intelligence/continuous_refresh.py','scripts/company_intelligence/universe_scheduler.py','scripts/company_intelligence/universe_eligibility.py','scripts/company_intelligence/refresh-run.mjs','scripts/company_intelligence/public-delivery.mjs','scripts/company_intelligence/refresh-storage.mjs'];
          execFileSync('git',['diff','--exit-code',r.head_sha,process.env.GITHUB_SHA,'--',...paths]);
          mkdirSync(process.env.RUNNER_TEMP+'/scale-receipt',{recursive:true});
          execFileSync('gh',['run','download',id,'--name','company-intelligence-refresh-health-'+id,'--dir',process.env.RUNNER_TEMP+'/scale-receipt'],{stdio:'inherit'});
          NODE
      - name: Current private state twice, all assets and real sampled Discover
        if: inputs.mode == 'activate'
        run: |
          node scripts/company_intelligence/universe-audit.mjs --temporary "$RUNNER_TEMP/universe-release" --identity-root .accepted-identities
          node scripts/company_intelligence/universe-browser-qa.mjs --consumer "$RUNNER_TEMP/universe-release/first/consumer" --sample "$RUNNER_TEMP/universe-release/evidence/sample.json" --out "$RUNNER_TEMP/universe-release/evidence/browser.json"
      - name: Preserve 46 rollback, verify full R2 consumer and activate eligible gate
        id: activation
        if: inputs.mode != 'refreeze' && inputs.mode != 'restore-legacy'
        env:
          RELEASE_MODE: ${{ inputs.mode }}
        run: node scripts/company_intelligence/universe-release.mjs "$RELEASE_MODE" --temporary "$RUNNER_TEMP/universe-release" --scaling "$RUNNER_TEMP/scale-receipt/health.json"
      - name: Re-freeze immutable 46 rollback onto current legacy GOOD
        id: refreeze
        if: inputs.mode == 'refreeze'
        env:
          EXPECT_GENERATION: ${{ inputs.expect_generation }}
        run: |
          set -euo pipefail
          extra=()
          if [ -n "$EXPECT_GENERATION" ]; then
            [[ "$EXPECT_GENERATION" =~ ^[0-9a-f]{24}$ ]] || { echo "::error::expect_generation must be 24 lowercase hex characters"; exit 1; }
            extra=(--expect-generation "$EXPECT_GENERATION")
          fi
          node scripts/company_intelligence/universe-release.mjs refreeze --temporary "$RUNNER_TEMP/universe-release" "${extra[@]}"
      - name: Require untouched gate, activation and universe GOOD after refreeze
        if: inputs.mode == 'refreeze'
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const r=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/universe-release/evidence/release.json'));
          assert(['REFROZEN','ALREADY_CURRENT'].includes(r.status),'REFREEZE_STATUS_UNEXPECTED');
          for(const k of ['privateStateModified','activationModified','gateModified','universeGoodModified'])assert.strictEqual(r[k],false,'REFREEZE_PROTECTED_STATE_FLAG_NOT_FALSE:'+k);
          console.log(JSON.stringify({status:r.status,generation:r.generation,previousGeneration:r.previousGeneration}));
          NODE
      - name: Restore legacy GOOD pointer from the verified frozen rollback
        id: restore_legacy
        if: inputs.mode == 'restore-legacy'
        env:
          EXPECT_GENERATION: ${{ inputs.expect_generation }}
        run: |
          set -euo pipefail
          node scripts/company_intelligence/universe-release.mjs restore-legacy --temporary "$RUNNER_TEMP/universe-release" --expect-generation "$EXPECT_GENERATION"
      - name: Require untouched gate, activation, universe GOOD and rollback after restore-legacy
        if: inputs.mode == 'restore-legacy'
        env:
          EXPECT_GENERATION: ${{ inputs.expect_generation }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const r=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/universe-release/evidence/release.json'));
          assert(['RESTORED','ALREADY_PRESENT'].includes(r.status),'RESTORE_LEGACY_STATUS_UNEXPECTED');
          if(r.status==='RESTORED')assert.equal(r.generation,process.env.EXPECT_GENERATION,'RESTORE_LEGACY_GENERATION_UNEXPECTED');
          for(const k of ['privateStateModified','activationModified','gateModified','universeGoodModified','rollbackModified'])assert.strictEqual(r[k],false,'RESTORE_LEGACY_PROTECTED_STATE_FLAG_NOT_FALSE:'+k);
          console.log(JSON.stringify({status:r.status,generation:r.generation,validUntil:r.validUntil||null}));
          NODE
      - name: Deploy existing Pages and wait for exact consumer generation
        id: deployment
        if: inputs.mode != 'refreeze' && inputs.mode != 'restore-legacy'
        run: |
          gh workflow run pages-release.yml --ref main
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import {acceptedHealthServed} from './scripts/company_intelligence/release-health.mjs';
          const accepted=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/universe-release/evidence/release.json')),expected=accepted.generation;
          const deadline=Date.now()+20*60000;let ok=false;
          while(Date.now()<deadline){
            try{
              const query='?release='+Date.now(),root='https://research.visionuniverse.de/';
              const r=await fetch(root+'company-intelligence-delivery.json'+query),d=await r.json();
              if(d.status==='PASS'&&d.generation===expected){
                if(process.env.RELEASE_MODE==='health'){
                  const refresh=await(await fetch(root+'company-intelligence-refresh.json'+query)).json();
                  if(!acceptedHealthServed(d,refresh,accepted))throw Error('RECONCILED_HEALTH_NOT_YET_SERVED');
                }
                ok=true;break;
              }
            }catch{}
            await new Promise(r=>setTimeout(r,10000));
          }
          if(!ok)throw Error('EXACT_PRODUCTION_GENERATION_NOT_SERVED');
          NODE
        env:
          RELEASE_MODE: ${{ inputs.mode }}
      - name: Actual production broad sample and source-to-browser readback
        id: live
        if: inputs.mode == 'activate'
        run: |
          node scripts/company_intelligence/universe-browser-qa.mjs --live --sample "$RUNNER_TEMP/universe-release/evidence/sample.json" --out "$RUNNER_TEMP/universe-release/evidence/live.json"
          node scripts/company_intelligence/refresh-run.mjs observe
          node scripts/company_intelligence/refresh-run.mjs health --out "$RUNNER_TEMP/universe-release/evidence/health.json"
      - name: Actual 46-scope rollback acceptance
        if: inputs.mode == 'rollback'
        run: node scripts/company_intelligence/refresh-qa.mjs --live --out "$RUNNER_TEMP/universe-release/evidence/rollback-live.json"
      - name: Actual unchanged generation and reconciled source health
        if: inputs.mode == 'health'
        run: |
          node scripts/company_intelligence/refresh-run.mjs health --out "$RUNNER_TEMP/universe-release/evidence/health.json"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const root=process.env.RUNNER_TEMP+'/universe-release/evidence/';
          const release=JSON.parse(readFileSync(root+'release.json')),health=JSON.parse(readFileSync(root+'health.json'));
          assert.equal(health.generation,release.generation);assert.equal(health.productionState,'VERIFIED');assert.equal(health.status,'HEALTHY');
          NODE
      - name: Fail closed to immutable 46 scope on material production failure
        if: (failure() || cancelled()) && inputs.mode != 'health' && inputs.mode != 'refreeze' && inputs.mode != 'restore-legacy' && steps.activation.outcome == 'success'
        run: |
          recovery_status=0
          node scripts/company_intelligence/universe-release.mjs rollback --temporary "$RUNNER_TEMP/universe-recovery" || recovery_status=$?
          gh workflow run pages-release.yml --ref main
          exit "$recovery_status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: company-intelligence-universe-release-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/universe-release/evidence/
            ${{ runner.temp }}/universe-recovery/evidence/
          retention-days: 14
