name: CI (Pruefungen je Produkt)

# Buendel `ci` (core/registry/workflow-bundles.json, Plan Neustart §3), Stufe 1: die kleinen Pruefungen.
# Jede ist ein eigener Job mit unveraendertem Inhalt; der Job `auswahl` entscheidet mit
# scripts/ci/select-checks.mjs nach scripts/ci/ci-checks.json (Pfade/Zweige wie die frueheren Filter):
#   ask                    vormals ask-ci.yml
#   brevo                  vormals brevo-ci.yml
#   ci-config              vormals ci-config.yml
#   creative-job-guard     vormals creative-job-guard.yml
#   etf-dashboard          vormals etf-dashboard-ci.yml
#   fundamental            vormals fundamental-ci.yml
#   hedgefonds-dashboard   vormals hedgefonds-dashboard-ci.yml
#   landing                vormals landing-ci.yml
#   research-access        vormals research-access-ci.yml
#   screener               vormals screener-ci.yml
#   vorsorge               vormals vorsorge-ci.yml
#   willkommen             vormals willkommen-ci.yml
#   discover               vormals discover-ci.yml (Stufe 2)
#   discover-frontend      vormals discover-frontend-ci.yml (Stufe 2)
#   sec-fundamentals       vormals sec-fundamentals-ci.yml (Stufe 2)
#   social                 vormals social-ci.yml (Stufe 2)
#   supertrader            vormals supertrader-ci.yml (Stufe 2)
#   technical              vormals technical-ci.yml (Stufe 2)
#   vu2-browser-qa         vormals vu2-browser-qa.yml (Stufe 2)
#   vu2-lifecycle-handoff  vormals vu2-lifecycle-handoff.yml (Stufe 2)
#   account                vormals account-ci.yml (Stufe 3)
#   shell                  vormals shell-ci.yml (Stufe 3)

