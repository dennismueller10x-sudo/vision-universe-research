  # --- vu2-browser-qa: vormals vu2-browser-qa.yml
  vu2-browser-qa:
    needs: auswahl
    if: >-
      needs.auswahl.outputs.vu2_browser_qa == 'true'
    # Workflow-Concurrency der Quelle (PR-Abbruch bzw. Gruppe je Zweig) am Job
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('vu2-browser-qa-pr-{0}', github.event.pull_request.number) || format('vu2-browser-qa-{0}', github.run_id) }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    # 11.11.2026: Browser kommen aus dem Playwright-Image (Version = npm playwright@ unten) statt per apt-get/playwright install
    # (apt-DNS auf azure.archive.ubuntu.com haengt zeitweise > 60 min). Python fehlt im Image: statischer Server scripts/ci/static-server.mjs.
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --ipc=host
    defaults:
      run:
        shell: bash
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Workspace fuer git freigeben (Container laeuft als root)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test resource budget failure cases
        run: node --test scripts/vu2/resource-budget.test.mjs
      - name: Install isolated browser test dependency
        timeout-minutes: 8
        run: npm install --prefix /tmp/vu2-qa playwright@1.58.2 axe-core@4.10.3 esbuild@0.25.10
      # Datenzweig vor dem Bau wie pages-release.yml (Plan Neustart §3): BRANCH_ONLY-Daten (z. B. marketPulse) liegen in main
      # nur eingefroren; ohne diesen Schritt prueft der Bau einen anderen Stand als die ausgelieferte Seite. Vertragstest DB-16.
      - name: Datenzweig in den Arbeitsbaum (vor dem Bau)
        run: scripts/ci/seed-data-branch.sh alle
      - name: Build the exact static release artifact
        run: node scripts/vu2/build-release.mjs --output="$RUNNER_TEMP/quant2-site"
      - name: Compact delivery script without changing identifiers or removing code
        run: |
          set -euo pipefail
          shopt -s nullglob
          /tmp/vu2-qa/node_modules/.bin/esbuild "$RUNNER_TEMP/quant2-site/quant/release-bundle.js" --minify-whitespace --charset=utf8 --legal-comments=inline --tree-shaking=false --allow-overwrite --outfile="$RUNNER_TEMP/quant2-site/quant/release-bundle.js"
          # Die Pakete je Ansicht (QUANT_PACKS in build-release.mjs) sind Teile des Buendels und werden wie es behandelt.
          for pack in "$RUNNER_TEMP"/quant2-site/quant/app/pack-*.js; do
            /tmp/vu2-qa/node_modules/.bin/esbuild "$pack" --minify-whitespace --charset=utf8 --legal-comments=inline --tree-shaking=false --allow-overwrite --outfile="$pack"
          done
      - name: Test desktop and mobile preview
        env:
          NODE_PATH: /tmp/vu2-qa/node_modules
          VU_QA_OUTPUT: /tmp/vu2-screenshots
        run: |
          cd "$RUNNER_TEMP/quant2-site"
          node "$GITHUB_WORKSPACE/scripts/vu2/browser-qa.mjs"
      # PR #619 (Discover): ein WebKit-Race trat nur ueber die Zugangsmaske auf (document.write-Pfad). Das Skript verpackt die
      # HTML-Seiten des Release wie pages-release.yml (protectRelease, Einmalpasswort) und laedt jede Quant-Route durch die
      # Maske, auch unter langsamer Verbindung und parallel. Leere Seiten gelten nicht als bestanden.
      # Phase 4: die Direktlink-Pruefung vergleicht meta vu-release mit /release-id.json und jeden ?v= mit den ausgelieferten Bytes. Dafuer
      # braucht der Release die Kennung - in pages-release.yml steht dieser Schritt nach dem Verkleinern und vor der Passwortsperre.
      - name: Stamp release identifier like pages-release (meta vu-release, release-id.json, ?v= stamps)
        run: node scripts/vu2/release-id.mjs "$RUNNER_TEMP/quant2-site"
      - name: Direct links through the active access gate, slow networks and parallel loads
        env:
          NODE_PATH: /tmp/vu2-qa/node_modules
        run: |
          mkdir -p /tmp/vu2-direct
          chromium_status=0
          webkit_status=0
          node scripts/vu2/browser-qa-direct.mjs --release "$RUNNER_TEMP/quant2-site" --engine chromium --out /tmp/vu2-direct || chromium_status=$?
          node scripts/vu2/browser-qa-direct.mjs --release "$RUNNER_TEMP/quant2-site" --engine webkit --out /tmp/vu2-direct || webkit_status=$?
          test "$chromium_status" -eq 0 && test "$webkit_status" -eq 0
      # Die sechs Saetze, an denen am 25.09.2026 eine falsche Auskunft stand,
      # je an einem Titel, an dem der Fall wirklich auftritt. Laeuft gegen
      # dasselbe ausgelieferte Verzeichnis wie die Reise-QA darueber.
      - name: Six named journey surfaces on the delivered artifact
        env:
          NODE_PATH: /tmp/vu2-qa/node_modules
        run: node scripts/vu2/verify-journey-surfaces.mjs --site "$RUNNER_TEMP/quant2-site"

      - uses: actions/upload-artifact@v4
        with:
          name: quant2-release-candidate
          path: ${{ runner.temp }}/quant2-site
          include-hidden-files: true
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vu2-direct-links
          path: /tmp/vu2-direct
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vu2-desktop-mobile
          path: /tmp/vu2-screenshots
          retention-days: 14

  # --- vu2-lifecycle-handoff: vormals vu2-lifecycle-handoff.yml
  vu2-lifecycle-handoff:
    needs: auswahl
    if: >-
      needs.auswahl.outputs.vu2_lifecycle_handoff == 'true' && (github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'workstream/vu2-operating-handoff'))
    # Die PR-Gruppe der Quelle deckt die Workflow-Gruppe von ci.yml ab (ueberholte PR-Laeufe brechen ab); die Job-Gruppe bleibt.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: vu2-canonical-handoff
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Handoff protection tests
        run: node --test quant/tests/history-handoff-proof.test.mjs quant/tests/history-sync-boundary.test.mjs quant/tests/history-usage-boundary.test.mjs
      - name: Measured preflight using the existing accounting and storage
        env:
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_REGION: ${{ secrets.VU_HISTORY_S3_REGION }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
        run: >-
          node scripts/market/preflight-zero-cost.mjs --operation RECOVERY --gate GATE_100
          --out "$RUNNER_TEMP/vu2-handoff/preflight.json"
      - name: Restore only five existing universe members to private runner state
        env:
          VU_HISTORY_S3_ENDPOINT: ${{ secrets.VU_HISTORY_S3_ENDPOINT }}
          VU_HISTORY_S3_BUCKET: ${{ secrets.VU_HISTORY_S3_BUCKET }}
          VU_HISTORY_S3_REGION: ${{ secrets.VU_HISTORY_S3_REGION }}
          VU_HISTORY_S3_ACCESS_KEY_ID: ${{ secrets.VU_HISTORY_S3_ACCESS_KEY_ID }}
          VU_HISTORY_S3_SECRET_ACCESS_KEY: ${{ secrets.VU_HISTORY_S3_SECRET_ACCESS_KEY }}
        run: >-
          node scripts/market/sync-history-store.mjs --pull --gate GATE_100 --limit 5 --concurrency 1
          --preflight "$RUNNER_TEMP/vu2-handoff/preflight.json"
          --work-dir "$RUNNER_TEMP/vu2-private-history"
          --report "$RUNNER_TEMP/vu2-handoff/sync.json"
      - name: Verify restored state through the existing market store and EOD gate
        run: >-
          node scripts/vu2/verify-history-handoff.mjs
          --preflight "$RUNNER_TEMP/vu2-handoff/preflight.json"
          --sync "$RUNNER_TEMP/vu2-handoff/sync.json"
          --work-dir "$RUNNER_TEMP/vu2-private-history"
          --out "$RUNNER_TEMP/vu2-handoff/result.json"
      - name: Retain metadata evidence only, including blocked preflight
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vu2-canonical-handoff
          path: ${{ runner.temp }}/vu2-handoff/*.json
          if-no-files-found: warn
          retention-days: 14

  # --- account: vormals account-ci.yml
  account-test:
    needs: auswahl
    if: needs.auswahl.outputs.account == 'true'
    # Workflow-Gruppe der Quelle je Job (parallele Jobs, gleiche Abbruch-Regel)
    concurrency:
      group: account-ci-${{ github.ref_name }}-test
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          # Wegwerf-Container nur fuer diesen Lauf, nur auf localhost: ohne Passwort.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PG_TEST_URL: postgresql://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: SQL-Migrationen und RLS (PostgreSQL 17)
        run: node scripts/account/sql-tests.mjs
      - name: Worker, Ende-zu-Ende und Kontoseiten
        run: node --test "workers/vu-account/tests/*.test.mjs" "konto/tests/*.test.mjs" "mein-dashboard/tests/*.test.mjs" "scripts/account/tests/*.test.mjs"
      - name: Watchlist - Uebersicht und Ansicht (Core)
        run: node --test core/tests/watchlist-view.test.mjs core/tests/watchlist-button.test.mjs
      - name: Watchlist - Last und Speicher (1.000 Nutzer, Kurzlauf)
        run: node scripts/account/watchlist-load.mjs --users=1000 --sizes=25,200
      - name: Keine Schluessel im Repository
        run: node scripts/account/assert-no-billing-secrets.mjs
      - name: Worker laesst sich buendeln (ohne Ausrollen)
        working-directory: workers/vu-account
        run: npx --yes wrangler@4.147.0 deploy --dry-run --outdir /tmp/vu-account-bundle

  account-browser:
    needs: auswahl
    if: needs.auswahl.outputs.account == 'true'
    # Workflow-Gruppe der Quelle je Job (parallele Jobs, gleiche Abbruch-Regel)
    concurrency:
      group: account-ci-${{ github.ref_name }}-browser
      cancel-in-progress: true
    # Kontoseiten im echten Browser gegen die lokale Simulation (scripts/account/dev-server.mjs):
    # Chromium (Desktop, mobil) und WebKit im iPhone-Profil (Safari-Engine). Browser aus dem
    # Playwright-Image wie in shell-ci.yml, PostgreSQL 17 als Dienst.
    name: Browser (Chromium und WebKit/iPhone)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    services:
      postgres:
        image: postgres:17
        env:
          # Wegwerf-Container nur fuer diesen Lauf: ohne Passwort.
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PG_TEST_URL: postgresql://postgres@postgres:5432/postgres
    defaults:
      run:
        # Im Container ist die Standard-Shell sh (ohne pipefail).
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL-Client
        timeout-minutes: 8
        run: |
          set -euo pipefail
          # psql (apply-migrations.mjs) kommt nicht im Playwright-Image mit. apt mit kurzen Zeitlimits, bis zu 3 Versuchen;
          # bei Spiegel-/DNS-Ausfall bricht der Schritt nach hoechstens 8 min ab (timeout-minutes), statt eine Stunde zu haengen.
          apt_opts="-o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          for versuch in 1 2 3; do
            # shellcheck disable=SC2086
            if apt-get $apt_opts update -qq && DEBIAN_FRONTEND=noninteractive apt-get $apt_opts install -y -qq postgresql-client > /dev/null; then break; fi
            [ "$versuch" -lt 3 ] || { echo "::error::postgresql-client nicht installierbar (apt)"; exit 1; }
            echo "::warning::apt Versuch $versuch fehlgeschlagen, neuer Versuch"; sleep $((versuch * 20))
          done
          psql --version
      - name: Playwright (Chromium und WebKit liegen im Image)
        run: |
          npm install --prefix /tmp/account-qa-deps --no-audit --no-fund playwright@1.56.1
          node -e "const pw=require('/tmp/account-qa-deps/node_modules/playwright');for(const b of [pw.chromium,pw.webkit])require('fs').accessSync(b.executablePath())"
      - name: Browser-QA (Chromium 1280/390, WebKit iPhone 390)
        env:
          PLAYWRIGHT_PATH: /tmp/account-qa-deps/node_modules/playwright
        run: |
          set -euo pipefail
          mkdir -p /tmp/account-evidence
          node scripts/account/dev-server.mjs --port=8790 --backtest-review > /tmp/account-evidence/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl --fail --silent http://localhost:8790/v1/health > /dev/null && break; sleep 1; done
          chromium_status=0
          webkit_status=0
          node scripts/account/browser-qa.mjs --url=http://localhost:8790 --out=/tmp/account-evidence || chromium_status=$?
          node scripts/account/browser-qa.mjs --engine=webkit --url=http://localhost:8790 --out=/tmp/account-evidence || webkit_status=$?
          # Persoenliche Watchlist und Lesezeichen im Aktienkopf (Desktop, iPhone, hell/dunkel).
          node scripts/account/watchlist-qa.mjs --url=http://localhost:8790 --out=/tmp/account-evidence || chromium_status=$?
          node scripts/account/watchlist-qa.mjs --engine=webkit --url=http://localhost:8790 --out=/tmp/account-evidence || webkit_status=$?
          test "$chromium_status" -eq 0 && test "$webkit_status" -eq 0
      - name: Nutzerreise Free/Pro wie in der Produktion (Checkout nur fuer Tester, eigener Testserver)
        env:
          PLAYWRIGHT_PATH: /tmp/account-qa-deps/node_modules/playwright
        run: |
          set -euo pipefail
          # Je Engine ein frischer Testserver (signup 5/h je IP; die Simulation meldet immer 127.0.0.1).
          status=0
          port=8795
          for engine in chromium webkit; do
            port=$((port + 1))
            node scripts/account/dev-server.mjs --port=$port --checkout-access=testers --newsletter > /tmp/account-evidence/server-journey-$engine.log 2>&1 &
            server_pid=$!
            for i in $(seq 1 30); do curl --fail --silent http://localhost:$port/v1/health > /dev/null && break; sleep 1; done
            node scripts/account/journey-qa.mjs --engine=$engine --url=http://localhost:$port --out=/tmp/account-evidence || status=1
            kill "$server_pid" 2>/dev/null || true
          done
          test "$status" -eq 0
      - name: Kopplungs-QA (lokale Beobachten-Listen, eigener Testserver)
        env:
          PLAYWRIGHT_PATH: /tmp/account-qa-deps/node_modules/playwright
        run: |
          set -euo pipefail
          # Eigener Testserver: frischer Zaehler fuer Registrierungen (signup 5/h je IP, die Simulation meldet immer
          # 127.0.0.1). Die Grenze selbst bleibt unveraendert. Abgemeldet rein lokal, angemeldet lokal und Konto.
          node scripts/account/dev-server.mjs --port=8791 > /tmp/account-evidence/server-coupling.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl --fail --silent http://localhost:8791/v1/health > /dev/null && break; sleep 1; done
          status=0
          for qa in scripts/discover/watchlist-coupling-qa.mjs scripts/account/quant-watch-coupling-qa.mjs; do
            [ -f "$qa" ] || continue
            node "$qa" --url=http://localhost:8791 || status=1
            node "$qa" --engine=webkit --url=http://localhost:8791 || status=1
          done
          test "$status" -eq 0
      - name: Screenshots sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: account-browser-evidence
          path: /tmp/account-evidence

  # --- shell: vormals shell-ci.yml
  shell-shell:
    name: shell-shell (${{ matrix.id }})
    needs: auswahl
    if: needs.auswahl.outputs.shell == 'true'
    # Workflow-Gruppe der Quelle je Job (parallele Jobs, gleiche Abbruch-Regel)
    # 11.11.2026: Chromium (Handy, Desktop) und WebKit laufen parallel statt nacheinander (vorher ein Job, rund 35 min).
    concurrency:
      group: shell-qa-${{ github.ref }}-shell-${{ matrix.id }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: chromium-handy, engine: chromium, viewports: '390x844,430x932,768x1024', legal: chromium }
          - { id: chromium-desktop, engine: chromium, viewports: '1024x768,1440x900', legal: '' }
          - { id: webkit, engine: webkit, viewports: '390x844,430x932,1024x768', legal: webkit }
    # Browser aus dem Playwright-Image statt apt-get bei jedem Lauf - Begruendung beim Job vu3-regression.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - name: Workspace fuer git freigeben (Container laeuft als root, build-release.mjs ruft git ls-files)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Shell tests
        run: node --test "core/tests/shell-navigation.test.mjs" discover/tests/navigation-theme.test.mjs quant/tests/site-navigation.test.mjs
      - name: Build screener universe from committed product data
        run: node products/screener/producer/build-universe.mjs
      - name: Browser dependencies (Chromium und WebKit liegen im Image)
        run: |
          npm install --prefix /tmp/shell-qa-deps --no-audit --no-fund playwright@1.56.1
          node -e "const pw=require('/tmp/shell-qa-deps/node_modules/playwright');for(const b of [pw.chromium,pw.webkit])require('fs').accessSync(b.executablePath())"
      # Datenzweig vor dem Bau wie pages-release.yml (Plan Neustart §3): BRANCH_ONLY-Daten (z. B. marketPulse) liegen in main
      # nur eingefroren; ohne diesen Schritt prueft der Bau einen anderen Stand als die ausgelieferte Seite. Vertragstest DB-16.
      - name: Datenzweig in den Arbeitsbaum (vor dem Bau)
        run: scripts/ci/seed-data-branch.sh alle
      - name: Build exact Pages delivery artifact
        run: node scripts/vu2/build-release.mjs --output="$RUNNER_TEMP/shell-release"
      - name: Browser QA (${{ matrix.engine }} ${{ matrix.viewports }})
        env:
          PLAYWRIGHT_PATH: /tmp/shell-qa-deps/node_modules/playwright
          QA_ENGINE: ${{ matrix.engine }}
          QA_VIEWPORTS: ${{ matrix.viewports }}
        run: |
          mkdir -p /tmp/shell-evidence
          node scripts/ci/static-server.mjs --dir="$RUNNER_TEMP/shell-release" --port=8765 > /tmp/shell-evidence/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in 1 2 3 4 5; do curl --fail --silent http://127.0.0.1:8765/quant/ > /dev/null && break; sleep 1; done
          node scripts/quality/shell-browser-qa.mjs --engine="$QA_ENGINE" --viewports="$QA_VIEWPORTS" --url=http://127.0.0.1:8765 --out="/tmp/shell-evidence/$QA_ENGINE"
      - name: App-QA Rechtliches & Infos (App-Hülle mit CSP, App-UA, echter Tipp je Menüeintrag)
        if: matrix.legal != ''
        env:
          PLAYWRIGHT_PATH: /tmp/shell-qa-deps/node_modules/playwright
          QA_LEGAL: ${{ matrix.legal }}
        run: |
          mkdir -p /tmp/shell-evidence
          node scripts/quality/app-legal-menu-qa.mjs --browser "$QA_LEGAL" --out "/tmp/shell-evidence/app-legal-$QA_LEGAL.json"
      - name: Preserve screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shell-browser-evidence-${{ matrix.id }}
          path: /tmp/shell-evidence
          if-no-files-found: warn

  shell-vu3-regression:
    needs: auswahl
    if: needs.auswahl.outputs.shell == 'true'
    # Workflow-Gruppe der Quelle je Job (parallele Jobs, gleiche Abbruch-Regel)
    concurrency:
      group: shell-qa-${{ github.ref }}-vu3-regression
      cancel-in-progress: true
    # VU3-Regression (scripts/quality/vu3-regression-qa.mjs): Wege zwischen den Welten (dieselbe Aktie bleibt dieselbe),
    # Farbschema ueber die Welten, Visual-First-Bausteine je Welt und Kontrast (axe color-contrast) hell/dunkel, 390/1440 px.
    # Eigener Job neben shell, damit dessen 40-Minuten-Budget unberuehrt bleibt. Europa-Routen bewusst ausgenommen.
    # Browser und ihre Systembibliotheken kommen aus dem offiziellen Playwright-Image (Version = playwright@ unten).
    # Vorher installierte `playwright install --with-deps` sie bei jedem Lauf per apt-get vom Ubuntu-Spiegel des
    # Runners: rund 100 MB (WebKit: GStreamer, FFmpeg, Schriften) mit zeitweise unter 100 KB/s - die Installation
    # allein lief in das 40-Minuten-Limit, bevor eine Pruefung startete. Node 22 und git bringt das Image mit;
    # Python nicht, deshalb liefert scripts/ci/static-server.mjs die Seiten aus (Verhalten wie http.server).
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - name: Workspace fuer git freigeben (Container laeuft als root, build-release.mjs ruft git ls-files)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build screener universe from committed product data
        run: node products/screener/producer/build-universe.mjs
      - name: Browser dependencies (axe-core; Chromium und WebKit liegen im Image)
        run: |
          npm install --prefix /tmp/vu3-qa-deps --no-audit --no-fund playwright@1.56.1 axe-core@4.10.3
          node -e "const pw=require('/tmp/vu3-qa-deps/node_modules/playwright');for(const b of [pw.chromium,pw.webkit])require('fs').accessSync(b.executablePath())"
      # Datenzweig vor dem Bau wie pages-release.yml (Plan Neustart §3): BRANCH_ONLY-Daten (z. B. marketPulse) liegen in main
      # nur eingefroren; ohne diesen Schritt prueft der Bau einen anderen Stand als die ausgelieferte Seite. Vertragstest DB-16.
      - name: Datenzweig in den Arbeitsbaum (vor dem Bau)
        run: scripts/ci/seed-data-branch.sh alle
      - name: Build exact Pages delivery artifact
        run: node scripts/vu2/build-release.mjs --output="$RUNNER_TEMP/vu3-release"
      - name: VU3 regression (Chromium all sections · WebKit iPhone journeys, theme, Visual First)
        env:
          PLAYWRIGHT_PATH: /tmp/vu3-qa-deps/node_modules/playwright
          AXE_PATH: /tmp/vu3-qa-deps/node_modules/axe-core/axe.min.js
        run: |
          mkdir -p /tmp/vu3-evidence
          node scripts/ci/static-server.mjs --dir="$RUNNER_TEMP/vu3-release" --port=8765 > /tmp/vu3-evidence/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in 1 2 3 4 5; do curl --fail --silent http://127.0.0.1:8765/quant/ > /dev/null && break; sleep 1; done
          chromium_status=0
          webkit_status=0
          node scripts/quality/vu3-regression-qa.mjs --url=http://127.0.0.1:8765 --out=/tmp/vu3-evidence/chromium || chromium_status=$?
          node scripts/quality/vu3-regression-qa.mjs --engine=webkit --only=journeys,theme,visual --url=http://127.0.0.1:8765 --out=/tmp/vu3-evidence/webkit || webkit_status=$?
          test "$chromium_status" -eq 0 && test "$webkit_status" -eq 0
      - name: Preserve results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vu3-regression-evidence
          path: /tmp/vu3-evidence
          if-no-files-found: warn

  shell-fundamental-compare:
    needs: auswahl
    if: needs.auswahl.outputs.shell == 'true'
    # Workflow-Gruppe der Quelle je Job (parallele Jobs, gleiche Abbruch-Regel)
    concurrency:
      group: shell-qa-${{ github.ref }}-fundamental-compare
      cancel-in-progress: true
    # Fundamental: mehrere Kennzahlen in einem Verlauf (scripts/quality/fundamental-compare-qa.mjs) gezielt im
    # iPhone-Profil von WebKit (390 und 430 px, hell und dunkel): "+ Kennzahl", Auswahl im mobilen Dialog,
    # synchrones Ablesen per Antippen, Achsen und Legende, Touch-Flaechen, Vollbild, Entfernen bis zur
    # Ausgangsansicht (Balken, Branchenvergleich). Dazu derselbe Lauf in Chromium (mobil, mit Touch).
    # Eigener Job neben shell und vu3-regression, damit deren 40-Minuten-Budget unberuehrt bleibt.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - name: Workspace fuer git freigeben (Container laeuft als root, build-release.mjs ruft git ls-files)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build screener universe from committed product data
        run: node products/screener/producer/build-universe.mjs
      - name: Browser dependencies (Chromium und WebKit liegen im Image)
        run: |
          npm install --prefix /tmp/fu-qa-deps --no-audit --no-fund playwright@1.56.1
          node -e "const pw=require('/tmp/fu-qa-deps/node_modules/playwright');for(const b of [pw.chromium,pw.webkit])require('fs').accessSync(b.executablePath())"
      # Datenzweig vor dem Bau wie pages-release.yml (Plan Neustart §3): BRANCH_ONLY-Daten (z. B. marketPulse) liegen in main
      # nur eingefroren; ohne diesen Schritt prueft der Bau einen anderen Stand als die ausgelieferte Seite. Vertragstest DB-16.
      - name: Datenzweig in den Arbeitsbaum (vor dem Bau)
        run: scripts/ci/seed-data-branch.sh alle
      - name: Build exact Pages delivery artifact
        run: node scripts/vu2/build-release.mjs --output="$RUNNER_TEMP/fu-release"
      - name: Fundamental compare (WebKit iPhone 390, 430 · Chromium 390, 430)
        env:
          PLAYWRIGHT_PATH: /tmp/fu-qa-deps/node_modules/playwright
        run: |
          mkdir -p /tmp/fu-evidence
          node scripts/ci/static-server.mjs --dir="$RUNNER_TEMP/fu-release" --port=8765 > /tmp/fu-evidence/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in 1 2 3 4 5; do curl --fail --silent http://127.0.0.1:8765/fundamental/ > /dev/null && break; sleep 1; done
          webkit_status=0
          chromium_status=0
          node scripts/quality/fundamental-compare-qa.mjs --engine=webkit --viewports=390x844,430x932 --url=http://127.0.0.1:8765 --out=/tmp/fu-evidence/webkit || webkit_status=$?
          node scripts/quality/fundamental-compare-qa.mjs --engine=chromium --viewports=390x844,430x932 --url=http://127.0.0.1:8765 --out=/tmp/fu-evidence/chromium || chromium_status=$?
          test "$webkit_status" -eq 0 && test "$chromium_status" -eq 0
      - name: Preserve screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fundamental-compare-evidence
          path: /tmp/fu-evidence
          if-no-files-found: warn
