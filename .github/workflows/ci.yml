  # --- discover: vormals discover-ci.yml
  discover:
    needs: auswahl
    if: >-
      needs.auswahl.outputs.discover == 'true'
    # Workflow-Concurrency der Quelle (PR-Abbruch bzw. Gruppe je Zweig) am Job
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('discover-ci-pr-{0}', github.event.pull_request.number) || format('discover-ci-{0}', github.run_id) }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Zwei Commits: im pull_request-Ereignis ist HEAD der Merge-Commit,
          # HEAD^1 die aktuelle Basis. Damit sieht das Modul-Gate den PR-Diff
          # ohne Vollclone.
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Engine- und Contract-Tests
        run: node --test "discover/tests/*.test.mjs"

      - name: Ausgelieferte Daten stimmen mit den Engines ueberein
        run: node scripts/discover/verify-discover-data.mjs

      - name: Der Build ist reproduzierbar
        # Derselbe Eingabestand muss denselben Ausgabestand ergeben. Weicht
        # er ab, ist irgendwo eine Uhrzeit oder eine Zufallszahl in die
        # Rechnung geraten - und dann ist kein Vergleich zweier Staende mehr
        # aussagekraeftig. generatedAt ist die eine erlaubte Ausnahme.
        run: |
          node scripts/discover/build-discover-data.mjs > /dev/null
          git diff --stat -- discover/data > /tmp/discover-drift.txt || true
          changed=$(git diff --name-only -- discover/data | grep -v 'discover/data/meta.json' | wc -l)
          if [ "$changed" -gt 0 ]; then
            echo "Der Neubau ergibt andere Daten als der eingecheckte Stand:"
            cat /tmp/discover-drift.txt
            exit 1
          fi
          echo "Build reproduzierbar (nur meta.json traegt einen Zeitstempel)."

      - name: Discover-Seite bindet die gemeinsame Shell und die Navigation ein
        run: |
          page=discover/index.html
          grep -q '/quant/ui/shell.js' "$page" || { echo "$page ohne quant/ui/shell.js"; exit 1; }
          grep -q 'vu-navigation' "$page" || { echo "$page ohne Vision-Universe-Navigation"; exit 1; }
          grep -q 'site-navigation.css' "$page" || { echo "$page ohne Navigations-Stylesheet"; exit 1; }
          echo "Seite geprueft"

      # Bis 05.11.2026 stand hier "Discover veraendert keine bestehende Engine" (Pfadverbot fuer quant,
      # providers, scripts/quant|technical|market, dashboard, macro, academy). Ersetzt durch Vertragstests:
      # wer diese Pfade aendert, loest Quant-/Technical-CI aus; Schnittstellen pruefen PC-1..4.
      - name: Produktvertraege (statt Pfadverbot)
        run: node --test core/tests/product-contracts.test.mjs

      - name: JSON-Dateien sind gueltig
        run: |
          files=$(find discover -name '*.json')
          for file in $files; do
            node -e "JSON.parse(require('fs').readFileSync('$file','utf8'))" || exit 1
          done
          echo "$(echo "$files" | wc -l) JSON-Dateien geprueft"

  # --- discover-frontend: vormals discover-frontend-ci.yml
  discover-frontend:
    needs: auswahl
    if: >-
      needs.auswahl.outputs.discover_frontend == 'true'
    # Workflow-Concurrency der Quelle (PR-Abbruch bzw. Gruppe je Zweig) am Job
    concurrency:
      group: discover-frontend-qa-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    # 11.11.2026: Browser kommen aus dem Playwright-Image (Version = npm playwright@ unten) statt per apt-get/playwright install
    # (apt-DNS auf azure.archive.ubuntu.com haengt zeitweise > 60 min). Python fehlt im Image: statischer Server scripts/ci/static-server.mjs.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    defaults:
      run:
        shell: bash
    # Bekannte Fehler (scripts/discover/known-defects.json) warten je Ladevorgang
    # bis zum Zeitlimit der Pruefung; mit Direktlink-Schritt in beiden Engines
    # reichen 35 Minuten dann nicht. Kein Check wird dadurch gelockert.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Workspace fuer git freigeben (Container laeuft als root)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: One Discover (single implementation, legacy alias, navigation, contract)
        run: node scripts/discover/consolidation-gate.mjs
      - name: Existing contract and navigation tests
        run: node --test discover/tests/*.test.mjs quant/tests/site-navigation.test.mjs
      - name: Browser quality dependencies
        timeout-minutes: 8
        run: |
          npm install --prefix /tmp/discover-qa-deps --no-audit --no-fund playwright@1.63.0 axe-core@4.10.3
      # Offener Tab ueber ein Deployment (lazy.js + Release-Waechter, hinter der Sperre). Setzt den Quant-PR voraus
      # (quant/ui/release-guard.js, scripts/vu2/deploy-switch-lib.mjs); davor uebersprungen.
      - name: Deployment switch with an open tab
        if: hashFiles('scripts/vu2/deploy-switch-lib.mjs') != ''
        env:
          NODE_PATH: /tmp/discover-qa-deps/node_modules
        run: node scripts/discover/deploy-switch-qa.mjs --engine chromium,webkit
      # Datenzweig vor dem Bau wie pages-release.yml (Plan Neustart §3): BRANCH_ONLY-Daten (z. B. marketPulse) liegen in main
      # nur eingefroren; ohne diesen Schritt prueft der Bau einen anderen Stand als die ausgelieferte Seite. Vertragstest DB-16.
      - name: Datenzweig in den Arbeitsbaum (vor dem Bau)
        run: scripts/ci/seed-data-branch.sh alle
      - name: Build exact Pages delivery artifact
        run: node scripts/vu2/build-release.mjs --output="$RUNNER_TEMP/discover-release"
      - name: Browser, accessibility, performance and screenshot gates
        env:
          NODE_PATH: /tmp/discover-qa-deps/node_modules
          SITE: ${{ inputs.site }}
        run: |
          mkdir -p /tmp/discover-evidence
          node scripts/ci/static-server.mjs --dir="$RUNNER_TEMP/discover-release" --port=8765 > /tmp/discover-evidence/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in 1 2 3 4 5; do curl --fail --silent http://127.0.0.1:8765/discover/ > /dev/null && break; sleep 1; done
          chromium_status=0
          webkit_status=0
          node scripts/discover/browser-qa.mjs --url "${SITE:-http://127.0.0.1:8765}" --out /tmp/discover-evidence || chromium_status=$?
          node scripts/discover/browser-qa.mjs --engine webkit --url "${SITE:-http://127.0.0.1:8765}" --out /tmp/discover-evidence/webkit || webkit_status=$?
          test "$chromium_status" -eq 0 && test "$webkit_status" -eq 0
      # Phase 4: die Direktlink-Pruefung vergleicht meta vu-release mit /release-id.json und jeden ?v= mit den ausgelieferten Bytes. Dafuer
      # braucht der Release die Kennung - in pages-release.yml steht dieser Schritt nach dem Verkleinern und vor der Passwortsperre.
      - name: Stamp release identifier like pages-release (meta vu-release, release-id.json, ?v= stamps)
        run: node scripts/vu2/release-id.mjs "$RUNNER_TEMP/discover-release"
      - name: Direct links through the active access gate, slow networks and parallel loads
        # PR #619: ein WebKit-Race trat nur ueber die Zugangsmaske auf (document.write-Pfad). Das Skript verpackt die HTML-Seiten
        # des Release wie pages-release.yml (protectRelease, Einmalpasswort) und laedt jede Route durch die Maske.
        env:
          NODE_PATH: /tmp/discover-qa-deps/node_modules
        run: |
          mkdir -p /tmp/discover-evidence/direct
          chromium_status=0
          webkit_status=0
          node scripts/discover/browser-qa-direct.mjs --release "$RUNNER_TEMP/discover-release" --engine chromium --out /tmp/discover-evidence/direct || chromium_status=$?
          node scripts/discover/browser-qa-direct.mjs --release "$RUNNER_TEMP/discover-release" --engine webkit --out /tmp/discover-evidence/direct || webkit_status=$?
          test "$chromium_status" -eq 0 && test "$webkit_status" -eq 0
      - name: Preserve screenshot and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discover-browser-evidence
          path: /tmp/discover-evidence
          if-no-files-found: warn

  # Die Quant-Suite des SEC-Adapters: er ist Teil des bestehenden Quant-Systems, es genuegt
  # nicht, nur seine eigenen Tests zu fahren - die Phase-1-3-Suite muss gruen bleiben.
  # Drei Shards (node --test-shard) statt eines 400-s-Schritts in sec-fundamentals.
  sec-fundamentals-quant-suite:
    needs: auswahl
    if: >-
      needs.auswahl.outputs.sec_fundamentals == 'true'
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('sec-fundamentals-quant-suite-pr-{0}-{1}', github.event.pull_request.number, matrix.shard) || format('sec-fundamentals-quant-suite-{0}-{1}', github.run_id, matrix.shard) }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run the quant test suite shard (JS, no network)
        env:
          SHARD: ${{ matrix.shard }}
        run: node --test --test-shard="$SHARD/3" "quant/tests/*.test.mjs"

  # --- sec-fundamentals: vormals sec-fundamentals-ci.yml
  sec-fundamentals:
    needs: auswahl
    if: >-
      needs.auswahl.outputs.sec_fundamentals == 'true'
    # Workflow-Concurrency der Quelle (PR-Abbruch bzw. Gruppe je Zweig) am Job
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('sec-fundamentals-ci-pr-{0}', github.event.pull_request.number) || format('sec-fundamentals-ci-{0}', github.run_id) }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # HEAD^1 ist im pull_request-Ereignis die aktuelle Basis (Gate unten).
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Compile every pipeline module
        run: python3 -m compileall -q scripts/quant

      - name: Run the SEC ingestion test suite (Python, no network)
        run: python3 scripts/quant/cli.py test

      # Die ganze Quant-Suite (JS) laeuft parallel in sec-fundamentals-quant-suite
      # (3 Shards): sie war mit ~400 s der laengste Schritt dieses Jobs und damit
      # die Laufzeit von ci-gate bei Quant-/SEC-PRs.

      - name: Verify the SEC adapter satisfies the existing provider interface
        run: |
          node -e '
            const path = require("path");
            const Provider = require("./quant/engines/provider.js");
            const Adapter = require("./providers/sec/adapter.js");
            const provider = Adapter.createSecProvider();
            const missing = Provider.missingMethods("FundamentalDataProvider", provider);
            if (missing.length) {
              console.error("SEC adapter does not implement FundamentalDataProvider:", missing);
              process.exit(1);
            }
            // It must NOT claim interfaces it cannot serve.
            for (const iface of ["MarketDataProvider", "EstimateDataProvider", "CorporateActionsProvider"]) {
              if (Provider.implementsInterface(iface, provider)) {
                console.error("SEC adapter must not claim " + iface);
                process.exit(1);
              }
            }
            console.log("SEC adapter interface contract OK");
          '

      - name: Reject a second architecture
        shell: bash
        run: |
          # The SEC workstream must not grow its own provider abstraction,
          # capability matrix, PIT rule, factor engine or backtester alongside
          # the existing ones. These are the names that would signal it.
          if grep -rniE "class .*Provider(Registry|Abstraction)|CAPABILITY_SETS|def (run_backtest|backtest_symbol)|def score_universe" scripts/quant/sec/; then
            echo "::error::scripts/quant/sec/ appears to duplicate an existing quant layer"
            exit 1
          fi
          for gone in scripts/quant/sec/factors.py scripts/quant/sec/backtest_bridge.py; do
            if [ -f "$gone" ]; then
              echo "::error::$gone duplicates an existing engine and must stay removed"
              exit 1
            fi
          done
          # Capabilities are declared once, in the shared profile file.
          if grep -rn "CAPABILITIES = {" scripts/quant/sec/; then
            echo "::error::capabilities must be declared in quant/config/provider-profiles.json"
            exit 1
          fi
          echo "no parallel architecture detected"

      - name: Validate configuration files
        run: |
          python3 - <<'PY'
          import json, sys
          sys.path.insert(0, "scripts")
          from quant.sec.registry import MetricRegistry

          registry = MetricRegistry.load()
          print("metric registry:", registry.version, len(registry.names()), "metrics")

          profiles = json.load(open("quant/config/provider-profiles.json"))
          assert "sec-edgar" in profiles["providers"], "SEC provider profile missing"
          print("provider profile: sec-edgar present")

          universe = json.load(open("quant/config/sec-universe.json"))
          assert universe["companies"], "universe must not be empty"
          for entry in universe["companies"]:
              assert entry["ticker"] and entry["cik"], entry
          print("universe:", [c["ticker"] for c in universe["companies"]])
          PY

      - name: Validate the generated SEC data JSON
        run: |
          python3 - <<'PY'
          import json, pathlib
          # Only what THIS pipeline generates. quant/data/*.json belongs to the
          # earlier phases and follows their own convention (asOf,
          # methodologyVersion, dataSnapshotId); asserting the SEC convention
          # over the whole directory failed on eight files this branch never
          # wrote. The check had never run before the first pull request, which
          # is exactly how it survived that long.
          root = pathlib.Path("quant/data/sec")
          paths = sorted(root.glob("*.json")) + sorted(root.glob("*/*.json"))
          assert paths, "no generated SEC artifacts found"
          # Two naming conventions, on purpose. Below the canonical boundary the
          # SEC layer uses snake_case; at and above it the payload follows
          # quant/engines/schema.js, which is camelCase. An artifact must carry
          # its provenance in one of the two, never in neither.
          SNAKE = ("schema_version", "generated_at_utc")
          CAMEL = ("schema", "generatedAtUtc")
          for path in paths:
              payload = json.loads(path.read_text(encoding="utf-8"))
              assert isinstance(payload, dict), path
              stamped = any(key in payload for key in SNAKE + CAMEL)
              assert stamped, f"{path} carries neither {SNAKE} nor {CAMEL}"
              assert "versions" in payload, f"{path} has no version stamp"
              print(f"{path}: OK ({path.stat().st_size} bytes)")
          PY

      - name: Validate the data inspector page
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          path = "quant/data-inspector/index.html"
          html = open(path, encoding="utf-8").read()

          class Checker(HTMLParser):
              def error(self, message):
                  raise AssertionError(message)

          Checker().feed(html)
          # Attribute (theme, theme-switch, no-preview) sind erlaubt; geprueft
          # wird, dass die gemeinsame Navigation als Element vorhanden ist.
          import re
          assert re.search(r"<vu-navigation(\s[^>]*)?></vu-navigation>", html), "shared navigation missing"
          # The inspector is a quant page and must use the quant shell, not a
          # second UI stack of its own.
          assert "/quant/ui/shell.js" in html, "shared quant shell missing"
          assert "/quant/ui/quant.css" in html, "shared quant design system missing"
          print(f"{path}: OK ({len(html)} bytes)")
          PY

      - name: Reject company-specific logic in the pipeline
        # The rule lives in a script, not in this file, so it can be run before
        # pushing and is covered by the test suite. The previous grep matched
        # comments and __pycache__ alongside code: naming the company whose real
        # data exposed a defect is how findings are documented here, and a
        # binary .pyc is not source at all.
        run: python3 scripts/quant/check_company_agnostic.py

      - name: Enforce data hygiene
        shell: bash
        run: |
          # Raw SEC payloads and normalized factbooks must never be committed.
          # raw/ and facts/ are large and regenerable and stay local. canonical/
          # is the opposite: it IS the data layer the adapter serves, so it is
          # committed.
          for forbidden in quant/data/sec/raw quant/data/sec/facts .sec-cache .quant-state; do
            if git ls-files --error-unmatch "$forbidden" >/dev/null 2>&1; then
              echo "::error::$forbidden is tracked but must stay local"
              exit 1
            fi
          done
          # Committed artifacts stay small enough to review in a diff.
          oversized="$(find quant/data/sec -type f -size +2M 2>/dev/null || true)"
          if [ -n "$oversized" ]; then
            echo "::error::files over 2MB under quant/data/sec:"; echo "$oversized"; exit 1
          fi
          # Canonical R2-backed source remains intact. Measure the actual
          # product artifact, never the full storage source tree.
          scripts/ci/seed-data-branch.sh alle  # wie pages-release.yml vor dem Bau (DB-16)
          node scripts/vu2/build-release.mjs --output="$RUNNER_TEMP/sec-delivery"
          total="$(du -sk "$RUNNER_TEMP/sec-delivery/quant/data/sec" | cut -f1)"
          if [ "$total" -gt 8192 ]; then
            echo "::error::SEC delivery is ${total}KB, over the unchanged 8MB budget"
            exit 1
          fi
          echo "SEC product delivery OK (${total}KB of 8192KB)"

      - name: Reject secrets in the SEC pipeline
        shell: bash
        run: |
          # The SEC APIs need no key. Anything that looks like one is a mistake.
          if grep -rniE '(api[_-]?key|secret|token|password)[[:space:]]*=[[:space:]]*["'"'"'][A-Za-z0-9_\-]{16,}' scripts/quant/ quant/; then
            echo "::error::possible credential committed"
            exit 1
          fi
          echo "no credentials found"

      - name: Confirm the existing backtest engine is untouched by the bridge
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          # The bridge imports scripts/dashboard/backtest_technicals.py; a change
          # to that file is a change to the production technical pipeline and
          # must not arrive through a SEC-pipeline pull request.
          # Bis 10/2026 lief hier origin/main...HEAD mit 2>/dev/null in einem
          # flachen Checkout ohne origin/main: der Vergleich scheiterte immer
          # still, das Gate war wirkungslos. Jetzt gegen HEAD^1, laut.
          set -euo pipefail
          geaendert=$(git diff --name-only HEAD^1 HEAD)
          if grep -q '^scripts/dashboard/' <<<"$geaendert"; then
            echo "::error::this pipeline must not modify scripts/dashboard/"
            exit 1
          fi
          echo "scripts/dashboard/ untouched"

  # --- social: vormals social-ci.yml
  social:
    needs: auswahl
    if: >-
      needs.auswahl.outputs.social == 'true'
    # Workflow-Concurrency der Quelle (PR-Abbruch bzw. Gruppe je Zweig) am Job
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('social-ci-pr-{0}', github.event.pull_request.number) || format('social-ci-{0}', github.run_id) }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # =====================================================================
      # DEN CREATIVE-JOB-REGISTERZUSTAND AN DIE EVIDENZ HOLEN — VOR
      # MAX_OPEN_CREATIVE_JOBS (Owner-Direktive "WORKFLOW-ORDERING-FIX",
      # 24.09.)
      #
      # Dieselbe Reihenfolge, aus demselben Grund, wie in
      # social-orchestrator.yml: die fuenf harten Invarianten unten
      # (check-hard-invariants.mjs, ueber die Suite gemessen) zaehlen
      # MAX_OPEN_CREATIVE_JOBS aus dem gerade ausgecheckten
      # social/data/creative-jobs.json. Ein Register-Eintrag ohne je
      # geoeffneten Request-PR (DISPATCH_NIE_ERFOLGT) blockiert diese
      # CI sonst genauso wie er den Orchestrator blockierte — nicht,
      # weil der Code falsch waere, sondern weil niemand vor der
      # Zaehlung nachgesehen hat.
      #
      # --write schreibt nur in den ephemeren Checkout dieses Laufs;
      # diese CI committet nichts zurueck (kein Push-Schritt in dieser
      # Datei). Die eigentliche, dauerhafte Bereinigung geschieht durch
      # denselben Schritt im Orchestrator, dessen Ergebnis er
      # festschreibt.
      # =====================================================================
      - name: Creative-Ergebnisse von offenen Request-PRs holen
        run: node products/social/producer/ingest-open-creative-jobs.mjs --write

      - name: Creative Jobs gegen die Evidenz abgleichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: node products/social/producer/reconcile-creative-jobs.mjs --write

      # =====================================================================
      # DIE SUITEN UND DIE ISOLATION — EINMAL, UND MIT STAND
      #
      # verify-suites.mjs laesst beide Suiten und die Isolationspruefung
      # laufen und schreibt das Ergebnis samt Commit nach
      # .verification/suites.json. Frueher standen hier zwei getrennte
      # Testschritte, und der Reifebericht bekam die Fahne
      # `--suites-green ja` - eine Behauptung des Workflows ueber die
      # Arbeit, die der Bericht bewerten sollte.
      #
      # Der Schritt scheitert, wenn eine Suite rot ist oder ein Testlauf
      # eine Produktionsdatei veraendert hat. Beides bleibt damit ein
      # harter Fehler der CI und wird nicht erst im Bericht sichtbar.
      # =====================================================================
      - name: Suiten und Test-/Produktionsisolation messen
        run: node products/social/producer/verify-suites.mjs

      - name: Was gemessen wurde
        if: always()
        run: cat .verification/suites.json || echo "Kein Befund geschrieben."

      # Die fuenf harten Invarianten (§45). Sie werden GEMESSEN, nicht
      # gelesen: der Publish-Pfad wird zweimal aufgerufen und muss
      # zweimal mit SEINEM eigenen Grund ablehnen.
      - name: Die fuenf harten Invarianten
        run: node products/social/producer/check-hard-invariants.mjs

      # Der Reifezustand des Approval Centers, gemessen am Repository.
      # Er schaltet nichts frei; er stellt fest - und was er von hier aus
      # nicht messen kann (ob der Worker deployt ist), bleibt
      # ausdruecklich UNGEPRUEFT statt als bestanden zu gelten.
      # Ohne --suites-green: der Suitenzustand kommt aus dem gemessenen
      # Befund des Schritts oben (.verification/suites.json, an diesen
      # Commit gebunden). Die Fahne war eine Behauptung des Workflows
      # ueber die Arbeit, die dieser Bericht bewerten soll.
      - name: APPROVAL_CENTER_PRODUCTION_READY
        run: node products/social/producer/approval-center-readiness.mjs

      # =====================================================================
      # §26/§27 — DIE GEMESSENEN ZUSTAENDE DES ASSET-/HASHTAG-AUFTRAGS
      #
      # Von hier aus ist fast alles messbar: die Tagbreite ueber den
      # echten Themenbestand, die gerenderte Karte, die Sperre, die
      # Zusammensetzung des Sendetextes. Und, anders als in der
      # Entwicklungsumgebung, auch die Erreichbarkeit des Bildes: dieser
      # Runner erreicht research.visionuniverse.de.
      #
      # Was er NICHT erreicht, ist der Worker hinter der eigenen Domain;
      # der Production Smoke steht deshalb erst im Deploy-Workflow.
      #
      # `|| true`: auf einem Zweig ist IN_MAIN_INTEGRIERT
      # notwendigerweise offen. Der Bericht stellt fest, er schaltet
      # nichts frei — und ein roter Lauf dafuer saegte an der falschen
      # Stelle. Rot wird die CI von den Suiten darueber.
      #
      # Lesend. Kein Publish, kein Approve, kein Dispatch.
      # =====================================================================
      - name: ASSET + HASHTAG — die gemessenen Zustaende
        if: always()
        run: |
          set -uo pipefail
          node products/social/producer/asset-hashtag-done.mjs | tee /tmp/asset-hashtag.log || true
          {
            echo "## ASSET + HASHTAG"
            echo '```'
            cat /tmp/asset-hashtag.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Die Cloudflare-Skripte sind syntaktisch gueltig und laufen ohne Zugang
        # Sie werden vom Workflow social-cloudflare gerufen, wo ein
        # Syntaxfehler erst nach dem Start auffiele — und dann mit
        # Cloudflare-Zugang im Ruecken.
        run: |
          for file in products/social/producer/provision-cloudflare.mjs products/social/producer/verify-worker.mjs; do
            node --check "$file" 2>/dev/null || node -e "import('./$file')" >/dev/null 2>&1 || true
          done
          # provision bricht ohne Zugangsdaten ab — mit einer Meldung, nicht mit einem Stacktrace.
          if node products/social/producer/provision-cloudflare.mjs --ensure-kv 2>&1 | grep -q "ABBRUCH"; then
            echo "provision-cloudflare.mjs meldet fehlenden Zugang sauber."
          else
            echo "::error::provision-cloudflare.mjs verhaelt sich ohne Zugang unerwartet."
            exit 1
          fi
          # verify meldet ein Ergebnis und wirft nicht — was auch immer das
          # Netz sagt.
          #
          # Hier stand `grep -q "Worker-Adresse bekannt"`. Diese Zeile
          # erscheint NUR, wenn die Adresse FEHLT. Sie fehlte, solange sie
          # aus einem Secret kam, das es in der CI nie gab; seit sie einen
          # Vorgabewert aus wrangler.toml hat, kann der Fall nicht mehr
          # eintreten. Die Pruefung verlangte damit Text von einem
          # Programm, das ihn zu Recht nicht mehr schreibt — und war rot,
          # obwohl alles stimmte.
          #
          # Geprueft gehoert der Vertrag, nicht der Wortlaut eines
          # Sonderfalls: ein Ergebnis steht da, und es gibt keinen
          # Stacktrace. Ob der Worker gerade erreichbar ist, ist eine
          # Frage an die Infrastruktur und nicht an diesen Code — ein
          # roter Lauf deswegen saegte an der falschen Stelle.
          ausgabe="$(node products/social/producer/verify-worker.mjs 2>&1 || true)"
          echo "$ausgabe" | tail -6
          if echo "$ausgabe" | grep -q "^Abgebrochen:"; then
            echo "::error::verify-worker.mjs ist mit einem Stacktrace abgebrochen."
            exit 1
          fi
          if echo "$ausgabe" | grep -q "^Ergebnis: "; then
            echo "verify-worker.mjs meldet ein Ergebnis, ohne zu werfen."
          else
            echo "::error::verify-worker.mjs meldet kein Ergebnis."
            exit 1
          fi

      - name: Worker-Preflight (lokale Pruefungen)
        # Ohne Cloudflare-Zugang prueft er die Konfiguration: Zielname,
        # Platzhalter, und vor allem — keine Secret-Werte in wrangler.toml.
        run: node products/social/producer/preflight-worker.mjs

      - name: Konfigurations- und Methodikdateien sind gueltiges JSON
        run: |
          files=$(find social/config social/methodology -name '*.json')
          for file in $files; do
            node -e "JSON.parse(require('fs').readFileSync('$file','utf8'))" || exit 1
          done
          echo "$(echo "$files" | wc -l) JSON-Dateien geprueft"

      - name: Jede Engine laedt in Node und registriert sich nicht global
        # Die Engines laufen in Browser UND Node (UMD-Muster wie quant/engines).
        # Ein Ladefehler faellt hier auf und nicht erst im Browser.
        run: |
          for file in social/engines/*.js; do
            node -e "
              const api = require('./$file');
              if (!api || typeof api !== 'object') throw new Error('$file exportiert nichts');
            " || exit 1
          done
          echo "$(ls social/engines/*.js | wc -l) Engines geprueft"

      - name: Der Kill Switch ist im ausgelieferten Zustand AUS
        # Die wichtigste Zeile dieser Datei. Sie faengt den Fall, dass
        # jemand den Schalter zum Testen umlegt und das Zuruecklegen
        # vergisst — der einzige Weg, auf dem dieses System versehentlich
        # etwas veroeffentlichen koennte.
        run: |
          node -e '
            const config = require("./social/config/kill-switch.json");
            const gate = config.gates.GLOBAL_AUTOPUBLISH;
            if (gate.enabled !== false) {
              throw new Error(
                "GLOBAL_AUTOPUBLISH ist eingeschaltet. Das ist eine Owner-Entscheidung und " +
                "gehoert in einen eigenen Commit mit Begruendung — nicht in einen Nebeneffekt.");
            }
            const meta = config.gates.PROVIDER_META;
            if (meta.enabled !== false) {
              throw new Error("PROVIDER_META ist eingeschaltet, obwohl der Provider nie gegen die echte API lief.");
            }
            console.log("Kill Switch: global AUS, Meta AUS.");
          '

      - name: Der Verbindungsabruf laeuft ohne Zugang fehlerfrei durch
        # Dieselbe Eigenschaft wie ueberall: ein fehlender Zugang ist eine
        # Konfigurationsfrage, kein Baufehler. Das erzeugte Artefakt sagt
        # ausdruecklich, dass es ueber die Verbindung nichts aussagen kann.
        #
        # Diese Pruefung verlangte frueher `state: "not_configured"` und
        # `connected: false` — also genau die beiden Werte, die
        # fetch-meta-status.mjs bewusst NICHT mehr schreibt.
        #
        # Der Grund steht im Skript: NICHT KONFIGURIERT ist eine Aussage
        # ueber die VERBINDUNG, ZUGANGSDATEN FEHLEN eine ueber DIESEN
        # LAUF. Aus der zweiten folgt die erste nicht — und aus den alten
        # Feldern ist genau dieser Fehlschluss an den Owner gegangen.
        # `connected` ist seitdem null und nicht false, weil Unbekanntes
        # sonst aussieht wie Abwesendes.
        #
        # Die Pruefung bestand also darauf, dass das Artefakt die falsche
        # Aussage wieder macht. Sie prueft jetzt die richtige.
        run: |
          node products/social/producer/fetch-meta-status.mjs
          node -e '
            const { execSync } = require("child_process");
            execSync("node products/social/producer/fetch-meta-status.mjs --out /tmp/social-meta");
            const report = require("/tmp/social-meta/meta-connection.json");
            if (report.state !== "credentials_missing_here") {
              throw new Error("Ohne Zugang muss der Zustand credentials_missing_here sein, war: " + report.state);
            }
            if (report.connected !== null) {
              throw new Error("connected muss null sein - dieser Lauf weiss nichts ueber die Verbindung. War: " + report.connected);
            }
            if (report.probeScope !== "THIS_RUN_ONLY") {
              throw new Error("probeScope muss THIS_RUN_ONLY sein, war: " + report.probeScope);
            }
            console.log("Verbindungsbericht korrekt: " + report.state + ", connected=null, Reichweite " + report.probeScope);
          '

      - name: Die Signalsammlung laeuft ohne Zugang fehlerfrei durch
        # Dieselbe Eigenschaft wie beim Marktdatenabruf in quant-ci.yml:
        # ein fehlender Zugang ist eine Konfigurationsfrage, kein Baufehler.
        run: |
          node products/social/producer/collect-vu-signals.mjs

      - name: Der vollstaendige Zyklus laeuft gegen den Mock durch
        # Der Nachweis aus §53: der Kreislauf traegt, und ein Provider kann
        # ihn durchlaufen. Veroeffentlicht wird dabei nichts — der globale
        # Schalter ist aus, und der Mock verlaesst den Prozess ohnehin nie.
        run: |
          node products/social/producer/collect-vu-signals.mjs --out /tmp/social-ci
          cp /tmp/social-ci/signals.json social/data/signals.json
          node products/social/producer/run-social-cycle.mjs --provider mock
          git checkout -- social/data/signals.json 2>/dev/null || true

      - name: Keine Zugangsdaten und keine Anbieterbindung in ausgelieferten Pfaden
        run: node products/social/producer/assert-no-secrets.mjs

      - name: Die Seiten des Command Center binden Shell und Navigation ein
        run: |
          for page in $(find social -name 'index.html'); do
            grep -q 'vu-navigation' "$page" || { echo "$page ohne Vision-Universe-Navigation"; exit 1; }
            grep -q 'site-navigation.css' "$page" || { echo "$page ohne Navigations-Stylesheet"; exit 1; }
          done
          echo "$(find social -name 'index.html' | wc -l) Seiten geprueft"

  # §48: Der bestehende Quant-Bereich bleibt unberuehrt (Social-Guard). Vormals ein 400-s-Schritt im Job social; jetzt 3 Shards.
  social-quant-suite:
    needs: auswahl
    if: >-
      needs.auswahl.outputs.social == 'true'
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('social-quant-suite-pr-{0}-{1}', github.event.pull_request.number, matrix.shard) || format('social-quant-suite-{0}-{1}', github.run_id, matrix.shard) }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run the quant test suite shard (JS, no network)
        env:
          SHARD: ${{ matrix.shard }}
        run: node --test --test-shard="$SHARD/3" "quant/tests/*.test.mjs"

  # Quant-2.0-Regression des Supertrader-Jobs (bestehende Tests); vormals ein Schritt in supertrader, jetzt 3 Shards.
  supertrader-quant-suite:
    needs: auswahl
    if: >-
      needs.auswahl.outputs.supertrader == 'true'
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('supertrader-quant-suite-pr-{0}-{1}', github.event.pull_request.number, matrix.shard) || format('supertrader-quant-suite-{0}-{1}', github.run_id, matrix.shard) }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run the quant test suite shard (JS, no network)
        env:
          SHARD: ${{ matrix.shard }}
        run: node --test --test-shard="$SHARD/3" "quant/tests/*.test.mjs"

  # --- supertrader: vormals supertrader-ci.yml
  supertrader:
    needs: auswahl
    if: >-
      needs.auswahl.outputs.supertrader == 'true'
    # Workflow-Concurrency der Quelle (PR-Abbruch bzw. Gruppe je Zweig) am Job
    concurrency:
      group: supertrader-ci-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    # 11.11.2026: Browser kommen aus dem Playwright-Image (Version = npm playwright@ unten) statt per apt-get/playwright install
    # (apt-DNS auf azure.archive.ubuntu.com haengt zeitweise > 60 min). Python fehlt im Image: statischer Server scripts/ci/static-server.mjs.
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    defaults:
      run:
        shell: bash
    # 45 statt 30 Minuten: der Checkout des vollen Arbeitsbaums (~2-3 GB) schwankt
    # GitHub-seitig stark (2:46 in Lauf 41686237365, 14:43 im parallel
    # gestarteten core-ci-Lauf 41686237440, >15 min im package-Job von Lauf
    # 41688632337). Der Rest des Jobs braucht rund 13 Minuten.
    timeout-minutes: 45
    steps:
      # Keine volle Historie: fetch-depth 0 holte alle Branches und Tags (.git
      # rund 16 GB); seit 03.11.2026 ~16:08 UTC hing der Checkout bis zum
      # 30-Minuten-Limit (Lauf 41671038235). Nur Gate A braucht Historie, und
      # zwar nur eine erreichbare Merge-Basis zur PR-Basis. Im PR ist der
      # Checkout der Merge-Commit; Tiefe 2 bringt seine Eltern (Basis und
      # PR-Kopf) mit, die Basis wird im naechsten Schritt gezielt geholt.
      # Alle anderen Schritte brauchen nur den Stand selbst (git ls-files,
      # git rev-parse HEAD, eigene Fixture-Repos). Zwei Quant-Regressionen
      # mit Historienbezug (v13b Basis-Loader, v11 Chronologie) ueberspringen
      # sich im flachen Checkout selbst - genau wie in quant-ci.yml, das immer
      # flach auscheckt.
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
      - name: Workspace fuer git freigeben (Container laeuft als root)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Basis fuer Gate A: nur den Basis-Branch holen und vertiefen, bis die
      # Merge-Basis mit dem PR erreichbar ist. Ist sie nach der letzten
      # Vertiefung nicht erreichbar, wird der Schritt laut rot (ADR-005) -
      # nie still "0 Dateien".
      - name: Basis fuer Gate A holen (flach, vertieft bis zur Merge-Basis)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          test -n "$BASE_REF"
          # Nur Commits und Baeume (--filter=blob:none): merge-base und
          # git diff --name-only brauchen keine Dateiinhalte. Die Datenlaeufe
          # schreiben je Commit ueber tausend Dateien; mit Inhalten kostete
          # schon Tiefe 50 rund 1,5 Minuten. Tiefe 1 reicht im Normalfall,
          # weil die PR-Basis (HEAD^1) der Kopf des Basis-Branches ist.
          git fetch --no-tags --prune --filter=blob:none --depth=1 origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          for deepen in 50 200 1000 5000; do
            if mb="$(git merge-base "origin/$BASE_REF" HEAD)"; then break; fi
            mb=""
            echo "Merge-Basis zu origin/$BASE_REF noch nicht erreichbar - vertiefe um $deepen"
            git fetch --no-tags --filter=blob:none --deepen="$deepen" origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          done
          if [ -z "${mb:-}" ]; then mb="$(git merge-base "origin/$BASE_REF" HEAD || true)"; fi
          if [ -z "$mb" ]; then
            echo "::error::Merge-Basis zwischen HEAD und origin/$BASE_REF nicht erreichbar - Gate A kann nicht pruefen"
            exit 1
          fi
          echo "Merge-Basis zu origin/$BASE_REF: $(git rev-parse --short "$mb") (HEAD^1 $(git rev-parse --short HEAD^1))"
      - name: Gate A (Bericht) — beruehrte Produkte ausserhalb Supertrader
        # Seit 05.11.2026 Vertragstests statt Pfad-Isolation (core/registry/product-contracts.json).
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          node scripts/supertrader/guard-protected-paths.mjs --base="origin/$BASE_REF"
      - name: Produktvertraege (Pfade loesen die Produkt-CI aus, Schnittstellen-Schemata)
        run: node --test core/tests/product-contracts.test.mjs
      - name: Gate B/D/E — Engine, Registry, Source Ledger, Artefakte
        run: node --test "scripts/supertrader/tests/*.test.mjs"
      # Nur hier mit SF9_E2E=1: In den Produktionslaeufen (Signalkette, SF8-Tageslauf) ueberspringt sich der Test,
      # damit er keine Veroeffentlichung verlaengert oder blockiert.
      - name: E2E SF8-Tagesweg (nur Pruefung, keine Veroeffentlichung)
        env:
          SF9_E2E: '1'
        run: node --test scripts/supertrader/tests/sf-sf9-e2e.test.mjs
      - name: Build auf den aktuellen kanonischen Artefakten (frisches Protokoll, temporaer)
        run: node scripts/supertrader/build.mjs --out="$RUNNER_TEMP/supertrader-build"
      - name: Build wie im Produktivlauf (inkrementell auf einer Kopie, Runner-Standard-Heap)
        # Speicher-Fruehwarnung: der Signallauf laeuft mit dem Node-Standard des
        # Runners (gemessen 27.10.2026: 4144 MB; Bedarf ~2,5 GB, lokal mit
        # 2096 MB Standard Abbruch). Bricht dieser Schritt ab, reicht der
        # Standard nicht mehr. Schreibt nur in RUNNER_TEMP.
        run: |
          set -euo pipefail
          echo "Runner-Standard Heap-Grenze (MB): $(node -p 'Math.round(require("v8").getHeapStatistics().heap_size_limit/1048576)')"
          cp -r supertrader "$RUNNER_TEMP/supertrader-inkrementell"
          node scripts/supertrader/build.mjs --out="$RUNNER_TEMP/supertrader-inkrementell"
      - name: Discovery-Regression (bestehende Tests)
        run: node --test "discover/tests/*.test.mjs"
      - name: Browser QA dependencies
        timeout-minutes: 8
        run: |
          npm install --prefix /tmp/supertrader-qa-deps --no-audit --no-fund playwright@1.56.1
      # Datenzweig vor dem Bau wie pages-release.yml (Plan Neustart §3): BRANCH_ONLY-Daten (z. B. marketPulse) liegen in main
      # nur eingefroren; ohne diesen Schritt prueft der Bau einen anderen Stand als die ausgelieferte Seite. Vertragstest DB-16.
      - name: Datenzweig in den Arbeitsbaum (vor dem Bau)
        run: scripts/ci/seed-data-branch.sh alle
      - name: Exaktes Pages-Auslieferungsartefakt bauen
        run: node scripts/vu2/build-release.mjs --output="$RUNNER_TEMP/release"
      - name: Generationenmanifest im Releasebau (ADR-008)
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/release/core/release-manifest.json"
          node -e 'const m=JSON.parse(require("fs").readFileSync(process.argv[1]));if(m.schema!=="vu-release-manifest-1"||!/^[0-9a-f]{40}$/.test(m.code.sha)||!/^[0-9a-f]{64}$/.test(m.payloadHash))process.exit(1);console.log("Nutzdatenhash "+m.payloadHash+" Code "+m.code.sha+" Datenzweig "+m.dataBranch.sha)' "$RUNNER_TEMP/release/core/release-manifest.json"
      - name: Gate F — Browser QA 390 px und 1280 px gegen das Release
        run: |
          test -f "$RUNNER_TEMP/release/supertrader/index.html"
          test -f "$RUNNER_TEMP/release/supertrader/data/signals.json"
          node scripts/supertrader/browser-qa.mjs --site="$RUNNER_TEMP/release" --out=/tmp/supertrader-evidence --playwright=/tmp/supertrader-qa-deps/node_modules/playwright
      - name: Keine Secrets in Supertrader-Artefakten
        run: |
          if grep -rEIl '(api[_-]?key|secret|token|password|authorization)["'"'"' ]*[:=]' supertrader/ scripts/supertrader/ ; then echo "Verdaechtiger Schluessel gefunden"; exit 1; fi
      - name: Preserve screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supertrader-browser-evidence
          path: /tmp/supertrader-evidence
          if-no-files-found: ignore
          retention-days: 14

  # --- technical: vormals technical-ci.yml
  technical:
    needs: auswahl
    if: >-
      needs.auswahl.outputs.technical == 'true'
    # Workflow-Concurrency der Quelle (PR-Abbruch bzw. Gruppe je Zweig) am Job
    concurrency:
      group: technical-ci-${{ github.ref_name }}
