# =========================================================================
# SOCIAL — WORK HAT GELIEFERT (Owner-Auftrag "WORK OWNS THE POST", 29.09.)
#
# ChatGPT Work committet sein Ergebnis auf den Request-Branch. Bisher
# holte es erst der naechste Orchestrator-Lauf ab (Zeitplan zweimal
# taeglich oder ein Knopfdruck) - ein fertiges Carousel lag bis dahin
# unsichtbar auf einem Branch, und ein wartender Auftrag in der
# Post-Schlange wartete mit.
#
# Dieser Workflow stoesst bei jeder Lieferung genau einen Orchestrator-
# Lauf im Modus EINHOLEN an: Ergebnis einholen, pruefen, zum Kandidaten
# machen, ins Approval Center uebertragen - und den naechsten wartenden
# Auftrag starten. Er selbst schreibt nichts.
#
# Er feuert auf Pushes, die ein Ergebnis enthalten. Die Pushes des
# Orchestrators selbst (GITHUB_TOKEN) loesen keine Workflows aus; die des
# Agenten schon.
# =========================================================================
name: Social Work Delivery

on:
  push:
    branches:
      - 'authoring/request/**'
    paths:
      - 'authoring/requests/**/authoring-result.json'

permissions:
  actions: write
  contents: read

jobs:
  einholen:
    runs-on: ubuntu-latest
    steps:
      - name: Orchestrator im Modus EINHOLEN anstossen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "Lieferung auf ${GITHUB_REF_NAME} (${GITHUB_SHA})."
          gh workflow run social-orchestrator.yml \
            --repo "${GITHUB_REPOSITORY}" --ref main \
            -f modus=EINHOLEN -f thema="" -f nur_entscheiden=false
          echo "Orchestrator-Lauf EINHOLEN angestossen."
