name: Brevo | Newsletter mit Versionsfreigabe
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        description: Separater Newsletter-Prozess; Versand erst nach konkreter Freigabe
        options: [check, initialize, draft, test, preview, send]
        default: check
        required: true
      campaign_id:
        type: string
        description: Konkrete Brevo-Kampagnen-ID
        default: ''
      content_source:
        type: choice
        description: Nur für draft; kuratierter App-Newsletter oder bestehender privater Inhalt
        options: [secret, vision-universe-app]
        default: secret
      expected_version:
        type: string
        description: SHA256 der konkreten Inhaltsversion (keine Inhaltsdaten)
        default: ''
      authorize_send:
        type: boolean
        description: Nur nach ausdrücklicher Freigabe dieses Test- oder Hauptversands
        default: false
      approval_sha256:
        type: string
        description: Nur nach konkreter Owner-Freigabe; SHA256 des privaten Nachweises, niemals Nachricht oder Adressen
        default: ''
      dry_run:
        type: boolean
        description: Nur test/preview/send; prüft Freigabe und Version ohne Reservierung oder E-Mail-Versand
        default: false
permissions:
  contents: read
concurrency:
  group: brevo-newsletter
  cancel-in-progress: false
jobs:
  newsletter:
    if: github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: scripts/brevo
      - name: Version-bound newsletter execution
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_NEWSLETTER_CONFIG: ${{ secrets.BREVO_NEWSLETTER_CONFIG }}
          BREVO_NEWSLETTER_CONTENT: ${{ secrets.BREVO_NEWSLETTER_CONTENT }}
          BREVO_NEWSLETTER_SOURCE: ${{ inputs.content_source }}
          GITHUB_TOKEN: ${{ github.token }}
          BREVO_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BREVO_NEWSLETTER_OPERATION: ${{ inputs.operation }}
          BREVO_CAMPAIGN_ID: ${{ inputs.campaign_id }}
          BREVO_EXPECTED_VERSION: ${{ inputs.expected_version }}
          BREVO_AUTHORIZE_SEND: ${{ inputs.authorize_send }}
          BREVO_APPROVAL_SHA256: ${{ inputs.approval_sha256 }}
          BREVO_DRY_RUN: ${{ inputs.dry_run }}
        run: python3 scripts/brevo/newsletter_actions.py
