name: SEC Consumer-Fundamentals (Produktuniversum, Bulk companyfacts)

# Fundamentaldaten fuer die Consumer Experience: je Unternehmen des
# Produktuniversums ein kompaktes Bundle (Annual / Quarterly / TTM, PIT,
# Herkunft je Wert) aus dem SEC-Bulk-Archiv companyfacts.zip - EINE Anfrage
# statt tausender, genau wie die Fair-Access-Regeln der SEC es wollen.
# Dieselbe Pipeline wie "Update SEC fundamentals" (scripts/quant/sec/),
# nur mit einer anderen, schlanken Ausgabe (scripts/quant/sec/consumer.py).
#
# Identitaet: Ticker + Boerse -> CIK aus der kanonischen Namensschicht
# (quant/data/market/security-master/company-names.json). Ohne CIK gibt es
# keine Fundamentaldaten - und keine Schaetzung.
#
# Ausloeser: Dispatch, woechentlich (Montag frueh, nach dem SEC-Wochenlauf)
# oder ein Push mit der Marke `[sec-consumer]`.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Nur die ersten N CIKs (Testlauf); leer = alle'
        type: string
        default: ''
  schedule:
    - cron: "30 7 * * 1"
  push:
    branches:
      - 'claude/**'

permissions:
  contents: write

concurrency:
  group: sec-consumer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  consumer:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[sec-consumer]')
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Offline-Tests der SEC-Pipeline
        run: python3 scripts/quant/cli.py test

      - name: Universumsquelle
        run: node scripts/market/universe-source.mjs

      # Ein Download, zwei Leser. Der Consumer-Schritt streamte das Archiv
      # bisher und legte nichts ab; der Konzept-Zensus danach suchte genau
      # diese Datei und lief auf FileNotFoundError auf - unsichtbar, weil
      # continue-on-error einen gescheiterten Schritt als success meldet.
      # Deshalb wird es hier einmal in den Cache geholt und von beiden
      # Schritten ueber --archive gelesen, statt es zweimal zu ziehen.
      - name: Sammelarchiv einmal in den Cache holen
        env:
          SEC_USER_AGENT: "VisionUniverseResearch info@visionuniverse.de"
          SEC_CACHE_DIR: ${{ runner.temp }}/sec-cache
        run: |
          python3 -c 'import os, pathlib, sys; sys.path.insert(0, "scripts");
          from quant.sec.provider import SECProvider, BULK_COMPANY_FACTS_URL;
          cache = pathlib.Path(os.environ["SEC_CACHE_DIR"]) / "bulk" / "companyfacts.zip";
          path, size, cached = SECProvider().client.download_to(BULK_COMPANY_FACTS_URL, cache);
          print("companyfacts.zip %.2f GB %s -> %s" % (size/1e9, "aus dem Cache" if cached else "geladen", path))'
          test -s "$SEC_CACHE_DIR/bulk/companyfacts.zip"

      - name: Consumer-Fundamentals aus companyfacts.zip
        env:
          SEC_USER_AGENT: "VisionUniverseResearch info@visionuniverse.de"
          SEC_CACHE_DIR: ${{ runner.temp }}/sec-cache
        run: |
          LIMIT="${{ github.event.inputs.limit }}"
          python3 scripts/quant/cli.py --log-level WARNING consumer --archive "$SEC_CACHE_DIR/bulk/companyfacts.zip" --as-of "$(date -u +%F)" ${LIMIT:+--limit $LIMIT}
          du -sh quant/data/sec/consumer
          node -e 'const c=require("./quant/data/sec/consumer_coverage.json"); console.log(JSON.stringify({productUniverse:c.productUniverse,cikMapped:c.cikMapped,secAvailable:c.secAvailable,annual:c.annualHistory,quarterly:c.quarterlyHistory,ttm:c.ttmPossible,h3:c.history3y,h5:c.history5y,h10:c.history10y,failures:c.failures.length}))'

      # Reine Messung, kein Wert aendert sich. total_debt deckt 2.645 von
      # 5.068 ausgelieferten Emittenten ab, und genau diese Zahl haelt
      # roicTtm, roicMedian3y, netDebtToAssets und salesYield in der
      # Quant-2.0-Faktorevidenz unten. Die Registry bildet total_debt auf
      # zwei Konzepte ab, eines davon eine optionale Sammelangabe, die die
      # meisten US-Filer gar nicht taggen. Welche Tags sie stattdessen
      # benutzen, wird hier gezaehlt statt geraten - was daraus folgt, ist
      # eine Methodik-Entscheidung und passiert nicht in diesem Schritt.
      # Das Archiv liegt schon im Cache; der Schritt laedt nichts nach und
      # darf den Datenlauf nie abbrechen.
      # Nicht mehr continue-on-error: das hat den echten Fehler als
      # 'success' getarnt und ein Owner-Gate auf eine Messung warten
      # lassen, die nie entstand. Der Schritt darf den Datenlauf trotzdem
      # nicht mitreissen - deshalb faengt er selbst und sagt es laut.
      - name: Konzept-Zensus fuer die Schuldenkennzahlen (nur Messung)
        env:
          SEC_USER_AGENT: "VisionUniverseResearch info@visionuniverse.de"
          SEC_CACHE_DIR: ${{ runner.temp }}/sec-cache
        run: |
          if ! python3 scripts/quant/cli.py --log-level WARNING concept-census --archive "$SEC_CACHE_DIR/bulk/companyfacts.zip"; then
            echo "::warning::Konzept-Zensus fehlgeschlagen - es wird keine Messung veroeffentlicht."
            exit 0
          fi
          test -s quant/data/sec/concept-census.json || { echo "::warning::Konzept-Zensus lief durch, schrieb aber nichts."; exit 0; }
          node -e 'const c=require("./quant/data/sec/concept-census.json"); console.log("Emittenten:",c.issuers); console.log("gemappt:"); for(const m of c.mapped)console.log("  "+m.concept+" "+m.issuers+" ("+m.servesMetrics.join(",")+")"); console.log("ungemappte Kandidaten (Top 10):"); for(const u of c.unmapped.slice(0,10))console.log("  "+u.concept+" "+u.issuers)'

      - name: Discover-Daten neu bauen (mit Fundamentals)
        run: |
          node scripts/discover/build-discover-data.mjs
          node scripts/discover/verify-discover-data.mjs

      - name: Capability Matrix je Instrument
        run: node scripts/market/build-capability-matrix.mjs

      # Die Projektion wird AUS der Matrix gerechnet und danebengelegt. Wer
      # die Matrix neu baut und die Projektion stehen laesst, hinterlaesst
      # zwei Staende derselben Aussage - und genau das hat Lauf 35763910366
      # zu Recht abgebrochen: product-capabilities rechnet die erwartete
      # Projektion aus der frischen Matrix und vergleicht sie mit der
      # abgelegten. Der Marktdaten-Refresh macht beides seit jeher; hier
      # fehlte der zweite Schritt.
      - name: Kompakte Product-Capability-Projektion fuer Quant 2.0
        run: node scripts/vu2/build-product-capabilities.mjs

      - name: Kein Schluessel in den Artefakten
        run: node scripts/market/assert-no-secrets.mjs

      - name: Public-Data-Hygiene
        run: node scripts/market/assert-public-data-hygiene.mjs

      - name: Regressionssuite
        run: |
          node --test "quant/tests/*.test.mjs"
          node --test "discover/tests/*.test.mjs"

      - name: Commit und Push
        run: |
          git config user.name "vision-universe-bot"
          git config user.email "bot@visionuniverse.de"
          git add quant/data/sec/consumer quant/data/sec/consumer_coverage.json discover/data quant/data/market/capabilities \
                  quant/data/product/capabilities-v1.json quant/data/product/capabilities-summary-v1.json
          # Nur wenn die Messung wirklich entstand. 'git add' auf einen
          # fehlenden Pfad bricht mit exit 128 ab und nahm in Lauf
          # 35862972083 den gesamten Datenlauf mit - die Fundamentaldaten
          # von 20 Minuten Arbeit wurden deshalb nie committet.
          if [ -s quant/data/sec/concept-census.json ]; then git add quant/data/sec/concept-census.json; fi
          if git diff --cached --quiet; then echo "Keine Aenderung."; exit 0; fi
          Z=$(node -e 'const c=require("./quant/data/sec/consumer_coverage.json"); console.log(c.secAvailable+"/"+c.productUniverse+" Unternehmen, 10J "+c.history10y+", 5J "+c.history5y+", TTM "+c.ttmPossible)')
          git commit -m "SEC Consumer-Fundamentals: $Z"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin HEAD:"${{ github.ref_name }}"

      - name: Zusammenfassung
        if: always()
        run: |
          {
            echo '### SEC Consumer-Fundamentals'
            echo ''
            if [ -f quant/data/sec/consumer_coverage.json ]; then
              node -e 'const c=require("./quant/data/sec/consumer_coverage.json"); console.log("| Kennzahl | Wert |"); console.log("|---|---|"); for (const k of ["productUniverse","cikMapped","withoutCik","secAvailable","notInCompanyFacts","annualHistory","quarterlyHistory","ttmPossible","latestFundamentals","history3y","history5y","history10y"]) console.log("| "+k+" | "+c[k]+" |"); console.log(""); console.log("| Kennzahl | annual | quarterly | ttm |"); console.log("|---|---|---|---|"); for (const [m,v] of Object.entries(c.perMetric)) console.log("| "+m+" | "+v.annual+" | "+v.quarterly+" | "+v.ttm+" |"); console.log(""); console.log("Fehler: "+c.failures.length);'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
