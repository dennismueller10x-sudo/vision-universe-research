name: Quant - Musterdepots (vorwärts, Rechenmodell)

# Rechnet die fünf Quant-Musterdepots nach Regel vorwärts (scripts/quant/portfolio/model-depots.cjs) und committet
# genau eine Datei: quant/data/product/model-depots-v1.json. Rechenmodell, kein echtes Geld, keine Empfehlung.
# Wöchentlich nach den Tagesdaten: bewertet Bestände zum Datenstand; im ersten Lauf eines Monats wird nach Regel
# umgeschichtet. Das Protokoll (rein/raus) wird nur fortgeschrieben. Kein Kursabruf, nur committete Daten.
on:
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * 6'

permissions:
  contents: write

concurrency:
  group: market-data-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  depots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Musterdepots rechnen (Erzeuger)
        run: |
          set -euo pipefail
          node scripts/quant/portfolio/model-depots.cjs --out quant/data/product/model-depots-v1.json

      - name: Vertrag und Tests
        run: |
          set -euo pipefail
          node --test quant/tests/model-depots.test.mjs

      - name: Commit und Push (nur die eigene Datei)
        env:
          PUSH_OWNED_PATHS: quant/data/product/model-depots-v1.json
        run: |
          set -euo pipefail
          git config user.name "vision-universe-bot"
          git config user.email "actions@users.noreply.github.com"
          git add $PUSH_OWNED_PATHS
          if git diff --cached --quiet; then echo "unveraendert"; exit 0; fi
          asof=$(node -e 'console.log(require("./quant/data/product/model-depots-v1.json").asOf)')
          git commit -q -m "Quant-Musterdepots: Stand ${asof} (Lauf ${GITHUB_RUN_ID})"
          scripts/ci/push-with-retry.sh "${GITHUB_REF_NAME}"
